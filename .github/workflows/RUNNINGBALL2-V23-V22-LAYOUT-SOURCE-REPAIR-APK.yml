          #!/usr/bin/env bash
          # Executed as one entire script, never one shell per YAML line.
          set -euo pipefail
          APK="$RUNNER_TEMP/release/RUNNINGBALL2-V23-WORLD-OPERATIONS-CONTROL-APK.apk"
          if [[ ! -s "$APK" ]]; then
            echo 'ERROR: signed V15 APK not found at expected release path:' "$APK" >&2
            ls -lah "$RUNNER_TEMP/release" "$PROJECT_DIR/app/build/outputs/apk/debug" 2>&1 || true
            exit 42
          fi
          printf 'V15 emulator installing signed APK: %s\n' "$APK"
          adb install -r "$APK"
          PKG=com.sentongoharuna.worldsituationroom.rb2worldops23
          adb shell am force-stop "$PKG" || true
          adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/dev/null
          sleep 3
          python3 - <<'PY_ADB_SMOKE'
          import subprocess,time,re,xml.etree.ElementTree as ET
          pkg='com.sentongoharuna.worldsituationroom.rb2worldops23'
          def adb(*args):
              result=subprocess.run(['adb',*args],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=40)
              if result.returncode: raise RuntimeError('adb '+str(args)+'\n'+result.stdout[-1200:])
              return result.stdout
          def dump():
              adb('shell','uiautomator','dump','/sdcard/rb15-ui.xml')
              xml=adb('shell','cat','/sdcard/rb15-ui.xml')
              return ET.fromstring(xml[xml.index('<?xml'):])
          def find(term):
              root=dump()
              for n in root.iter('node'):
                  if term in (n.get('text','')+' '+n.get('content-desc','')):
                      m=re.search(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.get('bounds',''))
                      if m:
                          x1,y1,x2,y2=map(int,m.groups());return ((x1+x2)//2,(y1+y2)//2)
              return None
          def capture_failure(tag):
              name='/tmp/NavigationMissing'+tag+'Activity.png'
              try:
                  with open(name,'wb') as img:
                      subprocess.run(['adb','exec-out','screencap','-p'],stdout=img,check=True,timeout=20)
              except Exception as e: print('Could not capture UI screenshot:',e,flush=True)
              try:
                  hierarchy=dump()
                  labels=[n.get('text','') for n in hierarchy.iter('node') if n.get('text','').strip()]
                  print('VISIBLE UI LABELS:',repr(labels[-40:]),flush=True)
              except Exception as e: print('UI hierarchy unavailable:',e,flush=True)
              try:
                  focus=adb('shell','dumpsys','activity','activities')
                  for row in focus.splitlines():
                      if 'topResumedActivity' in row or 'mResumedActivity' in row:
                          print('FOREGROUND:',row.strip(),flush=True)
              except Exception as e: print('Cannot read foreground activity:',e,flush=True)
              return name
          def hub():
              # After ACTION_SEND, Android's chooser belongs to the SYSTEM, not our
              # package. A force-stop of our package alone cannot reliably dismiss it.
              component=pkg+'/com.sentongoharuna.worldsituationroom.RunningballV12HubActivity'
              for attempt in range(3):
                  if attempt:
                      adb('shell','input','keyevent','4')  # close any remaining overlay
                      time.sleep(.35)
                  adb('shell','am','force-stop',pkg)
                  adb('shell','am','start','-W','-n',component)
                  for poll in range(5):
                      time.sleep(.45)
                      details=adb('shell','dumpsys','activity','activities')
                      resumed=[line for line in details.splitlines()
                               if 'topResumedActivity' in line or 'mResumedActivity' in line]
                      # Do not accept a stale dashboard hidden under system chooser.
                      if resumed and 'RunningballV12HubActivity' not in resumed[-1]:
                          continue
                      # The ScrollView might retain its earlier scroll offset. Verify
                      # an actually visible tile, not only the top-of-page heading.
                      try:
                          adb('shell','input','swipe','520','320','520','1550','250')
                          time.sleep(.3)
                          if find('OPEN ORIGINAL APP') or find('AIRCRAFT RADAR') or find('COMMAND CENTER'):
                              print('PASS dashboard foreground restored after navigation',flush=True)
                              return
                      except Exception as e:
                          print('Dashboard UI not yet ready:',str(e)[:180],flush=True)
              screenshot=capture_failure('DashboardReturn')
              raise AssertionError('V15 dashboard could not regain foreground/visible tiles; see '+screenshot)
          def nav(label,activity):
              hub()
              hit=None
              for _ in range(10):
                  hit=find(label)
                  if hit:break
                  adb('shell','input','swipe','500','1600','500','430','350');time.sleep(.4)
              if not hit:
                  # Capture evidence of the missing button before failing the build.
                  screenshot='/tmp/NavigationMissing'+activity+'Activity.png'
                  with open(screenshot,'wb') as img:
                      subprocess.run(['adb','exec-out','screencap','-p'],stdout=img,check=True,timeout=20)
                  try:
                      nodes=[n.get('text','') for n in dump().iter('node') if n.get('text','').strip()]
                      print('VISIBLE UI LABELS:',repr(nodes[-35:]),flush=True)
                  except Exception as e:print('Cannot dump missing-button UI:',e,flush=True)
                  raise AssertionError(f'Cannot find navigation button {label}; screenshot {screenshot}')
              adb('shell','input','tap',str(hit[0]),str(hit[1]));time.sleep(1.6)
              resumed=adb('shell','dumpsys','activity','activities')
              lines=[row for row in resumed.splitlines() if 'topResumedActivity' in row or 'mResumedActivity' in row]
              if lines:assert activity in lines[-1],f'{label} did not become resumed: '+lines[-1]
              else:assert activity in resumed,f'{label} failed to navigate to {activity}'
              assert pkg in resumed,f'{label} navigated outside expected app'
              # Capture screen for independent human review.
              name=re.sub('[^a-zA-Z0-9]+','-',activity)
              subprocess.run(['adb','exec-out','screencap','-p'],stdout=open('/tmp/'+name+'.png','wb'),check=True,timeout=20)
              print('PASS visible navigation:',label,'→',activity)
          # Real on-emulator smoke tests for each installed activity. A successful launch
          # does NOT assert that remote providers are live or that the phone behaves identically.
          hub()
          # V16 new dashboard must be present on the actual Android screen, not just in source files.
          for _ in range(4):
              if find('WORLD COMMAND GRID'):break
              adb('shell','input','swipe','530','450','530','1650','250');time.sleep(.3)
          assert find('WORLD COMMAND GRID'),'V16 WORLD COMMAND GRID is not visible on launcher'
          assert find('EARTHQUAKES') or find('AIRCRAFT'),'V16 source boards missing from screen'
          print('PASS V16 live boards are visible on Android emulator')
          for label,activity in [
            ('OPEN ORIGINAL APP',''),
            ('WORLDWIDE EARTH','RunningballWorldExplorerActivity'),
            ('AIRCRAFT RADAR','AirRadarActivity'),
            ('AIRCRAFT CONTACTS','GevContactsActivity'),
            ('COCKPIT & CHASE','GevCockpitActivity'),
            ('EARTH EXPLORER','GevEarthExploreActivity'),
            ('SATELLITE INTELLIGENCE','GevSatelliteActivity'),
            ('MARITIME INTELLIGENCE','GevMarineActivity'),
            ('OPEN GLOBAL SIGNALS','RunningballV13SignalsActivity'),
            ('OPEN SOURCE HEALTH','RunningballV15SourceHealthActivity')]:
              if not activity:continue
