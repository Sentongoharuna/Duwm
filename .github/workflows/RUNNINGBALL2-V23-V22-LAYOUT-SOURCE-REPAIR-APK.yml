          public final class GevSatelliteWidget extends AppWidgetProvider {
              @Override public void onUpdate(Context context,AppWidgetManager manager,int[] ids){for(int id:ids)paint(context,manager,id);}
              public static void updateAll(Context context){AppWidgetManager manager=AppWidgetManager.getInstance(context);
