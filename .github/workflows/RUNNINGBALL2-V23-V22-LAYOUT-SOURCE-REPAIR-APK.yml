          /** V23. Displays source truth; never synthesizes numbers, positions or events. */
          public final class RunningballV23ControlBar extends LinearLayout {
            private static final int CYAN=0xFF75DEFA, GREEN=0xFF51DCAA, AMBER=0xFFFBC875,
                                     INK=0xFFEAF8FE, DIM=0xFFA9C0CF;
            private final Handler handler=new Handler(Looper.getMainLooper());
            private final TextView overview, last;
            private long lastRefreshTap=0;
            private boolean visible=false;
            private final Runnable tick=new Runnable(){@Override public void run(){
              if(!visible)return;render();handler.postDelayed(this,10000L);
            }};
            private int dp(int p){return Math.round(getResources().getDisplayMetrics().density*p);}
            private TextView label(String t,int size,int tint,boolean bold){
              TextView view=new TextView(getContext());view.setText(t);view.setTextSize(size);view.setTextColor(tint);
              if(bold)view.setTypeface(null,1);return view;
            }
            private GradientDrawable panel(int border){
              GradientDrawable d=new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                new int[]{0xFF142C3D,0xFF0C1825});d.setStroke(dp(1),border);d.setCornerRadius(dp(14));return d;
            }
            private SharedPreferences p(String file){return getContext().getApplicationContext().getSharedPreferences(file,Context.MODE_PRIVATE);}
            private static String freshness(long stamp,long maxAge){
              if(stamp<=0)return "NOT LOADED";
              long diff=Math.max(0,System.currentTimeMillis()-stamp);
              if(diff>maxAge)return "STALE / CACHED";
              long mins=diff/60000L;return mins==0?"RECENT <1M":"RECENT "+mins+"M";
            }
            private void open(Class<?> activity){getContext().startActivity(new Intent(getContext(),activity));}
            private TextView button(String title,final Runnable click){
              TextView text=label(title,11,CYAN,true);text.setGravity(Gravity.CENTER);
              text.setBackground(panel(0xFF3B718A));text.setPadding(dp(5),dp(14),dp(5),dp(14));
              text.setOnClickListener(v->click.run());return text;
            }
            private void actions(LinearLayout body,String a,Runnable actionA,String b,Runnable actionB){
              LinearLayout row=new LinearLayout(getContext());
              LinearLayout.LayoutParams params=new LinearLayout.LayoutParams(-1,-2);params.topMargin=dp(9);
              LinearLayout.LayoutParams left=new LinearLayout.LayoutParams(0,-2,1);left.rightMargin=dp(5);
              LinearLayout.LayoutParams right=new LinearLayout.LayoutParams(0,-2,1);right.leftMargin=dp(5);
              row.addView(button(a,actionA),left);row.addView(button(b,actionB),right);body.addView(row,params);
            }
            public RunningballV23ControlBar(Context context){super(context);setOrientation(VERTICAL);
              setPadding(dp(13),dp(12),dp(13),dp(13));setBackground(panel(0xFF51A6BE));
              addView(label("V23 / WORLD OPERATIONS CONTROL",13,CYAN,true));
              overview=label("CHECKING VERIFIED SOURCES…",12,INK,false);
              LinearLayout.LayoutParams op=new LinearLayout.LayoutParams(-1,-2);op.topMargin=dp(9);addView(overview,op);
              last=label("SOURCE CHANGES / NO REPORT YET",10,DIM,false);
              LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,-2);lp.topMargin=dp(8);addView(last,lp);
              actions(this,"WORLD MAP",()->open(RunningballWorldExplorerActivity.class),
                           "SOURCE HEALTH",()->open(RunningballV19SourceCenterActivity.class));
              actions(this,"REFRESH SOURCES",this::refresh,
                           "AIS / VESSELS",()->open(GevMarineActivity.class));
              render();
            }
            private void render(){
              Context context=getContext();
              String region=RunningballWorldTarget.ready(context)?RunningballWorldTarget.label(context):"SELECT WORLD REGION FOR AIR / WEATHER";
              long quake=p("rb_global_public_events").getLong("quakes_time",0L);
              long satellite=p("rb10_satellite").getLong("data_STATIONS_time",0L);
              long noaa=RunningballV19Noaa.received(context);
              String ais=p("rb11_marine").getString("endpoint","").trim().isEmpty()?"AIS NOT CONFIGURED":"AIS GATEWAY SET";
              overview.setText("REGION: "+region+"\nUSGS: "+freshness(quake,1200000L)+
