      - name: GEV PORT 05 - marine unit tests, source honesty and preservation acceptance
        shell: bash
        run: |
          set -euo pipefail
          PKG="$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom"
          mkdir -p "$RUNNER_TEMP/v11-marine-unit"
          javac -d "$RUNNER_TEMP/v11-marine-unit" "$PKG/GevMarineMath.java"
          cat > "$RUNNER_TEMP/v11-marine-unit/TestMarine.java" <<'JAVA_V11_MARINE_TEST'
          import com.sentongoharuna.worldsituationroom.GevMarineMath;
          public final class TestMarine {
              static void check(boolean v,String m){if(!v)throw new AssertionError(m);}
              public static void main(String[] args){
                  check(GevMarineMath.valid(-6.6,39.2),"valid port position");
                  check(!GevMarineMath.valid(93d,32d),"reject impossible latitude");
                  check(GevMarineMath.validMmsi("123456789"),"accept 9-digit MMSI");
                  check(!GevMarineMath.validMmsi("GHOST"),"reject invented MMSI");
                  double nm=GevMarineMath.distanceNm(0d,0d,1d,0d);
                  check(nm>59.9d&&nm<60.3d,"distance in nautical miles");
                  check(Double.isInfinite(GevMarineMath.distanceNm(95d,0d,0d,0d)),"reject invalid location");
                  long now=1730000000000L;
                  check("RECENT".equals(GevMarineMath.freshness(now-10000L,now)),"live report");
                  check("CACHED".equals(GevMarineMath.freshness(now-31L*60000L,now)),"cached report");
                  check("STALE".equals(GevMarineMath.freshness(now-121L*60000L,now)),"stale report");
                  check("TIME UNKNOWN".equals(GevMarineMath.freshness(0,now)),"unknown age");
                  System.out.println("V11 marine calculations and source-state tests passed");
              }
          }
          JAVA_V11_MARINE_TEST
          javac -cp "$RUNNER_TEMP/v11-marine-unit" -d "$RUNNER_TEMP/v11-marine-unit" "$RUNNER_TEMP/v11-marine-unit/TestMarine.java"
          java -cp "$RUNNER_TEMP/v11-marine-unit" TestMarine
          python3 - "$PROJECT_DIR" <<'PY_V11_AIS_TEST'
          from pathlib import Path
          import sys, xml.etree.ElementTree as ET
          main=Path(sys.argv[1])/'app/src/main';pkg=main/'java/com/sentongoharuna/worldsituationroom'
          act=(pkg/'GevMarineActivity.java').read_text()
          widget=(pkg/'GevMaritimeWidget.java').read_text()
          earth=(pkg/'GevEarthExploreActivity.java').read_text()
          assert 'new JSONObject(json)' in act and 'optJSONArray("rows")' in act
          assert 'sourceStatus="offline"' in act
          assert 'https' in act and 'putString("endpoint",rawUrl)' in act
          assert 'AISStream' in act and 'GevMarineMath.validMmsi' in act
          assert 'new GevMarineRadarView(this)' in act and 'radar.setRecords(plots)' in act
          assert 'SharedPreferences' in act and 'ShareCardRenderer.share' in act
          assert 'marine_observed' in earth and 'satellite_estimated' in earth
          assert 'GevMaritimeWidget.updateAll' in act
          for f in ('res/layout/rb11_marine_widget.xml','res/xml/rb11_marine_widget_info.xml','res/drawable/rb11_marine_card.xml'):
              ET.parse(main/f)
          manifest=main/'AndroidManifest.xml'
          assert 'GevMaritimeWidget' in manifest.read_text() and 'GevMarineActivity' in manifest.read_text()
          live=(pkg/'DuwmLiveWallpaperService.java').read_text()
          for invariant in ('FRAME_MS=33L','rotation=(rotation+(dt/1000.0d)*4.0d)%360.0d;','h.lockCanvas()','h.unlockCanvasAndPost(c)'):
              assert invariant in live
          assert 'NO AIS FEED' in widget and 'CACHED AIS REPORTS' in widget
          print('V11 integration checks PASSED: no fabricated AIS, premium widget, HTTPS, Earth and original 33ms globe')
          PY_V11_AIS_TEST

      - name: V12 DIRECT HUB - visible intelligence navigation and protected original monitor
        shell: bash
        run: |
          set -euo pipefail
          PKG="$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom"
          cat > "$PKG/RunningballV12HubActivity.java" <<'JAVA_V12_HUB'
          package com.sentongoharuna.worldsituationroom;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          
          /** V12 starts here. Every tile opens an actual compiled activity, not a mockup. */
          public final class RunningballV12HubActivity extends Activity {
            private static final int BG=0xFF080F18, INK=0xFFEAF8FF, DIM=0xFF91AEC2;
            private static final int CYAN=0xFF66D9F5, GREEN=0xFF56DEA7, GOLD=0xFFFFC46D;
            private int dp(float d){return Math.round(getResources().getDisplayMetrics().density*d);}
            private GradientDrawable panel(int accent){
              GradientDrawable g=new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                new int[]{0xEE152A39,0xF008121D});
              g.setCornerRadius(dp(19));g.setStroke(dp(1),accent);return g;
            }
            private TextView text(String s,int sp,int color,boolean bold){
              TextView t=new TextView(this);t.setText(s);t.setTextColor(color);t.setTextSize(sp);
              if(bold)t.setTypeface(null,1);return t;
            }
            private void margin(LinearLayout parent,android.view.View v,int top){
              LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,-2);p.topMargin=dp(top);parent.addView(v,p);
            }
            private void go(String activity){
              Intent i=new Intent();
              i.setClassName(getPackageName(),"com.sentongoharuna.worldsituationroom."+activity);
              try{startActivity(i);}catch(Exception e){
                android.widget.Toast.makeText(this,"Unable to open "+activity,android.widget.Toast.LENGTH_LONG).show();
              }
            }
            private void tile(LinearLayout parent,String tag,String heading,String detail,String source,String activity,int accent){
              LinearLayout p=new LinearLayout(this);p.setOrientation(LinearLayout.VERTICAL);
              p.setPadding(dp(17),dp(13),dp(17),dp(15));p.setBackground(panel(accent));
              p.addView(text(tag,10,accent,true));
              margin(p,text(heading+"   ›",17,INK,true),5);
              margin(p,text(detail,12,DIM,false),6);
              margin(p,text(source,10,accent,false),9);
              p.setClickable(true);p.setFocusable(true);p.setOnClickListener(v->go(activity));
              LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,-2);lp.topMargin=dp(11);parent.addView(p,lp);
            }
            @Override public void onCreate(Bundle saved){super.onCreate(saved);
              getWindow().setStatusBarColor(BG);getWindow().setNavigationBarColor(BG);
              ScrollView scroll=new ScrollView(this);scroll.setFillViewport(true);scroll.setBackgroundColor(BG);
              LinearLayout body=new LinearLayout(this);body.setOrientation(LinearLayout.VERTICAL);
              body.setPadding(dp(18),dp(20),dp(18),dp(24));scroll.addView(body);
              body.addView(text("RUNNINGBALL2  •  APP VERSION V12",10,GREEN,true));
              margin(body,text("INTELLIGENCE\nCOMMAND CENTER",26,INK,true),8);
              margin(body,text("Direct access to working native screens • no hidden navigation chain",12,DIM,false),9);
              tile(body,"ORIGINAL MONITOR  /  PRESERVED","OPEN THE ORIGINAL APP",
                "Existing world monitor, original globe and reporting functionality.","NO ORIGINAL MONITOR FUNCTIONS REMOVED","V12_ORIGINAL_ACTIVITY",GREEN);
              tile(body,"AIR  /  ADS-B REPORTS","AIRCRAFT RADAR",
                "Observed aircraft positions, aircraft details and radar interactions.","PUBLIC ADSB.LOL • REPORTED POSITIONS","AirRadarActivity",CYAN);
              tile(body,"AIR  /  NEAREST CONTACTS","AIRCRAFT CONTACTS",
                "Search, range selection, detail cards and aircraft share cards.","PUBLIC ADSB.LOL • CHECK REPORT AGE","GevContactsActivity",CYAN);
              tile(body,"AIR  /  FLIGHT DETAIL","COCKPIT & CHASE",
                "Cockpit-style telemetry and reported-position chase view.","NO LIVE CAMERA OR PREDICTED VIDEO","GevCockpitActivity",GREEN);
              tile(body,"EARTH  /  GEO EXPLORER","EARTH EXPLORER",
                "Map exploration with direct navigation from aircraft, satellites and ships.","TILE AVAILABILITY DEPENDS ON PUBLIC SOURCE","GevEarthExploreActivity",CYAN);
              tile(body,"ORBIT  /  CELESTRAK","SATELLITE INTELLIGENCE",
                "Public satellite catalogues, estimated positions and satellite widget.","TWO-BODY ESTIMATES • NOT REAL-TIME TRACKING","GevSatelliteActivity",GOLD);
              tile(body,"SEA  /  AIS","MARITIME INTELLIGENCE",
                "Vessel radar, MMSI, vessel details, share cards and marine widget.","HTTPS AIS GATEWAY REQUIRED • NO FABRICATED SHIPS","GevMarineActivity",GOLD);
              tile(body,"WALLPAPER  /  PROTECTED","SET LIVE GLOBE WALLPAPER",
                "Launch the original rotating globe wallpaper chooser.","ORIGINAL 33-MS ENGINE UNCHANGED","LiveWallpaperLauncherActivity",GREEN);
              margin(body,text("V12  •  NAVIGATION VISIBLE  •  SOURCE STATUS SHOWN IN EACH MODULE",10,DIM,false),17);
              setContentView(scroll);
            }
          }
          JAVA_V12_HUB
          python3 - "$PROJECT_DIR" <<'PY_V12_ENTRY'
          from pathlib import Path
          import sys, xml.etree.ElementTree as ET
          home=Path(sys.argv[1])/'app/src/main'
          manifest=home/'AndroidManifest.xml'
          java=home/'java/com/sentongoharuna/worldsituationroom/RunningballV12HubActivity.java'
          before=(home/'java/com/sentongoharuna/worldsituationroom/DuwmLiveWallpaperService.java').read_bytes()
          AND='http://schemas.android.com/apk/res/android'; key='{'+AND+'}'
          ET.register_namespace('android',AND)
          ET.register_namespace('tools','http://schemas.android.com/tools')
          tree=ET.parse(manifest); root=tree.getroot(); app=root.find('application')
          assert app is not None,'V12 missing application node'
          matches=[]
          for activity in list(app):
            if activity.tag not in ('activity','activity-alias'): continue
            for fil in activity.findall('intent-filter'):
              actions={el.get(key+'name') for el in fil.findall('action')}
              categories={el.get(key+'name') for el in fil.findall('category')}
              if 'android.intent.action.MAIN' in actions and 'android.intent.category.LAUNCHER' in categories:
                matches.append((activity,fil))
          assert len(matches)==1,'V12 requires exactly one original Android launcher; found '+str(len(matches))
          activity,fil=matches[0]
          previous=activity.get(key+'targetActivity') if activity.tag=='activity-alias' else activity.get(key+'name')
          assert previous,'V12 original app activity name missing'
          previous=previous.lstrip('.').split('.')[-1]
          assert (home/'java/com/sentongoharuna/worldsituationroom'/ (previous+'.java')).is_file(),'Original launcher class not found: '+previous
          activity.remove(fil)
          hub=ET.SubElement(app,'activity',{key+'name':'.RunningballV12HubActivity',key+'label':'@string/app_name',key+'exported':'true'})
          f=ET.SubElement(hub,'intent-filter')
