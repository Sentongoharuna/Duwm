      - name: V23 Android emulator - boot and test global operations
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # This action splits script into separate sh -c commands. Exactly ONE invocation
          # is required or shell variables (including APK) disappear between lines.
          script: |
            bash "$RUNNER_TEMP/v15-emulator-smoke.sh"

