      - name: V22 INSTALL - immediately visible command grid and source-derived readiness strip
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY_V22_UI'
          from pathlib import Path
          import sys,re,hashlib
          pkg=Path(sys.argv[1])/'app/src/main/java/com/sentongoharuna/worldsituationroom'
          wall=pkg/'DuwmLiveWallpaperService.java'
          protected=hashlib.sha256(wall.read_bytes()).hexdigest()
          hub=pkg/'RunningballV12HubActivity.java'
          h=hub.read_text(encoding='utf-8')
          # The actual V21 launcher has an Earth header, command deck, and V17 panel.
          # It does NOT yet instantiate the V20 source pulse. Do not match an invented
          # three-view sequence: inspect the real V21 anchors separately.
          header=re.compile(r'v18Header\s*=\s*new\s+RunningballV18MissionHeader\s*\(\s*this\s*\)\s*;')
          deck=re.compile(r'commandDeck\s*=\s*new\s+RunningballV16CommandDeck\s*\(\s*this\s*\)\s*;')
          deck_margin=re.compile(r'margin\s*\(\s*body\s*,\s*commandDeck\s*,\s*\d+\s*\)\s*;')
          for label,pat in [('V18 header',header),('world command deck',deck),('world deck margin',deck_margin)]:
              n=len(pat.findall(h))
              if n!=1:raise SystemExit('V23 WORLD LAYOUT: expected one '+label+', got '+str(n))
          assert header.search(h).start()<deck.search(h).start()<deck_margin.search(h).start(),'Launcher rendering order unexpectedly changed'
          if h.count('new RunningballV20LiveFeedPulse(this)')!=0:
              raise SystemExit('V23 WORLD LAYOUT: pulse already installed; prevent duplicated view')
          field='private RunningballV18MissionHeader v18Header;'
          assert h.count(field)==1,'V23 WORLD LAYOUT: V18 field anchor changed'
          h=h.replace(field,field+'\n  private TextView v22Status;\n  private RunningballV20LiveFeedPulse v20Pulse;',1)
          # Place the compact readiness strip before the Earth header, retaining that
          # existing header and all previous launch controls.
          header_insert='''v22Status=text("V22 / WORLD STATUS  ·  AWAITING VERIFIED FEEDS",12,GREEN,true);
              v22Status.setPadding(dp(14),dp(13),dp(12),dp(13));
              v22Status.setBackground(panel(GREEN));
              margin(body,v22Status,9);
              '''
          h,n=header.subn(lambda m:header_insert+m.group(0),h,count=1)
          assert n==1
          # The command grid stays ahead of the detailed nine-source list.
          margin_hit=deck_margin.search(h)
          assert margin_hit is not None
          h=h[:margin_hit.start()]+'''margin(body,commandDeck,10);
              v20Pulse=new RunningballV20LiveFeedPulse(this);
              v20Pulse.bindV22(v22Status);
              margin(body,v20Pulse,10);
              v22Status.setOnClickListener(v->scroll.post(()->scroll.smoothScrollTo(0,v20Pulse.getTop())));'''+h[margin_hit.end():]
          # Lifecycle-driven refresh: real source requests start only while activity
          # is visible; avoid a separate duplicate onResume override.
          start_anchor='private int dp(float d){'
          assert h.count(start_anchor)==1,'V23 WORLD LAYOUT: hub utility anchor changed'
          h=h.replace(start_anchor,'''@Override protected void onStart(){super.onStart();if(v20Pulse!=null)v20Pulse.start();}
            @Override protected void onStop(){if(v20Pulse!=null)v20Pulse.stop();super.onStop();}
