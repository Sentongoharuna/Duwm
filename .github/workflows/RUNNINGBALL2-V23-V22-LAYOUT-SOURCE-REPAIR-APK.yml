                      android:layout_height="wrap_content" android:layout_weight="1"
                      android:text="GLOBAL SIGNALS  /  V14" android:textColor="#78E7EF"
                      android:textSize="13sp" android:textStyle="bold"/>
                  <TextView android:id="@+id/rb14_refresh" android:layout_width="45dp"
                      android:layout_height="38dp" android:gravity="center"
                      android:text="↻" android:textColor="#FFFFFF" android:textSize="24sp"
                      android:contentDescription="Refresh cached reports"/>
              </LinearLayout>
              <TextView android:id="@+id/rb14_air_line" android:layout_width="match_parent"
                  android:layout_height="45dp" android:gravity="center_vertical"
                  android:paddingLeft="12dp" android:paddingRight="10dp"
                  android:background="@drawable/rb14_widget_row"
                  android:text="AIR -- · NO DATA" android:textColor="#84E5F9"
                  android:textSize="13sp" android:textStyle="bold"/>
