          hub=(Path(environ['PROJECT_DIR'])/'app/src/main/java/com/sentongoharuna/worldsituationroom/RunningballV12HubActivity.java').read_text(encoding='utf-8')
          module_labels={
              'AIRCRAFT RADAR':'AirRadarActivity',
