      - name: V14 ACCURACY PATCH - source-driven widget updates, matching counters and correct labels
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY_V14_ACCURACY'
          from pathlib import Path
          import sys,re
          pkg=Path(sys.argv[1])/'app/src/main/java/com/sentongoharuna/worldsituationroom'
          def once(path,old,new,label):
              src=path.read_text(encoding='utf-8')
              count=src.count(old)
              assert count==1, f'{label}: expected 1 anchor, found {count}'
              path.write_text(src.replace(old,new,1),encoding='utf-8')
          # The ADS-B fetch is asynchronous. Update dashboard widget AFTER the result is cached,
          # not just when a user requests a cache repaint.
          air=pkg/'AirOperationsWidgets.java'
          source=air.read_text(encoding='utf-8')
          # Match the completed AIR fetch callback, not a hardcoded indentation level.
          # Anchored to FETCHING.set(false) so the cached-only initial repaint is untouched.
          pattern=r'(FETCHING\.set\(false\);\s*renderAll\(app\);)(\s*)(completion\.finish\(\);)'
          matches=list(re.finditer(pattern,source))
          if len(matches)!=1:
              raise SystemExit('AIR completed-fetch callback expected once, found '+str(len(matches)))
          m=matches[0]
          indent=m.group(2).split('\n')[-1]
          insert=m.group(1)+'\n'+indent+'RunningballV14SignalWidget.updateAll(app);'+m.group(2)+m.group(3)
          air.write_text(source[:m.start()]+insert+source[m.end():],encoding='utf-8')
          print('AIR completed-fetch callback patched exactly once')
          # Satellite source writes to cache, then notifies both types of widgets.
          sat=pkg/'GevSatelliteActivity.java'
          before=sat.read_text(encoding='utf-8')
          assert before.count('GevSatelliteWidget.updateAll(this);')==2,'Satellite cache change count'
          sat.write_text(before.replace('GevSatelliteWidget.updateAll(this);',
                         'GevSatelliteWidget.updateAll(this);RunningballV14SignalWidget.updateAll(this);'),encoding='utf-8')
          # Maritime updates cache only when configured gateway supplies a response.
          sea=pkg/'GevMarineActivity.java'
          once(sea,'render();GevMaritimeWidget.updateAll(this);',
                    'render();GevMaritimeWidget.updateAll(this);RunningballV14SignalWidget.updateAll(this);',
                    'SEA result notification')
          # ADSB.LOL /v2/point radius is nautical miles, not kilometres.
          # Contacts screen independently filters to 250 km, so only change this source panel.
          board=pkg/'RunningballV13SignalsActivity.java'
          once(board,'AIRCRAFT  /  250 KM NEAR KAMPALA','AIRCRAFT  /  250 NM NEAR KAMPALA','aircraft radius units')
          # Count the same validated, capped satellite entries as the satellite activity,
          # not every raw row returned by CelesTrak.
          original='private static int stations(Context c){try{return new JSONArray(satRaw(c)).length();}catch(Exception e){return 0;}}'
          exact='''private static int stations(Context c){try{
              JSONArray raw=new JSONArray(satRaw(c));int valid=0;
              for(int i=0;i<raw.length()&&valid<100;i++){
                JSONObject j=raw.optJSONObject(i);if(j==null)continue;
                String name=j.optString("OBJECT_NAME","");int norad=j.optInt("NORAD_CAT_ID",0);
                String epoch=j.optString("EPOCH","");
                boolean goodEpoch=false;
                try{String v=epoch.replace("Z","");int dot=v.indexOf('.');
                  if(dot>=0){String fraction=v.substring(dot+1);if(fraction.length()>3)fraction=fraction.substring(0,3);
                    while(fraction.length()<3)fraction+="0";v=v.substring(0,dot)+"."+fraction;}
                  else v+=".000";
                  SimpleDateFormat format=new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS",Locale.US);
                  format.setLenient(false);format.setTimeZone(TimeZone.getTimeZone("UTC"));
                  Date dt=format.parse(v);goodEpoch=dt!=null&&dt.getTime()>0;
                }catch(Exception ignored){}
                if(!name.isEmpty()&&norad>0&&goodEpoch&&GevOrbitMath.validElements(
                   j.optDouble("MEAN_MOTION",Double.NaN),j.optDouble("ECCENTRICITY",Double.NaN),
                   j.optDouble("INCLINATION",Double.NaN),j.optDouble("RA_OF_ASC_NODE",Double.NaN),
                   j.optDouble("ARG_OF_PERICENTER",Double.NaN),j.optDouble("MEAN_ANOMALY",Double.NaN)))valid++;
              }
              return valid;
            }catch(Exception e){return 0;}}'''
          once(board,original,exact,'SAT source count parity')
          # Prior summary showed AIR=RECENT even if the last refresh failed.
          once(board,'private static String satRaw(Context c){',
                '''private static String airFreshness(Context c,long t){
              String error=c.getSharedPreferences("air_widget_v2",MODE_PRIVATE).getString("last_error","");
              return error.isEmpty()?freshness(t):"FETCH FAILED / CACHED";
            }
            private static String satRaw(Context c){''','AIR source error check')
          once(board,'+"  ·  "+freshness(at)+"\\n"','+"  ·  "+airFreshness(c,at)+"\\n"','AIR summary freshness')
          # A cached redraw is not a network refresh. The button must describe its real action.
          once(board,'"REFRESH HOME WIDGET"','"RECHECK HOME WIDGET CACHE"','V14 button honesty')
          widget=pkg/'RunningballV14SignalWidget.java'
          once(widget,'"CACHED SOURCE REPORTS · CHECKED "','"CACHED DISPLAY · RECHECKED "','widget freshness explanation')
          source=widget.read_text();assert 'AirRadarActivity.class' in source
          print('V14 accuracy: corrected count parity, NM/KM label, source status and cache-driven refresh complete')
          PY_V14_ACCURACY

