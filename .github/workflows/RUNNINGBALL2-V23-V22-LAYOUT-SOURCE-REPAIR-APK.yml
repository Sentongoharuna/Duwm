                  telemetry=label("NO REPORT",13,LIGHT,false);telemetry.setPadding(dp(12),dp(7),dp(12),dp(7));telemetry.setBackground(card());
                  LinearLayout.LayoutParams facts=new LinearLayout.LayoutParams(-1,dp(96));facts.topMargin=dp(8);root.addView(telemetry,facts);
                  LinearLayout nav=new LinearLayout(this);nav.setOrientation(LinearLayout.HORIZONTAL);
                  TextView details=action("DETAILS",()->{if(target!=null){Intent i=new Intent(this,AirFlightDetailsActivity.class);
                      i.putExtra("air_hex",hex);startActivity(i);}});
                  TextView share=action("SHARE CARD",this::share);
                  TextView refresh=action("REFRESH",this::requestRefresh);
                  nav.addView(details,new LinearLayout.LayoutParams(0,dp(45),1f));
                  LinearLayout.LayoutParams sh=new LinearLayout.LayoutParams(0,dp(45),1f);sh.leftMargin=dp(6);nav.addView(share,sh);
                  LinearLayout.LayoutParams re=new LinearLayout.LayoutParams(0,dp(45),1f);re.leftMargin=dp(6);nav.addView(refresh,re);
                  LinearLayout.LayoutParams np=new LinearLayout.LayoutParams(-1,dp(45));np.topMargin=dp(8);root.addView(nav,np);
                  source=label("PUBLIC ADS-B OBSERVATIONS • NO FUTURE POSITION PREDICTIONS",10,MUTED,false);
                  source.setGravity(Gravity.CENTER);root.addView(source,new LinearLayout.LayoutParams(-1,dp(34)));
