      - name: V15 app crash filter - test false positives and genuine exceptions
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v15-target-crash-filter.py" <<'PY_V15_CRASH_FILTER'
          #!/usr/bin/env python3
          """Return nonzero only for app-owned fatal exceptions in captured Android logcat."""
          from pathlib import Path
          import re
          import sys
          
          def find_app_fatals(lines, package):
              failures=[]
              for index,line in enumerate(lines):
                  if 'FATAL EXCEPTION:' not in line:
                      continue
                  block=lines[index:index+24]
                  if any(re.search(r'\bProcess:\s*'+re.escape(package)+r'(?=\s|,|$)', row) for row in block):
                      failures.append(''.join(block))
              return failures
          
          def main():
              if len(sys.argv)!=3:
                  raise SystemExit('usage: v15-target-crash-filter.py LOGCAT_FILE APP_PACKAGE')
              p=Path(sys.argv[1]); package=sys.argv[2]
              if not p.is_file():
                  raise SystemExit('LOGCAT UNAVAILABLE: missing '+str(p))
              text=p.read_text(encoding='utf-8',errors='replace')
              if not text.strip():
                  raise SystemExit('LOGCAT UNAVAILABLE: empty capture')
              fatal=find_app_fatals(text.splitlines(True),package)
              if fatal:
                  for block in fatal:
                      print('APPLICATION FATAL EXCEPTION:',block,flush=True)
                  return 1
              print('PASS V15 target-app crash check; routine AndroidRuntime startup logs ignored',flush=True)
              return 0
          
          if __name__=='__main__':
              sys.exit(main())
          PY_V15_CRASH_FILTER
          python3 - "$RUNNER_TEMP/v15-target-crash-filter.py" <<'PY_V15_FILTER_TEST'
          import ast,sys,runpy
          from pathlib import Path
          p=Path(sys.argv[1]);code=p.read_text(encoding='utf-8')
          ast.parse(code)
          f=runpy.run_path(str(p))['find_app_fatals']
          package='com.sentongoharuna.worldsituationroom.rb2worldops23'
          normal=['D/AndroidRuntime( 7695): >>>>>> START com.android.internal.os.RuntimeInit uid 2000 <<<<<<\n',
                  'I/AndroidRuntime( 7695): Using default boot image\n',
                  'D/AndroidRuntime( 7695): Calling main entry com.android.commands.uiautomator.Launcher\n',
                  'D/AndroidRuntime( 7695): Shutting down VM\n']
          unrelated=['E/AndroidRuntime( 1122): FATAL EXCEPTION: main\n',
                     'E/AndroidRuntime( 1122): Process: com.android.otherapp, PID: 1122\n']
          own=['E/AndroidRuntime( 2211): FATAL EXCEPTION: main\n',
               'E/AndroidRuntime( 2211): Process: '+package+', PID: 2211\n',
               'E/AndroidRuntime( 2211): java.lang.IllegalStateException: test\n']
          assert not f(normal,package), 'Routine AndroidRuntime startup incorrectly treated as crash'
          assert not f(unrelated,package), 'Crash belonging to different app incorrectly counted'
          assert len(f(own,package)) == 1, 'Real app fatal exception not detected'
          assert len(f(normal+own,package)) == 1, 'App fatal hidden by routine logger'
          print('PASS V15 crash filter: benign startup, unrelated crash and own fatal checked')
          PY_V15_FILTER_TEST

