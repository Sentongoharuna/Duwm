            @Override public void onCreate(Bundle saved){super.onCreate(saved);""","resume data summary")
          java.write_text(t,encoding='utf-8')
          manifest=p/'AndroidManifest.xml';tree=ET.parse(manifest);root=tree.getroot();app=root.find('application');assert app is not None
          key='{http://schemas.android.com/apk/res/android}name'
