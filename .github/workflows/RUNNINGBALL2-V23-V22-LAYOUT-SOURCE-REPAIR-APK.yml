      - name: GEV PORT 04 - orbit math, source and preservation acceptance
        shell: bash
        run: |
          set -euo pipefail
          PKG="$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom"
          mkdir -p "$RUNNER_TEMP/v10-sat-unit"
          javac -cp "$RUNNER_TEMP/v10-sat-unit" -d "$RUNNER_TEMP/v10-sat-unit" "$PKG/GevGeo.java" "$PKG/GevOrbitMath.java"
          cat > "$RUNNER_TEMP/v10-sat-unit/TestOrbit.java" <<'JAVA_V10_SAT_TEST'
          import com.sentongoharuna.worldsituationroom.GevOrbitMath;
          public final class TestOrbit {
              static void require(boolean condition,String why){if(!condition)throw new AssertionError(why);}
              public static void main(String[] args){
                  long epoch=1720000000000L;
                  GevOrbitMath.Position iss=GevOrbitMath.propagate(15.5d,0.001d,51.6d,110d,45d,16d,epoch,epoch);
                  require(iss.valid,"finite orbital state");
                  require(iss.lat>=-90d&&iss.lat<=90d&&iss.lon>=-180d&&iss.lon<=180d,"valid longitude/latitude");
                  require(iss.altKm>150d&&iss.altKm<750d,"ISS-like rough orbital height");
                  require(!GevOrbitMath.propagate(0d,0d,0d,0d,0d,0d,epoch,epoch).valid,"reject invalid mean motion");
                  GevOrbitMath.Position future=GevOrbitMath.propagate(15.5d,0.001d,51.6d,110d,45d,16d,epoch,epoch+3600000L);
                  require(future.valid,"forward prediction");
                  require(Math.abs(future.lon-iss.lon)>0.1d || Math.abs(future.lat-iss.lat)>0.1d,"changing ground-track");
                  double up=GevOrbitMath.elevationDeg(iss,iss.lat,iss.lon);
                  require(up>85d,"subpoint altitude overhead");
                  require(GevOrbitMath.periodSeconds(15.5d)>5500L,"orbital period");
                  System.out.println("V10 Kepler maths: expected tests passed (not SGP4)");
              }
          }
          JAVA_V10_SAT_TEST
          javac -cp "$RUNNER_TEMP/v10-sat-unit" -d "$RUNNER_TEMP/v10-sat-unit" "$RUNNER_TEMP/v10-sat-unit/TestOrbit.java"
          java -cp "$RUNNER_TEMP/v10-sat-unit" TestOrbit
          python3 - "$PROJECT_DIR" <<'PY_V10_CHECK'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          m=Path(sys.argv[1])/'app/src/main'
          p=m/'java/com/sentongoharuna/worldsituationroom'
          for f in ['GevSatelliteActivity.java','GevOrbitMath.java','GevSatelliteWidget.java']:
              assert (p/f).is_file(),f
          t=(p/'GevSatelliteActivity.java').read_text()
          for s in ['celestrak.org/NORAD/elements/gp.php?GROUP=','&FORMAT=JSON','NOT SGP4','GevOrbitMath.propagate','ShareCardRenderer.share','GevSatelliteWidget.updateAll']:
              assert s in t,s
          assert 'new Intent(this,GevSatelliteActivity.class)' in (p/'GevEarthExploreActivity.java').read_text()
          for f in ['res/layout/rb10_satellite_widget.xml','res/xml/rb10_satellite_widget_info.xml','res/drawable/rb10_sat_widget_card.xml']:
              ET.parse(m/f)
          ids=(p/'DuwmLiveWallpaperService.java').read_text()
          for s in ['FRAME_MS=33L','rotation=(rotation+(dt/1000.0d)*4.0d)%360.0d;','h.lockCanvas()','h.unlockCanvasAndPost(c)']:
              assert s in ids,s
          print('V10 source, navigation, widget IDs, data labelling and original wallpaper preserved')
          PY_V10_CHECK

