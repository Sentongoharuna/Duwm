      - name: V17 ACCEPTANCE - sources, navigation, safe insets, protected globe
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'RB17_ACCEPT'
          from pathlib import Path
          import sys,xml.etree.ElementTree as ET
          root=Path(sys.argv[1])/'app/src/main';p=root/'java/com/sentongoharuna/worldsituationroom'
          files=['RunningballV17PulsePanel.java','RunningballV17Feeds.java','RunningballV17DetailsActivity.java','RunningballV17Insets.java']
          for file in files:assert (p/file).is_file(),file
          hub=(p/'RunningballV12HubActivity.java').read_text()
          assert 'new RunningballV16CommandDeck(this)' in hub
          assert 'new RunningballV17PulsePanel(this)' in hub
          assert 'v17Pulse.start()' in hub and 'v17Pulse.stop()' in hub
          ui=(p/'RunningballV17PulsePanel.java').read_text()
          for token in ('WORLD NEWS','WEATHER','FX REFERENCE','OPEN V17 ','SOURCE NOT LOADED',
                        'RunningballV17DetailsActivity.class','ValueAnimator','changed&&active'):
           assert token in ui,token
          api=(p/'RunningballV17Feeds.java').read_text()
          for host in ('api.gdeltproject.org','api.open-meteo.com','api.frankfurter.dev'):
           assert host in api,host
          for condition in ('!url.startsWith("https://")','source.getJSONArray','getResponseCode()', 'RESPONSE SIZE LIMIT',
                            'RunningballWorldTarget.ready(c)', 'putLong(key+"_received"', 'putString(key+"_error"'):
           # source uses optJSONArray rather than getJSONArray for safe missing-field handling
           if condition=='source.getJSONArray':continue
           assert condition in api,condition
          assert 'new Thread(' in api and 'setConnectTimeout' in api and 'setReadTimeout' in api
          assert 'if(!region.equals(cached(app,WEATHER).optString("region",""))' in api
          assert 'no sample data' not in api.lower() or 'demo data' not in api.lower()
          detail=(p/'RunningballV17DetailsActivity.java').read_text()
          for label in ('OPEN-METEO','GDELT DOC','FRANKFURTER','ACTION_VIEW','ACTION_SEND',
                        'REQUEST FRESH SOURCE DATA','RETURN TO COMMAND CENTER','NO NEWS ARTICLES RETRIEVED'):
           assert label in detail,label
          assert 'class RunningballV17Insets' in (p/'RunningballV17Insets.java').read_text()
          for n in ('RunningballV12HubActivity','AirRadarActivity','GevSatelliteActivity',
                    'RunningballWorldExplorerActivity','RunningballGlobalEventsActivity'):
           assert 'RunningballV17Insets.install(this);' in (p/(n+'.java')).read_text(),n
          an='{http://schemas.android.com/apk/res/android}'
          manifest=ET.parse(root/'AndroidManifest.xml').getroot()
          assert sum(x.get(an+'name')=='.RunningballV17DetailsActivity' for x in manifest.iter('activity'))==1
          assert 'FRAME_MS=33L' in (p/'DuwmLiveWallpaperService.java').read_text()
          print('V17 PASS: 3 sourced live boards, detailed screens, region-aware data, original engine, manifest and Android insets')
          RB17_ACCEPT

