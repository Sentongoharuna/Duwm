      - name: V16 manifest XML regression - worldwide activities registered and original launcher retained
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY_V16_MANIFEST_REGRESSION'
          import sys,xml.etree.ElementTree as ET
          from pathlib import Path
          manifest=Path(sys.argv[1])/'app/src/main/AndroidManifest.xml'
          root=ET.parse(manifest).getroot()
          app=root.find('application')
          assert app is not None,'Android manifest application missing'
          an='{http://schemas.android.com/apk/res/android}'
          def resolve(a):
              n=a.get(an+'name','')
              if n.startswith('.'):return n
              if n.startswith('com.sentongoharuna.worldsituationroom.'):
                  return '.'+n.rsplit('.',1)[-1]
              return '.'+n if n and '.' not in n else n
          activities=list(app.findall('activity'))
          for label in ('.RunningballV12HubActivity','.RunningballWorldExplorerActivity','.RunningballGlobalEventsActivity'):
              found=[a for a in activities if resolve(a)==label]
              assert len(found)==1, f'{label}: expected one activity; found {len(found)}'
              if label!='.RunningballV12HubActivity':
                  assert found[0].get(an+'exported')=='false',f'Worldwide internal activity exported: {label}'
          hub=next(a for a in activities if resolve(a)=='.RunningballV12HubActivity')
          assert any(any(action.get(an+'name')=='android.intent.action.MAIN' for action in f.findall('action')) for f in hub.findall('intent-filter')), 'V12 launcher MAIN action lost'
          print('PASS original Android launcher and two worldwide activities; XML namespaces, quotes and attribute order irrelevant')
          PY_V16_MANIFEST_REGRESSION

      - name: V15 WORLDWIDE - nonlocal observer and real-source acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'RB_GLOBAL_ACCEPT'
          from pathlib import Path
          import sys,re,xml.etree.ElementTree as ET
          m=Path(sys.argv[1])/'app/src/main';p=m/'java/com/sentongoharuna/worldsituationroom'
          world=(p/'RunningballWorldExplorerActivity.java').read_text()
          selection=(p/'RunningballWorldTarget.java').read_text()
          collector=(p/'AirOperationsWidgets.java').read_text()
          radar=(p/'AirRadarActivity.java').read_text()
          contacts=(p/'GevContactsActivity.java').read_text()
          earth=(p/'GevEarthExploreActivity.java').read_text()
          overlay=(p/'DuwmAircraftIntelligence.java').read_text()
          for token in ('SatelliteMapView','SELECT MAP CENTER','geocoding-api.open-meteo.com','RunningballWorldTarget.choose','WORLDWIDE EARTH INTELLIGENCE'):
           assert token in world,token
          for token in ('/v2/point/%.5f/%.5f/250','lat>=-90.0d','lon>=-180.0d','remove("last_snapshot")','NO REGION SELECTED'):
           assert token in selection,token
          assert 'new URL(RunningballWorldTarget.url(context))' in collector
          for required in (
              'radarImage(context, aircraft, stamp, count)',
              'Bitmap radarImage(Context context, JSONArray flights',
              'double north=(la-RunningballWorldTarget.lat(context))*60d;',
              'double east=(lo-RunningballWorldTarget.lon(context))*60d*',
              'canvas.drawText("SECTOR: "+RunningballWorldTarget.label(context)'):
              assert required in collector,'Worldwide radar mismatch: '+required
          assert 'KAMPALA AIRSPACE' not in collector
          widget_xml=(m/'res/layout/rb_air_command.xml').read_text(encoding='utf-8')
          assert 'positions in selected worldwide sector' in widget_xml
          assert 'positions in Kampala' not in widget_xml

          assert 'distanceNm(RunningballWorldTarget.lat(context)' in collector
          assert 'RunningballWorldTarget.label(this)' in radar
          assert 'RunningballWorldTarget.label(this)' in contacts
          assert 'new URL(RunningballWorldTarget.url(app))' in overlay
          assert 'map.setCenter(0.0d,0.0d,2.1d)' in earth
          hub=(p/'RunningballV12HubActivity.java').read_text()
          assert 'WORLDWIDE EARTH' in hub and 'RunningballWorldExplorerActivity' in hub
          assert any(x.get('{http://schemas.android.com/apk/res/android}name')=='.RunningballWorldExplorerActivity' for x in ET.parse(m/'AndroidManifest.xml').iter('activity'))
          assert 'RunningballGlobalEventsActivity' in hub
          assert 'earthquake.usgs.gov' in (p/'RunningballGlobalEventsActivity.java').read_text()
          assert 'eonet.gsfc.nasa.gov' in (p/'RunningballGlobalEventsActivity.java').read_text()
          assert 'FRAME_MS=33L' in (p/'DuwmLiveWallpaperService.java').read_text()
          print('PASS GLOBAL: any-latitude observer, 250NM regional ADS-B, globe navigation, world search, preserved wallpaper')
          RB_GLOBAL_ACCEPT
