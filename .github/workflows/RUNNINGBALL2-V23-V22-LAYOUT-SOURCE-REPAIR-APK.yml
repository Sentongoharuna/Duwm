          assert 'RunningballWorldTarget.ready(ctx)' in ui
          assert 'GevMarineMath.validMmsi' in ui
          assert 'CACHE' not in ui or 'SharedPreferences' in ui
          assert 'RB16-global-source-refresh' in api
          assert 'FRAME_MS=33L' in wall and 'h.unlockCanvasAndPost(c)' in wall
          manifest=ET.parse(p/'AndroidManifest.xml'); android='{http://schemas.android.com/apk/res/android}name'
          assert sum(1 for a in manifest.iter('activity') if a.get(android)=='.RunningballV12HubActivity')==1
          print('PASS V16 boards, source freshness, worldwide selector, no fake counts, UI lifecycle and original wallpaper')
