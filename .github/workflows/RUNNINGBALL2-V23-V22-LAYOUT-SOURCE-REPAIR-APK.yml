                "NO FAKE COUNTS • AIR FETCH IS REAL","RunningballV15SourceHealthActivity",GREEN);
              '''
          text=text.replace(marker,v15+marker,1)
          assert text.count('V14  /  GLOBAL INTELLIGENCE')==1
          text=text.replace('V14  /  GLOBAL INTELLIGENCE','V15  /  VERIFIED INTELLIGENCE',1)
          hub.write_text(text)
          widget=pkg/'RunningballV14SignalWidget.java';data=widget.read_text()
          assert data.count('GLOBAL SIGNALS  /  V14')==1
          widget.write_text(data.replace('GLOBAL SIGNALS  /  V14','GLOBAL SIGNALS  /  V15',1))
          board=pkg/'RunningballV13SignalsActivity.java';s=board.read_text()
          assert s.count('RUNNINGBALL2  V14  /  GLOBAL SIGNALS')==1
          board.write_text(s.replace('RUNNINGBALL2  V14  /  GLOBAL SIGNALS','RUNNINGBALL2  V15  /  GLOBAL SIGNALS',1))
          print('V15 real data health screen linked: Android manifest, hub, working AIR refresh and 3 source routes')
          PY_V15_WIRING

      - name: V15 strict functionality - diagnostics, AIR callback, original globe and source honesty
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY_V15_VERIFY'
          from pathlib import Path
          import sys,xml.etree.ElementTree as ET
          p=Path(sys.argv[1])/'app/src/main';pkg=p/'java/com/sentongoharuna/worldsituationroom'
          health=(pkg/'RunningballV15SourceHealthActivity.java').read_text()
          hub=(pkg/'RunningballV12HubActivity.java').read_text()
          air=(pkg/'AirOperationsWidgets.java').read_text()
          widget=(pkg/'RunningballV14SignalWidget.java').read_text()
          for value in ('AIR_WIDGET_REFRESH','AirOperationsWidgets.Pulse.class','sendBroadcast(refresh)',
                       'NO VERIFIED SNAPSHOT','NOT LOADED','STALE CACHED SNAPSHOT',
                       'REQUEST NEW AIRCRAFT REPORT','OPEN SATELLITES','OPEN MARITIME',
                       'onResume()','onPause()'):
              assert value in health,value
          assert air.count('RunningballV14SignalWidget.updateAll(app)')==1
          assert hub.count('"RunningballV15SourceHealthActivity"')==1
          assert 'GLOBAL SIGNALS  /  V15' in widget
          assert (pkg/'DuwmLiveWallpaperService.java').read_text().count('FRAME_MS=33L')>=1
          manifest=ET.parse(p/'AndroidManifest.xml').getroot();A='{http://schemas.android.com/apk/res/android}'
          assert sum(1 for x in manifest.iter('activity') if x.get(A+'name')=='.RunningballV15SourceHealthActivity')==1
          assert 'Math.random' not in health and 'sample ship' not in health.lower()
          print('V15 source verification PASS (not a live-data or handset test)')
          PY_V15_VERIFY

