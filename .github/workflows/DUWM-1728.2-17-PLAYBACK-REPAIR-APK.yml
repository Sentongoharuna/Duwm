name: DUWM 1728.2/17 | Playback repair and staged native proof
run-name: DUWM 1728.2/17 | Compile and verify playback repair
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    - build/duwm-1728-2-17
    paths:
    - .github/workflows/DUWM-1728.2-17-PLAYBACK-REPAIR-APK.yml
    - DUWM-1728.2-17-PLAYBACK-REPAIR-SOURCE.zip
permissions:
  contents: read
concurrency:
  group: duwm-1728-2-17-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Checkout existing original repository
      uses: actions/checkout@v4
    - name: Restore exact /17 source or checked patch over /10, /11, /12, /13, /14, /15 or /16
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_RESTORE'
        import pathlib,os,hashlib,json,zipfile,tarfile,base64,io,shutil,stat
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'duwm1728217'
        root.mkdir(parents=True,exist_ok=True)
        project=root/'DUWM-1728-2-17-ANDROID-SOURCE'
        if project.exists():shutil.rmtree(project)
        project.mkdir()
        full=pathlib.Path('DUWM-1728.2-17-PLAYBACK-REPAIR-SOURCE.zip')
        expected_full='e8b7d30bbe126744c071278dd321f50eb520f2000348ef46c17175a9b60a5c32'
        parents={'DUWM-1728.2-16-CAPTION-EDITOR-SOURCE.zip': 'f162500f0a676dbaf82dcc4c0fb904675f78e11e212122ce6f8a3ec775f1594d', 'DUWM-1728.2-15-BROADCAST-LAYOUTS-SOURCE.zip': '0cbc629f507dc7a0bf7fb3e10f2cb7034ae1c21e128fb829d4bd116b86b185c2', 'DUWM-1728.2-14-EXPORT-RECOVERY-SOURCE.zip': '7910510de6650bfac15d4f77ce7dad74d1e2cf87f872ce6c1e4f5e315daafa16', 'DUWM-1728.2-13-BROADCAST-CONTROLS-SOURCE.zip': '2bedae2dd91869b7e74c88e8b10877c94bcae1eae6bbf7c74630ec332e6cda3f', 'DUWM-1728.2-10-BROADCAST-TIMING-OUTPUT-CHECKS-SOURCE.zip': 'a9f98fc58040b8d8159b798aecdf9de7e60d5e5f39207ba3a2b30466059f3b0e', 'DUWM-1728.2-11-FRAMING-CONTROLS-SOURCE.zip': '69bc048391d8b5b9113d5198c3a4a75a3e22d0bfe7484b30716858f61784e347', 'DUWM-1728.2-12-BROADCAST-REVIEW-SOURCE.zip': 'eef462e29c12fdbd2d49a7241c4d794f0107a781d4c3ea5326fe573455125c14'}
        def safe_target(name):
            rel=pathlib.PurePosixPath(name)
            if rel.is_absolute() or '..' in rel.parts or not rel.parts:raise ValueError('Unsafe source path')
            target=project.joinpath(*rel.parts)
            if not target.resolve().is_relative_to(project.resolve()):raise ValueError('Escaping source path')
            return target
        def unzip_project(archive):
            roots=set();seen=set()
            with zipfile.ZipFile(archive) as z:
                assert z.testzip() is None,'Corrupt source ZIP'
                for info in z.infolist():
                    if info.is_dir():continue
                    rel=pathlib.PurePosixPath(info.filename)
                    if rel.is_absolute() or '..' in rel.parts or len(rel.parts)<2:raise ValueError('Unsafe ZIP member')
                    if stat.S_ISLNK(info.external_attr>>16):raise ValueError('Source symlink rejected')
                    roots.add(rel.parts[0]);name='/'.join(rel.parts[1:])
                    if name in seen:raise ValueError('Duplicate ZIP member')
                    seen.add(name);target=safe_target(name);target.parent.mkdir(parents=True,exist_ok=True)
                    target.write_bytes(z.read(info))
                assert len(roots)==1,'Expected one source project root'
        if full.is_file():
            assert hashlib.sha256(full.read_bytes()).hexdigest()==expected_full,'The /17 source ZIP and workflow must be a matching pair'
            unzip_project(full)
        else:
            baseline=None
            for name,expected_hash in parents.items():
                p=pathlib.Path(name)
                if p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==expected_hash:baseline=p;break
            if baseline is None:raise SystemExit('Upload the matching /17 SOURCE.zip to repository root; no exact /10, /11, /12, /13, /14, /15 or /16 baseline is present')
            print('Recovering exact /17 source from',baseline)
            unzip_project(baseline)
            patch=base64.b64decode(''.join(os.environ['DUWM_PATCH_%03d'%i] for i in range(25)),validate=True)
            assert hashlib.sha256(patch).hexdigest()=='b543e02367787d567063b549b5ca1ec891cead78b8d9c809402d8fffd6e445db','Embedded patch hash mismatch'
            with tarfile.open(fileobj=io.BytesIO(patch),mode='r:xz') as tar:
                seen=set()
                for member in tar.getmembers():
                    if not member.isfile() or member.name in seen:raise ValueError('Only unique regular patch files allowed')
                    seen.add(member.name);target=safe_target(member.name);target.parent.mkdir(parents=True,exist_ok=True)
                    with tar.extractfile(member) as data:target.write_bytes(data.read())
        manifest=project/'1728_2_17_SOURCE_SHA256.json'
        assert hashlib.sha256(manifest.read_bytes()).hexdigest()=='7ead0d338957a0b6f02f21415f168bcad8ffeb3f677d9d20a41f1af466a24825','Source manifest mismatch'
        expected=json.loads(manifest.read_text())
        # Remove only obsolete files in this isolated restored tree, never the repository.
        for p in list(project.rglob('*')):
            if p.is_file() and p!=manifest and p.relative_to(project).as_posix() not in expected:p.unlink()
        for name,want in expected.items():
            p=safe_target(name)
            assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==want,'Source integrity failed: '+name
        actual={p.relative_to(project).as_posix() for p in project.rglob('*') if p.is_file()}
        assert actual==set(expected)|{manifest.name},'Unexpected source files after restoration'
        print('PASS exact /17 source:',len(expected),'packaged file hashes')
        with open(os.environ['GITHUB_ENV'],'a') as env:
            env.write('PROJECT='+str(project)+'\n')
            env.write('BUILD_LOG_DIR='+str(pathlib.Path(os.environ['RUNNER_TEMP'])/'duwm1728217-logs')+'\n')
        PY_RESTORE
      env:
        DUWM_PATCH_000: 
        DUWM_PATCH_001: 
        DUWM_PATCH_002: 
        DUWM_PATCH_003: 
        DUWM_PATCH_004: 
        DUWM_PATCH_005: 
        DUWM_PATCH_006: 
        DUWM_PATCH_007: 
        DUWM_PATCH_008: 
        DUWM_PATCH_009: 
        DUWM_PATCH_010: 
        DUWM_PATCH_011: 
        DUWM_PATCH_012: 
        DUWM_PATCH_013: 
        DUWM_PATCH_014: 
        DUWM_PATCH_015: 
        DUWM_PATCH_016: 
        DUWM_PATCH_017: 
        DUWM_PATCH_018: 
        DUWM_PATCH_019: 
        DUWM_PATCH_020: 
        DUWM_PATCH_021: 
        DUWM_PATCH_022: 
        DUWM_PATCH_023: 
        DUWM_PATCH_024: 
    - name: Check every packaged source file
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_HASH'
        import pathlib,os,json,hashlib
        root=pathlib.Path(os.environ['PROJECT']).resolve()
        expected=json.loads((root/'1728_2_17_SOURCE_SHA256.json').read_text())
        for name,sha in expected.items():
            p=(root/name).resolve()
            assert p.is_relative_to(root) and p.is_file(),name
            assert hashlib.sha256(p.read_bytes()).hexdigest()==sha,name
        print('PASS',len(expected),'packaged source hashes')
        PY_HASH
    - name: Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Test /17 playback repair, caption editing, composition, recovery and service contracts
      shell: bash
      run: |
        set -euo pipefail
        cd "$PROJECT"
        python -m pip install -r ai-production-server/requirements-test.txt
        python verification/check_source.py
        python verification/check_1728_2_17.py
        python -m pytest -q ai-production-server/test_server.py
        mkdir -p "$RUNNER_TEMP/duwm-parser"
        javac -d "$RUNNER_TEMP/duwm-parser" verification/JavaSyntaxCheck.java
        java -cp "$RUNNER_TEMP/duwm-parser" JavaSyntaxCheck
        java -cp "$RUNNER_TEMP/duwm-parser" JavaSyntaxCheck app/src/androidTest/java
    - name: Publish scoped host-render evidence
      uses: actions/upload-artifact@v4
      with:
        name: DUWM-1728.2-17-HOST-RENDER-TESTS-NOT-PHONE
        path: ${{ env.PROJECT }}/verification/results/1728_2_17/
        if-no-files-found: error
        retention-days: 30
    - name: Ensure Android SDK and signing tools
      shell: bash
      run: |
        set -euo pipefail
        SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
        MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
        test -x "$MANAGER"
        if [ ! -s "$SDK/platforms/android-36/android.jar" ] || [ ! -x "$SDK/build-tools/36.0.0/apksigner" ]; then
          timeout 600 "$MANAGER" --sdk_root="$SDK" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
        fi
        test -s "$SDK/platforms/android-36/android.jar"
        test -x "$SDK/build-tools/36.0.0/aapt"
        echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
    - name: Optional retained debug signing key
      shell: bash
      env:
        SAVED_KEY: ${{ secrets.DUWM_DEBUG_KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        if [ -n "$SAVED_KEY" ]; then
          mkdir -p "$HOME/.android"
          printf '%s' "$SAVED_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
        else
          echo 'No retained debug keystore supplied. Existing installations may have a different signer; preserve private drafts.'
        fi
    - name: Gradle 8.13
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'
        cache-disabled: true
    - name: Android Java type-check (catches missing methods; not a syntax-only test)
      shell: bash
      run: |
        set -euo pipefail
        cd "$PROJECT"
        bash verification/ci_android_build.sh typecheck
    - name: Assemble real application and instrumentation APKs
      shell: bash
      run: |
        set -euo pipefail
        cd "$PROJECT"
        bash verification/ci_android_build.sh assemble
        mkdir -p "$RUNNER_TEMP/duwm-apk" "$RUNNER_TEMP/duwm-native-test"
        cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/duwm-apk/DUWM-1728.2-17-PLAYBACK-REPAIR.apk"
        cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/duwm-native-test/DUWM-native-tests.apk"
        cp 1728_2_17_BUILD_NOTES.md 1728_2_17_ACCEPTANCE.json "$RUNNER_TEMP/duwm-apk/"
        cp verification/run_native_stages.sh verification/verify_native_stages.py "$RUNNER_TEMP/duwm-native-test/"
    - name: Verify actual APK identity, signature and compiled components
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PY_APK'
        import os,pathlib,zipfile,subprocess,hashlib
        out=pathlib.Path(os.environ['RUNNER_TEMP'])/'duwm-apk'
        apk=out/'DUWM-1728.2-17-PLAYBACK-REPAIR.apk'
        assert apk.stat().st_size>150000
        with zipfile.ZipFile(apk) as z:
            assert z.testzip() is None
            dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
            for token in (b'SatelliteMapView',b'Duwm1718MonitorsCamActivity',b'Duwm1728BroadcastLayout',b'Duwm1728BroadcastCanvas',b'Duwm1728EglVideoPipe',b'Duwm1728AiProductionClient',b'Duwm1728VideoEditorActivity',b'Duwm1728AiStartPolicy',b'maybeStartAiAfterCapture',b'beginAi',b'Duwm1728BroadcastTimeline',b'Duwm1728ExportPreflight',b'parseSrtCues',b'Duwm1728FramePlan',b'showFraming',b'Duwm1728BroadcastReviewActivity',b'shareIntent',b'Duwm1728EditorTrimPolicy',b'Duwm1728BroadcastReviewState',b'Duwm1728ExportRecovery',b'Duwm1728ExportRecoveryActivity',b'Duwm1728ExportRecoveryProvider',b'Duwm1728BroadcastComposition',b'Duwm1728CaptionEditPolicy',b'Duwm1728CaptionEditorDialog'):
                assert token in dex,token
        test_apk=pathlib.Path(os.environ['RUNNER_TEMP'])/'duwm-native-test'/'DUWM-native-tests.apk'
        assert test_apk.stat().st_size>50000
        with zipfile.ZipFile(test_apk) as z:
            assert z.testzip() is None
            test_dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
            for token in (b'DuwmRenderedFrameCapture',b'review.missing_file.verified',b'ANDROID-EDITOR-TRIM-LANDSCAPE-BOUNDS.json',b'-CAPTURE.txt'):
                assert token in test_dex,token
        tools=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
        signer=subprocess.check_output([str(tools/'apksigner'),'verify','--verbose','--print-certs',str(apk)],text=True)
        print(signer)
        (out/'APK-SIGNER.txt').write_text(signer)
        text=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(apk)],text=True)
        for token in ("versionCode='172817'","versionName='1728.2.17'","name='com.sentongoharuna.worldsituationroom.rb2live25'","application-label:'DUWM 1728.2/17 • DEVELOP.UGANDA'"):
            assert token in text,token
        (out/'APK-IDENTITY.txt').write_text(text)
        (out/'SHA256SUMS.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  '+apk.name+'\n')
        print('Compiled development APK. AI inference, physical camera and native export are separate gates.')
        PY_APK
    - name: Publish compiled development APK for testing
      uses: actions/upload-artifact@v4
      with:
        name: DUWM-1728.2-17-COMPILED-DEVELOPMENT-APK
        path: ${{ runner.temp }}/duwm-apk/
        if-no-files-found: error
        retention-days: 30
    - name: Publish Android test APK
      uses: actions/upload-artifact@v4
      with:
        name: DUWM-1728.2-17-NATIVE-TEST-APK
        path: ${{ runner.temp }}/duwm-native-test/
        if-no-files-found: error
        retention-days: 30
    - name: Retain compiler logs and diagnostics even when a job fails
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: DUWM-1728.2-17-BUILD-DIAGNOSTICS
        path: |
          ${{ env.PROJECT }}/app/build/reports/
          ${{ env.PROJECT }}/build/reports/
          ${{ runner.temp }}/duwm1728217-logs/
        if-no-files-found: warn
        retention-days: 30
  native-broadcast-tests:
    needs: compile-development
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Java 17 for Android emulator tooling
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Download compiled application
      uses: actions/download-artifact@v4
      with:
        name: DUWM-1728.2-17-COMPILED-DEVELOPMENT-APK
        path: apk
    - name: Download native test APK
      uses: actions/download-artifact@v4
      with:
        name: DUWM-1728.2-17-NATIVE-TEST-APK
        path: tests
    - name: Enable KVM
      shell: bash
      run: |
        set -euo pipefail
        test -e /dev/kvm
        sudo chmod 666 /dev/kvm
    - name: Prepare persistent native test and evidence script
      shell: bash
      run: |
        set -euo pipefail
        cp tests/run_native_stages.sh "$RUNNER_TEMP/duwm-native.sh"
        cp tests/verify_native_stages.py "$RUNNER_TEMP/verify_native_stages.py"
        chmod +x "$RUNNER_TEMP/duwm-native.sh"
        bash -n "$RUNNER_TEMP/duwm-native.sh"
    - name: Required eleven native stages with exact APK and evidence verification
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        profile: pixel_6
        emulator-boot-timeout: 900
        disable-animations: true
        script: bash "$RUNNER_TEMP/duwm-native.sh" apk/DUWM-1728.2-17-PLAYBACK-REPAIR.apk tests/DUWM-native-tests.apk native-evidence
    - name: Publish actual native evidence, including failures
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: DUWM-1728.2-17-NATIVE-EXPORT-EVIDENCE
        path: native-evidence/
        if-no-files-found: warn
        retention-days: 30
    - name: Publish development APK with native test evidence only after success
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: DUWM-1728.2-17-NATIVE-TESTED-DEVELOPMENT-APK
        path: |-
          apk/
          native-evidence/
        if-no-files-found: error
        retention-days: 30
