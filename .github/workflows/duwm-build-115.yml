name: DUWM Build 115 FIX1 - Source-aware APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/duwm-build-115.yml'
      - 'DUWM-BUILD-115-SOURCE.zip'
permissions:
  contents: read
jobs:
  build115:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select source without replacing user changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f DUWM-BUILD-115-SOURCE.zip ]]; then
            mkdir -p build115
            unzip -q DUWM-BUILD-115-SOURCE.zip -d build115
            echo "PROJECT_DIR=build115" >> "$GITHUB_ENV"
            echo "SOURCE_LABEL=115-uploaded-source" >> "$GITHUB_ENV"
          elif [[ -f gradlew && ( -f settings.gradle.kts || -f settings.gradle ) ]]; then
            echo "::warning::Build 115 ZIP absent. Compiling existing repository source, NOT claiming this is uploaded Build 115."
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            echo "SOURCE_LABEL=repository-source-fallback" >> "$GITHUB_ENV"
          else
            echo "::error::No Android Gradle source found."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Compile Android debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-debug-apk-source-aware
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
