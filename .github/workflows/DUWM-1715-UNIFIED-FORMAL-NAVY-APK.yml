name: "DUWM 1715 | Formal navy UI and independent signed APK"
run-name: "DUWM 1715 | Rebuild original globe, repair formal UI, publish actual APK"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/DUWM-1715-UNIFIED-FORMAL-NAVY-APK.yml'
      - 'DUWM-1715-UNIFIED-FORMAL-NAVY-SOURCE.zip'
permissions:
  contents: read
concurrency:
  group: duwm-1715-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile-signed-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PROJECT: ${{ runner.temp }}/duwm1715/DUWM-1715-ANDROID-SOURCE
    steps:
      - name: Checkout the original GitHub repository
        uses: actions/checkout@v4
      - name: Recover full 1715 source or apply verified patch over exact 1714 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/duwm1715"
          if [ -s DUWM-1715-UNIFIED-FORMAL-NAVY-SOURCE.zip ]; then
            echo '4540941d41a4e83339af2eb2604f9531ccb79a31b004f57ce2812ee94e398b15  DUWM-1715-UNIFIED-FORMAL-NAVY-SOURCE.zip' | sha256sum -c -
            unzip -t DUWM-1715-UNIFIED-FORMAL-NAVY-SOURCE.zip | tail -1
            unzip -q DUWM-1715-UNIFIED-FORMAL-NAVY-SOURCE.zip -d "$RUNNER_TEMP/duwm1715"
          else
            # The exact previous full Android project exists in the current repository.
            echo '029a3bff1a1f02584407aca81ac7c0c41767a64827504b84454509f8b87833b5  DUWM-1714-SECTOR-WATCHLIST-SOURCE.zip' | sha256sum -c -
            unzip -q DUWM-1714-SECTOR-WATCHLIST-SOURCE.zip -d "$RUNNER_TEMP/duwm1715"
            cd "$RUNNER_TEMP/duwm1715/DUWM-1714-ANDROID-SOURCE"
            base64 --decode > "$RUNNER_TEMP/duwm1715-formal.patch.xz" <<'DUWM_1715_VERIFIED_PATCH'
