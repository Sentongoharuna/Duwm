      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate actual 1715 changes, receipt invariants and all Java syntax
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python3 verification/check_source.py
          python3 verification/check_1715.py
          mkdir -p "$RUNNER_TEMP/duwm1715-parser"
          javac -d "$RUNNER_TEMP/duwm1715-parser" verification/JavaSyntaxCheck.java
          java -cp "$RUNNER_TEMP/duwm1715-parser" JavaSyntaxCheck
      - name: Install Android 36 SDK if missing (no emulator/system image dependency)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then SDK_MANAGER="$(command -v sdkmanager)"; fi
          if [ ! -s "$SDK_ROOT/platforms/android-36/android.jar" ] || [ ! -x "$SDK_ROOT/build-tools/36.0.0/apksigner" ]; then
            timeout 600 "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          fi
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Compile original command-center Android APK, version 1715
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          gradle --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p "$RUNNER_TEMP/duwm1715-apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/duwm1715-apk/DUWM-1715.apk"
      - name: Verify the real signed APK and embedded 1715 classes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          import hashlib, os, pathlib, subprocess, zipfile
          apk=pathlib.Path(os.environ['RUNNER_TEMP'])/'duwm1715-apk/DUWM-1715.apk'
          assert apk.is_file() and apk.stat().st_size>150000
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              dex=b''.join(z.read(x) for x in z.namelist() if x.startswith('classes') and x.endswith('.dex'))
              for word in (b'SatelliteMapView',b'Duwm1715FormalUi',b'Duwm1712OperationsMatrixActivity',
                           b'Duwm1711NativeDeskDock',b'Duwm1709SectorOutline',b'SignalTickerRailView',
                           b'WATCHED',b'Duwm1713ReceiptCoverageView'):
                  assert word in dex,('Expected compiled class/feature not found',word)
          sdk=pathlib.Path(os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT'])/'build-tools/36.0.0'
          subprocess.run([str(sdk/'apksigner'),'verify','--verbose',str(apk)],check=True)
          badge=subprocess.check_output([str(sdk/'aapt'),'dump','badging',str(apk)],text=True)
          for term in ("versionCode='171500'","versionName='1715'",
                       "name='com.sentongoharuna.worldsituationroom.rb2live25'",
                       "application-label:'DUWM 1715 • DEVELOP.UGANDA'"):
              assert term in badge,(term,badge[:1200])
          (apk.parent/'SHA256SUMS.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  '+apk.name+'\n')
          print('SIGNED REAL APK COMPILED: DUWM 1715, original globe, formal UI, source watchlist and live ticker classes')
          PY_VERIFY
      - name: Upload compiled, signed APK even when emulator image download fails
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-1715-SIGNED-COMPILED-APK
          path: ${{ runner.temp }}/duwm1715-apk/
          if-no-files-found: error
          retention-days: 30
  emulator-smoke-optional:
    needs: compile-signed-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Download compiled APK from required green build
        uses: actions/download-artifact@v4
        with:
          name: DUWM-1715-SIGNED-COMPILED-APK
          path: apk
      - name: Install APK in Android 35 emulator (SDK image download may be unavailable)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            adb install -r apk/DUWM-1715.apk
            adb logcat -c
            adb shell am start -W -n com.sentongoharuna.worldsituationroom.rb2live25/com.sentongoharuna.worldsituationroom.MainActivity
            sleep 12
            adb shell pidof com.sentongoharuna.worldsituationroom.rb2live25
            adb exec-out screencap -p > apk/DUWM-1715-ORIGINAL-GLOBE.png
            test -s apk/DUWM-1715-ORIGINAL-GLOBE.png
            adb logcat -d -s AndroidRuntime:E > apk/DUWM-1715-AndroidRuntime.txt || true
            ! grep -q 'FATAL EXCEPTION' apk/DUWM-1715-AndroidRuntime.txt
      - name: Upload screenshot only if a genuine emulator session succeeded
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-1715-EMULATOR-SCREENSHOT-VERIFIED
          path: apk/DUWM-1715-ORIGINAL-GLOBE.png
          if-no-files-found: error
          retention-days: 30
