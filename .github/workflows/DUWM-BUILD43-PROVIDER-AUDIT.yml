name: DUWM Build 43 Provider Verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/DUWM-BUILD43-PROVIDER-AUDIT.yml'
      - 'scripts/duwm-provider-smoke-audit.py'
  workflow_dispatch:
jobs:
  provider-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test public provider reachability and response schema
        run: python3 scripts/duwm-provider-smoke-audit.py
      - name: Upload independent provider report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-BUILD43-PROVIDER-REPORT
          path: provider-audit/
          if-no-files-found: warn
