        assert not any(e.get(a+'name')=='.DuwmPlaceMapActivity' for e in app.findall('activity'))\nET.SubElement(app,'activity',{a+'name':'.DuwmPlaceMapActivity',a+'exported':'true',a+'label':'REGIONAL\
        \ MAPS'})\ntree.write(manifest,encoding='utf-8',xml_declaration=True)\nassert [(e.tag,e.get(a+'name','')) for e in\
        \ app if e.tag in ('receiver','service')]==old_receivers\n# Preserve the precise app version, original globe, share\
        \ renderer, and widget source.\ngradle=(root/'app/build.gradle.kts').read_text()\nassert 'versionCode = 116000' in\
        \ gradle and 'versionName = \"1160\"' in gradle\nassert 'applicationId = \"com.sentongoharuna.worldsituationroom.rb2live25\"\
        ' in gradle\nfor name,hash0 in originals.items():\n    assert hashlib.sha256((pkg/name).read_bytes()).hexdigest()==hash0,('Protected\
        \ existing feature changed',name)\nfor f,h in widgets.items():\n    assert hashlib.sha256(Path(f).read_bytes()).hexdigest()==h,('Existing\
        \ widget resource changed',f)\ngeo=(pkg/'DuwmPlaceMapActivity.java').read_text()\nrail=(pkg/'DuwmSignalRail.java').read_text()\n\
        for term in ('WebView','OpenSky Network','Open-Meteo model forecast','SHARE SELECTED VERIFIED DATA POINT',\n     \
        \        'NO AIS FEED CONFIGURED','Where The ISS At'):\n    assert term in geo,('Source-driven place map missing',term)\n\
        html=(src/'assets/duwm_place_map.html').read_text()\nfor token in ('tiles.openfreemap.org/styles/dark','window.duwmReceive','duwm-road-halo','duwm-route-core','line-extrusion'\
        \ if False else 'fill-extrusion','SOURCE GEOMETRY' if False else 'Road illumination'):\n    assert token in html,('Dynamic\
        \ vector map layer missing',token)\nassert 'Gravity.END | Gravity.BOTTOM' in rail and '156f*rail.density' in rail,\
        \ 'Signal overlay still obstructs the globe'\nprint('DUWM 1160 PASS: source-driven luminous roads, per-region styles,\
        \ observed track traces, every-marker share, compact signal chip; original widgets and globe protected')\nDUWM_1160_MAPS_INSTALL"
    - name: Compile complete Android APK
      shell: bash
      run: 'set -euo pipefail

        cd "$PROJECT_DIR"

        gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac :app:assembleDebug --stacktrace

        mkdir -p "$RUNNER_TEMP/release"

        cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/release/DEVELOP-UGANDA-1160.apk"

        '
    - name: Verify signed APK actual compiled DEX and correct version
      shell: bash
      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" \"$RUNNER_TEMP/release/DEVELOP-UGANDA-1160.apk\" <<'PY_DUWM_VERIFY'\n\
        from pathlib import Path\nimport subprocess,sys,zipfile\nproject,apk=map(Path,sys.argv[1:]);assert apk.is_file() and\
        \ apk.stat().st_size>150000\nwith zipfile.ZipFile(apk) as z:\n assert z.testzip() is None\n files=z.namelist();assert\
        \ 'classes.dex' in files and 'AndroidManifest.xml' in files\n dex=b''.join(z.read(n) for n in files if n.endswith('.dex'))\n\
        \ for item in (b'PulseDataActivity',b'V115941ShareCards',b'OperationsGlobeView',b'DuWidgetProviders',b'BBC News RSS',b'SOURCE\
        \ COUNT',b'WORLD GEOGRAPHIC DISPLAY',b'EARTHQUAKE'):\n  assert item in dex,('New visualization/data sharing or original\
        \ feature missing from compiled APK',item)\nsdk=Path(__import__('os').environ['ANDROID_HOME']);tools=sdk/'build-tools/36.0.0'\n\
        subprocess.run([str(tools/'apksigner'),'verify',str(apk)],check=True)\nbadge=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(apk)],text=True)\n\
        assert \"versionCode='116000'\" in badge and \"1160\" in badge,badge[:300]\nassert \"name='com.sentongoharuna.worldsituationroom.rb2live25'\"\
        \ in badge\nprint('PASS real signed Android APK with radar, data cards, source truth and unchanged application identity')\n\
        PY_DUWM_VERIFY\npython3 - \"$RUNNER_TEMP/release/DEVELOP-UGANDA-1160.apk\" <<'PY_DUWM_SIGNAL_APK'\nimport sys,zipfile\n\
        with zipfile.ZipFile(sys.argv[1]) as z:\n    assert z.testzip() is None\n    dex=b''.join(z.read(n) for n in z.namelist()\
        \ if n.endswith('.dex'))\n    for symbol in (b'DuwmSignalRail',b'DuwmSignalProvider',b'DUWM 1160',\n             \
        \      b'V115941ShareCards',b'PulseDataActivity',b'publishVerifiedReceipt',\n                   b'SIGNAL LIGHTS',b'NO\
        \ RECENT VERIFIED SOURCE RECEIPT'):\n        assert symbol in dex,('Signal system not compiled in APK',symbol)\nprint('PASS:\
        \ compiled APK includes all-screen source-driven signal rail, shareable LEDs, and original renderer')\nPY_DUWM_SIGNAL_APK\n"
    - name: 'DUWM 1160 MAPS: enforce actual map/share/signal classes in compiled APK'
      shell: bash
      run: "set -euo pipefail\npython3 - \"$RUNNER_TEMP/release/DEVELOP-UGANDA-1160.apk\" <<'DUWM_1160_MAPS_DEX'\nimport sys,zipfile\n\
        with zipfile.ZipFile(sys.argv[1]) as z:\n    assert z.testzip() is None\n    dex=b''.join(z.read(n) for n in z.namelist()\
        \ if n.endswith('.dex'))\n    for token in (b'DuwmPlaceMapActivity',b'DuwmGeoObservationStore',b'PulseDataActivity',\n\
        \                  b'V115941ShareCards',b'DuwmSignalRail',b'SHARE SELECTED VERIFIED DATA POINT',\n               \
        \   b'PLACE INTELLIGENCE'):\n        assert token in dex,('Not compiled in the 1160 APK',token)\n    assert 'assets/duwm_place_map.html'\
        \ in z.namelist(), 'MapLibre vector geographic source missing from APK'\n    assert b'duwm-road-halo' in z.read('assets/duwm_place_map.html'),\
        \ 'Illuminated road geometry layer missing'\nprint('PASS: real map engine, original share cards and compact signals\
        \ in DEX')\nDUWM_1160_MAPS_DEX"
    - name: Upload installable DUWM 1160 APK before emulator tests
      uses: actions/upload-artifact@v4
      with:
        name: DEVELOP-UGANDA-1160-MAPS-APK
        path: ${{ runner.temp }}/release/DEVELOP-UGANDA-1160.apk
        retention-days: 30
        if-no-files-found: error
    - name: Enable emulator KVM acceleration
      shell: bash
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm || true'
    - name: Android emulator verifies genuine visual screen and per-point share action
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        profile: pixel_6
        cores: 2
        ram-size: 2048M
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        script: "bash -c 'set -euo pipefail\nadb install -r \"$RUNNER_TEMP/release/DEVELOP-UGANDA-1160.apk\"\nadb shell am\
          \ start -n com.sentongoharuna.worldsituationroom.rb2live25/com.sentongoharuna.worldsituationroom.PulseDataActivity\n\
          sleep 4\nadb shell uiautomator dump /sdcard/duwm1160-pulse.xml >/dev/null\nadb shell cat /sdcard/duwm1160-pulse.xml\
          \ > \"$RUNNER_TEMP/duwm-116000-ui.xml\"\ngrep -q '\"'\"'LIVE SIGNAL INTELLIGENCE'\"'\"' \"$RUNNER_TEMP/duwm-116000-ui.xml\"\
          \ngrep -q '\"'\"'SHARE SELECTED INDIVIDUAL DATA POINT'\"'\"' \"$RUNNER_TEMP/duwm-116000-ui.xml\"\nadb shell am start\
          \ -n com.sentongoharuna.worldsituationroom.rb2live25/com.sentongoharuna.worldsituationroom.DuwmPlaceMapActivity\n\
          sleep 6\nadb shell uiautomator dump /sdcard/duwm1160-geo.xml >/dev/null\nadb shell cat /sdcard/duwm1160-geo.xml\
          \ > \"$RUNNER_TEMP/duwm-1160-geo.xml\"\ngrep -q '\"'\"'PLACE INTELLIGENCE'\"'\"' \"$RUNNER_TEMP/duwm-1160-geo.xml\"\
          \ngrep -q '\"'\"'SHARE SELECTED VERIFIED DATA POINT'\"'\"' \"$RUNNER_TEMP/duwm-1160-geo.xml\"\nadb exec-out screencap\
          \ -p > \"$RUNNER_TEMP/duwm-116000-visuals.png\"\ntest -s \"$RUNNER_TEMP/duwm-116000-visuals.png\"\n# Signal chip\
          \ must remain accessible and can expand on tap without covering the map.\ngrep -q '\"'\"'DUWM 1160 SIGNAL LIGHTS'\"\
          '\"' \"$RUNNER_TEMP/duwm-1160-geo.xml\"\nif adb logcat -d -t 4500 | grep -A8 '\"'\"'FATAL EXCEPTION'\"'\"' | grep\
          \ -q '\"'\"'com.sentongoharuna.worldsituationroom'\"'\"';then\n  echo '\"'\"'Android runtime crash in 1160 activities'\"\
          '\"' >&2;exit 1\nfi\necho '\"'\"'PASS Android emulator: source maps, individual cards and compact 8-colour signals\
          \ visible'\"'\"' '"
    - name: Upload real Android screenshot and UI evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: DEVELOP-UGANDA-1160-MAPS-ANDROID-EVIDENCE
        path: '${{ runner.temp }}/duwm-116000-visuals.png

          ${{ runner.temp }}/duwm-116000-ui.xml

          ${{ runner.temp }}/duwm-1160-geo.xml'
        if-no-files-found: warn
        retention-days: 30
    name: Build and verify original-scope 1160 APK
