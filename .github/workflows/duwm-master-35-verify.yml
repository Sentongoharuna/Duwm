name: DUWM Master 35 Android APK verification
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/duwm-master-35-verify.yml'
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-master-35-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
