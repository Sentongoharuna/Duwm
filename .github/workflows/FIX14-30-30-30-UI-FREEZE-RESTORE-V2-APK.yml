name: FIX14.30 30.30 UI FREEZE RESTORE V2
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  ui-freeze-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: echo "8084d5773f2cffc07ea800bf6f0ec7e4f32b0bab2eecde5f989dd80c7dcbf2b7  FIX14-30-30-30-UI-FREEZE-RESTORE-V2-SOURCE.tar.gz" | sha256sum -c -
      - run: |
          mkdir -p "$RUNNER_TEMP/duwm"; tar -xzf FIX14-30-30-30-UI-FREEZE-RESTORE-V2-SOURCE.tar.gz -C "$RUNNER_TEMP/duwm"; P="$(find "$RUNNER_TEMP/duwm" -mindepth 1 -maxdepth 1 -type d | head -n1)"; echo "PROJECT_DIR=$P" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: Verify UI freeze V2
        run: python3 "$PROJECT_DIR/fix14-tests/FIX14_30_30_UI_FREEZE_V2_AUDIT.py" "$PROJECT_DIR"
      - name: Verify port airport repair
        run: python3 "$PROJECT_DIR/fix14-tests/FIX14_30_30_BUILD_REPAIR_V2_AUDIT.py" "$PROJECT_DIR"
      - name: SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"; echo "SDKMANAGER=$SM" >> "$GITHUB_ENV"
      - run: yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true; "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.13", cache-disabled: true}
      - name: Build UI-frozen FIX14 APK V2
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache clean :app:assembleDebug --stacktrace
      - name: Stage APK
        run: |
          mapfile -t APKS < <(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | sort); test "${#APKS[@]}" -eq 1; test -s "${APKS[0]}"; mkdir -p "$RUNNER_TEMP/release"; cp "${APKS[0]}" "$RUNNER_TEMP/release/FIX14-30-30-30-UI-FREEZE-RESTORE-V2.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: FIX14-30-30-30-UI-FREEZE-RESTORE-V2-APK
          path: ${{ runner.temp }}/release/FIX14-30-30-30-UI-FREEZE-RESTORE-V2.apk
          if-no-files-found: error
