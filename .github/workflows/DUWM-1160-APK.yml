name: DUWM 1160 - Original Widget Style, Real Moving Data, Share Every Record
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/DUWM-1160-APK.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - name: Checkout DUWM unchanged source
      uses: actions/checkout@v4
    - name: Read original protected RUNNINGBALL2 source
      uses: actions/checkout@v4
      with:
        repository: Sentongoharuna/Du-World-Situation-Room-
        ref: 7d952dd607cdeec94832896023c10203425a3b7f
        path: rb2-original-source
        persist-credentials: false
    - name: Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Gradle 8.13
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'
        cache-disabled: true
    - name: Read verified workflow source (PyYAML)
      run: python3 -m pip install --no-cache-dir PyYAML==6.0.3
    - name: Preflight 1160 source, unchanged widgets, real moving data and share cards
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY_1160_PREFLIGHT'\nfrom pathlib import Path\nimport yaml,ast,base64,gzip,hashlib,re\n\
        wf=yaml.safe_load(Path('.github/workflows/DUWM-1160-APK.yml').read_text())\nsteps=wf['jobs']['build']['steps']\n\
        installer=next(s['run'] for s in steps if s['name']=='Install DUWM 1160 individual sharing and genuine moving\
        \ data visualizations')\nbody=re.search(r\"<<'PY_DUWM_1160_INSTALL'\\n(.*?)\\nPY_DUWM_1160_INSTALL\",installer,re.S).group(1)\n\
        ast.parse(body)\nvalues={}\nnode=next(n for n in ast.parse(body).body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name)\
        \ and t.id=='encoded' for t in n.targets))\npayload=ast.literal_eval(node.value)\nsource=gzip.decompress(base64.b64decode(payload,validate=True))\n\
        assert hashlib.sha256(source).hexdigest()=='600e6ef19a5cd52b911051271314b6562c90a72f1f09bd8ffa6300fae865adb9'\n\
        java=source.decode()\nfor signature in ('V115941ShareCards.share','postInvalidateDelayed(33)','OpenSky Network','USGS\
        \ Earthquake Hazards Program','BBC News RSS','Where The ISS At'):\n assert signature in java,signature\nassert\
        \ '1160' in wf['name']\nassert any('Rebuild original 1159.4/1 app without adding any new widgets' in s['name']\
        \ for s in steps)\nassert any('Verify signed APK actual compiled DEX and correct version' == s['name'] for\
        \ s in steps)\nprint('PASS: immutable Android source, original widget preservation, individual sharing and\
        \ source-driven visuals')\nPY_1160_PREFLIGHT"
    - name: Rebuild intact 1159.4/1 baseline without adding or replacing widgets
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY_DUWM_BASE'\nfrom pathlib import Path\nimport os,subprocess,tempfile,yaml\n\
        source=Path('.github/workflows/RUNNINGBALL2-V1159.4-1-SHARE-CARDS.yml')\nassert source.is_file(), 'Verified\
        \ inherited 1159.4/1 source workflow missing'\nwf=yaml.safe_load(source.read_text(encoding='utf-8'))\nsteps=wf['jobs']['build']['steps']\n\
        assert len(steps)>=64 and steps[6]['name'].startswith('Rebuild full V109 native app')\nassert 'V1159.4/1 INSTALL\
        \ advanced branded share cards on every source record' in steps[41]['name']\nassert 'set Android version 1159.4/1'\
        \ in steps[42]['name']\nassert all('run' in x and 'uses' not in x for x in steps[6:43]), 'Unexpected inherited\
        \ action instead of source generation'\nworkspace=Path(os.environ['GITHUB_WORKSPACE']); env=os.environ.copy();\
        \ marker=Path(env['GITHUB_ENV'])\nfor index in range(6,43):\n    step=steps[index]; script=step['run']; title=step['name']\n\
        \    assert isinstance(script,str) and len(script)<250000 and (chr(36)+chr(123)+chr(123)) not in script, ('Unsafe/incomplete\
        \ source script',title)\n    print('INHERITED SOURCE STEP',index+1,title,flush=True)\n    with tempfile.NamedTemporaryFile(prefix='duwm1160-',suffix='.sh',dir=env['RUNNER_TEMP'],mode='w',delete=False)\
        \ as f:\n        f.write(script); fn=Path(f.name)\n    try:\n        p=subprocess.run(['bash','-eo','pipefail',str(fn)],cwd=workspace,env=env,check=False)\n\
        \    finally:\n        fn.unlink(missing_ok=True)\n    if p.returncode:raise SystemExit('Inherited source\
        \ generation failed at '+title+' code '+str(p.returncode))\n    if marker.exists():\n        for line in marker.read_text().splitlines():\n\
        \            if '=' in line:\n                key,value=line.split('=',1)\n                if key.isidentifier():env[key]=value\n\
        project=Path(env.get('PROJECT_DIR',''))\nassert project.is_dir() and (project/'app/build.gradle.kts').is_file(),'Original\
        \ Android source generation incomplete'\nassert (project/'app/src/main/java/com/sentongoharuna/worldsituationroom/V115941ShareCards.java').is_file(),'Existing\
        \ original share card renderer missing'\nwith marker.open('a') as f:f.write('PROJECT_DIR='+str(project.resolve())+'\\\
        n')\nprint('PASS complete genuine 1159.4/1 app baseline, protected original widgets and branded record sharing',flush=True)\n\
        PY_DUWM_BASE"
