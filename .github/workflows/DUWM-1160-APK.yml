    - name: Compile complete Android APK
      shell: bash
      run: 'set -euo pipefail

        cd "$PROJECT_DIR"

        gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac :app:assembleDebug --stacktrace

        mkdir -p "$RUNNER_TEMP/release"

        cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/release/DEVELOP-UGANDA-1160.apk"

        '
    - name: Verify signed APK actual compiled DEX and correct version
      shell: bash
      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" \"$RUNNER_TEMP/release/DEVELOP-UGANDA-1160.apk\" <<'PY_DUWM_VERIFY'\n\
        from pathlib import Path\nimport subprocess,sys,zipfile\nproject,apk=map(Path,sys.argv[1:]);assert apk.is_file()\
        \ and apk.stat().st_size>150000\nwith zipfile.ZipFile(apk) as z:\n assert z.testzip() is None\n files=z.namelist();assert\
        \ 'classes.dex' in files and 'AndroidManifest.xml' in files\n dex=b''.join(z.read(n) for n in files if n.endswith('.dex'))\n\
        \ for item in (b'PulseDataActivity',b'V115941ShareCards',b'OperationsGlobeView',b'DuWidgetProviders',b'BBC\
        \ News RSS',b'SOURCE COUNT',b'WORLD GEOGRAPHIC DISPLAY',b'EARTHQUAKE'):\n  assert item in dex,('New visualization/data\
        \ sharing or original feature missing from compiled APK',item)\nsdk=Path(__import__('os').environ['ANDROID_HOME']);tools=sdk/'build-tools/36.0.0'\n\
        subprocess.run([str(tools/'apksigner'),'verify',str(apk)],check=True)\nbadge=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(apk)],text=True)\n\
        assert \"versionCode='116000'\" in badge and \"1160\" in badge,badge[:300]\nassert \"name='com.sentongoharuna.worldsituationroom.rb2live25'\"\
        \ in badge\nprint('PASS real signed Android APK with radar, data cards, source truth and unchanged application\
        \ identity')\nPY_DUWM_VERIFY"
    - name: Upload installable DUWM 1160 APK before emulator tests
      uses: actions/upload-artifact@v4
      with:
        name: DEVELOP-UGANDA-1160-APK
        path: ${{ runner.temp }}/release/DEVELOP-UGANDA-1160.apk
        retention-days: 30
        if-no-files-found: error
    - name: Enable emulator KVM acceleration
      shell: bash
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm || true'
    - name: Android emulator verifies genuine visual screen and per-point share action
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        profile: pixel_6
        cores: 2
        ram-size: 2048M
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        script: 'set -euo pipefail

          adb install -r "$RUNNER_TEMP/release/DEVELOP-UGANDA-1160.apk"

          adb shell am start -n com.sentongoharuna.worldsituationroom.rb2live25/com.sentongoharuna.worldsituationroom.PulseDataActivity

          sleep 5

          adb shell dumpsys activity activities | grep -q ''PulseDataActivity''

          adb shell uiautomator dump /sdcard/duwm1160.xml >/dev/null

          adb shell cat /sdcard/duwm1160.xml > "$RUNNER_TEMP/duwm-116000-ui.xml"

          grep -q ''LIVE SIGNAL INTELLIGENCE'' "$RUNNER_TEMP/duwm-116000-ui.xml"

          grep -q ''SHARE SELECTED INDIVIDUAL DATA POINT'' "$RUNNER_TEMP/duwm-116000-ui.xml"

          adb exec-out screencap -p > "$RUNNER_TEMP/duwm-116000-visuals.png"

          test -s "$RUNNER_TEMP/duwm-116000-visuals.png"

          if adb logcat -d -t 3000 | grep -E ''FATAL EXCEPTION.*|Process: com.sentongoharuna.worldsituationroom.rb2live25''
          | tail -n 10; then true;fi

          echo ''PASS Android emulator: new source-driven radar opens and individual share controls visible'' '
    - name: Upload real Android screenshot and UI evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: DEVELOP-UGANDA-1160-ANDROID-EVIDENCE
        path: '${{ runner.temp }}/duwm-116000-visuals.png

          ${{ runner.temp }}/duwm-116000-ui.xml'
        if-no-files-found: warn
        retention-days: 30
    name: Build and verify original-scope 1160 APK
run-name: DUWM 1160 APK - Real Data Motion + Every Record Shareable
