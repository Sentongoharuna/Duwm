name: RUNNINGBALL2 ORIGINAL WIDGETS SDK36 BUILD
run-name: "RUNNINGBALL2 ORIGINAL WIDGETS SDK36 BUILD #${{ github.run_number }}"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/RUNNINGBALL2-ORIGINAL-WIDGETS-REFRESH.yml'
      - 'DUWM-RUNNINGBALL2-ORIGINAL-WIDGETS-REFRESH-SOURCE.tar.gz'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          echo 'b5ce55692ecff070c9be8ca25f3e8714a9bd97b0105b5c45bcd01b5789f76144  DUWM-RUNNINGBALL2-ORIGINAL-WIDGETS-REFRESH-SOURCE.tar.gz' | sha256sum -c -
      - name: Extract verified Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/duwm"
          tar -xzf DUWM-RUNNINGBALL2-ORIGINAL-WIDGETS-REFRESH-SOURCE.tar.gz -C "$RUNNER_TEMP/duwm"
          echo "PROJECT_DIR=$RUNNER_TEMP/duwm/world-situation-room-native-1-2-20-4-19" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Verify existing real widget engine
        shell: bash
        run: |
          set -euo pipefail
          SRC="$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom"
          test -s "$SRC/DuWidgetProviders.java"
          test -s "$SRC/DuWidgetUpdater.java"
          test -s "$SRC/WidgetSnapshot.java"
          test -s "$SRC/WidgetRefreshJobService.java"
          test -s "$SRC/WidgetRefreshScheduler.java"
          grep -q 'NETWORK_TYPE_ANY' "$SRC/WidgetRefreshScheduler.java"
          if grep -q 'setRequiresCharging(true)' "$SRC/WidgetRefreshScheduler.java"; then
            echo 'Charging-only refresh is not permitted'; exit 1
          fi
      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug
      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' -size +0c | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: RUNNINGBALL2-ORIGINAL-WIDGETS-SDK36-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
