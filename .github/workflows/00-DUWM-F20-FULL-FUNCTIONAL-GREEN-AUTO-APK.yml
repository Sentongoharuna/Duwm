      - name: Decode and verify exact F20 source
        run: |
          set -euo pipefail
          base64 --decode "$RUNNER_TEMP/du-f20-source.b64" > "$RUNNER_TEMP/du-f20-source.tar.gz"
          echo "11f31488cc7a3dd180dc7094888fdf561dbe497611fa93757c5085fe62bdf2ff  $RUNNER_TEMP/du-f20-source.tar.gz" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/du-f20"
          tar -xzf "$RUNNER_TEMP/du-f20-source.tar.gz" -C "$RUNNER_TEMP/du-f20"
          echo "PROJECT_DIR=$RUNNER_TEMP/du-f20/world-situation-room-native-f20" >> "$GITHUB_ENV"
      - name: Full cumulative functional contract gate
        run: |
          set -euo pipefail
          chmod +x "$PROJECT_DIR/scripts/"*.sh
          "$PROJECT_DIR/scripts/verify-local-news.sh" "$PROJECT_DIR"
          "$PROJECT_DIR/scripts/verify-f11-f9-country-lenses.sh" "$PROJECT_DIR"
          "$PROJECT_DIR/scripts/verify-f12-f9-replay.sh" "$PROJECT_DIR"
          "$PROJECT_DIR/scripts/verify-f13-f9-timeline-controls.sh" "$PROJECT_DIR"
          "$PROJECT_DIR/scripts/verify-f14-f9-related-intelligence.sh" "$PROJECT_DIR"
          "$PROJECT_DIR/scripts/verify-f15-unified-search.sh" "$PROJECT_DIR"
          "$PROJECT_DIR/scripts/verify-f16-honest-states.sh" "$PROJECT_DIR"
          "$PROJECT_DIR/scripts/verify-f17-state-back-navigation.sh" "$PROJECT_DIR"
          "$PROJECT_DIR/scripts/verify-f18-remove-duplicate-static-ui.sh" "$PROJECT_DIR"
          "$PROJECT_DIR/scripts/verify-f19-functional-tap-gate.sh" "$PROJECT_DIR"
          "$PROJECT_DIR/scripts/verify-f20-full-functional-green.sh" "$PROJECT_DIR"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          set -euo pipefail
          SDK="${{ANDROID_SDK_ROOT:-${{ANDROID_HOME:-/usr/local/lib/android/sdk}}}}";test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true
      - name: Java compile green gate
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac --stacktrace
      - name: Lint green gate
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:lintDebug --stacktrace
      - name: Assemble final functional APK
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace
      - name: Final APK integrity and contract gate
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk')
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          test -s "$APK"
          "$PROJECT_DIR/scripts/verify-local-news.sh" "$PROJECT_DIR" "$APK"
          unzip -t "$APK" >/dev/null
          test "$(head -c 2 "$APK")" = "PK"
          mkdir -p "$RUNNER_TEMP/release"
          cp "$APK" "$RUNNER_TEMP/release/DUWM-F20-FULL-FUNCTIONAL-GREEN.apk"
          sha256sum "$RUNNER_TEMP/release/DUWM-F20-FULL-FUNCTIONAL-GREEN.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: DUWM-F20-FULL-FUNCTIONAL-GREEN-APK
          path: ${{ runner.temp }}/release/DUWM-F20-FULL-FUNCTIONAL-GREEN.apk
          if-no-files-found: error
          retention-days: 14
