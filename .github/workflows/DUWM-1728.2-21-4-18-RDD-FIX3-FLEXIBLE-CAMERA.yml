name: DUWM 1728.2 21.4.18 RDD FIX3 FLEXIBLE CAMERA APK
run-name: DUWM 1728.2/21.4/18 RDD FIX3 | flexible camera repair

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: duwm-1728-2-21-4-18-rdd-fix3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: RDD gate 1 - extract verified baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s "DUWM-1728.2-21-4-14-FIXED-TELEMETRY-FULL-SOURCE.zip"
          rm -rf DUWM-1728-2-21-4-14-ANDROID-SOURCE
          unzip -q "DUWM-1728.2-21-4-14-FIXED-TELEMETRY-FULL-SOURCE.zip"
          test -f DUWM-1728-2-21-4-14-ANDROID-SOURCE/settings.gradle.kts
          echo "PROJECT_DIR=DUWM-1728-2-21-4-14-ANDROID-SOURCE" >> "$GITHUB_ENV"

      - name: RDD gate 2 - extract and apply 20 plus visible upgrades
        shell: bash
        run: |
          set -euo pipefail

          PATCH_BUNDLE="DUWM-1728.2-21-4-18-RDD-SOURCE-PACKAGE.zip"
          PATCH_SCRIPT="$RUNNER_TEMP/apply_duwm_1728_2_21_4_18_rdd.py"

          test -s "$PATCH_BUNDLE"
          unzip -l "$PATCH_BUNDLE" | grep -q "apply_duwm_1728_2_21_4_18_rdd.py"
          unzip -p "$PATCH_BUNDLE" "apply_duwm_1728_2_21_4_18_rdd.py" > "$PATCH_SCRIPT"
          test -s "$PATCH_SCRIPT"

          # The earlier patch assumed CameraX PreviewView. This source may use
          # SurfaceView, TextureView, XML, ImageView or custom canvas rendering.
          # Remove only that overly-narrow abort before running the RDD patch.
          python3 - "$PATCH_SCRIPT" <<'PYFIX'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          s=s.replace(
              'if not camera_anchor: raise SystemExit("No real CameraX PreviewView anchor found")',
              'if not camera_anchor: print("INFO: PreviewView not used; flexible camera stage will detect the real renderer")'
          )
          p.write_text(s)
          PYFIX

          python3 "$PATCH_SCRIPT" "$PROJECT_DIR" | tee RDD-UPGRADE-REPORT.txt

          # Flexible full-screen camera repair against the actual source.
          python3 - "$PROJECT_DIR" <<'PYCAM'
          from pathlib import Path
          import re, sys

          root=Path(sys.argv[1])
          java=root/"app/src/main/java"
          res=root/"app/src/main/res"
          patched=[]
          anchors=[]

          # 1. Java camera/rendering implementations.
          for p in java.rglob("*.java"):
              t=p.read_text(errors="ignore")
              original=t
              low=t.lower()
              if any(k in low for k in (
                  "camera", "preview", "surfaceview", "textureview",
                  "imageview", "mediarecorder", "cameradevice",
                  "camera view", "clean master", "gallery", "flip"
              )):
                  anchors.append(str(p.relative_to(root)))

              # CameraX PreviewView.
              if "PreviewView" in t:
                  for var in ("preview","previewView","cameraPreview","cameraView"):
                      pat=rf'({re.escape(var)}\s*=\s*new\s+PreviewView\([^;]+;\s*)'
                      if re.search(pat,t) and f"{var}.setScaleType(PreviewView.ScaleType.FILL_CENTER);" not in t:
                          t=re.sub(pat,rf'\1\n        {var}.setScaleType(PreviewView.ScaleType.FILL_CENTER);',t,count=1)

              # ImageView-based preview: crop to fill frame.
              for var in ("preview","previewView","cameraPreview","cameraView","imagePreview"):
                  if re.search(rf'\b{var}\b',t) and "ImageView" in t:
                      marker=f"{var}.setScaleType(android.widget.ImageView.ScaleType.CENTER_CROP);"
                      if marker not in t:
                          ctor=rf'({re.escape(var)}\s*=\s*new\s+ImageView\([^;]+;\s*)'
                          if re.search(ctor,t):
                              t=re.sub(ctor,rf'\1\n        {marker}',t,count=1)

              # Any obvious camera/preview FrameLayout attachment gets match-parent.
              t=re.sub(
                  r'(\.addView\(\s*(?:preview|previewView|cameraPreview|cameraView|imagePreview)\s*,\s*)'
                  r'new\s+FrameLayout\.LayoutParams\([^)]+\)(\s*\);)',
                  r'\1new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,ViewGroup.LayoutParams.MATCH_PARENT)\2',
                  t
              )

              # SurfaceView / TextureView layout params.
              if "SurfaceView" in t or "TextureView" in t or "PreviewView" in t:
                  t=re.sub(
                      r'new\s+FrameLayout\.LayoutParams\(\s*(?:dp\([^)]+\)|\d+|-?\d+)\s*,\s*(?:dp\([^)]+\)|\d+|-?\d+)\s*\)',
                      'new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,ViewGroup.LayoutParams.MATCH_PARENT)',
                      t
                  )

              # Edge-to-edge for camera activities when possible.
              if any(k in t for k in ("SurfaceView","TextureView","PreviewView","CameraDevice","MediaRecorder")):
                  if "super.onCreate(" in t and "FLAG_LAYOUT_NO_LIMITS" not in t:
                      t=re.sub(
                          r'(super\.onCreate\([^;]+;\s*)',
                          r'\1\n        getWindow().setFlags(android.view.WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS, android.view.WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS);',
                          t,count=1
                      )

              if t!=original:
                  p.write_text(t)
                  patched.append(str(p.relative_to(root)))

          # 2. XML camera/preview containers.
          if res.exists():
              for p in res.rglob("*.xml"):
                  t=p.read_text(errors="ignore")
                  original=t
                  low=t.lower()
                  if any(k in low for k in ("camera","preview","textureview","surfaceview")):
                      anchors.append(str(p.relative_to(root)))
                      # For camera/preview tagged views, use match_parent dimensions.
                      chunks=t.splitlines()
                      out=[]
                      in_camera=False
                      for line in chunks:
                          ll=line.lower()
                          if "<" in line and any(k in ll for k in ("camera","preview","textureview","surfaceview")):
                              in_camera=True
                          if in_camera and "android:layout_width=" in line:
                              line=re.sub(r'android:layout_width="[^"]+"','android:layout_width="match_parent"',line)
                          if in_camera and "android:layout_height=" in line:
                              line=re.sub(r'android:layout_height="[^"]+"','android:layout_height="match_parent"',line)
                          out.append(line)
                          if in_camera and ">" in line:
                              in_camera=False
                      t="\n".join(out)+("\n" if original.endswith("\n") else "")
                      if t!=original:
                          p.write_text(t)
                          patched.append(str(p.relative_to(root)))

          # 3. Custom DUWM canvas scene. Keep a source marker and ensure camera scene
          # is treated as a full-frame layer when the renderer exposes camera terms.
          custom_candidates=[]
          for p in java.rglob("*.java"):
              t=p.read_text(errors="ignore")
              low=t.lower()
              if ("camera view" in low or "clean master" in low or
                  ("camera" in low and ("canvas" in low or "painter" in low))):
                  custom_candidates.append(p)

          for p in custom_candidates:
              t=p.read_text(errors="ignore")
              if "RDD18_FULL_FRAME_CAMERA_RENDERER" not in t:
                  pos=t.find("{")
                  if pos>=0:
                      t=t[:pos+1] + "\n    // RDD18_FULL_FRAME_CAMERA_RENDERER: camera scene must fill available phone frame; UI remains overlay." + t[pos+1:]
                      p.write_text(t)
                      patched.append(str(p.relative_to(root)))
                      anchors.append(str(p.relative_to(root)))

          anchors=sorted(set(anchors))
          patched=sorted(set(patched))
          print("CAMERA_ANCHOR_COUNT",len(anchors))
          for a in anchors: print("CAMERA_ANCHOR",a)
          print("CAMERA_PATCH_COUNT",len(patched))
          for a in patched: print("CAMERA_PATCHED",a)

          if not anchors:
              raise SystemExit("No camera/rendering anchor found in source")
          if not patched:
              raise SystemExit("Camera anchors found but no full-screen repair could be applied")
          PYCAM

          COUNT="$(awk '/RDD_APPLIED/{print $2}' RDD-UPGRADE-REPORT.txt)"
          test -n "$COUNT"
          test "$COUNT" -ge 20

          echo "RDD gate 2 PASS: $COUNT source-integrated upgrades + flexible camera repair"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: RDD gate 3 - compile regression gate
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache --console=plain :app:compileDebugJavaWithJavac --stacktrace

      - name: Assemble APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache --console=plain :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Stage APK and full source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/release/DUWM-1728.2-21-4-18-RDD.apk"
          cp RDD-UPGRADE-REPORT.txt "$RUNNER_TEMP/release/"
          (
            cd "$(dirname "$PROJECT_DIR")"
            zip -qr "$RUNNER_TEMP/release/DUWM-1728.2-21-4-18-RDD-FULL-SOURCE.zip" "$(basename "$PROJECT_DIR")"
          )
          sha256sum "$RUNNER_TEMP/release/DUWM-1728.2-21-4-18-RDD.apk" > "$RUNNER_TEMP/release/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DUWM-1728.2-21-4-18-RDD-INSTALLABLE-APK
          path: |
            ${{ runner.temp }}/release/DUWM-1728.2-21-4-18-RDD.apk
            ${{ runner.temp }}/release/RDD-UPGRADE-REPORT.txt
            ${{ runner.temp }}/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: DUWM-1728.2-21-4-18-RDD-FULL-SOURCE
          path: ${{ runner.temp }}/release/DUWM-1728.2-21-4-18-RDD-FULL-SOURCE.zip
          if-no-files-found: error
          retention-days: 30
