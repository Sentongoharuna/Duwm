name: DUWM 1728.2/21/3 | Clear picture with changing source information
run-name: DUWM 1728.2/21/3 | Compile and verify picture clarity
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    - build/duwm-1728-2-21-3
    paths:
    - .github/workflows/DUWM-1728.2-21-3-CLEAR-PICTURE-APK.yml
    - DUWM-1728.2-21-3-CLEAR-PICTURE-SOURCE.zip
permissions:
  contents: read
concurrency:
  group: duwm-1728-2-21-3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Checkout existing original repository
      uses: actions/checkout@v5
    - name: Restore exact /21/3 source or checked patch over delivered /21/2, /21/1, /21 or /20
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_RESTORE'
        import pathlib,os,hashlib,json,zipfile,tarfile,base64,io,shutil,stat
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'duwm1728221-3'
        root.mkdir(parents=True,exist_ok=True)
        project=root/'DUWM-1728-2-21-3-ANDROID-SOURCE'
        if project.exists():shutil.rmtree(project)
        project.mkdir()
        full=pathlib.Path('DUWM-1728.2-21-3-CLEAR-PICTURE-SOURCE.zip')
        expected_full='658fc5f137b76480be516eaa1590fcccb46049b99bc6825f5ced6cfafb566f49'
        parents={'DUWM-1728.2-21-2-MEASURED-TELEMETRY-SOURCE.zip': 'd6ef7877a16121d9bee61480d80ed53f2f3f60aed26a7b2fcfbf8c84f611770c', 'DUWM-1728.2-21-1-SCENE-VISION-SOURCE.zip': '6736e30d11961fa417eba9be9131f1ced5db84a5d058416102b3c490b466beb7', 'DUWM-1728.2-21-AUTO-FIT-SOURCE.zip': '3117973d5e1cce4f0e257bf179a3c81bf91a5f903605c8b59fde524744558a2d', 'DUWM-1728.2-20-AUTO-READY-SOURCE.zip': '600a819b4e3ce031c2c9bab6e91582300857467026a78a41262e683fa1761ca5'}
        def safe_target(name):
            rel=pathlib.PurePosixPath(name)
            if rel.is_absolute() or '..' in rel.parts or not rel.parts:raise ValueError('Unsafe source path')
            target=project.joinpath(*rel.parts)
            if not target.resolve().is_relative_to(project.resolve()):raise ValueError('Escaping source path')
            return target
        def unzip_project(archive):
            roots=set();seen=set()
            with zipfile.ZipFile(archive) as z:
                assert z.testzip() is None,'Corrupt source ZIP'
                for info in z.infolist():
                    if info.is_dir():continue
                    rel=pathlib.PurePosixPath(info.filename)
                    if rel.is_absolute() or '..' in rel.parts or len(rel.parts)<2:raise ValueError('Unsafe ZIP member')
                    if stat.S_ISLNK(info.external_attr>>16):raise ValueError('Source symlink rejected')
                    roots.add(rel.parts[0]);name='/'.join(rel.parts[1:])
                    if name in seen:raise ValueError('Duplicate ZIP member')
                    seen.add(name);target=safe_target(name);target.parent.mkdir(parents=True,exist_ok=True)
                    target.write_bytes(z.read(info))
                assert len(roots)==1,'Expected one source project root'
        if full.is_file():
            assert hashlib.sha256(full.read_bytes()).hexdigest()==expected_full,'The /21/3 source ZIP and workflow must be a matching pair'
            unzip_project(full)
        else:
            baseline=None
            for name,expected_hash in parents.items():
                p=pathlib.Path(name)
                if p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==expected_hash:baseline=p;break
            if baseline is None:raise SystemExit('Upload the matching /21/3 SOURCE.zip to repository root; no exact delivered /21/2, /21/1, /21 or /20 baseline is present')
            print('Recovering exact /21/3 source from',baseline)
            unzip_project(baseline)
            patch=base64.b64decode(''.join(os.environ['DUWM_PATCH_%03d'%i] for i in range(34)),validate=True)
            assert hashlib.sha256(patch).hexdigest()=='05b7eef08deb13ee980b88e684727b58c8def400b9d5a2868cabc5cc9fc7e16b','Embedded patch hash mismatch'
            with tarfile.open(fileobj=io.BytesIO(patch),mode='r:xz') as tar:
                seen=set()
                for member in tar.getmembers():
                    if not member.isfile() or member.name in seen:raise ValueError('Only unique regular patch files allowed')
                    seen.add(member.name);target=safe_target(member.name);target.parent.mkdir(parents=True,exist_ok=True)
                    with tar.extractfile(member) as data:target.write_bytes(data.read())
        manifest=project/'1728_2_21_3_SOURCE_SHA256.json'
        assert hashlib.sha256(manifest.read_bytes()).hexdigest()=='196bec79209534bdd07831b027958f5d0a31c4dab76f2261b082e149c7a17c52','Source manifest mismatch'
        expected=json.loads(manifest.read_text())
        # Remove only obsolete files in this isolated restored tree, never the repository.
        for p in list(project.rglob('*')):
            if p.is_file() and p!=manifest and p.relative_to(project).as_posix() not in expected:p.unlink()
        for name,want in expected.items():
            p=safe_target(name)
            assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==want,'Source integrity failed: '+name
        actual={p.relative_to(project).as_posix() for p in project.rglob('*') if p.is_file()}
        assert actual==set(expected)|{manifest.name},'Unexpected source files after restoration'
        print('PASS exact /21/3 source:',len(expected),'packaged file hashes')
        with open(os.environ['GITHUB_ENV'],'a') as env:
            env.write('PROJECT='+str(project)+'\n')
            env.write('BUILD_LOG_DIR='+str(pathlib.Path(os.environ['RUNNER_TEMP'])/'duwm1728221-3-logs')+'\n')
        PY_RESTORE
      env:
        DUWM_PATCH_000: 
        DUWM_PATCH_001: 
        DUWM_PATCH_002: 
        DUWM_PATCH_003: 
        DUWM_PATCH_004: 
        DUWM_PATCH_005: 
        DUWM_PATCH_006: 
        DUWM_PATCH_007: 
        DUWM_PATCH_008: 
        DUWM_PATCH_009: 
        DUWM_PATCH_010: 
        DUWM_PATCH_011: 
        DUWM_PATCH_012: 
        DUWM_PATCH_013: 
        DUWM_PATCH_014: 
        DUWM_PATCH_015: 
        DUWM_PATCH_016: 
        DUWM_PATCH_017: 
        DUWM_PATCH_018: 
        DUWM_PATCH_019: 
        DUWM_PATCH_020: 
        DUWM_PATCH_021: 
        DUWM_PATCH_022: 
        DUWM_PATCH_023: 
        DUWM_PATCH_024: 
        DUWM_PATCH_025: 
        DUWM_PATCH_026: 
        DUWM_PATCH_027: 
        DUWM_PATCH_028: 
        DUWM_PATCH_029: 
        DUWM_PATCH_030: 
        DUWM_PATCH_031: 
        DUWM_PATCH_032: 
        DUWM_PATCH_033: 
    - name: Check every packaged source file
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_HASH'
        import pathlib,os,json,hashlib
        root=pathlib.Path(os.environ['PROJECT']).resolve()
        expected=json.loads((root/'1728_2_21_3_SOURCE_SHA256.json').read_text())
        for name,sha in expected.items():
            p=(root/name).resolve()
            assert p.is_relative_to(root) and p.is_file(),name
            assert hashlib.sha256(p.read_bytes()).hexdigest()==sha,name
        print('PASS',len(expected),'packaged source hashes')
        PY_HASH
    - name: Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Ensure Android SDK and signing tools
      shell: bash
      run: |
        set -euo pipefail
        SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
        MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
        test -x "$MANAGER"
        if [ ! -s "$SDK/platforms/android-36/android.jar" ] || [ ! -x "$SDK/build-tools/36.0.0/apksigner" ]; then
          timeout 600 "$MANAGER" --sdk_root="$SDK" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
        fi
        test -s "$SDK/platforms/android-36/android.jar"
        test -x "$SDK/build-tools/36.0.0/aapt"
        echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
    - name: Test /21/3 picture clarity, SDK-field repair and retained broadcast contracts
      shell: bash
      run: |
        set -euo pipefail
        cd "$PROJECT"
        python -m pip install -r ai-production-server/requirements-test.txt
        python verification/check_source.py
        python verification/check_1728_2_21_3.py
        python -m pytest -q ai-production-server/test_server.py
        mkdir -p "$RUNNER_TEMP/duwm-parser"
        javac -d "$RUNNER_TEMP/duwm-parser" verification/JavaSyntaxCheck.java
        java -cp "$RUNNER_TEMP/duwm-parser" JavaSyntaxCheck
        java -cp "$RUNNER_TEMP/duwm-parser" JavaSyntaxCheck app/src/androidTest/java
    - name: Publish scoped host-render evidence
      uses: actions/upload-artifact@v6
      with:
        name: DUWM-1728.2-21-3-HOST-RENDER-TESTS-NOT-PHONE
        path: ${{ env.PROJECT }}/verification/results/1728_2_21_3/
        if-no-files-found: error
        retention-days: 30
    - name: Optional retained debug signing key
      shell: bash
      env:
        SAVED_KEY: ${{ secrets.DUWM_DEBUG_KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        if [ -n "$SAVED_KEY" ]; then
          mkdir -p "$HOME/.android"
          printf '%s' "$SAVED_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
        else
          echo 'No retained debug keystore supplied. Existing installations may have a different signer; preserve private drafts.'
        fi
    - name: Gradle 8.13
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: '8.13'
        cache-disabled: true
    - name: Resolve actual pinned ML Kit SDK and retain dependency diagnostics
      shell: bash
      run: |
        set -euo pipefail
        cd "$PROJECT"
        bash verification/ci_scene_dependency.sh
    - name: Android Java type-check (catches missing methods; not a syntax-only test)
      shell: bash
      run: |
        set -euo pipefail
        cd "$PROJECT"
        bash verification/ci_android_build.sh typecheck
    - name: Assemble real application and instrumentation APKs
      shell: bash
      run: |
        set -euo pipefail
        cd "$PROJECT"
        bash verification/ci_android_build.sh assemble
        mkdir -p "$RUNNER_TEMP/duwm-apk" "$RUNNER_TEMP/duwm-native-test"
        cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/duwm-apk/DUWM-1728.2-21-3-CLEAR-PICTURE.apk"
        cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/duwm-native-test/DUWM-native-tests.apk"
        cp 1728_2_21_3_BUILD_NOTES.md 1728_2_21_3_ACCEPTANCE.json "$RUNNER_TEMP/duwm-apk/"
        cp verification/run_native_stages.sh verification/verify_native_stages.py "$RUNNER_TEMP/duwm-native-test/"
    - name: Verify actual APK identity, signature and compiled components
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PY_APK'
        import os,pathlib,zipfile,subprocess,hashlib
        out=pathlib.Path(os.environ['RUNNER_TEMP'])/'duwm-apk'
        apk=out/'DUWM-1728.2-21-3-CLEAR-PICTURE.apk'
        assert apk.stat().st_size>150000
        with zipfile.ZipFile(apk) as z:
            assert z.testzip() is None
            dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
            for token in (b'SatelliteMapView',b'Duwm1718MonitorsCamActivity',b'Duwm1728BroadcastLayout',b'Duwm1728BroadcastCanvas',b'Duwm1728EglVideoPipe',b'Duwm1728AiProductionClient',b'Duwm1728VideoEditorActivity',b'Duwm1728AiStartPolicy',b'maybeStartAiAfterCapture',b'beginAi',b'Duwm1728BroadcastTimeline',b'Duwm1728ExportPreflight',b'parseSrtCues',b'Duwm1728FramePlan',b'showFraming',b'Duwm1728BroadcastReviewActivity',b'shareIntent',b'Duwm1728EditorTrimPolicy',b'Duwm1728BroadcastReviewState',b'Duwm1728ExportRecovery',b'Duwm1728ExportRecoveryActivity',b'Duwm1728ExportRecoveryProvider',b'Duwm1728BroadcastComposition',b'Duwm1728CaptionEditPolicy',b'Duwm1728CaptionEditorDialog',b'Duwm1728CaptionSrt',b'Duwm1728CaptionFilesController',b'Duwm1728CaptionFileStore',b'Duwm1728CaptionFileProvider',b'Duwm1728AutomaticProduction',b'Duwm1728PcmTimeline',b'Duwm1728SpeechCues',b'Duwm1728CaptionPages',b'Duwm1728SpeechSessionPolicy',b'Duwm1728SpeechLanguagePolicy',b'Duwm1728SpeechReadiness',b'Duwm1728HeadlineFit',b'Duwm1728OutputSizePolicy'):
                assert token in dex,token
        test_apk=pathlib.Path(os.environ['RUNNER_TEMP'])/'duwm-native-test'/'DUWM-native-tests.apk'
        assert test_apk.stat().st_size>50000
        with zipfile.ZipFile(test_apk) as z:
            assert z.testzip() is None
            test_dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
            for token in (b'DuwmRenderedFrameCapture',b'review.missing_file.verified',b'ANDROID-EDITOR-TRIM-LANDSCAPE-BOUNDS.json',b'-CAPTURE.txt',b'caption_files',b'DuwmCaptionFilesChecks',b'automatic_production',b'DuwmAutomaticProductionChecks',b'automatic_report',b'DuwmAutomaticReportChecks',b'automatic_ready',b'DuwmAutomaticReadyChecks',b'automatic_fit',b'DuwmAutomaticFitChecks',b'scene_timeline',b'DuwmSceneTimelineChecks',b'measured_telemetry',b'DuwmMeasuredTelemetryChecks',b'clear_picture',b'DuwmClearPictureChecks'):
                assert token in test_dex,token
        tools=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
        signer=subprocess.check_output([str(tools/'apksigner'),'verify','--verbose','--print-certs',str(apk)],text=True)
        print(signer)
        (out/'APK-SIGNER.txt').write_text(signer)
        text=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(apk)],text=True)
        for token in ("versionCode='172824'","versionName='1728.2.21.3'","name='com.sentongoharuna.worldsituationroom.rb2live25'","application-label:'DUWM 1728.2/21/3 • DEVELOP.UGANDA'"):
            assert token in text,token
        (out/'APK-IDENTITY.txt').write_text(text)
        (out/'SHA256SUMS.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  '+apk.name+'\n')
        print('Compiled development APK. AI inference, physical camera and native export are separate gates.')
        PY_APK
    - name: Verify clear-picture, measurement and actual ML Kit class definitions in the compiled APK
      shell: bash
      run: |
        set -euo pipefail
        cd "$PROJECT"
        python3 verification/verify_clear_picture_apk.py "$RUNNER_TEMP/duwm-apk/DUWM-1728.2-21-3-CLEAR-PICTURE.apk" "$BUILD_LOG_DIR/SCENE-SDK-DEPENDENCY.json" "$RUNNER_TEMP/duwm-apk/CLEAR-PICTURE-SDK-APK-INTEGRATION.json"
        cp "$BUILD_LOG_DIR/SCENE-SDK-DEPENDENCY.json" "$RUNNER_TEMP/duwm-apk/"
    - name: Publish compiled development APK for testing
      uses: actions/upload-artifact@v6
      with:
        name: DUWM-1728.2-21-3-COMPILED-DEVELOPMENT-APK
        path: ${{ runner.temp }}/duwm-apk/
        if-no-files-found: error
        retention-days: 30
    - name: Publish Android test APK
      uses: actions/upload-artifact@v6
      with:
        name: DUWM-1728.2-21-3-NATIVE-TEST-APK
        path: ${{ runner.temp }}/duwm-native-test/
        if-no-files-found: error
        retention-days: 30
    - name: Retain compiler logs and diagnostics even when a job fails
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: DUWM-1728.2-21-3-BUILD-DIAGNOSTICS
        path: |
          ${{ env.PROJECT }}/app/build/reports/
          ${{ env.PROJECT }}/build/reports/
          ${{ runner.temp }}/duwm1728221-3-logs/
        if-no-files-found: warn
        retention-days: 30
  native-broadcast-tests:
    needs: compile-development
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Java 17 for Android emulator tooling
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Download compiled application
      uses: actions/download-artifact@v7
      with:
        name: DUWM-1728.2-21-3-COMPILED-DEVELOPMENT-APK
        path: apk
    - name: Download native test APK
      uses: actions/download-artifact@v7
      with:
        name: DUWM-1728.2-21-3-NATIVE-TEST-APK
        path: tests
    - name: Enable KVM
      shell: bash
      run: |
        set -euo pipefail
        test -e /dev/kvm
        sudo chmod 666 /dev/kvm
    - name: Prepare persistent native test and evidence script
      shell: bash
      run: |
        set -euo pipefail
        cp tests/run_native_stages.sh "$RUNNER_TEMP/duwm-native.sh"
        cp tests/verify_native_stages.py "$RUNNER_TEMP/verify_native_stages.py"
        chmod +x "$RUNNER_TEMP/duwm-native.sh"
        bash -n "$RUNNER_TEMP/duwm-native.sh"
    - name: Required nineteen native stages with exact APK and evidence verification
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        profile: pixel_6
        emulator-boot-timeout: 900
        disable-animations: true
        script: bash "$RUNNER_TEMP/duwm-native.sh" apk/DUWM-1728.2-21-3-CLEAR-PICTURE.apk tests/DUWM-native-tests.apk native-evidence
    - name: Publish actual native evidence, including failures
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: DUWM-1728.2-21-3-NATIVE-EXPORT-EVIDENCE
        path: native-evidence/
        if-no-files-found: warn
        retention-days: 30
    - name: Publish development APK with native test evidence only after success
      if: success()
      uses: actions/upload-artifact@v6
      with:
        name: DUWM-1728.2-21-3-NATIVE-TESTED-DEVELOPMENT-APK
        path: |-
          apk/
          native-evidence/
        if-no-files-found: error
        retention-days: 30
