nonce('if(action==MotionEvent.ACTION_UP){\\n        if(!dragged&&!scale.isInProgress()){',\n     'if(action==MotionEvent.ACTION_UP){\\n        if(getParent()!=null)getParent().requestDisallowInterceptTouchEvent(false);\\n        if(!dragged&&!scale.isInProgress()){',\n     'touch-up-release-scroll')\nonce('      return true;\\n    }\\n    @Override public boolean performClick(){super.performClick();return true;}',\n     '      if(action==MotionEvent.ACTION_CANCEL){if(getParent()!=null)getParent().requestDisallowInterceptTouchEvent(false);return true;}\\n      return true;\\n    }\\n    @Override public boolean performClick(){super.performClick();return true;}',\n     'cancel-release-scroll')\nf.write_text(s,encoding='utf-8')\nfor n,sha in protected.items():\n assert hashlib.sha256((p/n).read_bytes()).hexdigest()==sha, 'ITEM03 protected original engine modified: '+n\nprint('PASS ITEM03 map gestures and preservation')\nRB25_ITEM03_INSTALL\n"
