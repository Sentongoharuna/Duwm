    - name: V25 FIX3 - retain V22 V23 V24 real-screen gates with correct scrolling
      shell: bash
      run: "set -euo pipefail\npython3 - \"$RUNNER_TEMP/v15-emulator-smoke.sh\" <<'RB25_FIX3_VISIBLE_UI'\nfrom pathlib import Path\nimport ast,sys\nf=Path(sys.argv[1]);source=f.read_text(encoding='utf-8')\ndef exact(old,new,label):\n    global source\n    n=source.count(old)\n    if n!=1:\n        raise SystemExit(f'FIX3 FAIL CLOSED: {label} must match exactly once in {f.name}; matches={n}')\n    source=source.replace(old,new,1)\n# V24 assumed the V22 bar is at the top and swiped DOWN to reach it.\n# V25 inserts native Stage2 and Stage1 panels BEFORE V22, moving it below.\n# Still demand a genuinely visible V22 bar; never fake a pass.\noriginal=\"\"\"for _ in range(7):\n    if find('V22 / WORLD STATUS'):break\n    adb('shell','input','swipe','530','490','530','1590','300');time.sleep(.3)\nassert find('V22 / WORLD STATUS'),'V22 source status strip is not visible'\"\"\"\nrevised=\"\"\"hub()\nv22_visible=False\nfor _ in range(24):\n    if find('V22 / WORLD STATUS'):\n        v22_visible=True;break\n    adb('shell','input','swipe','530','1550','530','650','300');time.sleep(.35)\nif not v22_visible:capture_failure('V22SourceStrip')\nassert find('V22 / WORLD STATUS'),'V22 source status strip is not visible'\nprint('PASS FIX3: original V22 status strip visibly reached below V25 stage panels',flush=True)\"\"\"\nexact(original,revised,'V22 status scan direction')\n# V23 is BELOW the V22 strip in the actual view hierarchy. Scrolling\n# downward-to-top never finds its header after V22 on a tall V25 launcher.\nold=\"\"\"for _ in range(8):\n    if find('V23 / WORLD OPERATIONS CONTROL'):break\n    adb('shell','input','swipe','520','480','520','1580','320');time.sleep(.3)\nassert find('V23 / WORLD OPERATIONS CONTROL'),'V23 controls are not visible on Android'\"\"\"\nnew=\"\"\"v23_visible=False\nfor _ in range(20):\n    if find('V23 / WORLD OPERATIONS CONTROL'):\n        v23_visible=True;break\n    adb('shell','input','swipe','520','1550','520','700','300');time.sleep(.35)\nif not v23_visible:capture_failure('V23Operations')\nassert find('V23 / WORLD OPERATIONS CONTROL'),'V23 controls are not visible on Android'\"\"\"\nexact(old,new,'V23 operations scan direction')\nold=\"assert find('WORLD MAP') or find('REFRESH SOURCES'),'V23 actionable controls missing'\"\nnew=\"\"\"v23_action=False\nfor _ in range(7):\n    if find('WORLD MAP') or find('REFRESH SOURCES'):\n        v23_action=True;break\n    adb('shell','input','swipe','520','1450','520','930','250');time.sleep(.3)\nif not v23_action:capture_failure('V23Actions')\nassert v23_action, 'V23 actionable controls missing'\"\"\"\nexact(old,new,'V23 control reachability')\n# V24 News/NASA controls are now even further down than before. Maintain\n# the requirement that both buttons actually exist on the Android UI.\nold=\"\"\"for _ in range(9):\n    if find('WORLD NEWS') and find('NASA EVENTS'):break\n    adb('shell','input','swipe','510','470','510','1510','300');time.sleep(.4)\"\"\"\nnew=\"\"\"news_nasa_visible=False\nfor _ in range(26):\n    if find('WORLD NEWS') and find('NASA EVENTS'):\n        news_nasa_visible=True;break\n    adb('shell','input','swipe','510','1550','510','650','300');time.sleep(.35)\nif not news_nasa_visible:capture_failure('V24NewsNASA')\"\"\"\nexact(old,new,'V24 News NASA visible controls')\n# Source of truth: all inherited UI assertions remain present and are run.\npy=source.split(\"python3 - <<'PY_ADB_SMOKE'\\n\",1)[1].split('\\nPY_ADB_SMOKE',1)[0]\nast.parse(py)\nfor guard in (\"assert find('V22 / WORLD STATUS'),'V22 source status strip is not visible'\",\n              \"assert find('V23 / WORLD OPERATIONS CONTROL'),'V23 controls are not visible on Android'\",\n              \"assert find('WORLD NEWS'),'V24 WORLD NEWS button not visible on device'\",\n              \"assert find('NASA EVENTS'),'V24 NASA EVENTS button not visible on device'\",\n              \"assert find('V25 / STAGE ACCESS')\",\n              \"assert find('V25 / WORLDWIDE CORE')\"):\n    if guard not in py:raise SystemExit('FIX3 FAIL CLOSED: inherited on-screen gate removed: '+guard)\nfor forbidden in ('RUNNINGBALL2-V24-WORLD-SOURCE-RECOVERY-APK.apk','rb2sources24'):\n    if forbidden in source:raise SystemExit('FIX3 FAIL CLOSED: obsolete APK identity '+forbidden)\nf.write_text(source,encoding='utf-8')\nprint('PASS FIX3: V22, V23, V24 scrolling uses real screen reachability with failure captures and all assertions retained')\nRB25_FIX3_VISIBLE_UI\nbash -n \"$RUNNER_TEMP/v15-emulator-smoke.sh\"\n"
