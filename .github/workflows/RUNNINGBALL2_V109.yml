    - name: Execute EVERY V24 source-generation and regression step unchanged (through V24 acceptance)
      shell: bash
      run: "set -euo pipefail\npython3 - <<'RB25_V24_RUN'\nimport os,subprocess,yaml,sys,pathlib\nsource=pathlib.Path('/tmp/RUNNINGBALL2-V24-EMBEDDED-LOCKED.yml')\nsteps=yaml.safe_load(source.read_text())['jobs']['build']['steps']\nassert len(steps)==77,'V24 baseline step count differs'\nenv=dict(os.environ)\ncwd=pathlib.Path(os.environ['GITHUB_WORKSPACE'])\n# V24 uses GITHUB_ENV between steps. Re-load it after every subprocess.\nmarker=pathlib.Path(os.environ['GITHUB_ENV'])\nfor index in range(2,57):\n  item=steps[index]\n  if 'uses' in item:\n    # V24 actions at 5 and 6 are already installed in this job. Verify\n    # exact name/action pairs; all other unexpected action steps fail closed.\n    approved={5:('Java 17','actions/setup-java@v4'),\n              6:('Gradle 8.13','gradle/actions/setup-gradle@v4')}\n    expected=approved.get(index)\n    if expected is None or (item.get('name'),item.get('uses'))!=expected:\n      raise SystemExit(f'V25 S2 BASELINE DEPENDENCY REJECTED index={index} name={item.get(\"name\")} action={item.get(\"uses\")}')\n    if index==5:\n      probe=subprocess.run(['java','-version'],env=env,check=False,capture_output=True,text=True)\n      if probe.returncode or '17.' not in probe.stderr+probe.stdout:raise SystemExit('V25 S2 java17 precondition failed')\n    if index==6:\n      probe=subprocess.run(['gradle','--version'],env=env,check=False,capture_output=True,text=True)\n      if probe.returncode or '8.13' not in probe.stdout:raise SystemExit('V25 S2 Gradle8.13 precondition failed')\n    print('REUSE VERIFIED PREINSTALLED V24 ACTION',index,expected,flush=True)\n    continue\n  label=item['name']\n  print('RUN V24 PRESERVED',index,label,flush=True)\n  cmd=['bash','-eo','pipefail','-c',item['run']]\n  child=subprocess.run(cmd,cwd=str(cwd),env=env,check=False)\n  if child.returncode!=0:raise SystemExit('V24 BASELINE STOP AT '+str(index)+' '+label+' EXIT '+str(child.returncode))\n  if marker.exists():\n    for line in marker.read_text().splitlines():\n      if '=' in line:\n        key,value=line.split('=',1)\n        if key and key.isidentifier():env[key]=value\ntarget=env.get('PROJECT_DIR','')\nif not target or not pathlib.Path(target).is_dir():raise SystemExit('V25 PROJECT_DIR missing after protected recovery')\nwith marker.open('a') as f:f.write('PROJECT_DIR='+target+'\\n')\nprint('PASS: all 55 V24 generation/regression stages retain their original tests')\nRB25_V24_RUN\n"
