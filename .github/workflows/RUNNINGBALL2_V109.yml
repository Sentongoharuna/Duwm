    - name: V105 UI01 INSTALL - modern command-center quick access rail
      shell: bash
      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" <<'RB105_UI01_INSTALL'\nfrom pathlib import Path\nimport sys,hashlib\nroot=Path(sys.argv[1]);pkg=root/'app/src/main/java/com/sentongoharuna/worldsituationroom'\npanel=pkg/'RunningballV25Stage2Panel.java'\nassert panel.is_file(),'V105 UI01 missing Stage2 panel: '+str(panel)\nold='overview=text(\"LOADING SOURCE-VERIFIED COUNTERS\",12,INK,false);overview.setPadding(0,dp(7),0,dp(10));addView(overview);'\ns=panel.read_text(encoding='utf-8')\nif s.count(old)!=1:raise SystemExit('V105 UI01 anchor expected once in '+str(panel)+'; found '+str(s.count(old)))\nassert 'new RunningballV105QuickRail(c)' not in s,'V105 UI01 duplicate install'\nwall=pkg/'DuwmLiveWallpaperService.java';globe=pkg/'SatelliteMapView.java'\nchecks={str(x):hashlib.sha256(x.read_bytes()).hexdigest() for x in (wall,globe)}\ns=s.replace(old,old+'\\n    addView(new RunningballV105QuickRail(c),new LayoutParams(-1,-2));',1)\npanel.write_text(s,encoding='utf-8')\nrail=pkg/'RunningballV105QuickRail.java'\nrail.write_text('''package com.sentongoharuna.worldsituationroom;\nimport android.content.Context;\nimport android.content.Intent;\nimport android.graphics.drawable.GradientDrawable;\nimport android.view.Gravity;\nimport android.widget.LinearLayout;\nimport android.widget.TextView;\n/** V105 UI01. Independent native shortcuts to EXISTING source-backed screens. */\npublic final class RunningballV105QuickRail extends LinearLayout {\n  private static final int CYAN=0xFF55D6EF, GREEN=0xFF5CFFC6, WHITE=0xFFEAF5FE;\n  private int dp(int value){return Math.round(getResources().getDisplayMetrics().density*value);}\n  private GradientDrawable plate(int border){\n    GradientDrawable shape=new GradientDrawable(GradientDrawable.Orientation.TL_BR,\n      new int[]{0xFF142D3F,0xFF0B1C29});\n    shape.setCornerRadius(dp(16));shape.setStroke(dp(1),border);return shape;\n  }\n  private TextView action(Context c,String title,String description,int tint,Class<?> destination){\n    TextView button=new TextView(c);button.setText(title);button.setTextSize(12);\n    button.setTextColor(WHITE);button.setTypeface(null,1);button.setGravity(Gravity.CENTER);\n    button.setMinHeight(dp(52));button.setPadding(dp(5),dp(8),dp(5),dp(8));\n    button.setBackground(plate(tint));button.setContentDescription(description);\n    button.setOnClickListener(v->getContext().startActivity(new Intent(getContext(),destination)));\n    return button;\n  }\n  public RunningballV105QuickRail(Context c){super(c);\n    setOrientation(VERTICAL);setPadding(0,dp(7),0,dp(9));\n    TextView label=new TextView(c);label.setText(\"QUICK ACCESS / DATA MODULES\");\n    label.setTextSize(11);label.setTextColor(CYAN);label.setTypeface(null,1);\n    label.setPadding(dp(2),dp(1),dp(2),dp(7));addView(label,new LayoutParams(-1,-2));\n    LinearLayout row=new LinearLayout(c);row.setOrientation(HORIZONTAL);\n    row.addView(action(c,\"AIR\",\"V105 quick access worldwide aircraft\",GREEN,RunningballV25WorldwideAirActivity.class),cell(false));\n    row.addView(action(c,\"NEWS\",\"V105 quick access live newsroom\",CYAN,RunningballV25NewsroomActivity.class),cell(true));\n    row.addView(action(c,\"DATA\",\"V105 quick access source health\",CYAN,RunningballV25SourceHealthActivity.class),cell(true));\n    addView(row,new LayoutParams(-1,-2));\n  }\n  private LayoutParams cell(boolean margin){\n    LayoutParams p=new LayoutParams(0,-2,1f);if(margin)p.leftMargin=dp(7);return p;\n  }\n}\n''',encoding='utf-8')\nfor path,prior in checks.items():\n assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==prior,'V105 changed protected renderer '+path\nprint('V105 UI01 installed: three functional native source shortcuts; old navigation preserved')\nRB105_UI01_INSTALL\n"
    - name: V105 UI01 STRICT GATE - accessible rail, existing routes, protected data
      shell: bash
      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" <<'RB105_UI01_GATE'\nfrom pathlib import Path\nimport sys,re\nroot=Path(sys.argv[1]);pkg=root/'app/src/main/java/com/sentongoharuna/worldsituationroom'\npanel=(pkg/'RunningballV25Stage2Panel.java').read_text()\nrail=(pkg/'RunningballV105QuickRail.java').read_text()\nassert panel.count('new RunningballV105QuickRail(c)')==1,'V105 quick access not visible in launcher'\nfor x in ('RunningballV25WorldwideAirActivity.class','RunningballV25NewsroomActivity.class','RunningballV25SourceHealthActivity.class',\n          'V105 quick access worldwide aircraft','V105 quick access live newsroom','V105 quick access source health',\n          'setMinHeight(dp(52))','setContentDescription','QUICK ACCESS / DATA MODULES'):\n assert x in rail,'V105 source contract missing '+x\nfor text in ('STAGE 1','STAGE 2','STAGE 3','STAGE 4','STAGE 5','SOURCE CHANGE LEDGER','RunningballV25Sources.read'):\n assert text in panel,'V105 removed existing stage/navigation: '+text\nfor forb in ('HttpURLConnection','new URL(', 'Math.random(', 'new Random('):\n assert forb not in rail,'V105 UI unexpectedly makes network/synthetic data calls: '+forb\nprint('PASS V105 UI01: rail visible, three real screen destinations, 52dp targets, original stage links and data intact')\nRB105_UI01_GATE\n"
    - name: V106 UI02 INSTALL - factual news and USGS status below shortcuts
      shell: bash
      run: 'set -euo pipefail

        python3 - "$PROJECT_DIR" <<''RB106_UI02_INSTALL''

        from pathlib import Path

        import sys,hashlib,gzip,base64

        pkg=Path(sys.argv[1])/''app/src/main/java/com/sentongoharuna/worldsituationroom''

        rail=pkg/''RunningballV105QuickRail.java''

        wall=pkg/''DuwmLiveWallpaperService.java'';globe=pkg/''SatelliteMapView.java''

        checks={p:hashlib.sha256(p.read_bytes()).hexdigest() for p in (wall,globe)}

        old=''    addView(row,new LayoutParams(-1,-2));''

