    - name: V25 V8 SOURCE CHECK - actual Uganda RSS and GDELT responses
      shell: bash
      continue-on-error: true
      run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/evidence\"\npython3 - \"$RUNNER_TEMP/evidence/V25_V8_NEWS_PROVIDER_CHECK.json\" <<'RB25_V8_PROVIDER_CHECK'\nimport urllib.request,urllib.parse,xml.etree.ElementTree as ET,json,datetime,sys\nitems=[\n  ('INDEPENDENT UGANDA RSS','https://www.independent.co.ug/feed/','rss'),\n  ('THE OBSERVER RSS','https://observer.ug/feed/','rss'),\n  ('SOFTPOWER NEWS RSS','https://softpower.ug/feed/','rss'),\n  ('WATCHDOG UGANDA RSS','https://www.watchdoguganda.com/feed','rss'),\n  ('GDELT MIDDLE EAST',None,'gdelt'),('GDELT WORLD CONFLICT',None,'gdelt')\n]\nquery1='(Gaza OR Israel OR Palestine OR Lebanon OR Syria OR Iran OR Yemen OR Iraq OR \"Red Sea\") (conflict OR ceasefire OR strike OR humanitarian OR casualties OR evacuation)'\nquery2='(war OR conflict OR ceasefire OR humanitarian OR displacement OR armed clashes)'\nresult=[]\nfor i,(name,url,shape) in enumerate(items):\n  if url is None:\n    q=query1 if i==4 else query2\n    url='https://api.gdeltproject.org/api/v2/doc/doc?mode=artlist&format=json&maxrecords=40&sort=datedesc&timespan=24h&query='+urllib.parse.quote_plus(q)\n  entry={'provider':name,'endpoint':url,'checked_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(), 'status':'UNVERIFIED', 'http_status':None,'record_count':None,'source_time':None, 'error':None}\n  try:\n    req=urllib.request.Request(url,headers={'User-Agent':'RUNNINGBALL2-V25-Staging-News-Checks/8','Accept':'application/rss+xml,application/xml,application/json'})\n    with urllib.request.urlopen(req,timeout=12) as res:\n      entry['http_status']=res.status\n      data=res.read(450001)\n    if len(data)>450000:raise ValueError('payload exceeds 450KB')\n    if shape=='rss':\n      xml=ET.fromstring(data)\n      stories=xml.findall('.//item') or xml.findall('.//{*}entry')\n      entry['record_count']=len(stories)\n      if stories:\n        entry['source_time']=stories[0].findtext('pubDate') or stories[0].findtext('{*}published')\n    else:\n      j=json.loads(data);posts=j.get('articles')\n      if not isinstance(posts,list):raise ValueError('missing articles list')\n      entry['record_count']=len(posts)\n      if posts:entry['source_time']=posts[0].get('seendate')\n    entry['status']='HTTP_OK_PARSED' if entry['record_count'] is not None else 'INVALID'\n  except Exception as e:entry['status']='FAILED';entry['error']=str(e)[:250]\n  result.append(entry)\n  print(name,entry['status'],entry['http_status'],entry['record_count'])\nwith open(sys.argv[1],'w') as out:json.dump(result,out,indent=2)\nRB25_V8_PROVIDER_CHECK\n"
