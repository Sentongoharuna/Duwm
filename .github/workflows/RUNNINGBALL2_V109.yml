    - name: Prepare preserved V24 emulator script with V25 identity and ADD stage1 visibility assertions
      shell: bash
      run: "set -euo pipefail\npython3 - <<'RB25_SMOKE_PREP'\nimport yaml,os,subprocess,pathlib,ast\nbaseline=yaml.safe_load(pathlib.Path('/tmp/RUNNINGBALL2-V24-EMBEDDED-LOCKED.yml').read_text())['jobs']['build']['steps']\nenv=dict(os.environ)\nfor i in range(64,72):\n  code=baseline[i]['run']\n  if i==64:\n    # Original V24 generator has an install-path and a path-assertion.\n    # Both must refer to this FIX3 APK, rather than the V24 APK.\n    original='RUNNINGBALL2-V24-WORLD-SOURCE-RECOVERY-APK.apk'\n    intended='RUNNINGBALL2-V109-XML-NAV-REPAIR-APK.apk'\n    if code.count(original)!=2:\n      raise SystemExit('FIX3 V24 generator path anchor changed; expected 2 occurrences')\n    if code.count('rb2sources24')!=2:\n      raise SystemExit('FIX3 V24 generator package anchor changed; expected 2 occurrences')\n    code=code.replace(original,intended)\n    code=code.replace('rb2sources24','rb2live25')\n    code=code.replace('signed V15 APK not found','signed V25 APK not found')\n  if i==67:\n    code=code.replace('rb2sources24','rb2live25')\n  result=subprocess.run(['bash','-eo','pipefail','-c',code],check=False,env=env)\n  if result.returncode:raise SystemExit('V25 V24 SMOKE GENERATOR FAILED index='+str(i)+' name='+baseline[i]['name'])\nfile=pathlib.Path(os.environ['RUNNER_TEMP'])/'v15-emulator-smoke.sh'\nscript=file.read_text()\nneedle=\"assert find('REFRESH SOURCES') or find('LATEST VERIFIED SOURCE CHANGES') or find('RECENT VERIFIED CHANGES'), 'V21 source refresh/status rail missing'\"\nif script.count(needle)!=1:raise SystemExit('V25 VISIBILITY REPAIR ANCHOR NOT FOUND in V24 smoke')\nreplacement=\"\"\"# The taller V25 dashboard can put the original V21 refresh rail below the viewport.\nfound_rail=False\nfor _ in range(22):\n    if find('REFRESH SOURCES') or find('LATEST VERIFIED SOURCE CHANGES') or find('RECENT VERIFIED CHANGES'):\n        found_rail=True;break\n    adb('shell','input','swipe','520','1530','520','620','250');time.sleep(.35)\nassert found_rail, 'V21 source refresh/status rail missing after complete scroll'\"\"\"\nscript=script.replace(needle,replacement,1)\nanchor=\"print('PASS V15 source diagnostics view')\"\nif script.count(anchor)!=1:raise SystemExit('V25 smoke insert anchor missing')\nextra=\"\"\"# V25 Stage 1 actual visible controls. Not a source-text-only assertion.\nhub()\n# The Stage 2 index is intentionally above Stage 1: seek the actual Stage 1\n# controls through the Android viewport, without disabling visibility tests.\nfor _ in range(24):\n    if find('V25 / WORLDWIDE CORE') and find('SELECT REGION') and find('RESET GLOBAL'):\n        break\n    adb('shell','input','swipe','520','1500','520','660','280');time.sleep(.35)\nassert find('V25 / WORLDWIDE CORE'), 'V25 Stage 1 heading not reachable after scroll'\nassert find('SELECT REGION'), 'V25 region chooser not visible'\nassert find('RESET GLOBAL'), 'V25 global reset not visible'\nfor _ in range(3):\n    if find('SOURCE HEALTH') and find('CREDITS'):break\n    adb('shell','input','swipe','520','1450','520','800','300');time.sleep(.3)\nassert find('SOURCE HEALTH'), 'V25 source health entry missing'\nassert find('CREDITS'), 'V25 credits control missing'\nprint('PASS V25 Stage 1 controls reachable on Android after Stage2 index')\n\"\"\"\nscript=script.replace(anchor,anchor+'\\n'+extra,1)\nbody=script.split(\"python3 - <<'PY_ADB_SMOKE'\\n\",1)[1].split('\\nPY_ADB_SMOKE',1)[0]\nast.parse(body)\nfile.write_text(script)\nprint('V25 smoke has every original V24 assertion + restored V21 scroll requirement + new V25 UI gates')\nRB25_SMOKE_PREP\nbash -n \"$RUNNER_TEMP/v15-emulator-smoke.sh\"\n"
