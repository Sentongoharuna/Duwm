    - name: V25 FIX5 EMULATOR - V25 Source Health AND legacy V15 real on-screen navigation
      shell: bash
      run: "set -euo pipefail\npython3 - \"$RUNNER_TEMP/v15-emulator-smoke.sh\" <<'RB25_FIX5_REAL_SCREEN'\nfrom pathlib import Path\nimport ast,sys\np=Path(sys.argv[1]); s=p.read_text(encoding='utf-8')\nold=\"('OPEN SOURCE HEALTH','RunningballV15SourceHealthActivity')\"\n# Exactly two references: the original navigation list and the explicit\n# post-share smoke. The old V15 class and its real checks are preserved.\nif s.count(old)!=2:raise SystemExit(f'FIX5 fail: expected 2 old-source navigation targets, got {s.count(old)} in {p.name}')\ns=s.replace(old,\"('OPEN SOURCE HEALTH','RunningballV25SourceHealthActivity')\")\nassert s.count(\"('OPEN SOURCE HEALTH','RunningballV25SourceHealthActivity')\")==2\nanchor=\"assert find('REQUEST NEW AIRCRAFT REPORT'),'V15 real AIR refresh control not visible'\"\nif s.count(anchor)!=1:raise SystemExit('FIX5 fail: V15 refresh assertion missing from original emulator script')\nnew='''# OPEN SOURCE HEALTH now routes to the Stage 1 V25 source-health overview.\nassert find('V25 / SOURCE HEALTH'), 'FIX5: V25 source health heading not on screen'\nassert find('OPEN LEGACY AIR DIAGNOSTICS'), 'FIX5: visible legacy V15 entry missing on V25 source health'\nroute=find('OPEN LEGACY AIR DIAGNOSTICS')\nassert route,'FIX5: original V15 route not tappable'\nadb('shell','input','tap',str(route[0]),str(route[1]));time.sleep(1.5)\nresumed=adb('shell','dumpsys','activity','activities')\nactive=[line for line in resumed.splitlines() if 'topResumedActivity' in line or 'mResumedActivity' in line]\nif not active or 'RunningballV15SourceHealthActivity' not in active[-1]:\n    screenshot=capture_failure('V15DiagnosticsRoute')\n    raise AssertionError('FIX5: tapping legacy diagnostics did not resume original V15; screenshot '+screenshot)\nassert find('REQUEST NEW AIRCRAFT REPORT'),'V15 real AIR refresh control not visible'\nprint('PASS FIX5: V25 source health and original V15 diagnostics navigated and aircraft refresh visible',flush=True)'''\ns=s.replace(anchor,new,1)\n# These checks were V24's original tests; keep them and the original\n# V15 diagnostics panel assertions after navigating to the legacy view.\nfor snippet in (\"assert find('NO VERIFIED SNAPSHOT') or find('AIR  /  ADSB.LOL')\",\n                \"nav('OPEN GLOBAL SIGNALS','RunningballV13SignalsActivity')\",\n                \"assert 'ResolverActivity' in output or 'ChooserActivity' in output\",\n                \"assert find('V22 / WORLD STATUS')\",\n                \"assert find('V23 / WORLD OPERATIONS CONTROL')\",\n                \"assert find('WORLD NEWS')\",\"assert find('NASA EVENTS')\",\n                \"assert find('V25 / STAGE ACCESS')\",\n                \"('AIRCRAFT RADAR','AirRadarActivity')\",\n                \"('AIRCRAFT CONTACTS','GevContactsActivity')\"):\n  if snippet not in s:raise SystemExit('FIX5: original non-bypass UI gate missing: '+snippet)\ncode=s.split(\"python3 - <<'PY_ADB_SMOKE'\\n\",1)[1].split('\\nPY_ADB_SMOKE',1)[0]\nast.parse(code)\n# Static test ensures V25 and V15 are two distinct resumed screens,\n# not an OR-condition that could silently accept a wrong destination.\nassert \"('OPEN SOURCE HEALTH','RunningballV15SourceHealthActivity')\" not in code\nassert 'RunningballV15SourceHealthActivity' in code\nassert 'RunningballV25SourceHealthActivity' in code\np.write_text(s,encoding='utf-8')\nprint('PASS FIX5: V25 Source Health -> real V15 diagnostics; retains all inherited navigation assertions')\nRB25_FIX5_REAL_SCREEN\nbash -n \"$RUNNER_TEMP/v15-emulator-smoke.sh\"\n"
