or install path match; V25 identity intact')\nRB25_FIX4_EMULATOR_CONTRACT\n\"$SDK_ROOT/build-tools/36.0.0/apksigner\" verify \"$APK\"\nPACKAGE=\"$(\"$SDK_ROOT/build-tools/36.0.0/aapt\" dump badging \"$APK\" | sed -n \"s/^package: name='\\([^']*\\)'.*/\\1/p\" | head -1)\"\ntest \"$PACKAGE\" = 'com.sentongoharuna.worldsituationroom.rb2live25'\nsha256sum \"$APK\"\necho 'V25 FIX5: emulator points to the exact signed APK and the correct package.' >> \"$GITHUB_STEP_SUMMARY\"\n"
