+item)\nnews=(p/'NewsPreferences.java').read_text()\nif '!s.id.startsWith(\"googlenews\")' not in news:raise SystemExit('V25 GOOGLE NEWS RSS NOT BLOCKED')\nprint('PASS V25: protected engine identical; manifest XML; dynamic widgets; worldwide share; cache/source contract')\nRB25_SOURCE_GATE\nTMPDIR=\"$(mktemp -d)\"\nPKG=\"$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom\"\njavac -d \"$TMPDIR\" \"$PKG/RunningballV25RegionQuery.java\"\ncat > \"$TMPDIR/RegionTest.java\" <<'JAVA'\nimport com.sentongoharuna.worldsituationroom.RunningballV25RegionQuery;\npublic final class RegionTest {\n  public static void main(String[] args) {\n    String ug=RunningballV25RegionQuery.url(.34760,32.58250);\n    String uk=RunningballV25RegionQuery.url(51.50740,-.12780);\n    if(ug.equals(uk)||!ug.contains(\"0.34760/32.58250/250\")||!uk.contains(\"51.50740/-0.12780/250\"))\n      throw new IllegalStateException(\"V25 two regions unexpectedly shared same URL\");\n    if(RunningballV25RegionQuery.coverage(\"LONDON\").contains(\"KAMPALA\"))\n      throw new IllegalStateException(\"V25 stale region label\");\n    System.out.println(\"PASS REAL TEST: Kampala and London request URLs & labels are different and explicitly 250 NM regional\");\n  }\n}\nJAVA\njavac -cp \"$TMPDIR\" -d \"$TMPDIR\" \"$TMPDIR/RegionTest.java\"\njava -cp \"$TMPDIR\" RegionTest\n"
