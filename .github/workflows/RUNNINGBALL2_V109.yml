k=True,timeout=20)\nprint('PASS FIX2: V20 live-source pulse visibly reached on expanded V25 dashboard',flush=True)\n# The V20 refresh button is BELOW the nine real-source tiles, and can be\n# more than five gestures away on a narrow or large-font Android screen.\nrefresh=find('REFRESH SOURCES')\nif refresh is None:\n    for direction in range(2):\n        for swipe in range(28):\n            if direction==0:\n                adb('shell','input','swipe','510','1530','510','555','270')\n            else:\n                adb('shell','input','swipe','510','475','510','1530','270')\n            time.sleep(.18)\n            refresh=find('REFRESH SOURCES')\n            if refresh:break\n        if refresh:break\nif refresh is None:capture_failure('V20RealRefreshNotVisible')\nassert refresh,'V20 real-source refresh control not visible after full search'\nprint('PASS FIX2: V20 physical Refresh button located; original tap-and-feedback assertions still required',flush=True)\"\"\"\nn=source.count(old)\nif n!=1:\n    raise SystemExit('STAGE3 FIX2 fail-closed: original V20 visibility + refresh block in v15-emulator-smoke.sh expected once, actual='+str(n))\nsource=source.replace(old,replacement,1)\npython=source.split(\"python3 - <<'PY_ADB_SMOKE'\\n\",1)[1].split('\\nPY_ADB_SMOKE',1)[0]\nast.parse(python)\nrequired=(\n  \"assert found,'V20 real live-source pulse not visible after a full two-way dashboard scan'\",\n  \"assert refresh,'V20 real-source refresh control not visible after full search'\",\n  \"adb('shell','input','tap',str(refresh[0]),str(refresh[1]))\",\n  \"assert find('SOURCE REQUESTS ISSUED') or find('RECENT'),'V20 refresh feedback missing'\",\n  \"PASS V20 pulse visible, real source request accessible and screenshot saved\",\n  \"PASS FIX3: original V22 status strip visibly reached\",\n  \"PASS V3 GLOBAL AIRCRAFT REGISTER\",\n)\nfor phrase in required:\n    if phrase not in python:\n        raise SystemExit('STAGE3 FIX2 required emulator check missing: '+phrase)\n