      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" <<'RB108_JAVA_GATE'\nfrom pathlib import Path\nimport sys,tempfile,subprocess\ns=(Path(sys.argv[1])/'app/src/main/java/com/sentongoharuna/worldsituationroom/RunningballV108ShakeMapActivity.java').read_text()\nstart=s.index('  static String checkImageUrl('); end=s.index('  private static byte[] download(',start)\nmethod=s[start:end]\ntests=r'''public static void main(String[] args) {\n String good=\"https://earthquake.usgs.gov/product/shakemap/us6000abcd/us/1695840300000/download/intensity.jpg\";\n if(!good.equals(checkImageUrl(good)))throw new AssertionError(\"valid USGS produced source image rejected\");\n String[] bad={\"http://earthquake.usgs.gov/product/shakemap/us6000abcd/us/1695840300000/download/intensity.jpg\",\n \"https://evil.test/product/shakemap/us6000abcd/us/1695840300000/download/intensity.jpg\",\n \"https://earthquake.usgs.gov/product/shakemap/us6000abcd/us/1695840300000/download/other.jpg\",\n \"https://earthquake.usgs.gov/product/shakemap/us6000abcd/us/1695840300000/download/intensity.jpg?redirect=evil\",\n \"https://earthquake.usgs.gov@evil.test/product/shakemap/us6000abcd/us/1695840300000/download/intensity.jpg\",\n \"https://earthquake.usgs.gov/product/shakemap/../us/1695840300000/download/intensity.jpg\"};\n for(String u:bad){if(!checkImageUrl(u).isEmpty())throw new AssertionError(\"unsafe/unrelated image allowed \"+u);}\n System.out.println(\"PASS V108 official USGS ShakeMap path and hostile URL rejection\");\n}'''\nwith tempfile.TemporaryDirectory() as temp:\n f=Path(temp)/'UsgsUrlContract.java';f.write_text('import java.net.URL;\\npublic class UsgsUrlContract {\\n'+method+tests+'\\n}\\n')\n subprocess.run(['javac',str(f)],check=True)\n subprocess.run(['java','-cp',temp,'UsgsUrlContract'],check=True)\nRB108_JAVA_GATE\n"
    - name: V108 PUBLIC SOURCE PROBE - USGS week feed actual HTTP and event metadata
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/evidence\"\npython3 - \"$RUNNER_TEMP/evidence/v108_usgs_shakemap_probe.json\" <<'RB108_PROBE'\nimport json,urllib.request,datetime,sys\nu='https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_week.geojson'\nr={'provider':'USGS Earthquake Catalog','endpoint':u,'status':'NOT_CHECKED','checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'count':None,'latest_event_utc':None}\ntry:\n req=urllib.request.Request(u,headers={'User-Agent':'RUNNINGBALL2-V108-source-check/1.0'})\n with urllib.request.urlopen(req,timeout=12) as h:\n  r['http_status']=h.status\n  b=h.read(900001)\n  if len(b)>900000:raise ValueError('USGS response too large')\n  obj=json.loads(b)\n  records=obj['features']\n  r['count']=len(records)\n  v=[x.get('properties',{}).get('time',0) for x in records if isinstance(x,dict)]\n  if v and max(v)>0:r['latest_event_utc']=datetime.datetime.fromtimestamp(max(v)/1000,datetime.timezone.utc).isoformat()\n  r['status']='SOURCE_RESPONSE_RECEIVED'\nexcept Exception as e:\n r['status']='SOURCE_CHECK_FAILED';r['error']=type(e).__name__+': '+str(e)[:180]\nwith open(sys.argv[1],'w') as f:json.dump(r,f,indent=2)\nprint(r)\nRB108_PROBE\n"
