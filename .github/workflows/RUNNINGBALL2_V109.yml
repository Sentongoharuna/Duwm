    - name: V109 FIX - real XML navigation controls are not Boolean values
      shell: bash
      run: |
        set -euo pipefail
        python3 - "$RUNNER_TEMP/v15-emulator-smoke.sh" <<'RB109_FIX_XML_NODES'
        from pathlib import Path
        from xml.etree.ElementTree import Element
        import ast,sys
        path=Path(sys.argv[1])
        script=path.read_text(encoding='utf-8')
        checkpoints=(
          ('V105 quick access', '# V105 UI01: native quick-access bar must be on launcher and actually navigate.', "print('PASS V105 UI01: all three shortcuts visible and route to actual native activities')"),
          ('V107 NASA image card', '# V107: a real on-device NASA image source card entry, not a source string assertion.', "print('PASS V107 NASA EPIC image-card screen and source/share controls visible; live photo reception not inferred')"),
          ('V108 USGS image card', '# V108: real launcher route and a visible USGS event-specific share screen.', "print('PASS V108: source-specific USGS card page and share controls visible; actual image network reception unverified')"),
        )
        old_checks=0
        for label,start,end in checkpoints:
          if script.count(start)!=1 or script.count(end)!=1:
            raise SystemExit('V109 '+label+' missing or ambiguous generated-test boundary in '+str(path))
          a=script.index(start);b=script.index(end,a)+len(end)
          block=script[a:b]
          if block.count('if node:break')!=2 or block.count('assert node,')!=1:
            raise SystemExit('V109 '+label+' legacy XML truth-test count changed: if='+str(block.count('if node:break'))+' assert='+str(block.count('assert node,')))
          block=block.replace('if node:break','if node is not None:break')
          block=block.replace('assert node,','assert node is not None,')
          if block.count('node is not None')!=3:
            raise SystemExit('V109 '+label+' XML repair incomplete')
          script=script[:a]+block+script[b:]
          old_checks+=1
        # Prove the real regression: ElementTree leaf nodes are objects, even if bool(node) is false.
        visible_button=Element('node', {'content-desc':'V105 quick access worldwide aircraft','bounds':'[5,10][50,55]'})
        assert visible_button is not None
        assert not bool(visible_button)
        body=script.split("python3 - <<'PY_ADB_SMOKE'\n",1)[1].split('\nPY_ADB_SMOKE',1)[0]
        ast.parse(body)
        for required in ('V105 quick access worldwide aircraft','RunningballV25WorldwideAirActivity',
                         'RunningballV107EpicActivity','RunningballV108ShakeMapActivity',
                         "adb('shell','input','tap'", "dumpsys','activity','activities'"):
          if required not in body: raise SystemExit('V109 lost real navigation check: '+required)
        path.write_text(script,encoding='utf-8')
        print('PASS V109: all 3 inherited XML leaf-node tests fixed; actual UI taps and activity assertions retained')
        RB109_FIX_XML_NODES
        bash -n "$RUNNER_TEMP/v15-emulator-smoke.sh"

