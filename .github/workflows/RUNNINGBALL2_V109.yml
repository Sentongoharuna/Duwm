        f=pkg/''RunningballV106CachePulse.java''

        assert not f.exists(),''V106 duplicate Java: ''+str(f)

        f.write_bytes(data)

        for p,h in checks.items():assert hashlib.sha256(p.read_bytes()).hexdigest()==h,''V106 changed protected ''+str(p)

        print(''PASS V106 UI02 installed: actual news and quake cache pulse below V105 navigation'')

        RB106_UI02_INSTALL'
