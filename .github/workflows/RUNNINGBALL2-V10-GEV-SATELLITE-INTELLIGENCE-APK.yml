          assert 'setGlobeMode(true)' in earth.read_text()
          assert mapjava.is_file()
          print('V10 SATELLITES: orbital estimates, 2 public OMM groups, premium satellite widget and Earth integration')
          PY_V10_WIRING

      - name: GEV PORT 04 - orbit math, source and preservation acceptance
        shell: bash
        run: |
          set -euo pipefail
          PKG="$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom"
          mkdir -p "$RUNNER_TEMP/v10-sat-unit"
          javac -cp "$RUNNER_TEMP/v10-sat-unit" -d "$RUNNER_TEMP/v10-sat-unit" "$PKG/GevGeo.java" "$PKG/GevOrbitMath.java"
          cat > "$RUNNER_TEMP/v10-sat-unit/TestOrbit.java" <<'JAVA_V10_SAT_TEST'
          import com.sentongoharuna.worldsituationroom.GevOrbitMath;
          public final class TestOrbit {
              static void require(boolean condition,String why){if(!condition)throw new AssertionError(why);}
              public static void main(String[] args){
                  long epoch=1720000000000L;
                  GevOrbitMath.Position iss=GevOrbitMath.propagate(15.5d,0.001d,51.6d,110d,45d,16d,epoch,epoch);
                  require(iss.valid,"finite orbital state");
                  require(iss.lat>=-90d&&iss.lat<=90d&&iss.lon>=-180d&&iss.lon<=180d,"valid longitude/latitude");
                  require(iss.altKm>150d&&iss.altKm<750d,"ISS-like rough orbital height");
                  require(!GevOrbitMath.propagate(0d,0d,0d,0d,0d,0d,epoch,epoch).valid,"reject invalid mean motion");
                  GevOrbitMath.Position future=GevOrbitMath.propagate(15.5d,0.001d,51.6d,110d,45d,16d,epoch,epoch+3600000L);
                  require(future.valid,"forward prediction");
                  require(Math.abs(future.lon-iss.lon)>0.1d || Math.abs(future.lat-iss.lat)>0.1d,"changing ground-track");
                  double up=GevOrbitMath.elevationDeg(iss,iss.lat,iss.lon);
                  require(up>85d,"subpoint altitude overhead");
                  require(GevOrbitMath.periodSeconds(15.5d)>5500L,"orbital period");
                  System.out.println("V10 Kepler maths: expected tests passed (not SGP4)");
              }
          }
          JAVA_V10_SAT_TEST
          javac -cp "$RUNNER_TEMP/v10-sat-unit" -d "$RUNNER_TEMP/v10-sat-unit" "$RUNNER_TEMP/v10-sat-unit/TestOrbit.java"
          java -cp "$RUNNER_TEMP/v10-sat-unit" TestOrbit
          python3 - "$PROJECT_DIR" <<'PY_V10_CHECK'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          m=Path(sys.argv[1])/'app/src/main'
          p=m/'java/com/sentongoharuna/worldsituationroom'
          for f in ['GevSatelliteActivity.java','GevOrbitMath.java','GevSatelliteWidget.java']:
              assert (p/f).is_file(),f
          t=(p/'GevSatelliteActivity.java').read_text()
          for s in ['celestrak.org/NORAD/elements/gp.php?GROUP=','&FORMAT=JSON','NOT SGP4','GevOrbitMath.propagate','ShareCardRenderer.share','GevSatelliteWidget.updateAll']:
              assert s in t,s
          assert 'new Intent(this,GevSatelliteActivity.class)' in (p/'GevEarthExploreActivity.java').read_text()
          for f in ['res/layout/rb10_satellite_widget.xml','res/xml/rb10_satellite_widget_info.xml','res/drawable/rb10_sat_widget_card.xml']:
              ET.parse(m/f)
          ids=(p/'DuwmLiveWallpaperService.java').read_text()
          for s in ['FRAME_MS=33L','rotation=(rotation+(dt/1000.0d)*4.0d)%360.0d;','h.lockCanvas()','h.unlockCanvasAndPost(c)']:
              assert s in ids,s
          print('V10 source, navigation, widget IDs, data labelling and original wallpaper preserved')
          PY_V10_CHECK

      - name: Unique app identity to prevent reopening an older frozen APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PYLABEL'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1]); f = p / 'app/build.gradle.kts'
          cfg = f.read_text(encoding='utf-8')
          def sub_once(s, old, new):
              if s.count(old) != 1: raise SystemExit('Identity anchor missing or repeated: ' + old)
              return s.replace(old, new, 1)
          cfg = sub_once(cfg, 'applicationId = "com.sentongoharuna.worldsituationroom"',
                         'applicationId = "com.sentongoharuna.worldsituationroom.rb2gevsat10"')
          cfg = sub_once(cfg, 'versionCode = 36', 'versionCode = 52')
          cfg = sub_once(cfg, 'versionName = "2026-local-news"', 'versionName = "RUNNINGBALL2-V10-GEV-SATELLITES-04"')
          f.write_text(cfg, encoding='utf-8')
          labels = p / 'app/src/main/res/values/strings.xml'
          s = labels.read_text(encoding='utf-8')
          s, n = re.subn(r'(<string\s+name="app_name">).*?(</string>)',
                         r'\g<1>RUNNINGBALL2 SATELLITES 10\g<2>', s, count=1)
          if n != 1: raise SystemExit('App-name label anchor missing')
          labels.write_text(s, encoding='utf-8')
          print('Only application identity and label changed; engine code untouched.')
          PYLABEL

      - name: Check unchanged RUNNINGBALL2 wallpaper mechanism
        shell: bash
        run: |
          set -euo pipefail
          PKG="$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom"
          grep -Fq 'private static final long FRAME_MS=33L;' "$PKG/DuwmLiveWallpaperService.java"
          grep -Fq 'rotation=(rotation+(dt/1000.0d)*4.0d)%360.0d;' "$PKG/DuwmLiveWallpaperService.java"
          grep -Fq 'h.lockCanvas()' "$PKG/DuwmLiveWallpaperService.java"
          grep -Fq 'h.unlockCanvasAndPost(c)' "$PKG/DuwmLiveWallpaperService.java"
          grep -Fq 'ui.removeCallbacks(tick)' "$PKG/DuwmLiveWallpaperService.java"
          test "$(grep -c 'drawGlobe();' "$PKG/DuwmLiveWallpaperService.java")" -ge 1
          echo 'RUNNINGBALL2 original surface rendering verified in source'

      - name: Compile protected globe and aircraft intelligence
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac --stacktrace

      - name: Assemble RUNNINGBALL2 AIR1 Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace

      - name: Verify actual APK, package and signature
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t APKS < <(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print0)
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          test -s "$APK"
          python3 - "$APK" <<'PYAPK'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              assert 'AndroidManifest.xml' in z.namelist()
              assert 'classes.dex' in z.namelist()
          PYAPK
          "$SDK_ROOT/build-tools/36.0.0/apksigner" verify "$APK"
          PACKAGE="$("$SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = 'com.sentongoharuna.worldsituationroom.rb2gevsat10'
          mkdir -p "$RUNNER_TEMP/release"
          cp "$APK" "$RUNNER_TEMP/release/RUNNINGBALL2-V10-GEV-SATELLITE-INTELLIGENCE-APK.apk"
          sha256sum "$RUNNER_TEMP/release/RUNNINGBALL2-V10-GEV-SATELLITE-INTELLIGENCE-APK.apk"
          echo '### RUNNINGBALL2 V10 Gods Eye View Satellite Intelligence APK compiled and signed' >> "$GITHUB_STEP_SUMMARY"
          echo 'The original live wallpaper runs a 33-ms drawing loop. Phone motion requires device verification.' >> "$GITHUB_STEP_SUMMARY"

