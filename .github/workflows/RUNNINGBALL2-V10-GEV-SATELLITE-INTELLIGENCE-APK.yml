              private final class CockpitScene extends View {
                  private final Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);private final Path arrow=new Path();
                  CockpitScene(){super(GevCockpitActivity.this);setBackground(card());}
                  private void line(Canvas c,float x1,float y1,float x2,float y2,int color,float thick){p.setStyle(Paint.Style.STROKE);p.setColor(color);p.setStrokeWidth(dp(thick));c.drawLine(x1,y1,x2,y2,p);p.setStyle(Paint.Style.FILL);}
                  private void txt(Canvas c,String s,float x,float y,int size,int color,boolean center){p.setStyle(Paint.Style.FILL);
                      p.setTextSize(dp(size));p.setTypeface(Typeface.create(Typeface.MONOSPACE,Typeface.BOLD));p.setColor(color);
                      p.setTextAlign(center?Paint.Align.CENTER:Paint.Align.LEFT);c.drawText(s,x,y,p);p.setTextAlign(Paint.Align.LEFT);}
                  @Override protected void onDraw(Canvas c){super.onDraw(c);float w=getWidth(),h=getHeight(),cx=w/2f,cy=h/2f;
                      c.drawColor(PANEL);if(target==null){txt(c,"NO SELECTED CONTACT",cx,cy,13,AMBER,true);return;}
                      double lat=target.optDouble("lat",Double.NaN),lon=target.optDouble("lon",Double.NaN);
                      double heading=target.optDouble("heading",Double.NaN);
                      boolean positionOk=GevGeo.valid(lat,lon);
                      float r=Math.min(w,h)*.40f;
                      if(chase){
                          p.setColor(Color.rgb(25,47,59));p.setStyle(Paint.Style.STROKE);p.setStrokeWidth(dp(1));
                          for(int i=1;i<=4;i++)c.drawCircle(cx,cy,r*i/4f,p);
                          line(c,cx-r,cy,cx+r,cy,Color.rgb(42,78,94),1);
                          line(c,cx,cy-r,cx,cy+r,Color.rgb(42,78,94),1);
                          p.setStyle(Paint.Style.FILL);txt(c,"TARGET-CENTERED  /  "+chaseNm+" NM",dp(13),dp(24),11,CYAN,false);
                          txt(c,GevCockpitMath.finite(heading)?"UP = TRACK "+GevCockpitMath.headingText(heading)+" DEG":"UP = NORTH",dp(13),dp(42),10,MUTED,false);
                          if(positionOk){
                              for(int i=0;i<items.length();i++){
                                  JSONObject x=items.optJSONObject(i);if(x==null||hex.equalsIgnoreCase(x.optString("hex","")))continue;
                                  double a=x.optDouble("lat",Double.NaN),b=x.optDouble("lon",Double.NaN);
                                  if(!GevGeo.valid(a,b))continue;
                                  double nm=GevGeo.km(lat,lon,a,b)/1.852d;
                                  if(!GevCockpitMath.finite(nm)||nm>chaseNm)continue;
                                  double bearing=GevCockpitMath.bearing(lat,lon,a,b);
                                  double relative=GevCockpitMath.relativeBearing(bearing,GevCockpitMath.finite(heading)?heading:0);
                                  float xPos=cx+(float)(Math.sin(Math.toRadians(relative))*nm/chaseNm*r);
                                  float yPos=cy-(float)(Math.cos(Math.toRadians(relative))*nm/chaseNm*r);
                                  p.setColor(GREEN);c.drawCircle(xPos,yPos,dp(3),p);
                              }
                          }
                          p.setStyle(Paint.Style.FILL);p.setColor(CYAN);c.drawCircle(cx,cy,dp(6),p);
                          line(c,cx,cy-dp(18),cx,cy-dp(7),LIGHT,2);
                          txt(c,"SELECTED AIRCRAFT",cx,cy+dp(28),11,LIGHT,true);
                          if(!positionOk)txt(c,"POSITION NOT REPORTED",cx,cy+dp(49),11,AMBER,true);
                      }else{
                          // Neutral instrument reference only: ADS-B does not provide an attitude/pitch feed.
                          p.setStyle(Paint.Style.FILL);p.setColor(Color.rgb(15,46,65));c.drawRect(0,0,w,cy,p);
                          p.setColor(Color.rgb(42,35,43));c.drawRect(0,cy,w,h,p);
                          line(c,0,cy,w,cy,Color.rgb(95,178,193),2);
                          line(c,cx-dp(40),cy,cx-dp(12),cy,CYAN,2);
                          line(c,cx+dp(12),cy,cx+dp(40),cy,CYAN,2);
                          line(c,cx,cy-dp(9),cx,cy+dp(9),CYAN,2);
                          txt(c,"COCKPIT TELEMETRY",cx,dp(30),13,CYAN,true);
                          txt(c,"ATTITUDE NOT REPORTED",cx,cy+dp(42),11,AMBER,true);
                          txt(c,"COURSE "+GevCockpitMath.headingText(heading)+" DEG",cx,cy-dp(45),18,LIGHT,true);
                          txt(c,"ALT "+(target.optBoolean("ground",false)?"GROUND":val(target.optDouble("alt",Double.NaN)," FT")),dp(12),cy-dp(9),11,GREEN,false);
                          txt(c,"SPD "+val(target.optDouble("speed",Double.NaN)," KT"),dp(12),cy+dp(25),11,GREEN,false);
                      }
                      txt(c,recent()?"RECENT ADS-B REPORT":"STALE / CACHED • NOT LIVE",cx,h-dp(22),11,recent()?GREEN:AMBER,true);
                  }
              }
          }
