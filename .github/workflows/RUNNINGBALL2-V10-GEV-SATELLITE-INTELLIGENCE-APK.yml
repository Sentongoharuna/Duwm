                  LinearLayout.LayoutParams qp=new LinearLayout.LayoutParams(-1,dp(46));qp.topMargin=dp(9);root.addView(query,qp);
                  record=label("CATALOGUE: --",12,CYAN,true);LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(-1,dp(27));cp.topMargin=dp(6);root.addView(record,cp);
