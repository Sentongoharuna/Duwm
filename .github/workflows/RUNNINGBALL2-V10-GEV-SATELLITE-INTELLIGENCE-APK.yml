              }
              private void requestRefresh(){Intent i=new Intent(this,AirOperationsWidgets.Command.class);
                  i.setAction(ACTION_REFRESH);sendBroadcast(i);
                  status.setText("REFRESH REQUESTED • AWAITING NEW PROVIDER RESPONSE");}
              private void load(){JSONObject data=AirOperationsWidgets.lastData(this);
                  items=data.optJSONArray("items");if(items==null)items=new JSONArray();
                  snapshotTime=data.optLong("time",0L);
                  error=getSharedPreferences("air_widget_v2",MODE_PRIVATE).getString("last_error","");
                  target=null;
                  for(int i=0;i<items.length();i++){JSONObject x=items.optJSONObject(i);
                      if(x!=null&&!hex.isEmpty()&&hex.equalsIgnoreCase(x.optString("hex",""))){target=x;break;}}
                  render();
              }
              private void render(){range.setText(chaseNm+" NM");
                  toggle.setText(chase?"CHASE VIEW   ●":"COCKPIT HUD   ●");
                  String quality=snapshotTime<=0?"NO OBSERVATION":recent()?"RECENT OBSERVATION":"CACHED / STALE OBSERVATION";
                  status.setText(quality+"  •  "+utc(snapshotTime));status.setTextColor(recent()?GREEN:AMBER);
                  if(target==null){name.setText(hex.isEmpty()?"NO AIRCRAFT SELECTED":"AIRCRAFT "+hex.toUpperCase(Locale.US));
                      telemetry.setText("CONTACT NOT PRESENT IN LAST REPORT.\nGo back to Contacts or Radar and select an aircraft.");
                  }else{
                      String flight=target.optString("flight","").trim();name.setText((flight.isEmpty()?"AIRCRAFT":flight)+" / "+hex.toUpperCase(Locale.US));
                      double lat=target.optDouble("lat",Double.NaN),lon=target.optDouble("lon",Double.NaN);
                      telemetry.setText("ALT "+(target.optBoolean("ground",false)?"ON GROUND":val(target.optDouble("alt",Double.NaN)," FT"))+
                        "   •   SPEED "+val(target.optDouble("speed",Double.NaN)," KT")+
                        "\nCOURSE "+GevCockpitMath.headingText(target.optDouble("heading",Double.NaN))+"°"+
                        "   •   LAT "+(GevCockpitMath.finite(lat)?String.format(Locale.US,"%.4f",lat):"—")+
                        "\nLON "+(GevCockpitMath.finite(lon)?String.format(Locale.US,"%.4f",lon):"—")+
                        "   •   "+(chase?"TARGET-CENTERED OBSERVATION":"OBSERVED FLIGHT TELEMETRY"));
                  }
                  source.setText("ADSB.LOL  •  "+(recent()?"RECENT":"NOT LIVE")+
                     "  •  OBSERVED POSITION ONLY"+(error.isEmpty()?"":" • SOURCE ERROR"));
                  if(scene!=null)scene.invalidate();
              }
              private void share(){if(target==null||snapshotTime<=0)return;
                  double lat=target.optDouble("lat",Double.NaN),lon=target.optDouble("lon",Double.NaN);
                  LinkedHashMap<String,String> info=new LinkedHashMap<>();
                  info.put("ICAO HEX",hex.toUpperCase(Locale.US));
                  info.put("ALTITUDE",target.optBoolean("ground",false)?"GROUND":val(target.optDouble("alt",Double.NaN)," FT"));
                  info.put("SPEED",val(target.optDouble("speed",Double.NaN)," KT"));
                  info.put("COURSE",GevCockpitMath.headingText(target.optDouble("heading",Double.NaN))+"°");
                  info.put("POSITION",GevGeo.valid(lat,lon)?String.format(Locale.US,"%.4f, %.4f",lat,lon):"NOT REPORTED");
