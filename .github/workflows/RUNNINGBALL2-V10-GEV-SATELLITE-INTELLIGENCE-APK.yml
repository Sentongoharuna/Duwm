              @Override protected void onCreate(Bundle s){super.onCreate(s);getWindow().setStatusBarColor(BACK);getWindow().setNavigationBarColor(BACK);
                  LinearLayout root=new LinearLayout(this);root.setOrientation(LinearLayout.VERTICAL);root.setBackgroundColor(BACK);root.setPadding(dp(12),dp(10),dp(12),dp(10));
                  root.addView(label("RUNNINGBALL2 / GOD'S EYE VIEW PORT 04",11,CYAN,true),new LinearLayout.LayoutParams(-1,dp(25)));
                  root.addView(label("SATELLITE INTELLIGENCE",23,INK,true),new LinearLayout.LayoutParams(-1,dp(42)));
                  banner=label("LOADING PUBLIC ORBITAL ELEMENTS",12,AMBER,false);root.addView(banner,new LinearLayout.LayoutParams(-1,dp(35)));
