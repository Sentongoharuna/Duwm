          /** GEV Cockpit Port 02. Native observed-data flight tracking / cockpit instrument presentation.
           * It is NOT an actual cockpit camera or a photorealistic 3D terrain camera.
           * Coordinates, altitude, heading and speed are read from ADS-B observations without prediction.
           * Previous RUNNINGBALL2 globe, wallpaper, radar, widgets, and share cards are left unchanged.
           */
          public final class GevCockpitActivity extends Activity {
              private static final int BG=Color.rgb(8,13,21), PANEL=Color.rgb(15,24,35);
              private static final int CYAN=Color.rgb(106,220,241), LIGHT=Color.rgb(232,246,252);
              private static final int MUTED=Color.rgb(147,174,190), AMBER=Color.rgb(255,190,94);
              private static final int GREEN=Color.rgb(73,219,165);
              private static final String ACTION_REFRESH="com.sentongoharuna.worldsituationroom.AIR_WIDGET_REFRESH";
              private final Handler handler=new Handler(Looper.getMainLooper());
              private final Runnable poll=new Runnable(){@Override public void run(){if(active){load();handler.postDelayed(this,3000L);}}};
              private boolean active, chase=false;
              private int chaseNm=30;
              private String hex="";
              private JSONArray items=new JSONArray();
              private JSONObject target;
              private long snapshotTime;
              private String error="";
              private TextView name, status, telemetry, source, toggle, range;
              private CockpitScene scene;
              private int dp(float n){return Math.round(n*getResources().getDisplayMetrics().density);}
              private static String val(double n,String suffix){return GevCockpitMath.finite(n)?String.format(Locale.US,"%.0f%s",n,suffix):"NOT REPORTED";}
              private static String utc(long t){if(t<=0L)return "NO SNAPSHOT";
                  SimpleDateFormat f=new SimpleDateFormat("HH:mm:ss 'UTC'",Locale.US);f.setTimeZone(TimeZone.getTimeZone("UTC"));return f.format(new Date(t));}
              private boolean recent(){return snapshotTime>0 && error.isEmpty() &&
                      System.currentTimeMillis()>=snapshotTime && System.currentTimeMillis()-snapshotTime<=180000L;}
              private TextView label(String s,int size,int color,boolean bold){TextView t=new TextView(this);
                  t.setText(s);t.setTextSize(size);t.setTextColor(color);t.setGravity(Gravity.CENTER_VERTICAL);
                  if(bold)t.setTypeface(Typeface.DEFAULT,Typeface.BOLD);return t;}
              private GradientDrawable card(){GradientDrawable d=new GradientDrawable();d.setColor(PANEL);
                  d.setCornerRadius(dp(22));d.setStroke(dp(1),Color.rgb(65,133,155));return d;}
              private TextView action(String title,Runnable r){TextView t=label(title,12,CYAN,true);
                  t.setGravity(Gravity.CENTER);t.setBackground(card());t.setOnClickListener(v->r.run());return t;}
              @Override protected void onCreate(Bundle b){super.onCreate(b);
                  getWindow().setStatusBarColor(BG);getWindow().setNavigationBarColor(BG);
                  hex=getIntent().getStringExtra("air_hex");if(hex==null)hex="";
                  hex=hex.trim().toLowerCase(Locale.US);
                  LinearLayout root=new LinearLayout(this);root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);root.setPadding(dp(13),dp(12),dp(13),dp(10));
                  root.addView(label("RUNNINGBALL2  /  GEV COCKPIT 02",12,CYAN,true),new LinearLayout.LayoutParams(-1,dp(28)));
                  name=label("SELECTED AIRCRAFT",22,LIGHT,true);root.addView(name,new LinearLayout.LayoutParams(-1,dp(38)));
                  status=label("AWAITING OBSERVED AIRCRAFT DATA",11,AMBER,true);root.addView(status,new LinearLayout.LayoutParams(-1,dp(36)));
                  LinearLayout top=new LinearLayout(this);top.setOrientation(LinearLayout.HORIZONTAL);
                  toggle=action("COCKPIT  /  CHASE",()->{chase=!chase;render();});
                  top.addView(toggle,new LinearLayout.LayoutParams(0,dp(44),2f));
                  range=action("30 NM",()->{chaseNm=chaseNm==10?30:chaseNm==30?60:10;render();});
                  LinearLayout.LayoutParams rp=new LinearLayout.LayoutParams(0,dp(44),1f);rp.leftMargin=dp(7);top.addView(range,rp);
                  root.addView(top,new LinearLayout.LayoutParams(-1,dp(44)));
                  scene=new CockpitScene();LinearLayout.LayoutParams canvas=new LinearLayout.LayoutParams(-1,0,1f);canvas.topMargin=dp(10);
