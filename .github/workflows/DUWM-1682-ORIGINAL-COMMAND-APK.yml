name: DUWM 1682 | Observed Position Navigator on Original Command Center
run-name: DUWM 1682 | Original globe real source position navigation and timestamp details
'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/DUWM-1682-ORIGINAL-COMMAND-APK.yml
      - DUWM-1682-ORIGINAL-COMMAND-SOURCE.zip
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: duwm-1682-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Validate and compile improved original DUWM 1682 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout exact DUWM 1682 source and workflow
        uses: actions/checkout@v4
      - name: Check source checksum and extract actual Android project
        shell: bash
        run: |
          set -euo pipefail
          test -s DUWM-1682-ORIGINAL-COMMAND-SOURCE.zip
          echo '8703becc83dcd7ab20700e7b1e6e135bba258100accd96c151173401447a4558  DUWM-1682-ORIGINAL-COMMAND-SOURCE.zip' | sha256sum -c -
          unzip -t DUWM-1682-ORIGINAL-COMMAND-SOURCE.zip | tail -2
          mkdir -p "$RUNNER_TEMP/duwm1682src"
          unzip -q DUWM-1682-ORIGINAL-COMMAND-SOURCE.zip -d "$RUNNER_TEMP/duwm1682src"
          test -f "$RUNNER_TEMP/duwm1682src/DUWM-1682-ANDROID-SOURCE/app/build.gradle.kts"
          echo "PROJECT=$RUNNER_TEMP/duwm1682src/DUWM-1682-ANDROID-SOURCE" >> "$GITHUB_ENV"
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate preinstalled Android SDK and ensure API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo 'Android SDK missing'; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          test -n "$SDK_MANAGER" && test -x "$SDK_MANAGER"
          if [ ! -f "$SDK_ROOT/platforms/android-36/android.jar" ] || [ ! -x "$SDK_ROOT/build-tools/36.0.0/apksigner" ]; then
            yes | timeout 120 "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            timeout 600 "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          fi
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Verify original globe navigator, one launcher and actual source readings
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python3 verification/check_source.py
          python3 verification/check_1674_fix1_compiler.py
          python3 verification/check_1682_observation_navigation.py
          python3 verification/check_1679_geometry.py
          mkdir -p "$RUNNER_TEMP/duwm1682syntax"
          javac -d "$RUNNER_TEMP/duwm1682syntax" verification/JavaSyntaxCheck.java
          java -cp "$RUNNER_TEMP/duwm1682syntax" JavaSyntaxCheck
          mkdir -p "$RUNNER_TEMP/duwm1682geo"
          javac -d "$RUNNER_TEMP/duwm1682geo" \
            app/src/main/java/com/sentongoharuna/worldsituationroom/Duwm1676GeoMath.java \
            verification/Duwm1676GeoMathTest.java
          java -cp "$RUNNER_TEMP/duwm1682geo" com.sentongoharuna.worldsituationroom.Duwm1676GeoMathTest
      - name: Compile Android source into installable APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac :app:assembleDebug --stacktrace
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$RUNNER_TEMP/duwm1682originalapk"
          cp "$APK" "$RUNNER_TEMP/duwm1682originalapk/DUWM-1682-ORIGINAL-COMMAND.apk"
      - name: Validate compiled UI classes, app version and APK signature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_APK'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,os,subprocess
          apk=Path(os.environ['RUNNER_TEMP'])/'duwm1682originalapk/DUWM-1682-ORIGINAL-COMMAND.apk'
          assert apk.is_file() and apk.stat().st_size>150000,'Installable APK missing'
          with ZipFile(apk) as z:
              assert z.testzip() is None
              entries=z.namelist()
              for asset in ('AndroidManifest.xml','classes.dex','assets/duwm_1682_observation_navigator.json',
                            'assets/duwm_country_borders_wdbii.txt'):
                  assert asset in entries,('Asset not packaged',asset)
              dex=b''.join(z.read(name) for name in entries if name.endswith('.dex'))
              for cls in (b'DuwmUnifiedTheme',b'SatelliteMapView',b'SourceMatrixView',b'Duwm1678VisualKit',b'PulsePanel',b'MediaDeskActivity',
                          b'GevMarineActivity',b'GevMarineRadarView',b'Duwm1671SectorActivity',
                          b'Duwm1671TrendView',b'Duwm1670FlightMapActivity',
                          b'Duwm1670WorldMapView',b'DuwmOptionsActivity',b'MainActivity',
                          b'Duwm1676GeoWatchActivity',b'Duwm1675EvidenceVaultActivity'):
                  assert cls in dex,('Changed class missing from APK',cls)
          build=Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
          subprocess.run([str(build/'apksigner'),'verify',str(apk)],check=True)
          badge=subprocess.check_output([str(build/'aapt'),'dump','badging',str(apk)],text=True)
          assert "versionCode='168200'" in badge,badge[:800]
          assert "versionName='1682'" in badge,badge[:800]
          assert "name='com.sentongoharuna.worldsituationroom.rb2live25'" in badge
          assert "launchable-activity: name='com.sentongoharuna.worldsituationroom.MainActivity'" in badge,'Original Command Center is not the APK launcher'
          (apk.parent/'SHA256SUMS.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  DUWM-1682-ORIGINAL-COMMAND.apk\n')
          print('PASS: DUWM 1682 real position navigator on original Command Center compiled in signed APK')
          PY_APK
      - name: Publish successful DUWM 1682 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-1682-ORIGINAL-COMMAND-APK
          path: |
            ${{ runner.temp }}/duwm1682originalapk/DUWM-1682-ORIGINAL-COMMAND.apk
            ${{ runner.temp }}/duwm1682originalapk/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
      - name: State verification boundaries
        if: always()
        shell: bash
        run: |
          {
            echo '### DUWM 1682: Source Pulse controls the original globe without a second globe'
            echo 'Original MainActivity now supports live on-map source focus, tap-again full desks and reset to all sources. SatelliteMapView remains the only home globe.'
            echo 'Animations are UI-only unless they interpolate actual consecutive source positions.'
            echo 'Successful Android compilation does not prove that live media streams or remote providers are reachable on the phone.'
          } >> "$GITHUB_STEP_SUMMARY"
