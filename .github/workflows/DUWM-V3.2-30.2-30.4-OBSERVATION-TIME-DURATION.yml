              /**
               * V3.2/30.1/30.26 LIFECYCLE INTEGRATION.
               * Live-object frame work exists only while the globe is attached and visible.
               * Source observations may still be accepted while paused, but no animation
               * frame work is performed in the background.
               */
              public synchronized void setLifecycle(boolean attached,boolean visible) {
                  MotionLifecycleState next=!attached?MotionLifecycleState.PAUSED_DETACHED:
                          (visible?MotionLifecycleState.ACTIVE_VISIBLE:MotionLifecycleState.PAUSED_HIDDEN);
                  if(next!=motionLifecycleState) {
                      if(next==MotionLifecycleState.ACTIVE_VISIBLE)lifecycleActivateCount++;
                      else lifecyclePauseCount++;
                      motionLifecycleState=next;
                  }
              }

              public synchronized MotionLifecycleState lifecycleState(){return motionLifecycleState;}
              public synchronized long lifecycleActivateCount(){return lifecycleActivateCount;}
              public synchronized long lifecyclePauseCount(){return lifecyclePauseCount;}
              public synchronized long lifecycleSuppressedFrameCount(){return lifecycleSuppressedFrameCount;}

              /** One shared frame tick for the whole collection; never one timer per object. */
              public synchronized void onFrame(long frameTimeNanos) {
                  if(motionLifecycleState!=MotionLifecycleState.ACTIVE_VISIBLE) {
                      lifecycleSuppressedFrameCount++;
                      return;
                  }
                  frameTicks++;
                  sharedClockFrameSequence++;
                  // V3.2/30.1/30.27: one shared frame visits the active collection.
                  // No Timer/Runnable/Choreographer callback is created per object.
                  int inBatch=0;
                  fleetFrameCount++;
                  fleetPeakTrackedObjects=Math.max(fleetPeakTrackedObjects,states.size());
                  for(MotionState state:states.values()) {
                      if(state==null)continue;
                      if(inBatch==0)fleetBatchCount++;
                      sharedClockObjectVisitCount++;
                      inBatch++;
                      if(inBatch>=V328_FLEET_BATCH_SIZE)inBatch=0;
                      // Foundation only: later interpolation may consume this shared clock.
                  }
              }

