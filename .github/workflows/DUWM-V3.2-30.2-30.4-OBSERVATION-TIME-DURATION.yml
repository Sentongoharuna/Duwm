              public synchronized UpdateDisposition classifyUpdate(String stableId,Kind kind,
                                                                       double latitude,double longitude,
                                                                       long effectiveAtMillis) {
                  if(stableId==null||stableId.trim().isEmpty()
                          || !Double.isFinite(latitude)||!Double.isFinite(longitude)
                          || latitude < -90.0d || latitude > 90.0d)
                      return UpdateDisposition.INVALID_REJECTED;
                  String id=canonicalIdentity(stableId,kind);
                  MotionState old=id==null?null:states.get(id);
                  if(old==null)return UpdateDisposition.ACCEPTED_NEW;
                  if(effectiveAtMillis<old.receivedAtMillis)return UpdateDisposition.OLDER_REJECTED;
                  double lon=normalizeLongitude(longitude);
                  if(effectiveAtMillis==old.receivedAtMillis
                          && Double.compare(latitude,old.receivedLatitude)==0
                          && Double.compare(lon,old.receivedLongitude)==0)
                      return UpdateDisposition.DUPLICATE_IGNORED;
                  return UpdateDisposition.ACCEPTED_NEW;
              }

              /**
               * V3.2/30.2/30.1 INTERPOLATION ENGINE FOUNDATION.
               * Establishes interpolation ownership and eligibility only. It does not yet
               * advance coordinates. Only previous/current real observations may become
               * endpoints; raw truth is immutable and forward prediction remains disabled.
               */
              /**
               * V3.2/30.2/30.4 OBSERVATION-TIME DURATION.
               * Interpolation duration comes from the effective timestamps of the two
               * accepted real observations, never frame count or device refresh rate.
               */
              public static final class InterpolationDurationSnapshot {
                  public final String stableId;
                  public final InterpolationDurationState state;
                  public final long startTimeMillis;
                  public final long endTimeMillis;
                  public final long durationMillis;
                  public final double durationSeconds;
                  InterpolationDurationSnapshot(String id,InterpolationDurationState state,
                                                long start,long end) {
                      stableId=id; this.state=state;
                      startTimeMillis=start; endTimeMillis=end;
                      durationMillis=(state==InterpolationDurationState.VALID_SOURCE_INTERVAL)?end-start:0L;
                      durationSeconds=durationMillis/1000.0d;
                  }
              }

              public synchronized InterpolationDurationSnapshot interpolationDuration(String stableId,Kind kind) {
                  InterpolationEndpointSnapshot ep=interpolationEndpoints(stableId,kind);
                  if(ep==null||ep.binding==EndpointBinding.UNBOUND)
                      return new InterpolationDurationSnapshot(canonicalIdentity(stableId,kind),
                              InterpolationDurationState.UNAVAILABLE,-1L,-1L);
                  if(ep.endTimeMillis<=ep.startTimeMillis)
                      return new InterpolationDurationSnapshot(ep.stableId,
                              InterpolationDurationState.INVALID_NON_POSITIVE_INTERVAL,
                              ep.startTimeMillis,ep.endTimeMillis);
                  return new InterpolationDurationSnapshot(ep.stableId,
                          InterpolationDurationState.VALID_SOURCE_INTERVAL,
                          ep.startTimeMillis,ep.endTimeMillis);
              }

