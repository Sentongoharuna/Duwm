name: DUWM V3.2 30.2 30.4 OBSERVATION TIME DURATION
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen working V3 source
        run: |
          set -euo pipefail
          SRC=DUWM-1-2-20-4-20-WORKING-GLOBE-BASELINE-FIX4-SOURCE.tar.gz
          test -s "$SRC"
          echo "0580d0c549421119bf933706a632760a6ef8ffd1d55a5c406b4430f6621277d2  $SRC" | sha256sum -c -
      - name: Extract V3
        run: |
          rm -rf "$RUNNER_TEMP/duwm"; mkdir -p "$RUNNER_TEMP/duwm"
          tar -xzf DUWM-1-2-20-4-20-WORKING-GLOBE-BASELINE-FIX4-SOURCE.tar.gz -C "$RUNNER_TEMP/duwm"
          P="$(find "$RUNNER_TEMP/duwm" -mindepth 1 -maxdepth 1 -type d | head -n1)"
          echo "PROJECT_DIR=$P" >> "$GITHUB_ENV"
      - name: Apply V3 repair plus V3.1 30.1 and 30.2
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import re,sys
          # V3.2 repair: inherited V3.1 engine template uses raw triple quotes; Java quotes are safe.
          root=Path(sys.argv[1])
          main=root/"app/src/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          s=main.read_text()
          if "double distanceKm(double lat1,double lon1,double lat2,double lon2)" not in s:
              pos=s.rfind("\n}")
              helper="\n    private static double distanceKm(double lat1,double lon1,double lat2,double lon2) {\n        final double r=6371.0088d; double p1=Math.toRadians(lat1),p2=Math.toRadians(lat2),dp=Math.toRadians(lat2-lat1),dl=Math.toRadians(lon2-lon1); double a=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2); return r*2.0d*Math.atan2(Math.sqrt(a),Math.sqrt(1.0d-a));\n    }\n"
              if pos<0: raise SystemExit("MainActivity closing brace missing")
              main.write_text(s[:pos]+helper+s[pos:])

          mp=root/"app/src/main/java/com/sentongoharuna/worldsituationroom/SatelliteMapView.java"
          s=mp.read_text()
          candidates=["centerLongitude","centerLon","longitudeOffset","rotationLongitude","globeLongitude","cameraLongitude","lonOffset"]
          state=next((x for x in candidates if re.search(r"\b"+re.escape(x)+r"\b",s)),None)
          if not state:
              m=re.search(r"\b(?:double|float)\s+([A-Za-z_][A-Za-z0-9_]*(?:Lon|Longitude)[A-Za-z0-9_]*)\b",s,re.I)
              state=m.group(1) if m else None
          if not state: raise SystemExit("No existing globe longitude state; refusing fake animation")
          lat_candidates=["centerLatitude","centerLat","cameraLatitude","globeLatitude","latOffset"]
          lat_state=next((x for x in lat_candidates if re.search(r"\b"+re.escape(x)+r"\b",s)),None)
          if not lat_state:
              lm=re.search(r"\b(?:double|float)\s+([A-Za-z_][A-Za-z0-9_]*(?:Lat|Latitude)[A-Za-z0-9_]*)\b",s,re.I)
              lat_state=lm.group(1) if lm else None
          check "v318ProtectedLatitude"
          check "v318LatitudeDriftCorrectionCount"
          check "v325FrameLatitude=v318ProtectedLatitude"
          print("DETECTED EXISTING GLOBE LATITUDE STATE:",lat_state)
          zoom_candidates=["zoom","zoomLevel","scale","mapScale","globeScale","cameraZoom"]
          zoom_state=next((x for x in zoom_candidates if re.search(r"\b"+re.escape(x)+r"\b",s)),None)
          if not zoom_state:
              zm=re.search(r"\b(?:double|float)\s+([A-Za-z_][A-Za-z0-9_]*(?:Zoom|Scale)[A-Za-z0-9_]*)\b",s,re.I)
              zoom_state=zm.group(1) if zm else None
          print("DETECTED EXISTING GLOBE ZOOM STATE:",zoom_state)
          print("DETECTED EXISTING GLOBE ZOOM STATE:",zoom_state)
          orient_candidates=["tilt","pitch","cameraTilt","cameraPitch","globeTilt","bearing","roll"]
          orient_state=next((x for x in orient_candidates if re.search(r"\b"+re.escape(x)+r"\b",s)),None)
          if not orient_state:
              om=re.search(r"\b(?:double|float)\s+([A-Za-z_][A-Za-z0-9_]*(?:Tilt|Pitch|Bearing|Roll)[A-Za-z0-9_]*)\b",s,re.I)
              orient_state=om.group(1) if om else None
          selection_candidates=["selectedSignal","selectedItem","selectedObject","selectedEntity","selectedTarget","selectedId","selection"]
          selection_state=next((x for x in selection_candidates if re.search(r"\b"+re.escape(x)+r"\b",s)),None)
          if not selection_state:
              sm=re.search(r"\b(?:Signal|String|Object|[A-Za-z_][A-Za-z0-9_<>?, ]*)\s+([A-Za-z_][A-Za-z0-9_]*selected[A-Za-z0-9_]*)\b",s,re.I)
              selection_state=sm.group(1) if sm else None
          cp=s.find("{",s.find("class SatelliteMapView"))
          orient_capture=(' v320ProtectedOrientation='+orient_state+';' if orient_state else '')
          orient_guard=(' if(Math.abs('+orient_state+'-v320ProtectedOrientation)>0.0000001d){ '+orient_state+'=v320ProtectedOrientation; v320OrientationDriftCorrectionCount++; }' if orient_state else '')
          engine=r'''\n    // V3.1/30.1 REAL CONTINUOUS EARTH ROTATION + V3.1/30.2 FRAME SYNCHRONISED + V3.1/30.3 DELTA TIME + V3.1/30.4 DEGREES-PER-SECOND GOVERNOR + V3.1/30.5 NEWSROOM DEFAULT + V3.1/30.6 IMMEDIATE FIRST MOVEMENT + V3.1/30.7 SINGLE LOOP OWNERSHIP + V3.1/30.8 LIFECYCLE AWARE START + V3.1/30.9 LIFECYCLE AWARE STOP + V3.1/30.10 AUTOMATIC POSITION PRESERVING RESTART + V3.1/30.11 TOUCH INTERRUPTION + V3.1/30.12 NO FIGHT WITH FINGER + V3.1/30.13 IDLE RESUME DELAY + V3.1/30.14 SMOOTH RESUME RAMP + V3.1/30.15 SMOOTH PAUSE RAMP + V3.1/30.16 LONGITUDE WRAPPING + V3.1/30.17 LONGITUDE NORMALIZATION + V3.1/30.18 LATITUDE PROTECTION + V3.1/30.19 ZOOM PRESERVATION + V3.1/30.20 ORIENTATION PRESERVATION + V3.1/30.21 SELECTION PRESERVATION + V3.1/30.22 CORRECT OBJECT REPROJECTION + V3.1/30.23 CORRECT LABEL REPROJECTION + V3.1/30.24 BACK SIDE VISIBILITY CLIPPING + V3.1/30.25 GLOBE LAYER SYNCHRONIZATION + V3.1/30.26 FRAME COALESCING + V3.1/30.27 ADAPTIVE FRAME PROTECTION + V3.1/30.28 BATTERY THERMAL PROTECTION + V3.1/30.29 ROTATION STALL WATCHDOG + V3.1/30.30 GLOBE MOTION FINAL ACCEPTANCE\n    private static final double V315_NEWSROOM_DEFAULT_DEG_PER_SECOND=1.20d;\n    private static final double V315_FULL_ROTATION_SECONDS=300.0d;\n    private static final double V31_DEFAULT_DEG_PER_SECOND=V315_NEWSROOM_DEFAULT_DEG_PER_SECOND;\n    private static final double V314_MIN_DEG_PER_SECOND=0.25d;\n    private static final double V314_MAX_DEG_PER_SECOND=12.0d;\n    private double v314RequestedDegPerSecond=V31_DEFAULT_DEG_PER_SECOND;\n    private double v314ActualDegPerSecond=V31_DEFAULT_DEG_PER_SECOND;\n    private boolean v31Running;\n    private long v31LastFrameNanos;\n    private long v313FrameCount,v313RejectedFrameCount,v313ClampedFrameCount;\n    private double v313IntegratedSeconds,v313IntegratedDegrees;\n    private long v316StartNanos,v316FirstMovementNanos;\n    private boolean v316FirstMovementApplied;\n    private long v317LoopGeneration;\n    private long v317Ac