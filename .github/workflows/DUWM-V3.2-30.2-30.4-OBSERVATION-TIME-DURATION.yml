              private static long acceptedObservationFingerprint(double lat,double lon,long effectiveAt) {
                  long h=23L;
                  h=37L*h+Double.doubleToLongBits(lat);
                  h=37L*h+Double.doubleToLongBits(normalizeLongitude(lon));
                  h=37L*h+effectiveAt;
                  return h;
              }

              private static long fingerprint(double lat,double lon,long at) {
                  long h=17L;
                  h=31L*h+Double.doubleToLongBits(lat);
                  h=31L*h+Double.doubleToLongBits(lon);
                  h=31L*h+at;
                  return h;
              }

              private static double normalizeTrack(double degrees) {
                  if(!Double.isFinite(degrees))return Double.NaN;
                  return ((degrees%360.0d)+360.0d)%360.0d;
              }

              private void classifyMovement(MotionState state) {
                  if(state==null)return;
                  MovementClassification c=MovementClassification.UNKNOWN;
                  String basis="NO_REPORTED_MOTION";
                  if(state.kind==Kind.AIRCRAFT) {
                      AircraftMotionProfile p=aircraftProfiles.get(state.stableId);
                      if(p!=null) {
                          if(p.phase==AircraftMotionPhase.GROUND && !p.airborne
                                  && Double.isFinite(p.reportedGroundSpeedMps)
                                  && p.reportedGroundSpeedMps==0.0d) {
                              c=MovementClassification.STATIONARY; basis="AIRCRAFT_REPORTED_ZERO_GROUND_SPEED";
                          } else if(Double.isFinite(p.reportedGroundSpeedMps) && p.reportedGroundSpeedMps>0.0d) {
                              c=MovementClassification.MOVING; basis="AIRCRAFT_REPORTED_GROUND_SPEED";
                          }
                      }
                  } else if(state.kind==Kind.VESSEL) {
                      VesselMotionProfile p=vesselProfiles.get(state.stableId);
                      if(p!=null) {
                          if((p.phase==VesselMotionPhase.MOORED||p.phase==VesselMotionPhase.ANCHORED)
                                  && Double.isFinite(p.reportedSpeedOverGroundMps)
                                  && p.reportedSpeedOverGroundMps==0.0d) {
                              c=MovementClassification.STATIONARY; basis="VESSEL_REPORTED_ZERO_SOG";
                          } else if(Double.isFinite(p.reportedSpeedOverGroundMps) && p.reportedSpeedOverGroundMps>0.0d) {
                              c=MovementClassification.MOVING; basis="VESSEL_REPORTED_SOG";
                          }
                      }
                  } else {
                      GenericMotionProfile p=genericProfiles.get(state.stableId);
                      if(p!=null) {
                          if(p.phase==GenericMotionPhase.STOPPED && Double.isFinite(p.reportedSpeedMps)
                                  && p.reportedSpeedMps==0.0d) {
                              c=MovementClassification.STATIONARY; basis="GENERIC_REPORTED_ZERO_SPEED";
                          } else if(p.phase==GenericMotionPhase.MOVING && Double.isFinite(p.reportedSpeedMps)
                                  && p.reportedSpeedMps>0.0d) {
                              c=MovementClassification.MOVING; basis="GENERIC_REPORTED_SPEED";
                          }
                      }
                  }
                  movementClassifications.put(state.stableId,new MovementClassificationSnapshot(
                          state.stableId,state.kind,c,basis,state.currentObservationRevision));
                  if(c==MovementClassification.STATIONARY)stationaryClassificationCount++;
                  else if(c==MovementClassification.MOVING)movingClassificationCount++;
                  else unknownClassificationCount++;
              }

              private static boolean frontHemisphere(double objectLat,double objectLon,
                                                            double centerLat,double centerLon) {
                  double p1=Math.toRadians(centerLat),p2=Math.toRadians(objectLat);
                  double dl=Math.toRadians(objectLon-centerLon);
                  double dot=Math.sin(p1)*Math.sin(p2)+Math.cos(p1)*Math.cos(p2)*Math.cos(dl);
                  return dot>=0.0d;
              }

              public synchronized boolean selectObject(String stableId,Kind kind) {
                  String id=canonicalIdentity(stableId,kind);
                  if(id==null||!states.containsKey(id))return false;
                  selectedStableId=id;
                  return true;
              }

              public synchronized void clearSelection() {
                  selectedStableId=null;
                  selectionClearCount++;
              }

              public synchronized SelectionMotionSnapshot selectionMotionState(String stableId,Kind kind) {
                  String id=canonicalIdentity(stableId,kind);
                  MotionState state=id==null?null:states.get(id);
                  return state==null?null:new SelectionMotionSnapshot(state,id.equals(selectedStableId));
              }

              public synchronized boolean selectedObjectSurvivesDisplayMotion(String stableId,Kind kind,
                                                                              double latitude,double longitude) {
                  String id=canonicalIdentity(stableId,kind);
                  boolean wasSelected=id!=null&&id.equals(selectedStableId);
                  boolean moved=applyLiveObjectDisplayMotion(stableId,kind,latitude,longitude);
                  if(wasSelected && moved && id.equals(selectedStableId))selectionPreservedMotionCount++;
                  return moved && (!wasSelected || id.equals(selectedStableId));
              }

              public synchronized HemisphereVisibilitySnapshot hemisphereVisibility(
                      String stableId,Kind kind,double globeCenterLatitude,double globeCenterLongitude) {
                  String id=canonicalIdentity(stableId,kind);
                  MotionState state=id==null?null:states.get(id);
                  if(state==null)return null;
                  HemisphereVisibility v=frontHemisphere(state.displayLatitude,state.displayLongitude,
                          globeCenterLatitude,globeCenterLongitude)
                          ?HemisphereVisibility.FRONT_VISIBLE:HemisphereVisibility.BACK_HIDDEN;
                  return new HemisphereVisibilitySnapshot(state,v);
              }

