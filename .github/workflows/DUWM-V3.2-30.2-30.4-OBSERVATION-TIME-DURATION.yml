belReprojectionFrameCount,v323LabelProjectionInvalidationCount;\n    private double v323LastLabelProjectionLongitude=Double.NaN;\n    private long v324FrontHemisphereCount,v324BackHemisphereCullCount;\n    private long v325RotationEpoch,v325LayerSyncFrameCount,v325LayerMismatchCount;\n    private boolean v326RedrawPending;\n    private long v326RedrawRequestCount,v326RedrawPostedCount,v326RedrawCoalescedCount,v326RedrawConsumedCount;\n    private static final double V327_SLOW_FRAME_SECONDS=0.028d;\n    private static final int V327_SLOW_STREAK_TO_THROTTLE=8;\n    private int v327SlowFrameStreak,v327RenderStride=1,v327StrideCounter;\n    private long v327ThrottledFrameCount,v327NormalFrameCount,v327RecoveryCount;\n    private int v328ThermalStatus=android.os.PowerManager.THERMAL_STATUS_NONE;\n    private boolean v328PowerSaveMode,v328ResourceConstrained;\n    private int v328ResourceRenderStride=1,v328ResourceStrideCounter;\n    private long v328ResourceThrottleCount,v328ResourceRecoveryCount;\n    private static final long V329_WATCHDOG_INTERVAL_MS=750L;\n    private static final double V329_MIN_PROGRESS_DEGREES=0.0005d;\n    private boolean v329WatchdogArmed;\n    private double v329LastObservedLongitude=Double.NaN;\n    private long v329CheckCount,v329StallCount,v329RecoveryCount,v329FalseAlarmAvoidCount;\n    private static final String V330_MOTION_RELEASE="V3.1/30.30";\n    private long v330AcceptedFrameCount;\n    private boolean v330MotionEngineReady;\n    private double v325FrameLongitude=Double.NaN,v325FrameLatitude=Double.NaN;\n    private double v325LayerLongitude(){ return v325FrameLongitude; }\n    private double v325LayerLatitude(){ return v325FrameLatitude; }\n    private long v325LayerEpoch(){ return v325RotationEpoch; }\n    private boolean v324IsFrontHemisphere(double objectLat,double objectLon,double centerLat,double centerLon){ double p1=Math.toRadians(centerLat),p2=Math.toRadians(objectLat),dl=Math.toRadians(objectLon-centerLon); double dot=Math.