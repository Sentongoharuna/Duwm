              /**
               * V3.2/30.2/30.2 PREVIOUS -> CURRENT ENDPOINT BINDING.
               * Interpolation endpoints are immutable copies of the two accepted real
               * observations. Display position can never become an endpoint source.
               */
              public static final class InterpolationEndpointSnapshot {
                  public final String stableId;
                  public final EndpointBinding binding;
                  public final double startLatitude;
                  public final double startLongitude;
                  public final double endLatitude;
                  public final double endLongitude;
                  public final long startTimeMillis;
                  public final long endTimeMillis;
                  public final long startSequence;
                  public final long endSequence;
                  InterpolationEndpointSnapshot(MotionState s,EndpointBinding binding) {
                      stableId=s.stableId; this.binding=binding;
                      ObservationSnapshot a=s.previousObservation,b=s.currentObservation;
                      startLatitude=a==null?Double.NaN:a.acceptedLatitude;
                      startLongitude=a==null?Double.NaN:a.acceptedLongitude;
                      endLatitude=b==null?Double.NaN:b.acceptedLatitude;
                      endLongitude=b==null?Double.NaN:b.acceptedLongitude;
                      startTimeMillis=a==null?-1L:a.observedAtMillis;
                      endTimeMillis=b==null?-1L:b.observedAtMillis;
                      startSequence=a==null?-1L:a.sequence;
                      endSequence=b==null?-1L:b.sequence;
                  }
              }

              public synchronized InterpolationEndpointSnapshot interpolationEndpoints(String stableId,Kind kind) {
                  String id=canonicalIdentity(stableId,kind);
                  MotionState state=id==null?null:states.get(id);
                  if(state==null)return null;
                  EndpointBinding binding=EndpointBinding.UNBOUND;
                  if(state.previousObservation!=null&&state.currentObservation!=null) {
                      binding=state.currentObservation.observedAtMillis>state.previousObservation.observedAtMillis
                              && state.currentObservation.sequence>state.previousObservation.sequence
                              ?EndpointBinding.BOUND_REAL_OBSERVATIONS:EndpointBinding.INVALID_ORDER;
                  }
                  return new InterpolationEndpointSnapshot(state,binding);
              }

              public static final class InterpolationFoundationSnapshot {
                  public final String stableId;
                  public final InterpolationState state;
                  public final long previousSequence;
                  public final long currentSequence;
                  public final long previousTimeMillis;
                  public final long currentTimeMillis;
                  public final boolean rawTruthImmutable;
                  public final boolean predictionDisabled;
                  InterpolationFoundationSnapshot(MotionState s,InterpolationState state) {
                      stableId=s.stableId;
                      this.state=state;
                      previousSequence=s.previousObservation==null?-1L:s.previousObservation.sequence;
                      currentSequence=s.currentObservation==null?-1L:s.currentObservation.sequence;
                      previousTimeMillis=s.previousObservation==null?-1L:s.previousObservation.observedAtMillis;
                      currentTimeMillis=s.currentObservation==null?-1L:s.currentObservation.observedAtMillis;
                      rawTruthImmutable=true;
                      predictionDisabled=true;
                  }
              }

              public synchronized InterpolationFoundationSnapshot interpolationFoundation(String stableId,Kind kind) {
                  String id=canonicalIdentity(stableId,kind);
                  MotionState state=id==null?null:states.get(id);
                  if(state==null)return null;
                  InterpolationState status=InterpolationState.IDLE;
                  if(state.previousObservation!=null&&state.currentObservation!=null) {
                      status=state.currentObservation.observedAtMillis>state.previousObservation.observedAtMillis
                              ?InterpolationState.READY_BETWEEN_REAL_OBSERVATIONS
                              :InterpolationState.BLOCKED;
                  }
                  return new InterpolationFoundationSnapshot(state,status);
              }

