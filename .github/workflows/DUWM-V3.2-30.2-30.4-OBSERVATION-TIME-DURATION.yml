              private static String canonicalIdentity(String stableId, Kind kind) {
                  if (stableId==null) return null;
                  String id=stableId.trim().toUpperCase(java.util.Locale.ROOT);
                  if (id.isEmpty()) return null;
                  String prefix=(kind==Kind.AIRCRAFT?"AIRCRAFT:":kind==Kind.VESSEL?"VESSEL:":"GENERIC:");
                  return prefix+id;
              }

              public synchronized boolean registerAlias(String alias, String stableId, Kind kind) {
                  String canonical=canonicalIdentity(stableId,kind);
                  if (alias==null || alias.trim().isEmpty() || canonical==null) return false;
                  String a=alias.trim().toUpperCase(java.util.Locale.ROOT);
                  String old=aliases.get(a);
                  if (old!=null && !old.equals(canonical)) { identityConflicts++; return false; }
                  aliases.put(a,canonical);
                  return true;
              }

              public synchronized boolean accept(String stableId, Kind kind, double latitude,
                                                 double longitude, long observedAtMillis) {
                  return acceptTimed(stableId,kind,latitude,longitude,observedAtMillis,
                          android.os.SystemClock.elapsedRealtime(),TimestampAuthority.SOURCE);
              }

              public synchronized boolean acceptTimed(String stableId, Kind kind, double latitude,
                                                 double longitude,long sourceObservedAtMillis,
                                                 long receivedAtMillis,TimestampAuthority authority) {
                  if(authority==null)authority=TimestampAuthority.UNKNOWN;
                  long effectiveAt=(authority==TimestampAuthority.SOURCE?sourceObservedAtMillis:receivedAtMillis);
                  if (stableId==null || stableId.trim().isEmpty()
                          || !Double.isFinite(latitude) || !Double.isFinite(longitude)
                          || latitude < -90.0d || latitude > 90.0d) {
                      rejectedObservations++;
                      invalidCoordinateRejectedCount++;
                      invalidCoordinatePreservedCurrentCount++;
                      return false;
                  }
                  String id=canonicalIdentity(stableId,kind);
                  if(id==null){ rejectedObservations++; return false; }
                  double lon=normalizeLongitude(longitude);
                  MotionState old=states.get(id);
                  if (old!=null) { identityReuses++;
                      if (effectiveAt < old.receivedAtMillis) {
                          rejectedObservations++;
                          outOfOrderRejectedCount++;
                          outOfOrderPreservedCurrentCount++;
                          return false;
                      }
                      if (effectiveAt==old.receivedAtMillis
                              && Double.compare(latitude,old.receivedLatitude)==0
                              && Double.compare(lon,old.receivedLongitude)==0) {
                          duplicateObservations++;
                          duplicateSameTimestampCount++;
                          duplicateSamePayloadCount++;
                          deduplicationPreservedRevisionCount++;
                          return false;
                      }
                  }
                  long sequence=++observationSequence;
                  MotionState next=new MotionState(id,kind,latitude,lon,sourceObservedAtMillis,receivedAtMillis,authority,sequence);
                  if(old!=null) {
                      next.previousObservation=old.currentObservation;
                      currentObservationReplacementCount++;
                  }
                  states.put(id,next);
                  if(authority==TimestampAuthority.SOURCE)sourceTimestampCount++;
                  else if(authority==TimestampAuthority.RECEIVE_TIME)receiveTimestampCount++;
                  else unknownTimestampCount++;
                  acceptedObservations++;
                  return true;
              }

              /**
               * V3.2/30.1/30.25 TELEPORT FLAG FOUNDATION.
               * Large observation-to-observation displacement is flagged for later
               * outlier handling. This stage does not delete, animate, or silently
               * accept/reject the observation based on distance alone.
               */
              public static final class TeleportAssessmentSnapshot {
                  public final String stableId;
                  public final TeleportAssessment assessment;
                  public final double distanceKm;
                  public final long elapsedMillis;
                  public final double impliedSpeedMps;
                  public final long observationRevision;
                  TeleportAssessmentSnapshot(String id,TeleportAssessment a,double km,long elapsed,
                                             double speed,long revision) {
                      stableId=id; assessment=a; distanceKm=km; elapsedMillis=elapsed;
                      impliedSpeedMps=speed; observationRevision=revision;
                  }
              }

              /**
               * V3.2/30.1/30.24 INVALID COORDINATE REJECTION.
               * Invalid geographic input is rejected before it can replace current truth,
               * alter display state, or enter projection.
               */
              public static final class CoordinateValidationSnapshot {
                  public final CoordinateValidation validation;
                  public final double inputLatitude;
                  public final double inputLongitude;
                  public final double normalizedLongitude;
                  CoordinateValidationSnapshot(CoordinateValidation v,double lat,double lon) {
                      validation=v; inputLatitude=lat; inputLongitude=lon;
                      normalizedLongitude=(v==CoordinateValidation.VALID?normalizeLongitude(lon):Double.NaN);
                  }
              }

              private static double geographicDistanceKm(double lat1,double lon1,double lat2,double lon2) {
                  final double r=6371.0088d;
                  double p1=Math.toRadians(lat1),p2=Math.toRadians(lat2);
                  double dp=Math.toRadians(lat2-lat1),dl=Math.toRadians(lon2-lon1);
                  double a=Math.sin(dp/2.0d)*Math.sin(dp/2.0d)
                          +Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2.0d)*Math.sin(dl/2.0d);
                  return r*2.0d*Math.atan2(Math.sqrt(a),Math.sqrt(Math.max(0.0d,1.0d-a)));
              }

              public synchronized TeleportAssessmentSnapshot assessTeleport(String stableId,Kind kind) {
                  String id=canonicalIdentity(stableId,kind);
                  MotionState state=id==null?null:states.get(id);
                  if(state==null||state.previousObservation==null||state.currentObservation==null)
                      return state==null?null:new TeleportAssessmentSnapshot(id,TeleportAssessment.NOT_ASSESSED,
                              Double.NaN,0L,Double.NaN,state.currentObservationRevision);
                  ObservationSnapshot a=state.previousObservation,b=state.currentObservation;
                  long elapsed=b.observedAtMillis-a.observedAtMillis;
                  double km=geographicDistanceKm(a.acceptedLatitude,a.acceptedLongitude,
                          b.acceptedLatitude,b.acceptedLongitude);
                  double speed=elapsed>0L?(km*1000.0d)/(elapsed/1000.0d):Double.POSITIVE_INFINITY;
                  TeleportAssessment result=(elapsed<=0L||speed>V325_TELEPORT_FOUNDATION_SPEED_MPS)
                          ?TeleportAssessment.TELEPORT_SUSPECT:TeleportAssessment.NORMAL_DISPLACEMENT;
                  teleportAssessmentCount++;
                  if(result==TeleportAssessment.TELEPORT_SUSPECT)teleportSuspectCount++;
                  return new TeleportAssessmentSnapshot(id,result,km,elapsed,speed,state.currentObservationRevision);
              }

              public synchronized long teleportAssessmentCount(){return teleportAssessmentCount;}
              public synchronized long teleportSuspectCount(){return teleportSuspectCount;}

              public synchronized CoordinateValidationSnapshot validateCoordinates(
                      String stableId,double latitude,double longitude) {
                  CoordinateValidation v;
                  if(stableId==null||stableId.trim().isEmpty())v=CoordinateValidation.INVALID_ID;
                  else if(!Double.isFinite(latitude)||!Double.isFinite(longitude))v=CoordinateValidation.NON_FINITE;
                  else if(latitude < -90.0d || latitude > 90.0d)v=CoordinateValidation.LATITUDE_OUT_OF_RANGE;
                  else v=CoordinateValidation.VALID;
                  return new CoordinateValidationSnapshot(v,latitude,longitude);
              }

