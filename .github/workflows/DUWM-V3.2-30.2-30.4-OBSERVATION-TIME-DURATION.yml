          echo "V3.2 30.1 ORIGINAL UI + MOTION FOUNDATION FREEZE PASS"

      - name: V3.1 marker projection integration gate
        shell: bash
        run: |
          set -euo pipefail
          MAP="$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom/SatelliteMapView.java"
          ENG="$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom/LiveObjectMotionEngine.java"
          test -s "$MAP"; test -s "$ENG"
          grep -Fq "v322InvalidateGeographicProjection" "$MAP"
          grep -Fq "v322ReprojectionFrameCount" "$MAP"
          grep -Fq "MarkerReprojectionSnapshot" "$ENG"
          grep -Fq "LabelReprojectionSnapshot" "$ENG"
          grep -Fq "v323LabelReprojectionFrameCount" "$MAP"
          grep -Fq "v324IsFrontHemisphere" "$MAP"
          grep -Fq "HemisphereVisibilitySnapshot" "$ENG"
          grep -Fq "V31_GEOGRAPHIC_PROJECTION" "$ENG"
          echo "V3.1 + V3.2 MARKER REPROJECTION INTEGRATION PASS"

      - name: V3.1 plus V3.2 lifecycle compatibility gate
        shell: bash
        run: |
          set -euo pipefail
          MAP="$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom/SatelliteMapView.java"
          ENG="$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom/LiveObjectMotionEngine.java"
          grep -Fq "v318CanRotate" "$MAP"
          grep -Fq "V319_STOP_DETACHED" "$MAP"
          grep -Fq "setLifecycle" "$ENG"
          grep -Fq "PAUSED_DETACHED" "$ENG"
          echo "V3.1 + V3.2 LIFECYCLE COMPATIBILITY PASS"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true
      - name: Compile
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac --stacktrace
      - name: Build APK
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace
      - name: Stage APK
        run: |
          mapfile -t A < <(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | sort)
          test "${#A[@]}" -eq 1; test -s "${A[0]}"
          mkdir -p "$RUNNER_TEMP/release"
          cp "${A[0]}" "$RUNNER_TEMP/release/DUWM-V3.2-30.1-30.7-V3.2-30.2-30.4-OBSERVATION-TIME-DURATION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: DUWM-V3.2-30.1-30.7-V3.2-30.2-30.4-OBSERVATION-TIME-DURATION-APK
          path: ${{ runner.temp }}/release/DUWM-V3.2-30.1-30.7-V3.2-30.2-30.4-OBSERVATION-TIME-DURATION.apk
          if-no-files-found: error
