              public synchronized long fleetFrameCount(){return fleetFrameCount;}
              public synchronized long fleetPeakTrackedObjects(){return fleetPeakTrackedObjects;}

              public synchronized MotionState get(String stableId) {
                  if(stableId==null)return null;
                  String raw=stableId.trim().toUpperCase(java.util.Locale.ROOT);
                  MotionState direct=states.get(raw);
                  if(direct!=null)return direct;
                  String canonical=aliases.get(raw);
                  return canonical==null?null:states.get(canonical);
              }
              public synchronized MotionState get(String stableId, Kind kind) { return states.get(canonicalIdentity(stableId,kind)); }
              public synchronized MotionStateSnapshot motionState(String stableId, Kind kind) {
                  MotionState state=states.get(canonicalIdentity(stableId,kind));
                  return state==null?null:new MotionStateSnapshot(state);
              }

              public synchronized ObservationSnapshot previousObservation(String stableId, Kind kind) {
                  MotionState state=states.get(canonicalIdentity(stableId,kind));
                  return state==null?null:state.previousObservation;
              }
              public synchronized ObservationSnapshot currentObservation(String stableId, Kind kind) {
                  MotionState state=states.get(canonicalIdentity(stableId,kind));
                  return state==null?null:state.currentObservation;
              }
              public synchronized long currentObservationRevision(String stableId, Kind kind) {
                  MotionState state=states.get(canonicalIdentity(stableId,kind));
                  return state==null?-1L:state.currentObservationRevision;
              }
              public synchronized boolean currentObservationIntact(String stableId, Kind kind) {
                  MotionState state=states.get(canonicalIdentity(stableId,kind));
                  if(state==null||state.currentObservation==null)return false;
                  ObservationSnapshot o=state.currentObservation;
                  return o.fingerprint==fingerprint(o.rawLatitude,o.rawLongitude,o.observedAtMillis)
                          && o.sequence==state.currentObservationRevision;
              }
              public synchronized long currentObservationReplacementCount(){ return currentObservationReplacementCount; }
              public synchronized long sourceTimestampCount(){ return sourceTimestampCount; }
              public synchronized long receiveTimestampCount(){ return receiveTimestampCount; }
              public synchronized long unknownTimestampCount(){ return unknownTimestampCount; }

              public synchronized DisplayPositionSnapshot displayPosition(String stableId, Kind kind) {
                  MotionState state=states.get(canonicalIdentity(stableId,kind));
                  return state==null?null:new DisplayPositionSnapshot(state);
              }

              /**
               * Rendering-only update. It never edits received/raw coordinates.
               * 30.4 does not interpolate yet; later stages may drive this method.
               */
              public synchronized boolean setDisplayPosition(String stableId, Kind kind,
                                                             double latitude, double longitude) {
                  if(!Double.isFinite(latitude)||!Double.isFinite(longitude)
                          || latitude < -90.0d || latitude > 90.0d) return false;
                  MotionState state=states.get(canonicalIdentity(stableId,kind));
                  if(state==null)return false;
                  state.displayLatitude=latitude;
                  state.displayLongitude=normalizeLongitude(longitude);
                  state.displayRevision++;
                  return rawPositionIntact(stableId,kind);
              }

              public synchronized boolean resetDisplayToReceived(String stableId, Kind kind) {
                  MotionState state=states.get(canonicalIdentity(stableId,kind));
                  if(state==null)return false;
                  state.displayLatitude=state.receivedLatitude;
                  state.displayLongitude=state.receivedLongitude;
                  state.displayRevision++;
                  return rawPositionIntact(stableId,kind);
              }

              public synchronized RawPositionSnapshot rawPosition(String stableId, Kind kind) {
                  MotionState state=states.get(canonicalIdentity(stableId,kind));
                  return state==null?null:new RawPositionSnapshot(state);
              }
              public synchronized boolean rawPositionIntact(String stableId, Kind kind) {
                  MotionState state=states.get(canonicalIdentity(stableId,kind));
                  return state!=null && state.rawObservationFingerprint==
                          fingerprint(state.rawReceivedLatitude,state.rawReceivedLongitude,state.receivedAtMillis);
              }
              public synchronized long identityReuseCount(){ return identityReuses; }
              public synchronized long identityConflictCount(){ return identityConflicts; }
              public synchronized List<MotionState> snapshot() {
                  return Collections.unmodifiableList(new ArrayList<>(states.values()));
              }
              public synchronized int trackedCount() { return states.size(); }
              public synchronized long acceptedCount() { return acceptedObservations; }
              public synchronized long rejectedCount() { return rejectedObservations; }
              public synchronized long duplicateCount() { return duplicateObservations; }
              public synchronized long duplicateSameTimestampCount(){return duplicateSameTimestampCount;}
              public synchronized long duplicateSamePayloadCount(){return duplicateSamePayloadCount;}
              public synchronized long deduplicationPreservedRevisionCount(){return deduplicationPreservedRevisionCount;}
              public synchronized long frameTickCount() { return frameTicks; }

              static double normalizeLongitude(double lon) {
                  return ((lon+180.0d)%360.0d+360.0d)%360.0d-180.0d;
              }
