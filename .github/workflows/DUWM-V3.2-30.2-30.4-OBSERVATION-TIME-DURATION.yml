      - name: V3.2 30.2 30.4 observation time duration acceptance
        shell: bash
        run: |
          python3 - <<'PY'
          def duration(start,end):
              return None if end<=start else end-start

          assert duration(1000,2000)==1000
          assert duration(1000,11000)==10000
          assert duration(2000,2000) is None
          assert duration(3000,2000) is None

          # Duration is source-time based and identical regardless of display refresh.
          start,end=10_000,15_000
          expected=5000
          for hz in (30,60,90,120,144):
              frames=round((expected/1000)*hz)
              assert duration(start,end)==5000
              assert frames>0

          # Network receive delay does not alter a SOURCE-authoritative interval.
          previous_source=1000; current_source=4000
          previous_receive=5000; current_receive=9000
          assert duration(previous_source,current_source)==3000
          assert duration(previous_receive,current_receive)==4000
          assert duration(previous_source,current_source)!=duration(previous_receive,current_receive)

          print("V3.2/30.2/30.4 OBSERVATION TIME DURATION FUNCTIONAL ACCEPTANCE PASS")
          PY

