              public synchronized long sharedClockObjectVisitCount(){return sharedClockObjectVisitCount;}
              public synchronized long perObjectClockCount(){return perObjectClockCount;}
              public synchronized FleetProcessingPolicy fleetProcessingPolicy(){
                  return FleetProcessingPolicy.SINGLE_PASS_BOUNDED_BATCHES;
              }
