name: DUWM 1.2-20-4-19A-4-19 FIX6 APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [".github/workflows/DUWM-1-2-20-4-19A-4-19-FIX6-APK.yml", "DUWM-1-2-20-4-19A-4-19-FIX6-SOURCE.tar.gz"]
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source
        run: echo "ee8cc7a383fe0dd147527dfb9a8042c7056eb9fd2d44de7906777a617e79ebf7  DUWM-1-2-20-4-19A-4-19-FIX6-SOURCE.tar.gz" | sha256sum -c -
      - name: Extract
        run: |
          mkdir -p "$RUNNER_TEMP/duwm"
          tar -xzf DUWM-1-2-20-4-19A-4-19-FIX6-SOURCE.tar.gz -C "$RUNNER_TEMP/duwm"
          echo "PROJECT_DIR=$RUNNER_TEMP/duwm/world-situation-room-native-1-2-20-4-19A-4-19-FIX6" >> "$GITHUB_ENV"
      - name: FIX6 incident generic contract gate
        run: chmod +x "$PROJECT_DIR/scripts/"*.sh && "$PROJECT_DIR/scripts/verify-1-2-20-4-19A-4-19-fix6-incident-map-contract.sh" "$PROJECT_DIR"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true
      - name: Compile
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac --stacktrace
      - name: Lint
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:lintDebug --stacktrace
      - name: Assemble
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace
      - name: Stage exactly one APK
        run: |
          mapfile -t APKS < <(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk")
          test "${#APKS[@]}" -eq 1
          test -s "${APKS[0]}"
          test "$(head -c 2 "${APKS[0]}")" = "PK"
          mkdir -p "$RUNNER_TEMP/release"
          cp "${APKS[0]}" "$RUNNER_TEMP/release/DUWM-1-2-20-4-19A-4-19-FIX6.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: DUWM-1-2-20-4-19A-4-19-FIX6-APK
          path: ${{ runner.temp }}/release/DUWM-1-2-20-4-19A-4-19-FIX6.apk
          if-no-files-found: error
