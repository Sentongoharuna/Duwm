name: "DUWM 1728.2/8 | Clean camera + shared professional broadcast"
run-name: "DUWM 1728.2/8 | Compile and test real native broadcast export"
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/DUWM-1728.2-8-PRO-BROADCAST-APK.yml'
      - 'DUWM-1728.2-8-PRO-BROADCAST-SOURCE.zip'
permissions:
  contents: read
concurrency:
  group: duwm-172828-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout existing original repository
        uses: actions/checkout@v4
      - name: Restore exact audited project
        shell: bash
        run: |
          set -euo pipefail
          echo '144baab2e1a066af19d548c8a7b8e610719a15e77441f57c5efe9cee9b8754fd  DUWM-1728.2-8-PRO-BROADCAST-SOURCE.zip' | sha256sum --check
          unzip -t DUWM-1728.2-8-PRO-BROADCAST-SOURCE.zip | tail -n 1
          mkdir -p "$RUNNER_TEMP/duwm172828"
          unzip -q DUWM-1728.2-8-PRO-BROADCAST-SOURCE.zip -d "$RUNNER_TEMP/duwm172828"
          echo "PROJECT=$RUNNER_TEMP/duwm172828/DUWM-1728-2-8-ANDROID-SOURCE" >> "$GITHUB_ENV"
      - name: Check every packaged source file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_HASH'
          import pathlib,os,json,hashlib
          root=pathlib.Path(os.environ['PROJECT']).resolve()
          expected=json.loads((root/'1728_2_8_SOURCE_SHA256.json').read_text())
          for name,sha in expected.items():
              p=(root/name).resolve()
              assert p.is_relative_to(root) and p.is_file(),name
              assert hashlib.sha256(p.read_bytes()).hexdigest()==sha,name
          print('PASS',len(expected),'packaged source hashes')
          PY_HASH
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute shared renderer, privacy, state and server contract tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python -m pip install -r ai-production-server/requirements-test.txt
          python verification/check_source.py
          python verification/check_1728_2_8.py
          python -m pytest -q ai-production-server/test_server.py
          mkdir -p "$RUNNER_TEMP/duwm-parser"
          javac -d "$RUNNER_TEMP/duwm-parser" verification/JavaSyntaxCheck.java
          java -cp "$RUNNER_TEMP/duwm-parser" JavaSyntaxCheck
          java -cp "$RUNNER_TEMP/duwm-parser" JavaSyntaxCheck app/src/androidTest/java
      - name: Publish scoped host-render evidence
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-1728.2-8-HOST-RENDER-TESTS-NOT-PHONE
          path: ${{ env.PROJECT }}/verification/results/1728_2_8/
          if-no-files-found: error
          retention-days: 30
      - name: Ensure Android SDK and signing tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$MANAGER"
          if [ ! -s "$SDK/platforms/android-36/android.jar" ] || [ ! -x "$SDK/build-tools/36.0.0/apksigner" ]; then
            timeout 600 "$MANAGER" --sdk_root="$SDK" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          fi
          test -s "$SDK/platforms/android-36/android.jar"
          test -x "$SDK/build-tools/36.0.0/aapt"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: Optional retained debug signing key
        shell: bash
        env:
          SAVED_KEY: ${{ secrets.DUWM_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$SAVED_KEY" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$SAVED_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          else
            echo 'No retained debug keystore supplied. Existing installations may have a different signer; preserve private drafts.'
          fi
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Compile actual application and native Android tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          gradle --no-daemon --no-configuration-cache :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          mkdir -p "$RUNNER_TEMP/duwm-apk" "$RUNNER_TEMP/duwm-native-test"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/duwm-apk/DUWM-1728.2-8-PRO-BROADCAST.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/duwm-native-test/DUWM-native-tests.apk"
          cp 1728_2_8_BUILD_NOTES.md 1728_2_8_ACCEPTANCE.json "$RUNNER_TEMP/duwm-apk/"
      - name: Verify actual APK identity, signature and compiled components
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_APK'
          import os,pathlib,zipfile,subprocess,hashlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'duwm-apk'
          apk=out/'DUWM-1728.2-8-PRO-BROADCAST.apk'
          assert apk.stat().st_size>150000
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
              for token in (b'SatelliteMapView',b'Duwm1718MonitorsCamActivity',b'Duwm1728BroadcastLayout',b'Duwm1728BroadcastCanvas',b'Duwm1728EglVideoPipe',b'Duwm1728AiProductionClient',b'Duwm1728VideoEditorActivity'):
                  assert token in dex,token
          tools=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
          subprocess.run([str(tools/'apksigner'),'verify','--verbose',str(apk)],check=True)
          text=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(apk)],text=True)
          for token in ("versionCode='172808'","versionName='1728.2.8'","name='com.sentongoharuna.worldsituationroom.rb2live25'","application-label:'DUWM 1728.2/8 • DEVELOP.UGANDA'"):
              assert token in text,token
          (out/'APK-IDENTITY.txt').write_text(text)
          (out/'SHA256SUMS.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  '+apk.name+'\n')
          print('Compiled development APK. AI inference, physical camera and native export are separate gates.')
          PY_APK
      - name: Publish compiled development APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-1728.2-8-COMPILED-DEVELOPMENT-APK
          path: ${{ runner.temp }}/duwm-apk/
          if-no-files-found: error
          retention-days: 30
      - name: Publish Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-1728.2-8-NATIVE-TEST-APK
          path: ${{ runner.temp }}/duwm-native-test/
          if-no-files-found: error
          retention-days: 30
      - name: Retain compilation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-1728.2-8-BUILD-DIAGNOSTICS
          path: |
            ${{ env.PROJECT }}/app/build/reports/
            ${{ env.PROJECT }}/build/reports/
          if-no-files-found: warn
  native-broadcast-tests:
    needs: compile-development
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Java 17 for Android emulator tooling
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download compiled application
        uses: actions/download-artifact@v4
        with:
          name: DUWM-1728.2-8-COMPILED-DEVELOPMENT-APK
          path: apk
      - name: Download native test APK
        uses: actions/download-artifact@v4
        with:
          name: DUWM-1728.2-8-NATIVE-TEST-APK
          path: tests
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Prepare persistent native test and evidence script
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/duwm-native.sh" <<'NATIVE'
          #!/usr/bin/env bash
          set -euo pipefail
          PKG=com.sentongoharuna.worldsituationroom.rb2live25
          mkdir -p native-evidence
          collect() {
            adb logcat -d -s AndroidRuntime:E > native-evidence/ANDROID-RUNTIME.txt || true
            adb exec-out run-as "$PKG" tar -C files -cf - broadcast-native-proof > native-evidence/proof.tar || true
            if tar -tf native-evidence/proof.tar >/dev/null 2>&1; then
              tar -xf native-evidence/proof.tar -C native-evidence
            fi
          }
          trap collect EXIT
          adb install -r apk/DUWM-1728.2-8-PRO-BROADCAST.apk
          adb install -r tests/DUWM-native-tests.apk
          adb logcat -c
          adb shell am instrument -w -r "$PKG.test/com.sentongoharuna.worldsituationroom.DuwmSignalInstrumentation" | tee native-evidence/INSTRUMENTATION.txt
          grep -q 'DUWM_NATIVE_BROADCAST_PASS' native-evidence/INSTRUMENTATION.txt
          ! grep -q 'DUWM_NATIVE_BROADCAST_FAIL' native-evidence/INSTRUMENTATION.txt
          NATIVE
          chmod +x "$RUNNER_TEMP/duwm-native.sh"
          bash -n "$RUNNER_TEMP/duwm-native.sh"
      - name: Required Android Canvas and real EGL/MP4 export tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash "$RUNNER_TEMP/duwm-native.sh"
      - name: Publish actual native evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-1728.2-8-NATIVE-EXPORT-EVIDENCE
          path: native-evidence/
          if-no-files-found: warn
          retention-days: 30
