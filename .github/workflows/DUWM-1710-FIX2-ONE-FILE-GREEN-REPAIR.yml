name: "DUWM 1710 FIX2 | Self-contained recovery of unobstructed original globe"
run-name: "DUWM 1710 FIX2 | Recover actual 1710 source, compile and verify globe"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/DUWM-1710-FIX2-ONE-FILE-GREEN-REPAIR.yml'
permissions:
  contents: read
concurrency:
  group: duwm-1710-fix2-one-file-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout GitHub verified 1709 baseline ZIP
        uses: actions/checkout@v4
      - name: Reconstruct exact 1710 FIX1 source from verified green 1709 base
        shell: bash
        run: |
          set -euo pipefail
          # Do not depend on an additional ZIP upload. The 1709 ZIP is already on GitHub.
          echo 'acf9503bb8d8c5764c16910a14c68045a289a0df52dab49cd91ed3f8bb790cbb  DUWM-1709-SECTOR-OUTLINES-SOURCE.zip' | sha256sum --check
          unzip -t 'DUWM-1709-SECTOR-OUTLINES-SOURCE.zip' | tail -n 1
          mkdir -p "$RUNNER_TEMP/duwm1710"
          unzip -q 'DUWM-1709-SECTOR-OUTLINES-SOURCE.zip' -d "$RUNNER_TEMP/duwm1710"
          mv "$RUNNER_TEMP/duwm1710/DUWM-1709-ANDROID-SOURCE" "$RUNNER_TEMP/duwm1710/DUWM-1710-ANDROID-SOURCE"
          PROJECT="$RUNNER_TEMP/duwm1710/DUWM-1710-ANDROID-SOURCE"
          echo 'Reconstructing actual 1710 FIX1 Java, layouts, tests and resources from embedded compressed delta.'
