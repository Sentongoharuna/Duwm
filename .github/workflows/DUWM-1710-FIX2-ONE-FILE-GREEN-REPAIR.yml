      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK API 36 and signing tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          test -n "$SDK_MANAGER" && test -x "$SDK_MANAGER"
          if [ ! -f "$SDK_ROOT/platforms/android-36/android.jar" ] || [ ! -x "$SDK_ROOT/build-tools/36.0.0/apksigner" ]; then
            timeout 600 "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          fi
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt"
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Check original globe, uniform 19-desk UI and real data features
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python3 verification/check_source.py
          python3 verification/check_1710.py
          python3 verification/check_1710_ui_fix1.py
          python3 verification/check_1708_navy.py
          mkdir -p "$RUNNER_TEMP/duwm1710-parser"
          javac -d "$RUNNER_TEMP/duwm1710-parser" verification/JavaSyntaxCheck.java
          java -cp "$RUNNER_TEMP/duwm1710-parser" JavaSyntaxCheck
      - name: Compile Build 1710 Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          gradle --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p "$RUNNER_TEMP/duwm1710-output"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/duwm1710-output/DUWM-1710.apk"
      - name: Verify signed 1710 APK, real source timeline and original single globe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAPK'
          import hashlib,os,subprocess,zipfile
          from pathlib import Path
          apk=Path(os.environ['RUNNER_TEMP'])/'duwm1710-output/DUWM-1710.apk'
          assert apk.is_file() and apk.stat().st_size>150000
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              dex=b''.join(z.read(k) for k in z.namelist() if k.startswith('classes') and k.endswith('.dex'))
              for token in [b'MainActivity',b'SatelliteMapView',b'Duwm1687WorkspaceActivity',
                            b'GevMarineActivity',b'Duwm1166NewsDeskActivity',b'MediaDeskActivity',
                            b'set1702SourceLens',b'show1702SourceLensPicker',b'markerPriority1702', b'build1703WorldWatchPanel',
                            b'show1703WorldWatch', b'collect1703WorldWatch', b'open1703WatchSignal', b'filter1704WorldWatch', b'show1704Receipt', b'show1704GroupPicker', b'show1704SortPicker', b'matches1705Evidence', b'matches1705SourceRegion', b'show1705EvidencePicker', b'show1705RegionPicker', b'render1705Pulse', b'count1705Category',
                            b'SignalTickerRailView', b'DuwmUnifiedTheme', b'Duwm1709SectorOutline', b'SECTOR_COLORS',
                            b'Duwm1710SourceWaveView', b'draw1710EvidenceSignalGlow',
                            b'set1710Observations', b'NO OBSERVATIONS IN WINDOW',
                            b'frameNativePage', b'sync1710ClearGlobeStage', b'add1710QuickAction', b'draw1705ReceivedFixLines',
                            b'draw1705SourceLightBeacons', b'draw1706SourceActivityHalo',
                            b'show1706SignalConsole', b'show1706TickerSpeed', b'set1706Channel', b'set1706Speed']:
                  assert token in dex,'Missing compiled feature: '+str(token)
          sdk=Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
          subprocess.run([str(sdk/'apksigner'),'verify','--verbose',str(apk)],check=True)
          badge=subprocess.check_output([str(sdk/'aapt'),'dump','badging',str(apk)],text=True)
          for expected in ["versionCode='171001'", "versionName='1710'",
                           "name='com.sentongoharuna.worldsituationroom.rb2live25'",
                           "application-label:'DUWM 1710 FIX1 • DEVELOP.UGANDA'"]:
              assert expected in badge,(expected,badge[:900])
          (apk.parent/'SHA256SUMS.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  '+apk.name+'\n')
          print('PASS actual compiled 1710 FIX1 APK identity, WORLD WATCH newsroom, signature and intact original globe')
          PYAPK
      - name: Publish compiled APK separately before emulator launch verification
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-1710-FIX2-COMPILED-APK-UNVERIFIED
          path: ${{ runner.temp }}/duwm1710-output/DUWM-1710.apk
          retention-days: 30
          if-no-files-found: error
      - name: Allow Linux KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm || { echo 'KVM unavailable on GitHub runner' >&2; exit 1; }
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Write persistent bash script for emulator installation and launch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/duwm1710-launch.sh" <<'LAUNCH'
          #!/usr/bin/env bash
          set -euo pipefail
          APK="${RUNNER_TEMP:?}/duwm1710-output/DUWM-1710.apk"
          PKG='com.sentongoharuna.worldsituationroom.rb2live25'
          test -s "$APK" && [[ "$APK" == *.apk ]]
          adb wait-for-device
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb install -r "$APK"
          adb logcat -c
          adb shell am start -W -n "$PKG/com.sentongoharuna.worldsituationroom.MainActivity"
          sleep 20
          adb shell pidof "$PKG" >/dev/null
          adb exec-out screencap -p > "${RUNNER_TEMP}/duwm1710-output/01-ORIGINAL-GLOBE.png"
          test -s "${RUNNER_TEMP}/duwm1710-output/01-ORIGINAL-GLOBE.png"
          adb logcat -d -s AndroidRuntime:E > "${RUNNER_TEMP}/duwm1710-output/02-RUNTIME-ERRORS.txt" || true
          if grep -q 'FATAL EXCEPTION' "${RUNNER_TEMP}/duwm1710-output/02-RUNTIME-ERRORS.txt"; then
            cat "${RUNNER_TEMP}/duwm1710-output/02-RUNTIME-ERRORS.txt" >&2
            exit 1
          fi
          echo 'PASS original globe installed and launched; actual 1710 FIX1 source recovered and tested in emulator'
          LAUNCH
          chmod +x "$RUNNER_TEMP/duwm1710-launch.sh"
          bash -n "$RUNNER_TEMP/duwm1710-launch.sh"
      - name: Android emulator - install and launch original single globe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          script: bash "$RUNNER_TEMP/duwm1710-launch.sh"
      - name: Publish emulator-verified Build 1710 FIX2 APK and screenshot
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-1710-FIX2-VERIFIED-APK-AND-GLOBE
          path: ${{ runner.temp }}/duwm1710-output/
          retention-days: 30
          if-no-files-found: error
