          cat > "$PKG/LiveObjectMotionEngine.java" <<'JAVA'
          package com.sentongoharuna.worldsituationroom;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;

          /**
           * V3.2/30.1/30.1 SINGLE LIVE MOTION ENGINE.
           * One authoritative registry/frame owner for moving live geographic objects.
           * This foundation does not predict, interpolate, or manufacture coordinates.
           */
          public final class LiveObjectMotionEngine {
              public enum Kind { AIRCRAFT, VESSEL, GENERIC }
              public enum Truth { RECEIVED, UNKNOWN }
              public enum TimestampAuthority { SOURCE, RECEIVE_TIME, UNKNOWN }

              public static final class MotionState {
                  public final String stableId;
                  public final Kind kind;
                  public final double receivedLatitude;
                  public final double receivedLongitude;
                  public final double rawReceivedLatitude;
                  public final double rawReceivedLongitude;
                  public final long receivedAtMillis;
                  public final Truth truth;
                  public final long rawObservationFingerprint;
                  private double displayLatitude;
                  private double displayLongitude;
                  private long displayRevision;
                  private ObservationSnapshot previousObservation;
                  private ObservationSnapshot currentObservation;
                  private long currentObservationRevision;

                  MotionState(String id, Kind kind, double lat, double lon,long sourceAt,long receiveAt,TimestampAuthority authority,long sequence) {
                      this.stableId=id;
                      this.kind=kind==null?Kind.GENERIC:kind;
                      this.rawReceivedLatitude=lat;
                      this.rawReceivedLongitude=lon;
                      this.receivedLatitude=lat;
                      this.receivedLongitude=normalizeLongitude(lon);
                      this.receivedAtMillis=(authority==TimestampAuthority.SOURCE?sourceAt:receiveAt);
                      this.truth=Truth.RECEIVED;
                      this.rawObservationFingerprint=fingerprint(lat,lon,at);
                      this.displayLatitude=this.receivedLatitude;
                      this.displayLongitude=this.receivedLongitude;
                      this.displayRevision=0L;
                      this.previousObservation=null;
                      this.currentObservation=new ObservationSnapshot(lat,lon,this.receivedLatitude,this.receivedLongitude,sourceAt,receiveAt,authority,sequence);
                      this.currentObservationRevision=sequence;
                  }
              }

              public static final class ObservationSnapshot {
                  public final double rawLatitude;
                  public final double rawLongitude;
                  public final double acceptedLatitude;
                  public final double acceptedLongitude;
                  public final long observedAtMillis;
                  public final long sourceObservedAtMillis;
                  public final long receivedAtMillis;
                  public final TimestampAuthority timestampAuthority;
                  public final long fingerprint;
                  public final long sequence;
                  ObservationSnapshot(double rawLat,double rawLon,double acceptedLat,double acceptedLon,long sourceAt,long receiveAt,TimestampAuthority authority,long seq) {
                      rawLatitude=rawLat;
                      rawLongitude=rawLon;
                      acceptedLatitude=acceptedLat;
                      acceptedLongitude=acceptedLon;
                      sourceObservedAtMillis=sourceAt;
                      receivedAtMillis=receiveAt;
                      timestampAuthority=authority;
                      observedAtMillis=(authority==TimestampAuthority.SOURCE?sourceAt:receiveAt);
                      fingerprint=fingerprint(rawLat,rawLon,observedAtMillis);
                      sequence=seq;
                  }
              }

              public static final class DisplayPositionSnapshot {
                  public final String stableId;
                  public final double latitude;
                  public final double longitude;
                  public final long revision;
                  public final Truth sourceTruth;
                  DisplayPositionSnapshot(MotionState s) {
                      stableId=s.stableId;
                      latitude=s.displayLatitude;
                      longitude=s.displayLongitude;
                      revision=s.displayRevision;
                      sourceTruth=s.truth;
                  }
              }

              public static final class RawPositionSnapshot {
                  public final String stableId;
                  public final double latitude;
                  public final double longitude;
                  public final long observedAtMillis;
                  public final long fingerprint;
                  RawPositionSnapshot(MotionState s) {
                      stableId=s.stableId;
                      latitude=s.rawReceivedLatitude;
                      longitude=s.rawReceivedLongitude;
                      observedAtMillis=s.receivedAtMillis;
                      fingerprint=s.rawObservationFingerprint;
                  }
              }

              private final LinkedHashMap<String, MotionState> states = new LinkedHashMap<>();
              private final LinkedHashMap<String, String> aliases = new LinkedHashMap<>();
              private long identityReuses;
              private long identityConflicts;
              private long acceptedObservations;
              private long rejectedObservations;
              private long duplicateObservations;
              private long frameTicks;
              private long observationSequence;
              private long currentObservationReplacementCount;
              private long sourceTimestampCount,receiveTimestampCount,unknownTimestampCount;

              private static long fingerprint(double lat,double lon,long at) {
                  long h=17L;
                  h=31L*h+Double.doubleToLongBits(lat);
                  h=31L*h+Double.doubleToLongBits(lon);
                  h=31L*h+at;
                  return h;
              }

              private static String canonicalIdentity(String stableId, Kind kind) {
                  if (stableId==null) return null;
                  String id=stableId.trim().toUpperCase(java.util.Locale.ROOT);
                  if (id.isEmpty()) return null;
                  String prefix=(kind==Kind.AIRCRAFT?"AIRCRAFT:":kind==Kind.VESSEL?"VESSEL:":"GENERIC:");
                  return prefix+id;
              }

              public synchronized boolean registerAlias(String alias, String stableId, Kind kind) {
                  String canonical=canonicalIdentity(stableId,kind);
                  if (alias==null || alias.trim().isEmpty() || canonical==null) return false;
                  String a=alias.trim().toUpperCase(java.util.Locale.ROOT);
                  String old=aliases.get(a);
                  if (old!=null && !old.equals(canonical)) { identityConflicts++; return false; }
                  aliases.put(a,canonical);
                  return true;
              }

              public synchronized boolean accept(String stableId, Kind kind, double latitude,
                                                 double longitude, long observedAtMillis) {
                  return acceptTimed(stableId,kind,latitude,longitude,observedAtMillis,
                          android.os.SystemClock.elapsedRealtime(),TimestampAuthority.SOURCE);
              }

              public synchronized boolean acceptTimed(String stableId, Kind kind, double latitude,
                                                 double longitude,long sourceObservedAtMillis,
                                                 long receivedAtMillis,TimestampAuthority authority) {
                  if(authority==null)authority=TimestampAuthority.UNKNOWN;
                  long effectiveAt=(authority==TimestampAuthority.SOURCE?sourceObservedAtMillis:receivedAtMillis);
                  if (stableId==null || stableId.trim().isEmpty()
                          || !Double.isFinite(latitude) || !Double.isFinite(longitude)
                          || latitude < -90.0d || latitude > 90.0d) {
                      rejectedObservations++;
                      return false;
                  }
                  String id=canonicalIdentity(stableId,kind);
                  if(id==null){ rejectedObservations++; return false; }
                  double lon=normalizeLongitude(longitude);
                  MotionState old=states.get(id);
                  if (old!=null) { identityReuses++;
                      if (effectiveAt < old.receivedAtMillis) {
                          rejectedObservations++;
                          return false;
                      }
                      if (effectiveAt==old.receivedAtMillis
                              && Double.compare(latitude,old.receivedLatitude)==0
                              && Double.compare(lon,old.receivedLongitude)==0) {
                          duplicateObservations++;
                          return false;
                      }
                  }
                  long sequence=++observationSequence;
                  MotionState next=new MotionState(id,kind,latitude,lon,sourceObservedAtMillis,receivedAtMillis,authority,sequence);
                  if(old!=null) {
                      next.previousObservation=old.currentObservation;
                      currentObservationReplacementCount++;
                  }
                  states.put(id,next);
                  if(authority==TimestampAuthority.SOURCE)sourceTimestampCount++;
                  else if(authority==TimestampAuthority.RECEIVE_TIME)receiveTimestampCount++;
                  else unknownTimestampCount++;
                  acceptedObservations++;
                  return true;
              }

              /** One shared frame tick for the whole collection; never one timer per object. */
              public synchronized void onFrame(long frameTimeNanos) {
                  frameTicks++;
                  // 30.1 foundation deliberately performs no interpolation/prediction.
              }

              public synchronized MotionState get(String stableId) {
                  if(stableId==null)return null;
                  String raw=stableId.trim().toUpperCase(java.util.Locale.ROOT);
                  MotionState direct=states.get(raw);
                  if(direct!=null)return direct;
                  String canonical=aliases.get(raw);
                  return canonical==null?null:states.get(canonical);
              }
              public synchronized MotionState get(String stableId, Kind kind) { return states.get(canonicalIdentity(stableId,kind)); }
              public synchronized ObservationSnapshot previousObservation(String stableId, Kind kind) {
                  MotionState state=states.get(canonicalIdentity(stableId,kind));
                  return state==null?null:state.previousObservation;
              }
              public synchronized ObservationSnapshot currentObservation(String stableId, Kind kind) {
                  MotionState state=states.get(canonicalIdentity(stableId,kind));
                  return state==null?null:state.currentObservation;
              }
              public synchronized long currentObservationRevision(String stableId, Kind kind) {
                  MotionState state=states.get(canonicalIdentity(stableId,kind));
                  return state==null?-1L:state.currentObservationRevision;
              }
              public synchronized boolean currentObservationIntact(String stableId, Kind kind) {
                  MotionState state=states.get(canonicalIdentity(stableId,kind));
                  if(state==null||state.currentObservation==null)return false;
                  ObservationSnapshot o=state.currentObservation;
                  return o.fingerprint==fingerprint(o.rawLatitude,o.rawLongitude,o.observedAtMillis)
                          && o.sequence==state.currentObservationRevision;
              }
              public synchronized long currentObservationReplacementCount(){ return currentObservationReplacementCount; }
              public synchronized long sourceTimestampCount(){ return sourceTimestampCount; }
              public synchronized long receiveTimestampCount(){ return receiveTimestampCount; }
              public synchronized long unknownTimestampCount(){ return unknownTimestampCount; }

              public synchronized DisplayPositionSnapshot displayPosition(String stableId, Kind kind) {
                  MotionState state=states.get(canonicalIdentity(stableId,kind));
                  return state==null?null:new DisplayPositionSnapshot(state);
              }

              /**
               * Rendering-only update. It never edits received/raw coordinates.
               * 30.4 does not interpolate yet; later stages may drive this method.
               */
              public synchronized boolean setDisplayPosition(String stableId, Kind kind,
                                                             double latitude, double longitude) {
                  if(!Double.isFinite(latitude)||!Double.isFinite(longitude)
                          || latitude < -90.0d || latitude > 90.0d) return false;
                  MotionState state=states.get(canonicalIdentity(stableId,kind));
                  if(state==null)return false;
                  state.displayLatitude=latitude;
                  state.displayLongitude=normalizeLongitude(longitude);
                  state.displayRevision++;
                  return rawPositionIntact(stableId,kind);
              }

              public synchronized boolean resetDisplayToReceived(String stableId, Kind kind) {
                  MotionState state=states.get(canonicalIdentity(stableId,kind));
                  if(state==null)return false;
                  state.displayLatitude=state.receivedLatitude;
                  state.displayLongitude=state.receivedLongitude;
                  state.displayRevision++;
                  return rawPositionIntact(stableId,kind);
              }

              public synchronized RawPositionSnapshot rawPosition(String stableId, Kind kind) {
                  MotionState state=states.get(canonicalIdentity(stableId,kind));
                  return state==null?null:new RawPositionSnapshot(state);
              }
              public synchronized boolean rawPositionIntact(String stableId, Kind kind) {
                  MotionState state=states.get(canonicalIdentity(stableId,kind));
                  return state!=null && state.rawObservationFingerprint==
                          fingerprint(state.rawReceivedLatitude,state.rawReceivedLongitude,state.receivedAtMillis);
              }
              public synchronized long identityReuseCount(){ return identityReuses; }
              public synchronized long identityConflictCount(){ return identityConflicts; }
              public synchronized List<MotionState> snapshot() {
                  return Collections.unmodifiableList(new ArrayList<>(states.values()));
              }
              public synchronized int trackedCount() { return states.size(); }
              public synchronized long acceptedCount() { return acceptedObservations; }
              public synchronized long rejectedCount() { return rejectedObservations; }
              public synchronized long duplicateCount() { return duplicateObservations; }
              public synchronized long frameTickCount() { return frameTicks; }

              static double normalizeLongitude(double lon) {
                  return ((lon+180.0d)%360.0d+360.0d)%360.0d-180.0d;
              }
          }
          JAVA

          test -s "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "SINGLE LIVE MOTION ENGINE" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "One shared frame tick" "$PKG/LiveObjectMotionEngine.java"
          ! grep -Eq "Timer|postDelayed|predict|interpolat" "$PKG/LiveObjectMotionEngine.java" || {
            # comments may contain the words predict/interpolate; timers are the actual forbidden architecture.
            ! grep -Eq "new Timer|postDelayed\\(" "$PKG/LiveObjectMotionEngine.java"
          }
          grep -Fq "canonicalIdentity" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "registerAlias" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "AIRCRAFT:" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "VESSEL:" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "identityConflictCount" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "rawReceivedLatitude" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "rawReceivedLongitude" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "RawPositionSnapshot" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "rawObservationFingerprint" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "rawPositionIntact" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "DisplayPositionSnapshot" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "displayLatitude" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "displayLongitude" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "setDisplayPosition" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "resetDisplayToReceived" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "rawPositionIntact" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "ObservationSnapshot" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "previousObservation" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "currentObservation" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "next.previousObservation=old.currentObservation" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "currentObservationRevision" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "currentObservationIntact" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "observationSequence" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "currentObservationReplacementCount" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "TimestampAuthority" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "sourceObservedAtMillis" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "receivedAtMillis" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "acceptTimed" "$PKG/LiveObjectMotionEngine.java"
          grep -Fq "sourceTimestampCount" "$PKG/LiveObjectMotionEngine.java"
          echo "V3.2/30.1/30.7 OBSERVATION TIMESTAMP SOURCE PASS"

      - name: V3.2 30.1 30.7 observation timestamp functional acceptance
        shell: bash
        run: |
          python3 - <<'PY'
          SOURCE="SOURCE"; RECEIVE="RECEIVE_TIME"; UNKNOWN="UNKNOWN"
          def effective(source,receive,authority):
              return source if authority==SOURCE else receive
          assert effective(1000,1100,SOURCE)==1000
          assert effective(0,1100,RECEIVE)==1100
          assert effective(0,1100,UNKNOWN)==1100
          # Source-authoritative ordering must use source observation time, not network arrival time.
          current=effective(2000,5000,SOURCE)
          delayed=effective(1500,6000,SOURCE)
          assert delayed<current
          # Receive-time fallback remains explicit and distinguishable.
          fallback=effective(0,7000,RECEIVE)
          assert fallback==7000
          # Equal effective timestamp + identical position is duplicate, not a new motion sample.
          pos=(.34,32.58); a=(pos,effective(3000,3100,SOURCE)); b=(pos,effective(3000,3500,SOURCE))
          assert a==b
          print("V3.2/30.1/30.7 OBSERVATION TIMESTAMP FUNCTIONAL ACCEPTANCE PASS")
          print("source_ordering=",current,delayed,"receive_fallback=",fallback)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true
      - name: Compile
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac --stacktrace
      - name: Build APK
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace
      - name: Stage APK
        run: |
          mapfile -t A < <(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | sort)
          test "${#A[@]}" -eq 1; test -s "${A[0]}"
          mkdir -p "$RUNNER_TEMP/release"
          cp "${A[0]}" "$RUNNER_TEMP/release/DUWM-V3.2-30.1-30.7-OBSERVATION-TIMESTAMP-LATITUDE-STATE-REPAIR.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: DUWM-V3.2-30.1-30.7-OBSERVATION-TIMESTAMP-LATITUDE-STATE-REPAIR-APK
          path: ${{ runner.temp }}/release/DUWM-V3.2-30.1-30.7-OBSERVATION-TIMESTAMP-LATITUDE-STATE-REPAIR.apk
          if-no-files-found: error
