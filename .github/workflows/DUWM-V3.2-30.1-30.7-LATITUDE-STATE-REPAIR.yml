      - name: V3.1 30.30 complete globe-motion acceptance
        shell: bash
        run: |
          python3 - <<'PY'
          import math
          SPEED=1.2; CAP=.100
          def norm(x): return ((x+180)%360+360)%360-180
          # 30.1-30.5: continuous, refresh-independent governed newsroom rotation.
          for hz in (60,90,120):
              lon=0.; last=1_000_000_000
              for i in range(1,hz*10+1):
                  now=1_000_000_000+round(i*1e9/hz)
                  dt=min(max(now-last,0)/1e9,CAP)
                  lon=norm(lon+SPEED*dt); last=now
              assert abs(lon-12.0)<.03,(hz,lon)
          # 30.6: first motion quantum is small and nonnegative.
          first=SPEED/60; assert 0<first<.05
          # 30.7: one outstanding callback invariant.
          running=True; posted=True
          for _ in range(1000):
              assert running and posted
              posted=False
              if running and not posted: posted=True
          # 30.8-30.10: hidden stops; restart preserves position.
          lon=42.75; saved=lon; running=False
          assert lon==saved
          running=True; assert lon==saved
          # 30.11-30.13: touch owns globe and idle delay prevents instant restart.
          touch=True; running=False; before=lon
          for _ in range(100): assert lon==before
          touch=False; delay_ms=900; assert delay_ms==900
          # 30.14/30.15: smooth resume/pause curves bounded [0,1].
          smooth=lambda x:x*x*(3-2*x)
          vals=[smooth(i/100) for i in range(101)]
          assert vals[0]==0 and vals[-1]==1 and all(0<=x<=1 for x in vals)
          # 30.16/30.17: million-step longitude bounded forever.
          lon=179.99
          for _ in range(1_000_000):
              lon=norm(lon+.02); assert -180<=lon<180
          # 30.18-30.21: protected non-longitude state stays invariant.
          lat,zoom,orient,selection=12.5,3.0,22.0,"AIRCRAFT-1"
          snapshot=(lat,zoom,orient,selection)
          for _ in range(10000):
              lon=norm(lon+.02)
              assert (lat,zoom,orient,selection)==snapshot
          # 30.22/30.23: marker and label share geographic anchor.
          rel=lambda obj,center: norm(obj-center)
          for center in range(-180,180,5):
              assert rel(32.58,center)==rel(32.58,center)
          # 30.24: spherical hemisphere.
          def front(lat,lo,clat,clon):
              p1,p2=map(math.radians,(clat,lat)); dl=math.radians(lo-clon)
              return math.sin(p1)*math.sin(p2)+math.cos(p1)*math.cos(p2)*math.cos(dl)>=0
          assert front(0,0,0,0) and not front(0,180,0,0)
          # 30.25: all layers share one epoch snapshot.
          layers=("earth","borders","overlays","markers","tracks","labels")
          snap=(999,lon,lat); assert len({snap for _ in layers})==1
          # 30.26: coalescing => one posted redraw for burst.
          pending=False; posted_count=0
          for _ in range(100):
              if not pending: pending=True; posted_count+=1
          assert posted_count==1
          # 30.27/30.28: render stride never changes geographic truth.
          truth=sum(SPEED*(1/60) for _ in range(600))
          for stride in (1,2,3):
              geo=sum(SPEED*(1/60) for _ in range(600))
              assert abs(geo-truth)<1e-12
          # 30.29: stall watchdog circular delta works across date line.
          circular=lambda a,b:abs(((a-b+540)%360)-180)
          assert abs(circular(-179.99,179.99)-.02)<1e-9
          assert circular(42,42)<.0005
          print("V3.1/30.30 COMPLETE GLOBE MOTION ACCEPTANCE PASS")
          print("30/30 cumulative movement contracts verified")
          PY
