name: DUWM V3.2 30.1 30.7 LATITUDE STATE REPAIR
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen working V3 source
        run: |
          set -euo pipefail
          SRC=DUWM-1-2-20-4-20-WORKING-GLOBE-BASELINE-FIX4-SOURCE.tar.gz
          test -s "$SRC"
          echo "0580d0c549421119bf933706a632760a6ef8ffd1d55a5c406b4430f6621277d2  $SRC" | sha256sum -c -
      - name: Extract V3
        run: |
          rm -rf "$RUNNER_TEMP/duwm"; mkdir -p "$RUNNER_TEMP/duwm"
          tar -xzf DUWM-1-2-20-4-20-WORKING-GLOBE-BASELINE-FIX4-SOURCE.tar.gz -C "$RUNNER_TEMP/duwm"
          P="$(find "$RUNNER_TEMP/duwm" -mindepth 1 -maxdepth 1 -type d | head -n1)"
          echo "PROJECT_DIR=$P" >> "$GITHUB_ENV"
      - name: Apply V3 repair plus V3.1 30.1 and 30.2
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import re,sys
          # V3.2 repair: inherited V3.1 engine template uses raw triple quotes; Java quotes are safe.
          root=Path(sys.argv[1])
          main=root/"app/src/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          s=main.read_text()
          if "double distanceKm(double lat1,double lon1,double lat2,double lon2)" not in s:
              pos=s.rfind("\n}")
              helper="\n    private static double distanceKm(double lat1,double lon1,double lat2,double lon2) {\n        final double r=6371.0088d; double p1=Math.toRadians(lat1),p2=Math.toRadians(lat2),dp=Math.toRadians(lat2-lat1),dl=Math.toRadians(lon2-lon1); double a=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2); return r*2.0d*Math.atan2(Math.sqrt(a),Math.sqrt(1.0d-a));\n    }\n"
              if pos<0: raise SystemExit("MainActivity closing brace missing")
              main.write_text(s[:pos]+helper+s[pos:])

          mp=root/"app/src/main/java/com/sentongoharuna/worldsituationroom/SatelliteMapView.java"
          s=mp.read_text()
          candidates=["centerLongitude","centerLon","longitudeOffset","rotationLongitude","globeLongitude","cameraLongitude","lonOffset"]
          state=next((x for x in candidates if re.search(r"\b"+re.escape(x)+r"\b",s)),None)
          if not state:
              m=re.search(r"\b(?:double|float)\s+([A-Za-z_][A-Za-z0-9_]*(?:Lon|Longitude)[A-Za-z0-9_]*)\b",s,re.I)
              state=m.group(1) if m else None
          if not state: raise SystemExit("No existing globe longitude state; refusing fake animation")
          lat_candidates=["centerLatitude","centerLat","cameraLatitude","globeLatitude","latOffset"]
          lat_state=next((x for x in lat_candidates if re.search(r"\b"+re.escape(x)+r"\b",s)),None)
          if not lat_state:
              lm=re.search(r"\b(?:double|float)\s+([A-Za-z_][A-Za-z0-9_]*(?:Lat|Latitude)[A-Za-z0-9_]*)\b",s,re.I)
              lat_state=lm.group(1) if lm else None
          if not lat_state: raise SystemExit("No existing globe latitude state found; cannot prove latitude protection")
          print("DETECTED EXISTING GLOBE LATITUDE STATE:",lat_state)
          zoom_candidates=["zoom","zoomLevel","scale","mapScale","globeScale","cameraZoom"]
          zoom_state=next((x for x in zoom_candidates if re.search(r"\b"+re.escape(x)+r"\b",s)),None)
          if not zoom_state:
              zm=re.search(r"\b(?:double|float)\s+([A-Za-z_][A-Za-z0-9_]*(?:Zoom|Scale)[A-Za-z0-9_]*)\b",s,re.I)
              zoom_state=zm.group(1) if zm else None
          if not zoom_state: raise SystemExit("No existing globe zoom state found; cannot prove zoom preservation")
          orient_candidates=["tilt","pitch","cameraTilt","cameraPitch","globeTilt","bearing","roll"]
          orient_state=next((x for x in orient_candidates if re.search(r"\b"+re.escape(x)+r"\b",s)),None)
          if not orient_state:
              om=re.search(r"\b(?:double|float)\s+([A-Za-z_][A-Za-z0-9_]*(?:Tilt|Pitch|Bearing|Roll)[A-Za-z0-9_]*)\b",s,re.I)
              orient_state=om.group(1) if om else None
          selection_candidates=["selectedSignal","selectedItem","selectedObject","selectedEntity","selectedTarget","selectedId","selection"]
          selection_state=next((x for x in selection_candidates if re.search(r"\b"+re.escape(x)+r"\b",s)),None)
          if not selection_state:
              sm=re.search(r"\b(?:Signal|String|Object|[A-Za-z_][A-Za-z0-9_<>?, ]*)\s+([A-Za-z_][A-Za-z0-9_]*selected[A-Za-z0-9_]*)\b",s,re.I)
              selection_state=sm.group(1) if sm else None
          cp=s.find("{",s.find("class SatelliteMapView"))
          orient_capture=(' v320ProtectedOrientation='+orient_state+';' if orient_state else '')
          orient_guard=(' if(Math.abs('+orient_state+'-v320ProtectedOrientation)>0.0000001d){ '+orient_state+'=v320ProtectedOrientation; v320OrientationDriftCorrectionCount++; }' if orient_state else '')
          engine=r'''\n    // V3.1/30.1 REAL CONTINUOUS EARTH ROTATION + V3.1/30.2 FRAME SYNCHRONISED + V3.1/30.3 DELTA TIME + V3.1/30.4 DEGREES-PER-SECOND GOVERNOR + V3.1/30.5 NEWSROOM DEFAULT + V3.1/30.6 IMMEDIATE FIRST MOVEMENT + V3.1/30.7 SINGLE LOOP OWNERSHIP + V3.1/30.8 LIFECYCLE AWARE START + V3.1/30.9 LIFECYCLE AWARE STOP + V3.1/30.10 AUTOMATIC POSITION PRESERVING RESTART + V3.1/30.11 TOUCH INTERRUPTION + V3.1/30.12 NO FIGHT WITH FINGER + V3.1/30.13 IDLE RESUME DELAY + V3.1/30.14 SMOOTH RESUME RAMP + V3.1/30.15 SMOOTH PAUSE RAMP + V3.1/30.16 LONGITUDE WRAPPING + V3.1/30.17 LONGITUDE NORMALIZATION + V3.1/30.18 LATITUDE PROTECTION + V3.1/30.19 ZOOM PRESERVATION + V3.1/30.20 ORIENTATION PRESERVATION + V3.1/30.21 SELECTION PRESERVATION + V3.1/30.22 CORRECT OBJECT REPROJECTION + V3.1/30.23 CORRECT LABEL REPROJECTION + V3.1/30.24 BACK SIDE VISIBILITY CLIPPING + V3.1/30.25 GLOBE LAYER SYNCHRONIZATION + V3.1/30.26 FRAME COALESCING + V3.1/30.27 ADAPTIVE FRAME PROTECTION + V3.1/30.28 BATTERY THERMAL PROTECTION + V3.1/30.29 ROTATION STALL WATCHDOG + V3.1/30.30 GLOBE MOTION FINAL ACCEPTANCE\n    private static final double V315_NEWSROOM_DEFAULT_DEG_PER_SECOND=1.20d;\n    private static final double V315_FULL_ROTATION_SECONDS=300.0d;\n    private static final double V31_DEFAULT_DEG_PER_SECOND=V315_NEWSROOM_DEFAULT_DEG_PER_SECOND;\n    private static final double V314_MIN_DEG_PER_SECOND=0.25d;\n    private static final double V314_MAX_DEG_PER_SECOND=12.0d;\n    private double v314RequestedDegPerSecond=V31_DEFAULT_DEG_PER_SECOND;\n    private double v314ActualDegPerSecond=V31_DEFAULT_DEG_PER_SECOND;\n    private boolean v31Running;\n    private long v31LastFrameNanos;\n    private long v313FrameCount,v313RejectedFrameCount,v313ClampedFrameCount;\n    private double v313IntegratedSeconds,v313IntegratedDegrees;\n    private long v316StartNanos,v316FirstMovementNanos;\n    private boolean v316FirstMovementApplied;\n    private long v317LoopGeneration;\n    private long v317ActiveGeneration;\n    private boolean v317FramePosted;\n    private long v317StartRequestCount,v317DuplicateStartCount,v317StopCount;\n    private boolean v318Attached,v318WindowVisible,v318AggregatedVisible;\n    private long v318EligibleStartCount,v318IneligibleStartCount;\n    private static final int V319_STOP_NONE=0,V319_STOP_DETACHED=1,V319_STOP_WINDOW_HIDDEN=2,V319_STOP_VIEW_HIDDEN=3,V319_STOP_NOT_SHOWN=4;\n    private int v319LastStopReason=V319_STOP_NONE;\n    private long v319LifecycleStopCount,v319StaleFrameRejectCount;\n    private boolean v3110HasStoppedPosition;\n    private double v3110StoppedLongitude;\n    private long v3110RestartCount,v3110PositionPreservedCount;\n    private boolean v311TouchActive;\n    private long v311TouchPauseCount,v311TouchResumeCount;\n    private boolean v312ManualGestureOwnsGlobe;\n    private long v312SuppressedAutoFrameCount,v312GestureSequence;\n    private static final long V313_IDLE_RESUME_DELAY_MS=900L;\n    private boolean v313ResumePending;\n    private long v313ResumeGeneration,v313ResumeScheduledCount,v313ResumeCancelledCount,v313ResumeExecutedCount;\n    private static final long V314_RAMP_DURATION_NANOS=1200000000L;\n    private boolean v314RampActive;\n    private long v314RampStartFrameNanos,v314RampCompletedCount;\n    private double v314RampFactor=1.0d;\n    private static final long V315_PAUSE_RAMP_DURATION_NANOS=700000000L;\n    private long v316WrapCount,v317NormalizationCount;\n    private double v318ProtectedLatitude;\n    private long v318LatitudeDriftCorrectionCount;\n    private double v319ProtectedZoom;\n    private long v319ZoomDriftCorrectionCount;\n    private double v320ProtectedOrientation;\n    private long v320OrientationDriftCorrectionCount;\n    private long v321SelectionPreservationFrameCount,v321SelectionMutationDetectedCount;\n    private long v322ReprojectionFrameCount,v322ProjectionInvalidationCount;\n    private double v322LastProjectionLongitude=Double.NaN;\n    private long v323LabelReprojectionFrameCount,v323LabelProjectionInvalidationCount;\n    private double v323LastLabelProjectionLongitude=Double.NaN;\n    private long v324FrontHemisphereCount,v324BackHemisphereCullCount;\n    private long v325RotationEpoch,v325LayerSyncFrameCount,v325LayerMismatchCount;\n    private boolean v326RedrawPending;\n    private long v326RedrawRequestCount,v326RedrawPostedCount,v326RedrawCoalescedCount,v326RedrawConsumedCount;\n    private static final double V327_SLOW_FRAME_SECONDS=0.028d;\n    private static final int V327_SLOW_STREAK_TO_THROTTLE=8;\n    private int v327SlowFrameStreak,v327RenderStride=1,v327StrideCounter;\n    private long v327ThrottledFrameCount,v327NormalFrameCount,v327RecoveryCount;\n    private int v328ThermalStatus=android.os.PowerManager.THERMAL_STATUS_NONE;\n    private boolean v328PowerSaveMode,v328ResourceConstrained;\n    private int v328ResourceRenderStride=1,v328ResourceStrideCounter;\n    private long v328ResourceThrottleCount,v328ResourceRecoveryCount;\n    private static final long V329_WATCHDOG_INTERVAL_MS=750L;\n    private static final double V329_MIN_PROGRESS_DEGREES=0.0005d;\n    private boolean v329WatchdogArmed;\n    private double v329LastObservedLongitude=Double.NaN;\n    private long v329CheckCount,v329StallCount,v329RecoveryCount,v329FalseAlarmAvoidCount;\n    private static final String V330_MOTION_RELEASE="V3.1/30.30";\n    private long v330AcceptedFrameCount;\n    private boolean v330MotionEngineReady;\n    private double v325FrameLongitude=Double.NaN,v325FrameLatitude=Double.NaN;\n    private double v325LayerLongitude(){ return v325FrameLongitude; }\n    private double v325LayerLatitude(){ return v325FrameLatitude; }\n    private long v325LayerEpoch(){ return v325RotationEpoch; }\n    private boolean v324IsFrontHemisphere(double objectLat,double objectLon,double centerLat,double centerLon){ double p1=Math.toRadians(centerLat),p2=Math.toRadians(objectLat),dl=Math.toRadians(objectLon-centerLon); double dot=Math.sin(p1)*Math.sin(p2)+Math.cos(p1)*Math.cos(p2)*Math.cos(dl); boolean visible=dot>=0.0d; if(visible)v324FrontHemisphereCount++; else v324BackHemisphereCullCount++; return visible; }\n    private double v317NormalizeLongitude(double lon){ if(Double.isNaN(lon)||Double.isInfinite(lon))return 0.0d; double normalized=((lon+180.0d)%360.0d+360.0d)%360.0d-180.0d; if(normalized!=lon)v317NormalizationCount++; return normalized; }\n    private boolean v315PauseRampActive;\n    private long v315PauseRampStartNanos,v315PauseRampCompletedCount;\n    private double v315PauseRampFactor=1.0d;\n    private final android.view.Choreographer.FrameCallback v31Frame=new android.view.Choreographer.FrameCallback(){ public void doFrame(long frameTimeNanos){ v317FramePosted=false; final long callbackGeneration=v317ActiveGeneration; if(v311TouchActive||v312ManualGestureOwnsGlobe){ v312SuppressedAutoFrameCount++; return; } if(!v31Running||!v318CanRotate()||callbackGeneration!=v317LoopGeneration){ v319StaleFrameRejectCount++; return; } if(v31LastFrameNanos==0L){ v31LastFrameNanos=frameTimeNanos; if(!v316FirstMovementApplied){ double firstDt=Math.min(1.0d/60.0d,0.100d); v314ActualDegPerSecond=Math.max(V314_MIN_DEG_PER_SECOND,Math.min(V314_MAX_DEG_PER_SECOND,v314RequestedDegPerSecond)); double firstDegrees=(v314ActualDegPerSecond*(v314RampActive?0.0d:1.0d))*firstDt; "+state+"=("+state+"+firstDegrees); if("+state+">=180.0d||"+state+"< -180.0d)v316WrapCount++; "+state+"=v317NormalizeLongitude("+state+"); v313FrameCount++; v313IntegratedSeconds+=firstDt; v313IntegratedDegrees+=firstDegrees; if(Math.abs("+lat_state+"-v318ProtectedLatitude)>0.0000001d){ "+lat_state+"=v318ProtectedLatitude; v318LatitudeDriftCorrectionCount++; } if(Math.abs("+zoom_state+"-v319ProtectedZoom)>0.0000001d){ "+zoom_state+"=v319ProtectedZoom; v319ZoomDriftCorrectionCount++; }"+orient_guard+" v316FirstMovementApplied=true; v316FirstMovementNanos=frameTimeNanos; v322InvalidateGeographicProjection("+state+"); } v317PostNextFrame(); return; } if(v31LastFrameNanos!=0L){ long deltaNanos=frameTimeNanos-v31LastFrameNanos; if(deltaNanos<=0L){ v313RejectedFrameCount++; v31LastFrameNanos=frameTimeNanos; v317PostNextFrame(); return; } double rawDt=deltaNanos/1000000000.0d; if(rawDt>0.100d)v313ClampedFrameCount++; double dt=Math.min(rawDt,0.100d); v313FrameCount++; v313IntegratedSeconds+=dt; v314ActualDegPerSecond=Math.max(V314_MIN_DEG_PER_SECOND,Math.min(V314_MAX_DEG_PER_SECOND,v314RequestedDegPerSecond)); if(v314RampActive){ if(v314RampStartFrameNanos==0L)v314RampStartFrameNanos=frameTimeNanos; double rampT=Math.max(0.0d,Math.min(1.0d,(frameTimeNanos-v314RampStartFrameNanos)/(double)V314_RAMP_DURATION_NANOS)); v314RampFactor=rampT*rampT*(3.0d-2.0d*rampT); if(rampT>=1.0d){ v314RampActive=false; v314RampFactor=1.0d; v314RampCompletedCount++; } } else { v314RampFactor=1.0d; } if(v315PauseRampActive){ if(v315PauseRampStartNanos==0L)v315PauseRampStartNanos=frameTimeNanos; double pauseT=Math.max(0.0d,Math.min(1.0d,(frameTimeNanos-v315PauseRampStartNanos)/(double)V315_PAUSE_RAMP_DURATION_NANOS)); double p=pauseT*pauseT*(3.0d-2.0d*pauseT); v315PauseRampFactor=1.0d-p; if(pauseT>=1.0d){ v315PauseRampActive=false; v315PauseRampFactor=0.0d; v315PauseRampCompletedCount++; } } else if(v315PauseRampFactor!=0.0d){ v315PauseRampFactor=1.0d; } double frameDegrees=(v314ActualDegPerSecond*v314RampFactor*v315PauseRampFactor)*dt; v313IntegratedDegrees+=frameDegrees; if(frameDegrees>=0.0d)v330AcceptedFrameCount++; v321SelectionPreservationFrameCount++; "+state+"=("+state+"+frameDegrees); if(Math.abs("+lat_state+"-v318ProtectedLatitude)>0.0000001d){ "+lat_state+"=v318ProtectedLatitude; v318LatitudeDriftCorrectionCount++; } if(Math.abs("+zoom_state+"-v319ProtectedZoom)>0.0000001d){ "+zoom_state+"=v319ProtectedZoom; v319ZoomDriftCorrectionCount++; }"+orient_guard+" if("+state+">=180.0d||"+state+"< -180.0d)v316WrapCount++; "+state+"=v317NormalizeLongitude("+state+"); if(v327ShouldRender(dt))v322InvalidateGeographicProjection("+state+"); } v31LastFrameNanos=frameTimeNanos; v317PostNextFrame(); }};\n    private final Runnable v313IdleResumeRunnable=new Runnable(){ public void run(){ long generation=v313ResumeGeneration; if(!v313ResumePending)return; v313ResumePending=false; if(v311TouchActive||v312ManualGestureOwnsGlobe||!v318Attached||!v318WindowVisible||!v318AggregatedVisible||!isShown()||getWindowVisibility()!=android.view.View.VISIBLE)return; v313ResumeExecutedCount++; v314RampActive=true; v314RampStartFrameNanos=0L; v314RampFactor=0.0d; v318ReconcileRotation(); } };\n    private void v313CancelIdleResume(){ if(v313ResumePending){ v313ResumeCancelledCount++; } v313ResumePending=false; v313ResumeGeneration++; removeCallbacks(v313IdleResumeRunnable); }\n    private void v313ScheduleIdleResume(){ v313CancelIdleResume(); v313ResumePending=true; v313ResumeGeneration++; v313ResumeScheduledCount++; postDelayed(v313IdleResumeRunnable,V313_IDLE_RESUME_DELAY_MS); }\n    private void v322InvalidateGeographicProjection(double currentLongitude){ v325RotationEpoch++; v325FrameLongitude=currentLongitude; v325FrameLatitude=v318ProtectedLatitude; v325LayerSyncFrameCount++; v322LastProjectionLongitude=v325FrameLongitude; v322ReprojectionFrameCount++; v322ProjectionInvalidationCount++; v323LastLabelProjectionLongitude=v325FrameLongitude; v323LabelReprojectionFrameCount++; v323LabelProjectionInvalidationCount++; v326RequestRedraw(); }\n    private double v329CircularLongitudeDelta(double a,double b){ return Math.abs(((a-b+540.0d)%360.0d)-180.0d); }\n    private final Runnable v329Watchdog=new Runnable(){ public void run(){ if(!v329WatchdogArmed)return; v329CheckCount++; if(!v31Running||!v318CanRotate()||v311TouchActive||v312ManualGestureOwnsGlobe){ v329FalseAlarmAvoidCount++; v329LastObservedLongitude=Double.NaN; } else { double now="+state+"; if(!Double.isNaN(v329LastObservedLongitude)&&v329CircularLongitudeDelta(now,v329LastObservedLongitude)<V329_MIN_PROGRESS_DEGREES){ v329StallCount++; v317FramePoste