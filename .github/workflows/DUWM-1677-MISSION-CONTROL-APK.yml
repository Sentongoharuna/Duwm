name: DUWM 1677 | Visual Global Situation Room Native APK
run-name: DUWM 1677 | New mission control, real map layers, source-status desks
'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/DUWM-1677-MISSION-CONTROL-APK.yml
      - DUWM-1677-REAL-ANDROID-SOURCE.zip
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: duwm-1677-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Check real source, compile and publish DUWM 1677 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - name: Checkout actual 1677 Android source archive and workflow
        uses: actions/checkout@v4
      - name: Verify exact source ZIP and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -s DUWM-1677-REAL-ANDROID-SOURCE.zip
          printf '%s  %s\n' 'cfd8f27e94b5721e1235075d66a919283b59839a0851ee15613f26e7aa27f9ea' 'DUWM-1677-REAL-ANDROID-SOURCE.zip' | sha256sum -c -
          unzip -t DUWM-1677-REAL-ANDROID-SOURCE.zip | tail -2
          mkdir -p "$RUNNER_TEMP/duwm1677src"
          unzip -q DUWM-1677-REAL-ANDROID-SOURCE.zip -d "$RUNNER_TEMP/duwm1677src"
          test -f "$RUNNER_TEMP/duwm1677src/DUWM-1677-ANDROID-SOURCE/app/build.gradle.kts"
          echo "PROJECT=$RUNNER_TEMP/duwm1677src/DUWM-1677-ANDROID-SOURCE" >> "$GITHUB_ENV"
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK and install required API 36 if missing
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo 'Android SDK not found'; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          test -n "$SDK_MANAGER" && test -x "$SDK_MANAGER" || { echo 'sdkmanager unavailable'; exit 1; }
          "$SDK_MANAGER" --version
          if [ ! -f "$SDK_ROOT/platforms/android-36/android.jar" ] || [ ! -x "$SDK_ROOT/build-tools/36.0.0/apksigner" ]; then
            yes | timeout 120 "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            timeout 600 "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          fi
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Verify genuine 1677 mission control source files and Java logic
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python3 verification/check_source.py
          python3 verification/check_1674_fix1_compiler.py
          python3 verification/check_1677_mission.py
          mkdir -p "$RUNNER_TEMP/duwm1677-java-parser"
          javac -d "$RUNNER_TEMP/duwm1677-java-parser" verification/JavaSyntaxCheck.java
          java -cp "$RUNNER_TEMP/duwm1677-java-parser" JavaSyntaxCheck
          mkdir -p "$RUNNER_TEMP/duwm1677-geo-test"
          javac -d "$RUNNER_TEMP/duwm1677-geo-test" \
            app/src/main/java/com/sentongoharuna/worldsituationroom/Duwm1676GeoMath.java \
            verification/Duwm1676GeoMathTest.java
          java -cp "$RUNNER_TEMP/duwm1677-geo-test" \
            com.sentongoharuna.worldsituationroom.Duwm1676GeoMathTest
      - name: Compile complete Android 1677 APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac :app:assembleDebug --stacktrace
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$RUNNER_TEMP/duwm1677apk"
          cp "$APK" "$RUNNER_TEMP/duwm1677apk/DUWM-1677.apk"
      - name: Verify APK classes, launcher, release and signature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_APK'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,os,subprocess
          apk=Path(os.environ['RUNNER_TEMP'])/'duwm1677apk/DUWM-1677.apk'
          assert apk.is_file() and apk.stat().st_size>150000,'Compiled APK missing'
          with ZipFile(apk) as z:
              assert z.testzip() is None
              names=z.namelist()
              for asset in ('AndroidManifest.xml','classes.dex','assets/duwm_1677_release_notes.json',
                            'assets/naturalearth_coasts.txt','assets/duwm_release_ui.json','assets/duwm_country_borders_wdbii.txt'):
                  assert asset in names,('Missing compiled asset',asset)
              dex=b''.join(z.read(x) for x in names if x.endswith('.dex'))
              for cls in (b'Duwm1677MissionControlActivity',b'Duwm1676GeoWatchActivity',
                          b'Duwm1676GeoMath',b'Duwm1676WatchRegions',
                          b'Duwm1675EvidenceVaultActivity',b'Duwm1675EvidenceStore',
                          b'Duwm1674UnifiedReceipts',b'Duwm1674MaritimeRefresh',
                          b'OperationsGlobeView',b'Duwm1670FlightMapActivity',
                          b'GevMarineActivity',b'Duwm1670NewsAtlasActivity',
                          b'MediaDeskActivity',b'NativeMediaActivity'):
                  assert cls in dex,('Feature class missing in compiled APK',cls)
          sdk=Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
          subprocess.run([str(sdk/'apksigner'),'verify',str(apk)],check=True)
          badge=subprocess.check_output([str(sdk/'aapt'),'dump','badging',str(apk)],text=True)
          assert "versionCode='167700'" in badge,badge[:800]
          assert "versionName='1677'" in badge
          assert "name='com.sentongoharuna.worldsituationroom.rb2live25'" in badge
          assert 'Duwm1677MissionControlActivity' in badge,'New 1677 launcher missing'
          (apk.parent/'SHA256SUMS.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  DUWM-1677.apk\n')
          print('PASS DUWM 1677 global mission control compiled into a signed APK')
          PY_APK
      - name: Publish verified 1677 installable Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-1677-VERIFIED-INSTALLABLE-APK
          path: |
            ${{ runner.temp }}/duwm1677apk/DUWM-1677.apk
            ${{ runner.temp }}/duwm1677apk/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
      - name: State source and device verification boundaries
        if: always()
        shell: bash
        run: |
          {
            echo '### DUWM 1677 Native Mission Control'
            echo 'New native layout uses actual source caches, eight prominent status LEDs, globe and region maps. Unavailable feeds remain visibly unavailable.'
            echo 'The UI only reports observed position records; source access may be rate-limited or unavailable.'
            echo 'APK compilation is not proof that in-app playback, worldwide AIS or network data works on a phone.'
          } >> "$GITHUB_STEP_SUMMARY"
