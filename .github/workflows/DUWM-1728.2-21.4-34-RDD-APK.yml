name: DUWM 1728.2 21.4 34 RDD Pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate and unpack
        run: |
          unzip -t DUWM-1728.2-21.4-34-RDD-PAGES-SOURCE.zip
          unzip -q DUWM-1728.2-21.4-34-RDD-PAGES-SOURCE.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile APK
        working-directory: DUWM-1728-2-21-4-14-ANDROID-SOURCE
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DUWM-1728.2-21.4-34-APK
          path: DUWM-1728-2-21-4-14-ANDROID-SOURCE/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
