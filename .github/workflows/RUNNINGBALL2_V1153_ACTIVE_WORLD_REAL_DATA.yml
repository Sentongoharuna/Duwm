      - name: Compile the complete preserved native Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac :app:assembleDebug --stacktrace
      - name: Verify real APK package, DEX and branded image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_V110_APK'
          import os
          import pathlib
          import hashlib
          import zipfile
          import subprocess
          project = pathlib.Path(os.environ['PROJECT_DIR'])
          apks = list((project / 'app/build/outputs/apk/debug').glob('*.apk'))
          assert len(apks) == 1, 'Expected precisely one compiled APK'
          apk = apks[0]
          assert apk.stat().st_size > 20000, 'APK empty or unexpectedly small'
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None, 'Broken APK zip'
              names = z.namelist()
              assert 'classes.dex' in names, 'Compiled Java missing'
              assert 'AndroidManifest.xml' in names, 'Android manifest missing'
              assert 'assets/develop_uganda_logo.png' in names, 'Official logo missing from APK'
              assert any(n.endswith('/develop_uganda_logo.png') for n in names), 'Launcher drawable missing'
              digest = hashlib.sha256(z.read('assets/develop_uganda_logo.png')).hexdigest()
              assert digest == 'e583513eda20b22ee9a9641c58a2b58869fd9997a94ae49c1321c378aa32d97b', 'Wrong official logo'
          sdk = pathlib.Path(os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT'])
          bt = sdk / 'build-tools/36.0.0'
          subprocess.run([str(bt / 'apksigner'), 'verify', str(apk)], check=True)
          badge = subprocess.check_output([str(bt / 'aapt'), 'dump', 'badging', str(apk)], text=True)
          assert "name='com.sentongoharuna.worldsituationroom.rb2live25'" in badge, 'Original installation identity lost'
          assert "versionCode='1153'" in badge, 'V1153 versionCode missing'
          assert "RUNNINGBALL2-V1153-DEVELOP-UGANDA" in badge, 'V1153 versionName missing'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release'
          target.mkdir(parents=True, exist_ok=True)
          output = target / 'RUNNINGBALL2-V1153-DEVELOP-UGANDA.apk'
          output.write_bytes(apk.read_bytes())
          print('PASS V1153 signed debug APK', output, output.stat().st_size, flush=True)
          PY_V110_APK
      - name: V1153 Verify new compiled native code is DIFFERENT from V1152 (not a renamed APK)
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/release/RUNNINGBALL2-V1153-DEVELOP-UGANDA.apk" <<'V1153_NEW_DEX'
          import hashlib,sys,zipfile
          baseline={
              '7ad94b66b28191d205452847a9fd5688639e8bc957842fddba0fd934d9409b82',
              '9b5003f4536f19f7af5d94ea30b7145465df087aa2758d68f7d723e74d5d4b60'}
          with zipfile.ZipFile(sys.argv[1]) as z:
              dex=[z.read(n) for n in z.namelist() if n.endswith('.dex')]
              assert dex,'No native compiled DEX code'
              names=[b'LiveCommandActivity',b'LiveEarthGlobeView',b'earthquake.usgs.gov',b'opensky-network.org']
              for marker in names:
                  assert any(marker in d for d in dex),'Missing real new implementation: '+repr(marker)
              sha=[hashlib.sha256(d).hexdigest() for d in dex]
              assert set(sha)!=baseline,'V1153 DEX UNCHANGED from V1152; refuse toy version upgrade'
              print('PASS: NEW native code, real feed URLs and moving globe class compiled into APK')
              print('V1153 DEX SHA256',sha)
          V1153_NEW_DEX
      - name: Grant Android emulator KVM access
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: V1153 DEVICE GATE - real foreground UI opens and animated globe changes frame
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            APK="$RUNNER_TEMP/release/RUNNINGBALL2-V1153-DEVELOP-UGANDA.apk"
            test -s "$APK"
            adb install -r "$APK"
            adb shell am start -n 'com.sentongoharuna.worldsituationroom.rb2live25/com.sentongoharuna.worldsituationroom.LiveCommandActivity'
            sleep 5
            adb shell dumpsys activity activities | grep -q LiveCommandActivity
            adb shell uiautomator dump /sdcard/v1153-ui.xml >/dev/null
            adb shell cat /sdcard/v1153-ui.xml > /tmp/V1153_UI.xml
            grep -q 'WORLD SITUATION ROOM' /tmp/V1153_UI.xml
            grep -q 'OPENSKY' /tmp/V1153_UI.xml
            adb exec-out screencap -p > /tmp/V1153_FRAME_A.png
            sleep 2
            adb exec-out screencap -p > /tmp/V1153_FRAME_B.png
            python3 -m pip install --quiet Pillow
            python3 - <<'V1153_MOTION'
            from PIL import Image,ImageChops
            a=Image.open('/tmp/V1153_FRAME_A.png').convert('RGB')
            b=Image.open('/tmp/V1153_FRAME_B.png').convert('RGB')
            assert a.size==b.size and a.width>=480
            # Native globe occupies below the app header, avoiding the live UTC clock area.
            region=(int(a.width*.1),int(a.height*.14),int(a.width*.9),int(a.height*.40))
            diff=ImageChops.difference(a.crop(region),b.crop(region))
            assert diff.getbbox() is not None,'Foreground globe frame did not change'
            print('PASS V1153 on emulator: new interface visible, motion changed screen pixels')
            V1153_MOTION
      - name: Upload actual V1153 emulator screenshots and navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RUNNINGBALL2-V1153-REAL-SCREEN-EVIDENCE
          path: |
            /tmp/V1153_FRAME_A.png
            /tmp/V1153_FRAME_B.png
            /tmp/V1153_UI.xml
          if-no-files-found: warn
          retention-days: 30
      - name: Upload real compiled V1153 APK
        uses: actions/upload-artifact@v4
        with:
          name: RUNNINGBALL2-V1153-APK-BACKUP-ARTIFACT
          path: ${{ runner.temp }}/release/RUNNINGBALL2-V1153-DEVELOP-UGANDA.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish directly installable APK on GitHub Releases (no ZIP extraction)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/release/RUNNINGBALL2-V1153-DEVELOP-UGANDA.apk"
          test -s "$APK" || { echo "::error::Compiled V1153 APK is missing"; exit 1; }
          gh --version
          # GitHub Artifacts are always ZIP downloads. Release assets retain .apk extension.
          if gh release view "v1153" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v1153" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v1153" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "RUNNINGBALL2 V1153 | DEVELOP.UGANDA" \
              --notes "Direct installable APK, preserved V24-V109 development chain, DEVELOP.UGANDA logo and package identity. Android versionCode 1153. Release asset SHA and bytes are verified identical to built APK. No invented live data. Device runtime still requires testing." \
              --latest=false
          fi
          echo '## V1153 Direct APK (not ZIP)' >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/v1153/RUNNINGBALL2-V1153-DEVELOP-UGANDA.apk" >> "$GITHUB_STEP_SUMMARY"
          gh release view v1153 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name=="RUNNINGBALL2-V1153-DEVELOP-UGANDA.apk") | .name + " " + (.size|tostring)' | tee /tmp/V1153_RELEASE_ASSET.txt
          test -s /tmp/V1153_RELEASE_ASSET.txt || { echo "::error::Release asset not visible"; exit 1; }
      - name: Verify public V1153 release delivers the identical installable APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/release/RUNNINGBALL2-V1153-DEVELOP-UGANDA.apk"
          RELEASE_DIR="$RUNNER_TEMP/verified-direct-release"
          mkdir -p "$RELEASE_DIR"
          gh release download v1153 --repo "$GITHUB_REPOSITORY" --pattern 'RUNNINGBALL2-V1153-DEVELOP-UGANDA.apk' --dir "$RELEASE_DIR" --clobber
          PUBLIC_APK="$RELEASE_DIR/RUNNINGBALL2-V1153-DEVELOP-UGANDA.apk"
          test -s "$PUBLIC_APK"
          cmp "$APK" "$PUBLIC_APK" || { echo '::error::Published APK differs from the verified built APK'; exit 1; }
          python3 - "$PUBLIC_APK" <<'PY_V1153_DIRECT_APK'
          import pathlib,sys,zipfile
          p=pathlib.Path(sys.argv[1]); assert p.suffix=='.apk' and p.stat().st_size>20000
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              for f in ('AndroidManifest.xml','classes.dex','assets/develop_uganda_logo.png'):
                  assert f in z.namelist(), f
          print('PASS: GitHub Releases provides identical, signed Android .apk file; ZIP extraction unnecessary')
          PY_V1153_DIRECT_APK
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          "$SDK/build-tools/36.0.0/apksigner" verify "$PUBLIC_APK"
          echo '## V1153 Direct APK VERIFIED' >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/v1153/RUNNINGBALL2-V1153-DEVELOP-UGANDA.apk" >> "$GITHUB_STEP_SUMMARY"
      - name: Display preserved-feature evidence
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/V1152_INHERITED_AUDIT.txt ]; then
            echo '## V1153: inherited source-step audit' >> "$GITHUB_STEP_SUMMARY"
            echo 'The audit lists original V109 generation steps executed before compiling the V1153 APK.' >> "$GITHUB_STEP_SUMMARY"
            printf 'Source steps: '; grep -c '^EXECUTED:' /tmp/V1152_INHERITED_AUDIT.txt || true
            tail -n 8 /tmp/V1152_INHERITED_AUDIT.txt
          fi
      - name: Upload inherited-feature audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RUNNINGBALL2-V1153-INHERITED-AUDIT
          path: /tmp/V1152_INHERITED_AUDIT.txt
          if-no-files-found: ignore
