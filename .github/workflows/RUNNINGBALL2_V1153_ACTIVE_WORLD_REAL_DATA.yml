name: RUNNINGBALL2 V1153 - ACTIVE WORLD LIVE GLOBE AND REAL DATA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/RUNNINGBALL2_V1153_ACTIVE_WORLD.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout DUWM exact inherited source workflow
        uses: actions/checkout@v4
      - name: Checkout original protected RUNNINGBALL2 source
        uses: actions/checkout@v4
        with:
          repository: Sentongoharuna/Du-World-Situation-Room-
          ref: 7d952dd607cdeec94832896023c10203425a3b7f
          path: rb2-original-source
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Install source reader
        shell: bash
        run: python3 -m pip install --no-cache-dir 'PyYAML==6.0.3'
      - name: Rebuild full V109 native app, preserve V24 onward, install exact DEVELOP.UGANDA logo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_V110_BUILD'
          import os
          import pathlib
          import subprocess
          import yaml
          import hashlib
          import tempfile

          base = pathlib.Path('.github/workflows/RUNNINGBALL2_V109.yml')
          branding = pathlib.Path('.github/workflows/V110_FIX2_DIRECT_PHONE_UPLOAD.yml')
          assert base.is_file(), 'Required existing V109 source missing'
          assert branding.is_file(), 'Existing V1152 official-logo source missing'
          assert base.stat().st_size < 500000, 'V109 source file changed or exceeds safe size'
          base_steps = yaml.safe_load(base.read_text(encoding='utf-8'))['jobs']['build']['steps']
          brand_steps = yaml.safe_load(branding.read_text(encoding='utf-8'))['jobs']['build']['steps']
          assert len(base_steps) == 97, 'V109 source chain changed; refuse reduced app'
          assert len(brand_steps) == 14, 'V110 source logo chain changed'
          assert base_steps[6]['name'].startswith('Verify and unpack complete V24')
          assert base_steps[7]['name'].startswith('Execute EVERY V24')
          assert base_steps[62]['name'].startswith('V108 INSTALL')
          assert brand_steps[7]['name'].startswith('V110 install supplied DEVELOP.UGANDA logo')
          env = os.environ.copy()
          workspace = pathlib.Path(env['GITHUB_WORKSPACE'])
          marker = pathlib.Path(env['GITHUB_ENV'])
          audit = []

          def execute(script, label):
              assert (chr(36) + chr(123) + chr(123)) not in script, 'Unevaluated Actions expression in ' + label
              # Linux limits a single argv string to 128 KiB; the V109 V24-restore step is ~179 KiB.
              # Preserve exact source bytes but run Bash against a temporary script FILE, never bash -c SCRIPT.
              descriptor, script_path = tempfile.mkstemp(prefix='v1152-inherited-', suffix='.sh')
              path = pathlib.Path(script_path)
              try:
                  with os.fdopen(descriptor, 'w', encoding='utf-8') as fh:
                      fh.write(script)
                  result = subprocess.run(['bash', '-e', '-o', 'pipefail', str(path)],
                                          cwd=workspace, env=env, check=False)
              finally:
                  path.unlink(missing_ok=True)
              if result.returncode:
                  raise SystemExit('FAILED inherited ' + label + ' exit=' + str(result.returncode))
              if marker.exists():
                  for line in marker.read_text(encoding='utf-8').splitlines():
                      if '=' in line:
                          key, value = line.split('=', 1)
                          if key.isidentifier():
                              env[key] = value

          for index in range(6, 67):
              step = base_steps[index]
              label = 'V109 step ' + str(index + 1) + ': ' + step['name']
              if 'uses' in step:
                  assert index in (36, 38, 61, 66), label
                  assert step['uses'] == 'actions/upload-artifact@v4', label
                  audit.append('DEFERRED evidence upload: ' + label)
              else:
                  print('EXECUTING', label, flush=True)
                  original = step['run']
                  if index == 7:
                      # The V24 dispatcher inherited from V109 also invokes Bash using -c
                      # for potentially large source-generating step strings. Patch only
                      # its invocation mechanism; DO NOT change the embedded source steps.
                      # Replace the TWO original V24 dispatcher lines atomically.
                      # All injected lines retain the same Python block indentation.
                      # Neither nested V24 source scripts nor upstream code are edited.
                      anchor = ("  cmd=['bash','-eo','pipefail','-c',item['run']]\n"
                                "  child=subprocess.run(cmd,cwd=str(cwd),env=env,check=False)")
                      assert original.count(anchor) == 1, 'V109 V24 dispatcher anchor unexpectedly changed'
                      replacement = (
                          "  script_file=pathlib.Path('/tmp/v1152-v24-step-%02d.sh'%index)\n"
                          "  script_file.write_text(item['run'],encoding='utf-8')\n"
                          "  try:\n"
                          "    child=subprocess.run(['bash','-eo','pipefail',str(script_file)],cwd=str(cwd),env=env,check=False)\n"
                          "  finally:\n"
                          "    script_file.unlink(missing_ok=True)"
                      )
                      original = original.replace(anchor, replacement, 1)
                      # Parse the ACTUAL inherited dispatcher before executing it.
                      # This detects the FIX1 IndentationError without another failed GitHub build.
                      delimiter = "python3 - <<'RB25_V24_RUN'\n"
                      assert original.count(delimiter) == 1, 'V24 Python heredoc not found'
                      body = original.split(delimiter, 1)[1].split('\nRB25_V24_RUN', 1)[0]
                      import ast
                      ast.parse(body, filename='V1152_FIX2_V24_DISPATCHER.py')
                      assert "  cmd=['bash','-eo','pipefail','-c',item['run']]" not in original
                      assert original.count("child=subprocess.run(['bash','-eo','pipefail',str(script_file)]") == 1
                      print('PASS FIX2 V24 Python AST, preserved source and Bash-file execution',flush=True)
                  execute(original, label)
                  audit.append('EXECUTED: ' + label)

          project = pathlib.Path(env.get('PROJECT_DIR', ''))
          assert project.is_dir() and (project / 'app/build.gradle.kts').is_file(), 'Native V109 app not recovered'
          print('EXECUTING official V110 logo installer', flush=True)
          execute(brand_steps[7]['run'], 'original V110 branded image installed into V1152')
          # V1152 is the version to install; preserve the original Android appId so updates are possible.
          gradle = project / 'app/build.gradle.kts'
          definition = gradle.read_text(encoding='utf-8')
          if definition.count('versionCode = 111') != 1:
              raise SystemExit('V1152 requires completed original V110 branding/version chain')
          definition = definition.replace('versionCode = 111','versionCode = 1152',1)
          old_name = 'versionName = "RUNNINGBALL2-V110-DEVELOP-UGANDA-OFFICIAL-LOGO"'
          if definition.count(old_name) != 1:
              raise SystemExit('V1152 inherited branding version missing')
          definition = definition.replace(old_name,'versionName = "RUNNINGBALL2-V1152-DEVELOP-UGANDA"',1)
          assert definition.count('applicationId = "com.sentongoharuna.worldsituationroom.rb2live25"') == 1
          gradle.write_text(definition, encoding='utf-8')
          app_strings = project / 'app/src/main/res/values/strings.xml'
          st = app_strings.read_text(encoding='utf-8')
          if st.count('DEVELOP.UGANDA V110') != 1:
              raise SystemExit('V1152 app label anchor missing')
          app_strings.write_text(st.replace('DEVELOP.UGANDA V110','DEVELOP.UGANDA V1152',1),encoding='utf-8')
          audit.append('V1152 versionCode 1152, versionName V1152, app label V1152, preserved package identity')
          logo = project / 'app/src/main/assets/develop_uganda_logo.png' 
          assert logo.is_file(), 'DEVELOP.UGANDA logo asset missing from app source'
          assert hashlib.sha256(logo.read_bytes()).hexdigest() == 'e583513eda20b22ee9a9641c58a2b58869fd9997a94ae49c1321c378aa32d97b', 'Logo changed'
          audit.append('EXECUTED official image and launcher resource')
          pathlib.Path('/tmp/V1152_INHERITED_AUDIT.txt').write_text('\n'.join(audit) + '\n')
          with marker.open('a', encoding='utf-8') as out:
              out.write('PROJECT_DIR=' + str(project.resolve()) + '\n')
          print('PASS: V24-V109 source generation preserved; official logo installed and V1152 label/version set', flush=True)
          print('V1152 source reference: pinned V24 original + unchanged V109 pipeline, with V110 logo branding',flush=True)
          PY_V110_BUILD
