      - name: Install independent event pulse engine
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/raisedpodium9.py" <<'PY'
          import pathlib,sys,xml.etree.ElementTree as ET
          root=pathlib.Path(sys.argv[1]); base=root/'app/src/main'; pkg=base/'java/com/sentongoharuna/worldsituationroom'; res=base/'res'; p=pkg/'DuwmWidgetProvider.java'
          s=p.read_text()
          assert 'WidgetSnapshot.load' in s and 'duwm_ring_new' in s
          # Keep source-derived values, independently signal acquisition freshness vs content changes.
          s=s.replace('private static final java.util.concurrent.ExecutorService WORK=java.util.concurrent.Executors.newSingleThreadExecutor();','''private static final java.util.concurrent.ExecutorService WORK=java.util.concurrent.Executors.newSingleThreadExecutor();
           private static final java.util.concurrent.ExecutorService PULSE=java.util.concurrent.Executors.newSingleThreadExecutor();
           private static final long PULSE_INTERVAL_MS=550L;
           private static final int PULSE_CYCLES=3;
           private static void pulse(Context c,int id,int ring,int side){
             PULSE.execute(()->{
               AppWidgetManager manager=AppWidgetManager.getInstance(c);
               for(int phase=0;phase<PULSE_CYCLES*2;phase++){
                 RemoteViews rv=new RemoteViews(c.getPackageName(),R.layout.duwm_widget);
                 rv.setInt(R.id.widget_edge,"setBackgroundColor",phase%2==0?side:Color.TRANSPARENT);
                 rv.setTextColor(R.id.widget_signal,phase%2==0?side:Color.rgb(105,126,145));
                 rv.setInt(R.id.widget_signal,"setBackgroundColor",phase%2==0?0x332DB4FB:Color.TRANSPARENT);
                 rv.setInt(R.id.widget_frame,"setBackgroundResource",phase%2==0?ring:R.drawable.duwm_ring_healthy);
                 manager.partiallyUpdateAppWidget(id,rv);
                 try{Thread.sleep(PULSE_INTERVAL_MS);}catch(InterruptedException e){Thread.currentThread().interrupt();break;}
               }
               RemoteViews rv=new RemoteViews(c.getPackageName(),R.layout.duwm_widget);
               rv.setInt(R.id.widget_edge,"setBackgroundColor",side);
               rv.setTextColor(R.id.widget_signal,side);
               rv.setInt(R.id.widget_signal,"setBackgroundColor",Color.TRANSPARENT);
               rv.setInt(R.id.widget_frame,"setBackgroundResource",ring);
               manager.partiallyUpdateAppWidget(id,rv);
             });
           }''')
          # Enforce independent states: ring represents source health, side represents event count delta.
          start=s.find('int signalColor=stale?')
          assert start!=-1
          end=s.find('v.setTextViewText(R.id.widget_detail',start)
          assert end!=-1
          s=s[:start]+'''int ringColor=stale?Color.rgb(110,125,143):Color.rgb(38,224,145);
           ringRes=stale?R.drawable.duwm_ring_offline:R.drawable.duwm_ring_healthy;
           int sideColor=changed?(total>previous?Color.rgb(255,158,48):Color.rgb(45,180,255)):Color.rgb(124,145,160);
           v.setInt(R.id.widget_frame,"setBackgroundResource",ringRes);
           v.setInt(R.id.widget_edge,"setBackgroundColor",sideColor);
           v.setTextColor(R.id.widget_signal,sideColor);
           v.setTextViewText(R.id.widget_signal,changed?"◆ NEW COUNT":"● NO NEW EVENT");
           v.setTextViewText(R.id.widget_delta,changed?((total>previous?"▲ +":"▼ ")+Math.abs(total-previous)+" SINCE LAST UPDATE"):"MONITORING SOURCE DATA");
           v.setTextColor(R.id.widget_delta,sideColor);
           '''+s[end:]
          needle='m.updateAppWidget(id,v);'
          assert s.count(needle)==1
          s=s.replace(needle,needle+'if(changed) pulse(c,id,ringRes,sideColor);')
          p.write_text(s)
          layout=res/'layout/duwm_widget.xml'; x=layout.read_text()
          assert 'widget_edge' in x
          # wrap root in an ID-bearing frame; this enables RemoteViews background switching.
          import re
          # Normalize the root only; older widget patches may already declare this namespace.
          opening=re.search(r'<LinearLayout\b[^>]*>',x,re.S)
          assert opening is not None, 'Expected LinearLayout widget root'
          tag=opening.group(0)
          namespace='xmlns:android="http://schemas.android.com/apk/res/android"'
          tag=re.sub(r'\s+xmlns:android="[^"]*"','',tag)
          tag=tag.replace('<LinearLayout','<LinearLayout '+namespace,1)
          if 'android:id=' not in tag:
              tag=tag.replace('<LinearLayout','<LinearLayout android:id="@+id/widget_frame"',1)
          else:
              tag=re.sub(r'android:id="[^"]*"','android:id="@+id/widget_frame"',tag,count=1)
          x=x[:opening.start()]+tag+x[opening.end():]
          layout.write_text(x)
          # Only actual count change triggers brief flashes. This does not invent new data or run continuously.
          ET.parse(layout)
          for name in ('duwm_ring_healthy','duwm_ring_new','duwm_ring_offline'): ET.parse(res/'drawable'/f'{name}.xml')
          assert 'pulse(c,id,ringRes,sideColor)' in s
          print('PASS: independent ring/side states, three bounded on-change pulses, source-backed figures')
          PY
          python3 "$RUNNER_TEMP/raisedpodium9.py" "$PROJECT_DIR"
      - name: Raisedpodium12 connect widgets to original event updates
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PYCODE'
          from pathlib import Path
          import sys,re,xml.etree.ElementTree as ET
          root=Path(sys.argv[1]); pkg=root/'app/src/main/java/com/sentongoharuna/worldsituationroom'
          widget=pkg/'DuwmWidgetProvider.java'; updater=pkg/'DuWidgetUpdater.java'
          s=widget.read_text(); u=updater.read_text()
          assert 'WidgetSnapshot.load' in s and 'private static void schedule' in s
          assert 'private static void renderAll(Context app)' in u
          assert 'DuWidgetRenderer.render(app' in u
          # All new widgets now subscribe to the SAME snapshot-update dispatch
          # already used by the original functional DU widgets.
          marker=' private static void schedule(Context c,int[] ids)'
          assert s.count(marker)==1
          helper=""" public static void refreshAll(Context c){
            Context app=c.getApplicationContext();
            AppWidgetManager manager=AppWidgetManager.getInstance(app);
            for(int category=1;category<=24;category++){
              try{
                Class<?> provider=Class.forName(app.getPackageName()+".DuwmWidget"+category);
                int[] ids=manager.getAppWidgetIds(new ComponentName(app,provider));
                if(ids!=null && ids.length>0) schedule(app,ids);
              }catch(ClassNotFoundException e){android.util.Log.w("DUWM24","Missing provider "+category,e);}
            }
          }
          """
          s=s.replace(marker,helper+marker,1)
          # Data source updates call the original renderer; extend that dispatch
          # without touching its existing provider logic.
          needle='private static void renderAll(Context app) {'
          assert u.count(needle)==1
          u=u.replace(needle,needle+'\n        DuwmWidgetProvider.refreshAll(app);',1)
          # Distinguish no data from an actual zero. A fresh empty feed can be zero;
          # missing timestamps cannot be claimed live.
          s=s.replace('else{v.setTextViewText(R.id.widget_value,String.valueOf(total));}',
                      'else{v.setTextViewText(R.id.widget_value,stamp<=0?"—":String.valueOf(total));}')
          s=s.replace('"● NO NEW EVENT"','"● NO COUNT CHANGE"')
          s=s.replace('"SOURCE • "+s.healthBadge()+"  |  "+age',
                      '"SOURCE • "+(stale?"STALE/UNAVAILABLE":s.healthBadge())+"  |  "+age')
          # A ring signals source freshness; a side lamp signals a changed count.
          assert 'ringRes=stale?' in s and 'int sideColor=changed?' in s
          widget.write_text(s);updater.write_text(u)
          ET.parse(root/'app/src/main/res/layout/duwm_widget.xml')
          for name in ('healthy','new','offline'):
              ET.parse(root/f'app/src/main/res/drawable/duwm_ring_{name}.xml')
          assert 'DuwmWidgetProvider.refreshAll(app)' in updater.read_text()
          assert 'public static void refreshAll(Context c)' in widget.read_text()
          print('PASS: original DU widget update dispatch also refreshes all 24 source-backed widgets')
          print('PASS: missing source timestamps no longer render as genuine zero')
          PYCODE
      - name: Raisedpodium12 static regression checks
        shell: bash
        run: |
