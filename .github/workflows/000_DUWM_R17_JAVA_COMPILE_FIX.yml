              public static Snapshot evaluate(double linearProgress) {
                  double p=clamp01(linearProgress);
                  if(p<=0.0d)return new Snapshot(State.AT_EXACT_START,0.0d,0.0d);
                  if(p>=1.0d)return new Snapshot(State.AT_EXACT_END,1.0d,1.0d);

                  final double zone=0.20d;
                  final double begin=1.0d-zone;
                  if(p>begin) {
                      double x=(p-begin)/zone;
                      // cubic smoothstep joins linear baseline at 0.8 and reaches endpoint exactly.
                      double smooth=x*x*(3.0d-2.0d*x);
                      double eased=begin+zone*smooth;
                      return new Snapshot(State.EASING_OUT,p,eased);
                  }
                  return new Snapshot(State.CRUISE,p,p);
              }

              public static boolean mayRewriteSourceCoordinates(){ return false; }
              public static boolean mayOvershootEndpoint(){ return false; }
              public static boolean exactEndpointGuaranteed(){ return evaluate(1.0d).easedProgress==1.0d; }
          }
