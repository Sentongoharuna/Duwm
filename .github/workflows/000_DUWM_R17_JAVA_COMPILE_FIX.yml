          cat > "$F" <<'JAVA'
          package com.sentongoharuna.worldsituationroom;

          /**
           * V3.2/30.3/30.4 SMOOTH START.
           * Applies bounded ease-in to display progress only. The real start/end
           * observations remain untouched and progress can never leave [0,1].
           */
          public final class SmoothingSmoothStart {
              public enum State { AT_EXACT_START, EASING_IN, CRUISE_HANDOFF, AT_EXACT_END }

              public static final class Snapshot {
                  public final State state;
                  public final double linearProgress;
                  public final double easedProgress;
                  Snapshot(State s,double linear,double eased) {
                      state=s;
                      linearProgress=clamp01(linear);
                      easedProgress=clamp01(eased);
                  }
              }

              private static double clamp01(double v) {
                  if(Double.isNaN(v)||Double.isInfinite(v)) return 0.0d;
                  return Math.max(0.0d,Math.min(1.0d,v));
              }

              /*
               * Smooth-start foundation: smoothstep on the first 20% of normalized
               * progress, then hand back continuously to linear baseline.
               */
              public static Snapshot evaluate(double linearProgress) {
                  double p=clamp01(linearProgress);
                  if(p<=0.0d) return new Snapshot(State.AT_EXACT_START,0.0d,0.0d);
                  if(p>=1.0d) return new Snapshot(State.AT_EXACT_END,1.0d,1.0d);

                  final double zone=0.20d;
                  if(p<zone) {
                      double x=p/zone;
                      double smooth=x*x*(3.0d-2.0d*x);
                      double eased=zone*smooth;
                      return new Snapshot(State.EASING_IN,p,eased);
                  }
                  return new Snapshot(State.CRUISE_HANDOFF,p,p);
              }

              public static boolean mayRewriteSourceCoordinates(){ return false; }
              public static boolean mayMoveStartEndpoint(){ return false; }
              public static boolean mayMoveEndEndpoint(){ return false; }
          }
          JAVA

