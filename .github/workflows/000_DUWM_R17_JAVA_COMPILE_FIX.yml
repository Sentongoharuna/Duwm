        shell: bash
        run: |
          set -euo pipefail
          F="$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom/SmoothingMidMotionRetarget.java"
          cat > "$F" <<'JAVA'
          package com.sentongoharuna.worldsituationroom;

          /**
           * V3.2/30.3/30.14 MID-MOTION RETARGET SMOOTHING.
           * A newer genuine observation arriving during motion starts the new visual
           * smoothing path at the exact currently displayed geography, never at the old
           * source start or old target. The new real observation remains the exact target.
           */
          public final class SmoothingMidMotionRetarget {
              public enum State { RETARGET_READY, RETARGET_ACTIVE, EXACT_NEW_TARGET, BLOCKED }

              public static final class Snapshot {
                  public final State state;
                  public final double visualStartLatitude;
                  public final double visualStartLongitude;
                  public final double targetLatitude;
                  public final double targetLongitude;
                  public final double easedProgress;
                  public final double displayLatitude;
                  public final double displayLongitude;

                  Snapshot(State state,double slat,double slon,double tlat,double tlon,double p) {
                      this.state=state;
                      visualStartLatitude=slat;
                      visualStartLongitude=normalizeLongitude(slon);
                      targetLatitude=tlat;
                      targetLongitude=normalizeLongitude(tlon);
                      easedProgress=clamp01(p);
                      if(easedProgress<=0.0d) {
                          displayLatitude=visualStartLatitude;
                          displayLongitude=visualStartLongitude;
                      } else if(easedProgress>=1.0d) {
                          displayLatitude=targetLatitude;
                          displayLongitude=targetLongitude;
                      } else {
                          displayLatitude=visualStartLatitude+(targetLatitude-visualStartLatitude)*easedProgress;
                          double dlon=normalizeLongitude(targetLongitude-visualStartLongitude);
                          displayLongitude=normalizeLongitude(visualStartLongitude+dlon*easedProgress);
                      }
                  }
              }

              private static double clamp01(double v) {
                  if(Double.isNaN(v)||Double.isInfinite(v))return 0.0d;
                  return Math.max(0.0d,Math.min(1.0d,v));
              }
              private static double normalizeLongitude(double x) {
                  return ((x+180.0d)%360.0d+360.0d)%360.0d-180.0d;
              }

              public static Snapshot evaluate(double currentDisplayLat,double currentDisplayLon,
                                              double newTargetLat,double newTargetLon,
                                              double easedProgress,boolean newerObservationValid) {
                  if(!newerObservationValid)
                      return new Snapshot(State.BLOCKED,currentDisplayLat,currentDisplayLon,
                              newTargetLat,newTargetLon,0.0d);
                  double p=clamp01(easedProgress);
                  State state=p<=0.0d?State.RETARGET_READY:
                          (p>=1.0d?State.EXACT_NEW_TARGET:State.RETARGET_ACTIVE);
                  return new Snapshot(state,currentDisplayLat,currentDisplayLon,
                          newTargetLat,newTargetLon,p);
              }

              public static boolean maySnapBackToOldStart(){ return false; }
              public static boolean maySnapToOldTarget(){ return false; }
              public static boolean mayRewriteSourceCoordinates(){ return false; }
          }
          JAVA

