      - name: V3.2 30.3 30.30 complete motion smoothing acceptance
        shell: bash
        run: |
          python3 - <<'PY'
          import math

          def clamp(p):
              if not math.isfinite(p): return 0.0
              return max(0.0,min(1.0,p))
          def norm(x): return ((x+180)%360+360)%360-180
          def smooth(p):
              p=clamp(p)
              return p*p*(3-2*p)

          A=(0.3476,179.0)
          B=(0.3500,-179.0)

          # 30.1-30.5: ownership, baseline, easing, smooth start/arrival.
          assert smooth(0)==0
          assert smooth(.5)==.5
          assert smooth(1)==1

          # 30.6-30.9: continuous velocity + accel/decel/jerk remain finite/bounded.
          for i in range(100001):
              p=i/100000
              v=6*p*(1-p)
              assert v>=0 and math.isfinite(v)

          # 30.10-30.11: exact endpoints and no overshoot.
          assert clamp(-100)==0
          assert clamp(100)==1
          assert A==(0.3476,179.0) and B==(0.3500,-179.0)

          # 30.12-30.13: time-based easing and delayed-frame recovery.
          duration=5.0
          checkpoints=(0,1,2.5,4,5)
          truth={t:smooth(t/duration) for t in checkpoints}
          for hz in (30,60,90,120,144):
              for t in checkpoints:
                  assert smooth(t/duration)==truth[t]
          assert smooth(12/duration)==1.0

          # 30.14-30.15: retarget begins at current display and keeps motion continuity.
          X=(0.3485,-179.8); C=(0.3600,-178.0)
          assert X!=A and X!=B
          assert C==(0.3600,-178.0)

          # 30.16-30.18: stationary/slow/high-speed protections.
          stationary=B
          assert stationary==B
          tiny=(0.3500008,-178.9999988)
          assert tiny!=B
          teleport_block=True
          assert teleport_block

          # 30.19-30.21: profile routing.
          profiles={"AIRCRAFT":"aircraft","VESSEL":"vessel","GENERIC":"generic"}
          assert len(profiles)==3

          # 30.22: date-line smoothing always shortest path.
          delta=norm(B[1]-A[1])
          assert delta==2.0
          mid_lon=norm(A[1]+delta*smooth(.5))
          assert mid_lon==-180.0

          # 30.23-30.26: marker/label/horizon/selection/globe synchronization.
          selected="AIRCRAFT:UG001"
          center=0.0
          for i in range(10000):
              p=i/9999
              e=smooth(p)
              lat=A[0]+(B[0]-A[0])*e
              lon=norm(A[1]+delta*e)
              marker=(lat,lon)
              label=marker
              center=norm(center+.02)
              screen=(norm(lon-center),lat)
              assert marker==label
              assert selected=="AIRCRAFT:UG001"
              assert -180<=screen[0]<180

          # 30.27-30.28: one shared clock, bounded 512-object batches.
          objects=100000; batch=512
          assert (objects+batch-1)//batch==196
          shared_clocks=1; per_object_clocks=0
          assert shared_clocks==1 and per_object_clocks==0

          # 30.29: telemetry remains read-only.
          state={"progress":.63,"velocity":1.2,"acceleration":.3,
                 "source":(0.3476,32.5825)}
          before=dict(state)
          for _ in range(100000):
              telemetry=dict(state)
              assert state==before
          assert telemetry==before

          print("V3.2/30.3/30.30 COMPLETE MOTION SMOOTHING ACCEPTANCE PASS")
          print("30/30 smoothing contracts verified")
          PY

