                  public final State state;
                  public final double requestedEasedProgress;
                  public final double boundedEasedProgress;
                  Snapshot(State state,double requested,double bounded) {
                      this.state=state;
                      requestedEasedProgress=requested;
                      boundedEasedProgress=bounded;
                  }
              }

              public static Snapshot enforce(double requested) {
                  if(Double.isNaN(requested)||requested==Double.NEGATIVE_INFINITY)
                      return new Snapshot(State.CLAMPED_TO_START,requested,0.0d);
                  if(requested==Double.POSITIVE_INFINITY)
                      return new Snapshot(State.CLAMPED_TO_END,requested,1.0d);
                  if(requested<=0.0d)
                      return new Snapshot(State.CLAMPED_TO_START,requested,0.0d);
                  if(requested>=1.0d)
                      return new Snapshot(State.CLAMPED_TO_END,requested,1.0d);
                  return new Snapshot(State.WITHIN_ENDPOINTS,requested,requested);
              }

              public static boolean mayOvershootStart(){ return false; }
              public static boolean mayOvershootEnd(){ return false; }
              public static boolean mayRewriteSourceCoordinates(){ return false; }
          }
          JAVA

