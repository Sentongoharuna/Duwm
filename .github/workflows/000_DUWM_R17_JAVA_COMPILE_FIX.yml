      - name: V3.2 30.3 30.29 install smoothing telemetry jitter detection
        shell: bash
        run: |
          set -euo pipefail
          F="$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom/SmoothingTelemetryJitter.java"
          cat > "$F" <<'JAVA'
          package com.sentongoharuna.worldsituationroom;

          /**
           * V3.2/30.3/30.29 SMOOTHING TELEMETRY & JITTER DETECTION.
           * Read-only diagnostics compare consecutive smoothed display samples and flag
           * abnormal progress/velocity/acceleration discontinuities without changing motion.
           */
          public final class SmoothingTelemetryJitter {
              public enum JitterState {
                  STABLE,
                  PROGRESS_REVERSAL_SUSPECT,
                  VELOCITY_JUMP_SUSPECT,
                  ACCELERATION_JUMP_SUSPECT,
                  COMPLETE,
                  INACTIVE
              }

              public static final class Snapshot {
                  public final JitterState state;
                  public final double progress;
                  public final double velocity;
                  public final double acceleration;
                  public final double progressDelta;
                  public final double velocityDelta;
                  public final double accelerationDelta;

                  Snapshot(JitterState state,double progress,double velocity,double acceleration,
                           double dp,double dv,double da) {
                      this.state=state;
                      this.progress=clamp01(progress);
                      this.velocity=Math.max(0.0d,velocity);
                      this.acceleration=acceleration;
                      progressDelta=dp;
                      velocityDelta=dv;
                      accelerationDelta=da;
                  }
              }

              private static double clamp01(double v) {
                  if(Double.isNaN(v)||Double.isInfinite(v))return 0.0d;
                  return Math.max(0.0d,Math.min(1.0d,v));
              }

              public static Snapshot inspect(double previousProgress,double currentProgress,
                                             double previousVelocity,double currentVelocity,
                                             double previousAcceleration,double currentAcceleration,
                                             boolean active) {
                  double prevP=clamp01(previousProgress);
                  double curP=clamp01(currentProgress);
                  double dp=curP-prevP;
                  double dv=Math.max(0.0d,currentVelocity)-Math.max(0.0d,previousVelocity);
                  double da=currentAcceleration-previousAcceleration;

                  if(!active)
                      return new Snapshot(JitterState.INACTIVE,curP,currentVelocity,currentAcceleration,dp,dv,da);
                  if(curP>=1.0d)
                      return new Snapshot(JitterState.COMPLETE,curP,currentVelocity,currentAcceleration,dp,dv,da);
                  if(dp < -1.0e-12d)
                      return new Snapshot(JitterState.PROGRESS_REVERSAL_SUSPECT,curP,currentVelocity,currentAcceleration,dp,dv,da);
                  if(Math.abs(dv)>0.25d)
                      return new Snapshot(JitterState.VELOCITY_JUMP_SUSPECT,curP,currentVelocity,currentAcceleration,dp,dv,da);
                  if(Math.abs(da)>0.50d)
                      return new Snapshot(JitterState.ACCELERATION_JUMP_SUSPECT,curP,currentVelocity,currentAcceleration,dp,dv,da);
                  return new Snapshot(JitterState.STABLE,curP,currentVelocity,currentAcceleration,dp,dv,da);
              }

              public static boolean telemetryMayChangeProgress(){ return false; }
              public static boolean telemetryMayChangeVelocity(){ return false; }
              public static boolean telemetryMayRewriteSourceCoordinates(){ return false; }
          }
          JAVA

