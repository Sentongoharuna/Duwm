          /**
           * V3.2/30.3/30.22 DATE-LINE SMOOTHING.
           * Eased longitude follows the same shortest geographic angular path established
           * by 30.2. Smoothing cannot turn a +/-180 crossing into a long-way-around route.
           */
          public final class SmoothingDateLine {
              public enum State { NORMAL_ROUTE, DATE_LINE_CROSSING, EXACT_ENDPOINT, BLOCKED }

              public static final class Snapshot {
                  public final State state;
                  public final double startLongitude;
                  public final double endLongitude;
                  public final double shortestDelta;
                  public final double easedProgress;
                  public final double displayLongitude;
                  Snapshot(State state,double start,double end,double delta,double p,double display) {
                      this.state=state;
                      startLongitude=normalizeLongitude(start);
                      endLongitude=normalizeLongitude(end);
                      shortestDelta=delta;
                      easedProgress=clamp01(p);
                      displayLongitude=normalizeLongitude(display);
                  }
              }

              private static double clamp01(double v) {
                  if(Double.isNaN(v)||Double.isInfinite(v))return 0.0d;
                  return Math.max(0.0d,Math.min(1.0d,v));
              }
              private static double normalizeLongitude(double x) {
                  return ((x+180.0d)%360.0d+360.0d)%360.0d-180.0d;
              }

              public static Snapshot evaluate(double startLon,double endLon,
                                              double easedProgress,boolean interpolationAllowed) {
                  double start=normalizeLongitude(startLon);
                  double end=normalizeLongitude(endLon);
                  double delta=normalizeLongitude(end-start);
                  double p=clamp01(easedProgress);
                  if(!interpolationAllowed)
                      return new Snapshot(State.BLOCKED,start,end,delta,0.0d,start);
                  if(p>=1.0d)
                      return new Snapshot(State.EXACT_ENDPOINT,start,end,delta,1.0d,end);
                  double display=normalizeLongitude(start+delta*p);
                  boolean crossing=Math.abs(end-start)>180.0d;
                  return new Snapshot(crossing?State.DATE_LINE_CROSSING:State.NORMAL_ROUTE,
                          start,end,delta,p,display);
              }

              public static boolean mayUseLongWayAround(){ return false; }
              public static boolean mayRewriteSourceLongitude(){ return false; }
              public static boolean mayOvershootEndpoint(){ return false; }
          }
