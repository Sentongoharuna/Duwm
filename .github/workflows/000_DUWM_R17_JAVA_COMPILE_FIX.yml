              st,opacity=state(0,lon)
              marker_visible=(st!="BACK_HIDDEN")
              label_visible=(st!="BACK_HIDDEN")
              assert marker_visible==label_visible
              assert 0.0<=opacity<=1.0

          # Geography is unaffected by visual horizon treatment.
          geo=(0.3476,32.5825)
          frozen=geo
          for _ in range(100000):
              _=state(geo[0],geo[1])
              assert geo==frozen

          print("V3.2/30.3/30.24 HEMISPHERE HORIZON SMOOTHING FUNCTIONAL ACCEPTANCE PASS")
          PY

