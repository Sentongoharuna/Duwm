; return; } if(v31LastFrameNanos!=0L){ long deltaNanos=frameTimeNanos-v31LastFrameNanos; if(deltaNanos<=0L){ v313RejectedFrameCount++; v31LastFrameNanos=frameTimeNanos; v317PostNextFrame(); return; } double rawDt=deltaNanos/1000000000.0d; if(rawDt>0.100d)v313ClampedFrameCount++; double dt=Math.min(rawDt,0.100d); v313FrameCount++; v313IntegratedSeconds+=dt; v314ActualDegPerSecond=Math.max(V314_MIN_DEG_PER_SECOND,Math.min(V314_MAX_DEG_PER_SECOND,v314RequestedDegPerSecond)); if(v314RampActive){ if(v314RampStartFrameNanos==0L)v314RampStartFrameNanos=frameTimeNanos; double rampT=Math.max(0.0d,Math.min(1.0d,(frameTimeNanos-v314RampStartFrameNanos)/(double)V314_RAMP_DURATION_NANOS)); v314RampFactor=rampT*rampT*(3.0d-2.0d*rampT); if(rampT>=1.0d){ v314RampActive=false; v314RampFactor=1.0d; v314RampCompletedCount++; } } else { v314RampFactor=1.0d; } if(v315PauseRampActive){ if(v315PauseRampStartNanos==0L)v315PauseRampStartNanos=frameTimeNanos; double pauseT=Math.max(0.0d,Math.min(1.0d,(frameTimeNanos-v315PauseRampStartNanos)/(double)V315_PAUSE_RAMP_DURATION_NANOS)); double p=pauseT*pauseT*(3.0d-2.0d*pauseT); v315PauseRampFactor=1.0d-p; if(pauseT>=1.0d){ v315PauseRampActive=false; v315PauseRampFactor=0.0d; v315PauseRampCompletedCount++; } } else if(v315PauseRampFactor!=0.0d){ v315PauseRampFactor=1.0d; } double frameDegrees=(v314ActualDegPerSecond*v314RampFactor*v315PauseRampFactor)*dt; v313IntegratedDegrees+=frameDegrees; if(frameDegrees>=0.0d)v330AcceptedFrameCount++; v321SelectionPreservationFrameCount++; "+state+"=("+state+"+frameDegrees); if(Math.abs("+lat_state+"-v318ProtectedLatitude)>0.0000001d){ "+lat_state+"=v318ProtectedLatitude; v318LatitudeDriftCorrectionCount++; } if(Math.abs("+zoom_state+"-v319ProtectedZoom)>0.0000001d){ "+zoom_state+"=v319ProtectedZoom; v319ZoomDriftCorrectionCount++; }"+orient_guard+" if("+state+">=180.0d||"+state+"< -180.0d)v316WrapCount++; "+state+"=v317NormalizeLongitude("+state+"); if(v327ShouldRender(dt))v322InvalidateGeographicProjection(