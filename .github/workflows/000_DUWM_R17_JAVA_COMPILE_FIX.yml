          cat > "$F" <<'JAVA'
          package com.sentongoharuna.worldsituationroom;

          /**
           * V3.2/30.3/30.15 RETARGET VELOCITY CONTINUITY.
           * A mid-motion retarget inherits the current visual velocity rather than
           * restarting from zero or jumping directly to a newly requested velocity.
           * Acceleration/deceleration limits remain authoritative.
           */
          public final class SmoothingRetargetVelocityContinuity {
              public enum State { VELOCITY_PRESERVED, ACCELERATION_LIMITED, DECELERATION_LIMITED, HOLDING }

              public static final class Snapshot {
                  public final State state;
                  public final double inheritedVelocity;
                  public final double requestedVelocity;
                  public final double outputVelocity;
                  Snapshot(State s,double inherited,double requested,double output) {
                      state=s;
                      inheritedVelocity=Math.max(0.0d,inherited);
                      requestedVelocity=Math.max(0.0d,requested);
                      outputVelocity=Math.max(0.0d,output);
                  }
              }

              public static Snapshot preserve(double currentVelocity,double requestedVelocity,
                                              double deltaSeconds,double maxAcceleration,
                                              double maxDeceleration) {
                  double current=Math.max(0.0d,currentVelocity);
                  double requested=Math.max(0.0d,requestedVelocity);
                  double dt=Math.max(0.0d,deltaSeconds);
                  if(dt<=0.0d)return new Snapshot(State.HOLDING,current,requested,current);

                  double maxUp=Math.max(0.0d,maxAcceleration)*dt;
                  double maxDown=Math.max(0.0d,maxDeceleration)*dt;

                  if(requested>current+maxUp)
                      return new Snapshot(State.ACCELERATION_LIMITED,current,requested,current+maxUp);
                  if(requested<current-maxDown)
                      return new Snapshot(State.DECELERATION_LIMITED,current,requested,
                              Math.max(0.0d,current-maxDown));
                  return new Snapshot(State.VELOCITY_PRESERVED,current,requested,requested);
              }

              public static boolean mayResetVelocityToZeroOnRetarget(){ return false; }
              public static boolean mayRewriteSourceCoordinates(){ return false; }
              public static boolean mayMoveNewRealTarget(){ return false; }
          }
          JAVA

