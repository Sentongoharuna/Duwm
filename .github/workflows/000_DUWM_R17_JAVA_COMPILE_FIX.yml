      - name: V3.2 30.3 30.28 install large fleet smoothing performance protection
        shell: bash
        run: |
          set -euo pipefail
          F="$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom/SmoothingLargeFleetPerformance.java"
          cat > "$F" <<'JAVA'
          package com.sentongoharuna.worldsituationroom;

          /**
           * V3.2/30.3/30.28 LARGE-FLEET SMOOTHING PERFORMANCE PROTECTION.
           * Reuses bounded 512-object fleet batches with the one shared smoothing clock.
           * Fleet growth cannot create private schedulers or unbounded per-frame work units.
           */
          public final class SmoothingLargeFleetPerformance {
              public enum State { EMPTY, SINGLE_BATCH, LARGE_FLEET_BATCHED, PAUSED }

              public static final int BATCH_SIZE=512;

              public static final class Snapshot {
                  public final State state;
                  public final int trackedObjects;
                  public final int smoothingEligibleObjects;
                  public final int batchSize;
                  public final int requiredBatches;
                  public final int perObjectClockCount;

                  Snapshot(State state,int tracked,int eligible) {
                      this.state=state;
                      trackedObjects=Math.max(0,tracked);
                      smoothingEligibleObjects=Math.max(0,eligible);
                      batchSize=BATCH_SIZE;
                      requiredBatches=smoothingEligibleObjects==0?0:
                              (smoothingEligibleObjects+BATCH_SIZE-1)/BATCH_SIZE;
                      perObjectClockCount=0;
                  }
              }

              public static Snapshot evaluate(int trackedObjects,int smoothingEligibleObjects,
                                              boolean lifecycleActive) {
                  if(!lifecycleActive)
                      return new Snapshot(State.PAUSED,trackedObjects,0);
                  int eligible=Math.max(0,Math.min(trackedObjects,smoothingEligibleObjects));
                  if(eligible==0)return new Snapshot(State.EMPTY,trackedObjects,0);
                  return new Snapshot(eligible<=BATCH_SIZE?State.SINGLE_BATCH:State.LARGE_FLEET_BATCHED,
                          trackedObjects,eligible);
              }

              public static boolean mayCreatePerObjectScheduler(){ return false; }
              public static boolean mayCreateUnboundedBatch(){ return false; }
              public static boolean maySkipEligibleObject(){ return false; }
              public static boolean mayRewriteSourceCoordinates(){ return false; }
          }
          JAVA

