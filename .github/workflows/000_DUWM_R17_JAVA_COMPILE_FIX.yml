      - name: V3.2 30.3 30.1 install smoothing engine foundation
        shell: bash
        run: |
          set -euo pipefail
          PKG="$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom"
          mkdir -p "$PKG"
          cat > "$PKG/SmoothingEngineFoundation.java" <<'JAVA'
          package com.sentongoharuna.worldsituationroom;

          /**
           * V3.2/30.3/30.1 SMOOTHING ENGINE FOUNDATION.
           * Smoothing owns display progress only. It never rewrites source coordinates,
           * observation timestamps, stable identity, or accepted endpoints.
           */
          public final class SmoothingEngineFoundation {
              public enum State {
                  DISABLED,
                  READY_ON_INTERPOLATED_PROGRESS,
                  ACTIVE,
                  COMPLETE,
                  BLOCKED
              }

              public enum Authority {
                  DISPLAY_PROGRESS_ONLY,
                  NEVER_SOURCE_COORDINATES
              }

              public static final class Snapshot {
                  public final State state;
                  public final Authority authority;
                  public final double linearProgress;
                  public final double smoothedProgress;
                  public final boolean sourceCoordinatesImmutable;
                  public final boolean exactStartPreserved;
                  public final boolean exactEndPreserved;

                  Snapshot(State state, double linearProgress) {
                      this.state = state;
                      this.authority = Authority.DISPLAY_PROGRESS_ONLY;
                      this.linearProgress = clamp01(linearProgress);
                      // Foundation is intentionally identity easing.
                      this.smoothedProgress = this.linearProgress;
                      this.sourceCoordinatesImmutable = true;
                      this.exactStartPreserved = this.smoothedProgress == 0.0d;
                      this.exactEndPreserved = this.smoothedProgress == 1.0d;
                  }
              }

              private long evaluationCount;
              private long blockedCount;

              public synchronized Snapshot evaluate(double interpolationProgress,
                                                    boolean endpointsBound,
                                                    boolean interpolationAllowed) {
                  double p = clamp01(interpolationProgress);
                  State state;
                  if (!endpointsBound || !interpolationAllowed) {
                      state = State.BLOCKED;
                      blockedCount++;
                  } else if (p <= 0.0d) {
                      state = State.READY_ON_INTERPOLATED_PROGRESS;
                      evaluationCount++;
                  } else if (p >= 1.0d) {
                      state = State.COMPLETE;
                      evaluationCount++;
                  } else {
                      state = State.ACTIVE;
                      evaluationCount++;
                  }
                  return new Snapshot(state, p);
              }

              public static double clamp01(double value) {
                  if (Double.isNaN(value) || Double.isInfinite(value)) return 0.0d;
                  return Math.max(0.0d, Math.min(1.0d, value));
              }

              public boolean mayRewriteSourceCoordinates() { return false; }
              public boolean mayExtrapolateBeyondEndpoint() { return false; }
              public long evaluationCount() { return evaluationCount; }
              public long blockedCount() { return blockedCount; }
          }
          JAVA

