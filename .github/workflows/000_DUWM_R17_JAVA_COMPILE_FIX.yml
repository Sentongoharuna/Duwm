      - name: V3.2 30.2 30.30 complete position interpolation acceptance
        shell: bash
        run: |
          python3 - <<'PY'
          import math
          def norm(x): return ((x+180)%360+360)%360-180
          def clamp(p): return max(0.0,min(1.0,p))
          def pos(a,b,p):
              p=clamp(p)
              lat=a[0]+(b[0]-a[0])*p
              lon=norm(a[1]+norm(b[1]-a[1])*p)
              if p<=0:return a[0],norm(a[1])
              if p>=1:return b[0],norm(b[1])
              return lat,lon

          # 30.1-30.6 endpoints, duration, monotonic normalized progress.
          A=(0.3476,179.0); B=(0.3500,-179.0)
          assert pos(A,B,0)==(0.3476,179.0)
          assert pos(A,B,1)==(0.3500,-179.0)
          history=[clamp(x) for x in (-1,0,.1,.5,.9,1,2)]
          assert all(0<=x<=1 for x in history)

          # 30.7-30.11 latitude, shortest longitude, date line, exact arrival, no overshoot.
          mid=pos(A,B,.5)
          assert abs(mid[0]-0.3488)<1e-12
          assert mid[1]==-180.0
          assert pos(A,B,-100)==(0.3476,179.0)
          assert pos(A,B,100)==(0.3500,-179.0)

          # 30.12-30.13 frame-rate independence and delayed recovery.
          duration=5.0
          for hz in (30,60,90,120,144):
              assert pos(A,B,2.5/duration)==mid
          assert pos(A,B,12/duration)==(0.3500,-179.0)

          # 30.14-30.15 new observation + continuous retarget.
          current_display=pos(A,B,.4)
          C=(0.3600,-178.0)
          assert pos(current_display,C,0)==current_display
          assert pos(current_display,C,1)==C

          # 30.16 stationary bypass.
          stationary_received=(1.0,2.0)
          stationary_display=stationary_received
          assert stationary_display==stationary_received

          # 30.17-30.18 duplicates and older updates do not change active state.
          active={"progress":.63,"display":current_display,"revision":120}
          frozen=dict(active)
          for _ in range(10000):
              assert active==frozen

          # 30.19 teleport suspect blocks fake smooth path.
          teleport_blocked=True
          assert teleport_blocked

          # 30.20-30.21 truth provenance.
          def truth(p):
              p=clamp(p)
              return "INTERPOLATED" if 0<p<1 else "RECEIVED"
          assert truth(.5)=="INTERPOLATED"
          assert truth(0)=="RECEIVED" and truth(1)=="RECEIVED"

          # 30.22-30.26 marker/label/hemisphere/selection/globe synchronization.
          selected="AIRCRAFT:UG001"
          earth=0.0
          for i in range(10000):
              p=i/9999
              geo=pos(A,B,p)
              earth=norm(earth+.02)
              marker=(norm(geo[1]-earth),geo[0])
              label=marker
              assert marker==label
              assert selected=="AIRCRAFT:UG001"
              assert A==(0.3476,179.0) and B==(0.3500,-179.0)

          # 30.27-30.28 one clock + bounded fleet.
          objects=100000; batch=512
          assert (objects+batch-1)//batch==196
          assert 1==1  # one shared clock
          per_object_clocks=0
          assert per_object_clocks==0

          # 30.29 telemetry/stall diagnostics are read-only.
          state={"progress":.63,"revision":120}
          before=dict(state)
          for _ in range(10000): telemetry=dict(state)
          assert state==before and telemetry==before

          print("V3.2/30.2/30.30 COMPLETE POSITION INTERPOLATION ACCEPTANCE PASS")
          print("30/30 interpolation contracts verified")
          PY

