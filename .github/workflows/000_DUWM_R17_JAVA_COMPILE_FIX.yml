          F="$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom/SmoothingHemisphereHorizon.java"
          cat > "$F" <<'JAVA'
          package com.sentongoharuna.worldsituationroom;

          /**
           * V3.2/30.3/30.24 HEMISPHERE/HORIZON SMOOTHING.
           * Visibility follows spherical front/back truth. A narrow front-side horizon
           * band may smoothly reduce visual opacity, but no object on the back hemisphere
           * may remain rendered and opacity never changes geographic truth.
           */
          public final class SmoothingHemisphereHorizon {
              public enum State { FRONT_VISIBLE, FRONT_HORIZON_FADE, BACK_HIDDEN, BLOCKED }

              public static final class Snapshot {
                  public final State state;
                  public final boolean markerVisible;
                  public final boolean labelVisible;
                  public final double opacity;
                  public final double hemisphereDot;
                  Snapshot(State state,boolean visible,double opacity,double dot) {
                      this.state=state;
                      markerVisible=visible;
                      labelVisible=visible;
                      this.opacity=Math.max(0.0d,Math.min(1.0d,opacity));
                      hemisphereDot=dot;
                  }
              }

              public static Snapshot evaluate(double objectLat,double objectLon,
                                              double centerLat,double centerLon,
                                              boolean smoothingAllowed) {
                  if(!smoothingAllowed)
                      return new Snapshot(State.BLOCKED,false,0.0d,-1.0d);

                  double p1=Math.toRadians(centerLat);
                  double p2=Math.toRadians(objectLat);
                  double dl=Math.toRadians(objectLon-centerLon);
                  double dot=Math.sin(p1)*Math.sin(p2)
                          +Math.cos(p1)*Math.cos(p2)*Math.cos(dl);

                  if(dot<0.0d)
                      return new Snapshot(State.BACK_HIDDEN,false,0.0d,dot);

                  // Front-side-only fade over the final 5% of spherical visibility.
                  final double horizonBand=0.05d;
                  if(dot<horizonBand) {
                      double x=dot/horizonBand;
                      double opacity=x*x*(3.0d-2.0d*x);
                      return new Snapshot(State.FRONT_HORIZON_FADE,true,opacity,dot);
                  }
                  return new Snapshot(State.FRONT_VISIBLE,true,1.0d,dot);
              }

              public static boolean backHemisphereMayRemainVisible(){ return false; }
              public static boolean labelMayDisagreeWithMarkerVisibility(){ return false; }
              public static boolean mayRewriteGeographicCoordinates(){ return false; }
          }
          JAVA

