          package com.sentongoharuna.worldsituationroom;

          /**
           * V3.2/30.3/30.13 DELAYED-FRAME SMOOTHING RECOVERY.
           * After a render delay, eased display progress is recomputed from elapsed
           * monotonic time. Missed frames are not replayed and progress never rewinds.
           */
          public final class SmoothingDelayedFrameRecovery {
              public enum State { ON_TIME, RECOVERED_FORWARD, COMPLETE, BLOCKED }

              public static final class Snapshot {
                  public final State state;
                  public final double previousProgress;
                  public final double recoveredProgress;
                  public final long elapsedNanos;
                  Snapshot(State s,double previous,double recovered,long elapsed) {
                      state=s;
                      previousProgress=clamp01(previous);
                      recoveredProgress=Math.max(previousProgress,clamp01(recovered));
                      elapsedNanos=Math.max(0L,elapsed);
                  }
              }

              private static double clamp01(double v) {
                  if(Double.isNaN(v)||Double.isInfinite(v))return 0.0d;
                  return Math.max(0.0d,Math.min(1.0d,v));
              }
              private static double smoothstep(double p) {
                  p=clamp01(p);
                  return p*p*(3.0d-2.0d*p);
              }

              public static Snapshot recover(double previousProgress,long elapsedNanos,long durationNanos) {
                  if(durationNanos<=0L)
                      return new Snapshot(State.BLOCKED,previousProgress,previousProgress,elapsedNanos);
                  double linear=clamp01((double)Math.max(0L,elapsedNanos)/(double)durationNanos);
                  double eased=smoothstep(linear);
                  double recovered=Math.max(clamp01(previousProgress),eased);
                  State state=recovered>=1.0d?State.COMPLETE:
                          (recovered>clamp01(previousProgress)?State.RECOVERED_FORWARD:State.ON_TIME);
                  return new Snapshot(state,previousProgress,recovered,elapsedNanos);
              }

              public static boolean replaysMissedFrames(){ return false; }
              public static boolean mayRewindProgress(){ return false; }
              public static boolean mayRewriteSourceCoordinates(){ return false; }
          }
          JAVA

