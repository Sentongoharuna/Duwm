          package com.sentongoharuna.worldsituationroom;

          /**
           * V3.2/30.3/30.12 FRAME-RATE INDEPENDENT EASING.
           * Eased display progress is a pure function of elapsed monotonic time divided by
           * the real interpolation duration. Frame count and display refresh rate are not inputs.
           */
          public final class SmoothingFrameRateIndependent {
              public static final class Snapshot {
                  public final double linearProgress;
                  public final double easedProgress;
                  public final long elapsedNanos;
                  public final long durationNanos;
                  Snapshot(double linear,double eased,long elapsed,long duration) {
                      linearProgress=clamp01(linear);
                      easedProgress=clamp01(eased);
                      elapsedNanos=Math.max(0L,elapsed);
                      durationNanos=Math.max(1L,duration);
                  }
              }

              private static double clamp01(double v) {
                  if(Double.isNaN(v)||Double.isInfinite(v))return 0.0d;
                  return Math.max(0.0d,Math.min(1.0d,v));
              }

              private static double smoothstep(double p) {
                  p=clamp01(p);
                  return p*p*(3.0d-2.0d*p);
              }

              public static Snapshot evaluate(long elapsedNanos,long durationNanos) {
                  long duration=Math.max(1L,durationNanos);
                  double linear=clamp01((double)Math.max(0L,elapsedNanos)/(double)duration);
                  double eased=smoothstep(linear);
                  if(linear<=0.0d)eased=0.0d;
                  if(linear>=1.0d)eased=1.0d;
                  return new Snapshot(linear,eased,elapsedNanos,duration);
              }

              public static boolean dependsOnFrameCount(){ return false; }
              public static boolean dependsOnRefreshRate(){ return false; }
              public static boolean mayRewriteSourceCoordinates(){ return false; }
          }
