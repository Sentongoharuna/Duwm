      - name: V3.2 30.3 30.24 hemisphere horizon smoothing functional acceptance
        shell: bash
        run: |
          python3 - <<'PY'
          import math
          def dot(lat,lon,clat=0,clon=0):
              p1,p2=math.radians(clat),math.radians(lat)
              dl=math.radians(lon-clon)
              return math.sin(p1)*math.sin(p2)+math.cos(p1)*math.cos(p2)*math.cos(dl)
          def state(lat,lon):
              d=dot(lat,lon)
              if d<0:return "BACK_HIDDEN",0.0
              if d<.05:
                  x=d/.05
                  return "FRONT_HORIZON_FADE",x*x*(3-2*x)
              return "FRONT_VISIBLE",1.0

          assert state(0,0)==("FRONT_VISIBLE",1.0)
          assert state(0,180)[0]=="BACK_HIDDEN"
          assert state(0,90)[0]=="FRONT_HORIZON_FADE"
          assert state(0,90.1)[0]=="BACK_HIDDEN"

          # Marker and label always share one visibility decision.
          for i in range(100001):
