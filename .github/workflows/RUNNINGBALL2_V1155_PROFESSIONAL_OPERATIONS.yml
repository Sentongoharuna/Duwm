    - name: Compile the complete preserved native Android APK
      shell: bash
      run: |
        set -euo pipefail
        cd "$PROJECT_DIR"
        gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac :app:assembleDebug --stacktrace
    - name: V1155 Verify signed APK contains new globe + full data source UI
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_V110_APK'
        import os
        import pathlib
        import hashlib
        import zipfile
        import subprocess
        project = pathlib.Path(os.environ['PROJECT_DIR'])
        apks = list((project / 'app/build/outputs/apk/debug').glob('*.apk'))
        assert len(apks) == 1, 'Expected precisely one compiled APK'
        apk = apks[0]
        assert apk.stat().st_size > 20000, 'APK empty or unexpectedly small'
        with zipfile.ZipFile(apk) as z:
            assert z.testzip() is None, 'Broken APK zip'
            names = z.namelist()
            assert 'classes.dex' in names, 'Compiled Java missing'
            assert 'AndroidManifest.xml' in names, 'Android manifest missing'
            assert 'assets/develop_uganda_logo.png' in names, 'Official logo missing from APK'
            assert any(n.endswith('/develop_uganda_logo.png') for n in names), 'Launcher drawable missing'
            digest = hashlib.sha256(z.read('assets/develop_uganda_logo.png')).hexdigest()
            assert digest == 'e583513eda20b22ee9a9641c58a2b58869fd9997a94ae49c1321c378aa32d97b', 'Wrong official logo'
        sdk = pathlib.Path(os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT'])
        bt = sdk / 'build-tools/36.0.0'
        subprocess.run([str(bt / 'apksigner'), 'verify', str(apk)], check=True)
        badge = subprocess.check_output([str(bt / 'aapt'), 'dump', 'badging', str(apk)], text=True)
        assert "name='com.sentongoharuna.worldsituationroom.rb2live25'" in badge, 'Original installation identity lost'
        assert "versionCode='1155'" in badge, 'V1155 versionCode missing'
        assert "RUNNINGBALL2-V1155-PRO-OPERATIONS" in badge, 'V1153 ACTIVE WORLD versionName missing'
        target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release'
        target.mkdir(parents=True, exist_ok=True)
        output = target / 'RUNNINGBALL2-V1155-DEVELOP-UGANDA.apk'
        output.write_bytes(apk.read_bytes())
        print('PASS V1155 signed debug APK', output, output.stat().st_size, flush=True)
        PY_V110_APK
    - name: V1154 Reject an APK without actual new compiled source explorer + ISS
      shell: bash
      run: |
        set -euo pipefail
        python3 - "$RUNNER_TEMP/release/RUNNINGBALL2-V1155-DEVELOP-UGANDA.apk" <<'VERIFY_V1154_NATIVE'
        import hashlib,sys,zipfile
        with zipfile.ZipFile(sys.argv[1]) as z:
            dex=[z.read(n) for n in z.namelist() if n.endswith('.dex')]
            assert dex, 'No compiled program code'
            for symbol in (b'OperationsMainActivity',b'OperationsGlobeView',b'WorldSourceHubActivity',b'LiveCommandActivity',b'LiveEarthGlobeView',b'api.wheretheiss.at',b'celestrak.org',b'iptv-org.github.io',b'radio-browser.info',b'stat.ripe.net',b'opensky-network.org'):
                assert any(symbol in data for data in dex), 'Native world module absent from DEX: '+symbol.decode()
            print('PASS V1155: compiled code contains NEW operational home, interactive Earth, and 8 genuine source handlers')
            print('DEX SHA256:',[hashlib.sha256(d).hexdigest() for d in dex])
        VERIFY_V1154_NATIVE
    - name: Upload compiled V1155 APK even if later emulator test fails
      uses: actions/upload-artifact@v4
      with:
        name: RUNNINGBALL2-V1155-APK-BACKUP-ARTIFACT
        path: ${{ runner.temp }}/release/RUNNINGBALL2-V1155-DEVELOP-UGANDA.apk
        if-no-files-found: error
        retention-days: 30
    - name: Grant Android emulator KVM access
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Prepare strict V1155 Android emulator screen and motion test
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/v1155-emulator-test.sh" <<'V1155_SCREEN_TEST'
        #!/usr/bin/env bash
        set -euo pipefail
        APK="$RUNNER_TEMP/release/RUNNINGBALL2-V1155-DEVELOP-UGANDA.apk"
        test -s "$APK"
        adb install -r "$APK"
        adb shell am start -n 'com.sentongoharuna.worldsituationroom.rb2live25/com.sentongoharuna.worldsituationroom.OperationsMainActivity'
        sleep 4
        adb shell dumpsys activity activities | grep -q OperationsMainActivity
        adb shell uiautomator dump /sdcard/v1155-main.xml >/dev/null
        adb shell cat /sdcard/v1155-main.xml > /tmp/V1155_MAIN.xml
        grep -q 'WORLD SITUATION ROOM' /tmp/V1155_MAIN.xml
        grep -q 'EARTH  /  GEOGRAPHIC OVERVIEW' /tmp/V1155_MAIN.xml
        grep -q 'Open AIRCRAFT monitoring sources' /tmp/V1155_MAIN.xml
        adb exec-out screencap -p > /tmp/V1155_GLOBE_1.png
        sleep 3
        adb exec-out screencap -p > /tmp/V1155_GLOBE_2.png
        python3 - <<'CHECK_REAL_MOTION'
        from PIL import Image,ImageChops,ImageStat
        x=Image.open('/tmp/V1155_GLOBE_1.png').convert('RGB')
        y=Image.open('/tmp/V1155_GLOBE_2.png').convert('RGB')
        assert x.size==y.size, 'Screen dimensions changed'
        # Only compare the Earth area, excluding the clock, live source updates and operation cards.
        box=(int(x.width*.2),int(x.height*.26),int(x.width*.8),int(x.height*.54))
        diff=ImageChops.difference(x.crop(box),y.crop(box))
        mean=sum(ImageStat.Stat(diff).mean)/3
        assert mean>.02, 'Earth surface did not visibly move on the emulator: '+str(mean)
        print('PASS genuine on-screen Earth movement',mean)
        CHECK_REAL_MOTION
        python3 - <<'FIND_OPERATIONS_TAB'
        import xml.etree.ElementTree as ET,re
        root=ET.parse('/tmp/V1155_MAIN.xml').getroot()
        nodes=[n for n in root.iter('node') if n.get('content-desc')=='Open AIRCRAFT monitoring sources']
        assert len(nodes)==1,'AIRCRAFT operations control not reachable'
        m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',nodes[0].get('bounds',''))
        assert m,'AIRCRAFT tab bounds missing'
        x1,y1,x2,y2=map(int,m.groups())
        open('/tmp/V1155_TAP.txt','w').write(str((x1+x2)//2)+' '+str((y1+y2)//2))
        FIND_OPERATIONS_TAB
        read -r X Y < /tmp/V1155_TAP.txt
        adb shell input tap "$X" "$Y"
        sleep 2
        adb shell dumpsys activity activities | grep -q WorldSourceHubActivity
        adb shell uiautomator dump /sdcard/v1155-source.xml >/dev/null
        adb shell cat /sdcard/v1155-source.xml > /tmp/V1155_SOURCE.xml
        grep -q 'VERIFIED SOURCES' /tmp/V1155_SOURCE.xml
        adb exec-out screencap -p > /tmp/V1155_SOURCE.png
        printf 'PASS V1155: operational globe visible, motion verified, source navigation works\n'
        V1155_SCREEN_TEST
        bash -n "$RUNNER_TEMP/v1155-emulator-test.sh"
    - name: V1155 EMULATOR - professional globe motion and source navigation
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        profile: pixel_6
        cores: 4
        ram-size: 4096M
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        script: bash "$RUNNER_TEMP/v1155-emulator-test.sh"
    - name: Upload V1155 real Android main-globe and source-page evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: RUNNINGBALL2-V1155-REAL-ANDROID-EVIDENCE
        path: |
          /tmp/V1155_MAIN.xml
          /tmp/V1155_GLOBE_1.png
          /tmp/V1155_GLOBE_2.png
          /tmp/V1155_SOURCE.xml
          /tmp/V1155_SOURCE.png
        if-no-files-found: warn
        retention-days: 30
    - name: Publish direct V1155 APK as GitHub Release (not artifact ZIP)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        APK="$RUNNER_TEMP/release/RUNNINGBALL2-V1155-DEVELOP-UGANDA.apk"
        test -s "$APK" || { echo "::error::Compiled V1155 APK is missing"; exit 1; }
        gh --version
        # GitHub Artifacts are always ZIP downloads. Release assets retain .apk extension.
        if gh release view "v1155" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "v1155" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
        else
          gh release create "v1155" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RUNNINGBALL2 V1155 | DEVELOP.UGANDA" \
            --notes "V1155: visible globe, source hub for aircraft, satellites, public cameras, worldwide news, radio, TV, network routing and clearly disclosed AIS requirements. Provider failures are not simulated. Release APK is byte-verified; real phone coverage must be checked." \
            --latest=false
        fi
        echo '## V1155 Direct APK (not ZIP)' >> "$GITHUB_STEP_SUMMARY"
        echo "https://github.com/$GITHUB_REPOSITORY/releases/download/v1155/RUNNINGBALL2-V1155-DEVELOP-UGANDA.apk" >> "$GITHUB_STEP_SUMMARY"
        gh release view v1155 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name=="RUNNINGBALL2-V1155-DEVELOP-UGANDA.apk") | .name + " " + (.size|tostring)' | tee /tmp/V1155_RELEASE_ASSET.txt
        test -s /tmp/V1155_RELEASE_ASSET.txt || { echo "::error::Release asset not visible"; exit 1; }
    - name: Verify V1155 direct release asset is actual matching APK
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        APK="$RUNNER_TEMP/release/RUNNINGBALL2-V1155-DEVELOP-UGANDA.apk"
        RELEASE_DIR="$RUNNER_TEMP/verified-direct-release"
        mkdir -p "$RELEASE_DIR"
        gh release download v1155 --repo "$GITHUB_REPOSITORY" --pattern 'RUNNINGBALL2-V1155-DEVELOP-UGANDA.apk' --dir "$RELEASE_DIR" --clobber
        PUBLIC_APK="$RELEASE_DIR/RUNNINGBALL2-V1155-DEVELOP-UGANDA.apk"
        test -s "$PUBLIC_APK"
        cmp "$APK" "$PUBLIC_APK" || { echo '::error::Published APK differs from the verified built APK'; exit 1; }
        python3 - "$PUBLIC_APK" <<'PY_V1155_DIRECT_APK'
        import pathlib,sys,zipfile
        p=pathlib.Path(sys.argv[1]); assert p.suffix=='.apk' and p.stat().st_size>20000
        with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            for f in ('AndroidManifest.xml','classes.dex','assets/develop_uganda_logo.png'):
                assert f in z.namelist(), f
        print('PASS: GitHub Releases provides identical, signed Android .apk file; ZIP extraction unnecessary')
        PY_V1155_DIRECT_APK
        SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        "$SDK/build-tools/36.0.0/apksigner" verify "$PUBLIC_APK"
        echo '## V1155 Direct APK VERIFIED' >> "$GITHUB_STEP_SUMMARY"
        echo "https://github.com/$GITHUB_REPOSITORY/releases/download/v1155/RUNNINGBALL2-V1155-DEVELOP-UGANDA.apk" >> "$GITHUB_STEP_SUMMARY"
    - name: V1154 provider connectivity audit (not proof of Android runtime feed reception)
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/evidence"
        python3 - "$RUNNER_TEMP/evidence/v1154_provider_probe.json" <<'V1154_PROVIDER'
        import datetime,json,sys,urllib.request,urllib.error
        rows={
          'opensky_aircraft':'https://opensky-network.org/api/states/all',
          'iss_observation':'https://api.wheretheiss.at/v1/satellites/25544',
          'celestrak_orbits':'https://celestrak.org/NORAD/elements/gp.php?GROUP=STATIONS&FORMAT=JSON',
          'bbc_world_rss':'https://feeds.bbci.co.uk/news/world/rss.xml',
          'radio_browser':'https://de1.api.radio-browser.info/json/stations/search?limit=2',
          'iptv_directory':'https://iptv-org.github.io/api/channels.json',
          'ripe_internet_asn':'https://stat.ripe.net/data/country-resource-list/data.json?resource=UG',
        }
        out={'at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(), 'note':'CI server HTTP probes only; device UI not inferred', 'sources':{}}
        for name,url in rows.items():
            try:
                r=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'DEVELOP-UGANDA/1154 integration-audit'}),timeout=7)
                with r: b=r.read(8192)
                out['sources'][name]={'http_status':r.status,'nonempty':bool(b),'sample_bytes':len(b)}
            except Exception as e:
                out['sources'][name]={'status':'UNAVAILABLE','error':str(e)[:160]}
        out['sources']['ais_vessels']={'status':'KEY_AND_BACKEND_REQUIRED','docs':'https://www.aisstream.io/documentation'}
        out['sources']['city_cameras']={'status':'PUBLIC_DIRECTORY_LINKS','api_key_required_for_embedding':True}
        out['sources']['cloudflare_traffic']={'status':'API_KEY_REQUIRED','routing_statistics':'RIPEstat is not live packet traffic'}
        open(sys.argv[1],'w').write(json.dumps(out,indent=2))
        print(json.dumps(out,indent=2))
        V1154_PROVIDER
    - name: Upload provider truth audit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: RUNNINGBALL2-V1155-SOURCE-TRUTH
        path: ${{ runner.temp }}/evidence/v1154_provider_probe.json
        if-no-files-found: ignore
    - name: Display preserved-feature evidence
      if: always()
      shell: bash
      run: |
        if [ -f /tmp/V1152_INHERITED_AUDIT.txt ]; then
          echo '## V1154: inherited source-step audit' >> "$GITHUB_STEP_SUMMARY"
          echo 'The audit lists original V109 generation steps executed before compiling the V1153 APK.' >> "$GITHUB_STEP_SUMMARY"
          printf 'Source steps: '; grep -c '^EXECUTED:' /tmp/V1152_INHERITED_AUDIT.txt || true
          tail -n 8 /tmp/V1152_INHERITED_AUDIT.txt
        fi
    - name: Upload inherited-feature audit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: RUNNINGBALL2-V1155-INHERITED-AUDIT
        path: /tmp/V1152_INHERITED_AUDIT.txt
        if-no-files-found: ignore
on:
  workflow_dispatch: null
  push:
    branches:
    - main
    paths:
    - .github/workflows/RUNNINGBALL2_V1155_PROFESSIONAL_OPERATIONS.yml
