name: RUNNINGBALL2 V1155 - PROFESSIONAL OPERATIONS INTERFACE
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - name: Checkout DUWM exact inherited source workflow
      uses: actions/checkout@v4
    - name: Checkout original protected RUNNINGBALL2 source
      uses: actions/checkout@v4
      with:
        repository: Sentongoharuna/Du-World-Situation-Room-
        ref: 7d952dd607cdeec94832896023c10203425a3b7f
        path: rb2-original-source
        persist-credentials: false
    - name: Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Gradle 8.13
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'
        cache-disabled: true
    - name: Install source reader
      shell: bash
      run: python3 -m pip install --no-cache-dir 'PyYAML==6.0.3'
    - name: Rebuild full V109 native app, preserve V24 onward, install exact DEVELOP.UGANDA logo
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY_V110_BUILD'\nimport os\nimport pathlib\nimport subprocess\nimport yaml\nimport hashlib\n\
        import tempfile\n\nbase = pathlib.Path('.github/workflows/RUNNINGBALL2_V109.yml')\nbranding = pathlib.Path('.github/workflows/V110_FIX2_DIRECT_PHONE_UPLOAD.yml')\n\
        assert base.is_file(), 'Required existing V109 source missing'\nassert branding.is_file(), 'Existing V1152 official-logo source\
        \ missing'\nassert base.stat().st_size < 500000, 'V109 source file changed or exceeds safe size'\nbase_steps = yaml.safe_load(base.read_text(encoding='utf-8'))['jobs']['build']['steps']\n\
        brand_steps = yaml.safe_load(branding.read_text(encoding='utf-8'))['jobs']['build']['steps']\nassert len(base_steps) == 97,\
        \ 'V109 source chain changed; refuse reduced app'\nassert len(brand_steps) == 14, 'V110 source logo chain changed'\nassert base_steps[6]['name'].startswith('Verify\
        \ and unpack complete V24')\nassert base_steps[7]['name'].startswith('Execute EVERY V24')\nassert base_steps[62]['name'].startswith('V108\
        \ INSTALL')\nassert brand_steps[7]['name'].startswith('V110 install supplied DEVELOP.UGANDA logo')\nenv = os.environ.copy()\n\
        workspace = pathlib.Path(env['GITHUB_WORKSPACE'])\nmarker = pathlib.Path(env['GITHUB_ENV'])\naudit = []\n\ndef execute(script,\
        \ label):\n    assert (chr(36) + chr(123) + chr(123)) not in script, 'Unevaluated Actions expression in ' + label\n    # Linux\
        \ limits a single argv string to 128 KiB; the V109 V24-restore step is ~179 KiB.\n    # Preserve exact source bytes but run\
        \ Bash against a temporary script FILE, never bash -c SCRIPT.\n    descriptor, script_path = tempfile.mkstemp(prefix='v1152-inherited-',\
        \ suffix='.sh')\n    path = pathlib.Path(script_path)\n    try:\n        with os.fdopen(descriptor, 'w', encoding='utf-8') as\
        \ fh:\n            fh.write(script)\n        result = subprocess.run(['bash', '-e', '-o', 'pipefail', str(path)],\n        \
        \                        cwd=workspace, env=env, check=False)\n    finally:\n        path.unlink(missing_ok=True)\n    if result.returncode:\n\
        \        raise SystemExit('FAILED inherited ' + label + ' exit=' + str(result.returncode))\n    if marker.exists():\n      \
        \  for line in marker.read_text(encoding='utf-8').splitlines():\n            if '=' in line:\n                key, value = line.split('=',\
        \ 1)\n                if key.isidentifier():\n                    env[key] = value\n\nfor index in range(6, 67):\n    step =\
        \ base_steps[index]\n    label = 'V109 step ' + str(index + 1) + ': ' + step['name']\n    if 'uses' in step:\n        assert\
        \ index in (36, 38, 61, 66), label\n        assert step['uses'] == 'actions/upload-artifact@v4', label\n        audit.append('DEFERRED\
        \ evidence upload: ' + label)\n    else:\n        print('EXECUTING', label, flush=True)\n        original = step['run']\n  \
        \      if index == 7:\n            # The V24 dispatcher inherited from V109 also invokes Bash using -c\n            # for potentially\
        \ large source-generating step strings. Patch only\n            # its invocation mechanism; DO NOT change the embedded source\
        \ steps.\n            # Replace the TWO original V24 dispatcher lines atomically.\n            # All injected lines retain the\
        \ same Python block indentation.\n            # Neither nested V24 source scripts nor upstream code are edited.\n          \
        \  anchor = (\"  cmd=['bash','-eo','pipefail','-c',item['run']]\\n\"\n                      \"  child=subprocess.run(cmd,cwd=str(cwd),env=env,check=False)\"\
        )\n            assert original.count(anchor) == 1, 'V109 V24 dispatcher anchor unexpectedly changed'\n            replacement\
        \ = (\n                \"  script_file=pathlib.Path('/tmp/v1152-v24-step-%02d.sh'%index)\\n\"\n                \"  script_file.write_text(item['run'],encoding='utf-8')\\\
        n\"\n                \"  try:\\n\"\n                \"    child=subprocess.run(['bash','-eo','pipefail',str(script_file)],cwd=str(cwd),env=env,check=False)\\\
        n\"\n                \"  finally:\\n\"\n                \"    script_file.unlink(missing_ok=True)\"\n            )\n       \
        \     original = original.replace(anchor, replacement, 1)\n            # Parse the ACTUAL inherited dispatcher before executing\
        \ it.\n            # This detects the FIX1 IndentationError without another failed GitHub build.\n            delimiter = \"\
        python3 - <<'RB25_V24_RUN'\\n\"\n            assert original.count(delimiter) == 1, 'V24 Python heredoc not found'\n       \
        \     body = original.split(delimiter, 1)[1].split('\\nRB25_V24_RUN', 1)[0]\n            import ast\n            ast.parse(body,\
        \ filename='V1152_FIX2_V24_DISPATCHER.py')\n            assert \"  cmd=['bash','-eo','pipefail','-c',item['run']]\" not in original\n\
        \            assert original.count(\"child=subprocess.run(['bash','-eo','pipefail',str(script_file)]\") == 1\n            print('PASS\
        \ FIX2 V24 Python AST, preserved source and Bash-file execution',flush=True)\n        execute(original, label)\n        audit.append('EXECUTED:\
        \ ' + label)\n\nproject = pathlib.Path(env.get('PROJECT_DIR', ''))\nassert project.is_dir() and (project / 'app/build.gradle.kts').is_file(),\
        \ 'Native V109 app not recovered'\nprint('EXECUTING official V110 logo installer', flush=True)\nexecute(brand_steps[7]['run'],\
        \ 'original V110 branded image installed into V1152')\n# V1152 is the version to install; preserve the original Android appId\
        \ so updates are possible.\ngradle = project / 'app/build.gradle.kts'\ndefinition = gradle.read_text(encoding='utf-8')\nif definition.count('versionCode\
        \ = 111') != 1:\n    raise SystemExit('V1152 requires completed original V110 branding/version chain')\ndefinition = definition.replace('versionCode\
        \ = 111','versionCode = 1152',1)\nold_name = 'versionName = \"RUNNINGBALL2-V110-DEVELOP-UGANDA-OFFICIAL-LOGO\"'\nif definition.count(old_name)\
        \ != 1:\n    raise SystemExit('V1152 inherited branding version missing')\ndefinition = definition.replace(old_name,'versionName\
        \ = \"RUNNINGBALL2-V1152-DEVELOP-UGANDA\"',1)\nassert definition.count('applicationId = \"com.sentongoharuna.worldsituationroom.rb2live25\"\
        ') == 1\ngradle.write_text(definition, encoding='utf-8')\napp_strings = project / 'app/src/main/res/values/strings.xml'\nst\
        \ = app_strings.read_text(encoding='utf-8')\nif st.count('DEVELOP.UGANDA V110') != 1:\n    raise SystemExit('V1152 app label\
        \ anchor missing')\napp_strings.write_text(st.replace('DEVELOP.UGANDA V110','DEVELOP.UGANDA V1152',1),encoding='utf-8')\naudit.append('V1152\
        \ versionCode 1152, versionName V1152, app label V1152, preserved package identity')\nlogo = project / 'app/src/main/assets/develop_uganda_logo.png'\
        \ \nassert logo.is_file(), 'DEVELOP.UGANDA logo asset missing from app source'\nassert hashlib.sha256(logo.read_bytes()).hexdigest()\
        \ == 'e583513eda20b22ee9a9641c58a2b58869fd9997a94ae49c1321c378aa32d97b', 'Logo changed'\naudit.append('EXECUTED official image\
        \ and launcher resource')\npathlib.Path('/tmp/V1152_INHERITED_AUDIT.txt').write_text('\\n'.join(audit) + '\\n')\nwith marker.open('a',\
        \ encoding='utf-8') as out:\n    out.write('PROJECT_DIR=' + str(project.resolve()) + '\\n')\nprint('PASS: V24-V109 source generation\
        \ preserved; official logo installed and V1152 label/version set', flush=True)\nprint('V1152 source reference: pinned V24 original\
        \ + unchanged V109 pipeline, with V110 logo branding',flush=True)\nPY_V110_BUILD\n"
