name: FIX14.30 30.30 FINAL BUILD REPAIR V2
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  build-repair-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify V2 repair source
        run: echo "f779b13a8d9a91bb63a932523b35d657c47789dd356dabff21fe9bd53b18089d  FIX14-30-30-30-FINAL-BUILD-REPAIR-V2-SOURCE.tar.gz" | sha256sum -c -
      - name: Extract V2 cumulative source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/duwm"
          tar -xzf FIX14-30-30-30-FINAL-BUILD-REPAIR-V2-SOURCE.tar.gz -C "$RUNNER_TEMP/duwm"
          P="$(find "$RUNNER_TEMP/duwm" -mindepth 1 -maxdepth 1 -type d | head -n1)"
          echo "PROJECT_DIR=$P" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: Verify port and airport API repair
        run: python3 "$PROJECT_DIR/fix14-tests/FIX14_30_30_BUILD_REPAIR_V2_AUDIT.py" "$PROJECT_DIR"
      - name: FIX14 final acceptance regression
        run: |
          mkdir -p "$RUNNER_TEMP/final"
          javac -d "$RUNNER_TEMP/final" "$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom/"{Fix14GlobalPortRelease,Fix14FinalAcceptance,PortTruthProvenanceAudit,PortLoadPerformanceHarness}.java "$PROJECT_DIR/fix14-tests/Fix14FinalAcceptanceSmoke.java"
          java -cp "$RUNNER_TEMP/final" Fix14FinalAcceptanceSmoke
      - name: SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          echo "SDKMANAGER=$SM" >> "$GITHUB_ENV"
      - run: yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true; "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.13", cache-disabled: true}
      - name: Build repaired FIX14 APK V2
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache clean :app:assembleDebug --stacktrace
      - name: Stage repaired APK
        run: |
          mapfile -t APKS < <(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | sort)
          test "${#APKS[@]}" -eq 1
          test -s "${APKS[0]}"
          mkdir -p "$RUNNER_TEMP/release"
          cp "${APKS[0]}" "$RUNNER_TEMP/release/FIX14-30-30-30-FINAL-BUILD-REPAIR-V2.apk"
          sha256sum "$RUNNER_TEMP/release/"*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FIX14-30-30-30-FINAL-BUILD-REPAIR-V2-APK
          path: ${{ runner.temp }}/release/FIX14-30-30-30-FINAL-BUILD-REPAIR-V2.apk
          if-no-files-found: error
