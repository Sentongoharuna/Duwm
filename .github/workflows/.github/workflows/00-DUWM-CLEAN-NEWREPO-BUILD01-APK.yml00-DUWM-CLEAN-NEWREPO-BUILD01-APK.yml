name: DUWM CLEAN NEWREPO BUILD01 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f DUWM-CLEAN-NEWREPO-BUILD01-SOURCE.tar.gz
          echo "5ae17da3470f6c2a43426f67735cc10fb2bbf550dc3002dedb6762b033ba24f7  DUWM-CLEAN-NEWREPO-BUILD01-SOURCE.tar.gz" | sha256sum -c -

      - name: Extract DUWM source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/duwm"
          mkdir -p "$RUNNER_TEMP/duwm"
          tar -xzf DUWM-CLEAN-NEWREPO-BUILD01-SOURCE.tar.gz \
            -C "$RUNNER_TEMP/duwm"
          echo "PROJECT_DIR=$RUNNER_TEMP/duwm" >> "$GITHUB_ENV"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true

      - name: Compile DUWM
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache \
            :app:compileDebugJavaWithJavac \
            :app:processDebugResources \
            :app:assembleDebug \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Upload DUWM APK
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-CLEAN-NEWREPO-BUILD01-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
