name: DUWM Master Base 35 APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate master archive
        run: unzip -t DUWM-MASTER-BASE-35-ONE-TIME-UPLOAD.zip
      - name: Extract source
        run: unzip -q DUWM-MASTER-BASE-35-ONE-TIME-UPLOAD.zip -d build-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: build-source/DUWM-1728-2-21-4-14-ANDROID-SOURCE
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DUWM-MASTER-35-APK
          path: build-source/DUWM-1728-2-21-4-14-ANDROID-SOURCE/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
