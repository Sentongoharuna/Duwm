    - name: V1154 EMULATOR - main rotating globe and real 8-sector navigation
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        profile: pixel_6
        cores: 4
        ram-size: 4096M
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        script: "set -euo pipefail\nAPK=\"$RUNNER_TEMP/release/RUNNINGBALL2-V1154-DEVELOP-UGANDA.apk\"\ntest -s \"$APK\"\nadb install\
          \ -r \"$APK\"\nadb shell am start -n 'com.sentongoharuna.worldsituationroom.rb2live25/com.sentongoharuna.worldsituationroom.LiveCommandActivity'\n\
          sleep 4\nadb shell dumpsys activity activities | grep -q LiveCommandActivity\nadb shell uiautomator dump /sdcard/v1154-ui.xml\
          \ >/dev/null\nadb shell cat /sdcard/v1154-ui.xml > /tmp/V1154_UI.xml\ngrep -q 'WORLD SITUATION ROOM' /tmp/V1154_UI.xml\ngrep\
          \ -q 'Open live source VESSELS' /tmp/V1154_UI.xml\ngrep -q 'Open live source AIRCRAFT' /tmp/V1154_UI.xml\nadb exec-out screencap\
          \ -p > /tmp/V1154_FRAME_A.png\nsleep 2\nadb exec-out screencap -p > /tmp/V1154_FRAME_B.png\npython3 -m pip install --quiet\
          \ Pillow\npython3 - <<'VERIFY_MOTION'\nfrom PIL import Image,ImageChops\none=Image.open('/tmp/V1154_FRAME_A.png').convert('RGB')\n\
          two=Image.open('/tmp/V1154_FRAME_B.png').convert('RGB')\nassert one.size==two.size\narea=(int(one.width*.15),int(one.height*.12),int(one.width*.85),int(one.height*.36))\n\
          assert ImageChops.difference(one.crop(area),two.crop(area)).getbbox() is not None, 'Globe not visibly changing frames'\nprint('PASS\
          \ genuine globe motion on Android emulator')\nVERIFY_MOTION\n# Navigate to the real native vessel source page using the on-screen\
          \ UI bounds.\npython3 - <<'FIND_TAB'\nimport xml.etree.ElementTree as E,re\nroot=E.parse('/tmp/V1154_UI.xml').getroot()\n\
          buttons=[n for n in root.iter('node') if n.get('content-desc')=='Open live source VESSELS']\nassert len(buttons)==1,'Vessels\
          \ category is not in real Android UI'\nbounds=buttons[0].get('bounds','');m=re.fullmatch(r'\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\\
          d+)\\]',bounds)\nassert m,bounds\nx1,y1,x2,y2=map(int,m.groups())\nopen('/tmp/v1154_tapcoords','w').write(f'{(x1+x2)//2} {(y1+y2)//2}')\n\
          FIND_TAB\nread -r X Y < /tmp/v1154_tapcoords\nadb shell input tap \"$X\" \"$Y\"\nsleep 2\nadb shell dumpsys activity activities\
          \ | grep -q WorldSourceHubActivity\nadb shell uiautomator dump /sdcard/v1154-vessel-ui.xml >/dev/null\nadb shell cat /sdcard/v1154-vessel-ui.xml\
          \ > /tmp/V1154_VESSELS.xml\ngrep -q 'AIS LIVE FEED NOT CONFIGURED' /tmp/V1154_VESSELS.xml\nadb exec-out screencap -p > /tmp/V1154_VESSELS.png\n\
          echo 'PASS V1154: globe animates; real VESSELS tab navigates; source truth disclosed' \n"
