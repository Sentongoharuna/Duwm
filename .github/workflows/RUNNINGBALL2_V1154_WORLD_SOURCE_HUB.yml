          'opensky_aircraft':'https://opensky-network.org/api/states/all',
          'iss_observation':'https://api.wheretheiss.at/v1/satellites/25544',
          'celestrak_orbits':'https://celestrak.org/NORAD/elements/gp.php?GROUP=STATIONS&FORMAT=JSON',
          'bbc_world_rss':'https://feeds.bbci.co.uk/news/world/rss.xml',
          'radio_browser':'https://de1.api.radio-browser.info/json/stations/search?limit=2',
          'iptv_directory':'https://iptv-org.github.io/api/channels.json',
          'ripe_internet_asn':'https://stat.ripe.net/data/country-resource-list/data.json?resource=UG',
        }
        out={'at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(), 'note':'CI server HTTP probes only; device UI not inferred', 'sources':{}}
        for name,url in rows.items():
            try:
                r=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'DEVELOP-UGANDA/1154 integration-audit'}),timeout=7)
                with r: b=r.read(8192)
                out['sources'][name]={'http_status':r.status,'nonempty':bool(b),'sample_bytes':len(b)}
            except Exception as e:
                out['sources'][name]={'status':'UNAVAILABLE','error':str(e)[:160]}
        out['sources']['ais_vessels']={'status':'KEY_AND_BACKEND_REQUIRED','docs':'https://www.aisstream.io/documentation'}
        out['sources']['city_cameras']={'status':'PUBLIC_DIRECTORY_LINKS','api_key_required_for_embedding':True}
        out['sources']['cloudflare_traffic']={'status':'API_KEY_REQUIRED','routing_statistics':'RIPEstat is not live packet traffic'}
        open(sys.argv[1],'w').write(json.dumps(out,indent=2))
        print(json.dumps(out,indent=2))
        V1154_PROVIDER
    - name: Upload provider truth audit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: RUNNINGBALL2-V1154-SOURCE-TRUTH
        path: ${{ runner.temp }}/evidence/v1154_provider_probe.json
        if-no-files-found: ignore
    - name: Display preserved-feature evidence
      if: always()
      shell: bash
      run: |
        if [ -f /tmp/V1152_INHERITED_AUDIT.txt ]; then
          echo '## V1154: inherited source-step audit' >> "$GITHUB_STEP_SUMMARY"
          echo 'The audit lists original V109 generation steps executed before compiling the V1153 APK.' >> "$GITHUB_STEP_SUMMARY"
          printf 'Source steps: '; grep -c '^EXECUTED:' /tmp/V1152_INHERITED_AUDIT.txt || true
          tail -n 8 /tmp/V1152_INHERITED_AUDIT.txt
        fi
    - name: Upload inherited-feature audit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: RUNNINGBALL2-V1154-INHERITED-AUDIT
        path: /tmp/V1152_INHERITED_AUDIT.txt
        if-no-files-found: ignore
on:
  workflow_dispatch: null
  push:
    branches:
    - main
    paths:
    - .github/workflows/RUNNINGBALL2_V1154_WORLD_SOURCE_HUB.yml
