    - name: Publish direct V1154 APK as GitHub Release (not artifact ZIP)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        APK="$RUNNER_TEMP/release/RUNNINGBALL2-V1154-DEVELOP-UGANDA.apk"
        test -s "$APK" || { echo "::error::Compiled V1154 APK is missing"; exit 1; }
        gh --version
        # GitHub Artifacts are always ZIP downloads. Release assets retain .apk extension.
        if gh release view "v1154" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "v1154" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
        else
          gh release create "v1154" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RUNNINGBALL2 V1154 | DEVELOP.UGANDA" \
            --notes "V1154: visible globe, source hub for aircraft, satellites, public cameras, worldwide news, radio, TV, network routing and clearly disclosed AIS requirements. Provider failures are not simulated. Release APK is byte-verified; real phone coverage must be checked." \
            --latest=false
        fi
        echo '## V1154 Direct APK (not ZIP)' >> "$GITHUB_STEP_SUMMARY"
        echo "https://github.com/$GITHUB_REPOSITORY/releases/download/v1154/RUNNINGBALL2-V1154-DEVELOP-UGANDA.apk" >> "$GITHUB_STEP_SUMMARY"
        gh release view v1154 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name=="RUNNINGBALL2-V1154-DEVELOP-UGANDA.apk") | .name + " " + (.size|tostring)' | tee /tmp/V1154_RELEASE_ASSET.txt
        test -s /tmp/V1154_RELEASE_ASSET.txt || { echo "::error::Release asset not visible"; exit 1; }
    - name: Verify V1154 direct release asset is actual matching APK
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        APK="$RUNNER_TEMP/release/RUNNINGBALL2-V1154-DEVELOP-UGANDA.apk"
        RELEASE_DIR="$RUNNER_TEMP/verified-direct-release"
        mkdir -p "$RELEASE_DIR"
        gh release download v1154 --repo "$GITHUB_REPOSITORY" --pattern 'RUNNINGBALL2-V1154-DEVELOP-UGANDA.apk' --dir "$RELEASE_DIR" --clobber
        PUBLIC_APK="$RELEASE_DIR/RUNNINGBALL2-V1154-DEVELOP-UGANDA.apk"
        test -s "$PUBLIC_APK"
        cmp "$APK" "$PUBLIC_APK" || { echo '::error::Published APK differs from the verified built APK'; exit 1; }
        python3 - "$PUBLIC_APK" <<'PY_V1154_DIRECT_APK'
        import pathlib,sys,zipfile
        p=pathlib.Path(sys.argv[1]); assert p.suffix=='.apk' and p.stat().st_size>20000
        with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            for f in ('AndroidManifest.xml','classes.dex','assets/develop_uganda_logo.png'):
