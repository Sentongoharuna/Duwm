name: DUWM CLEAN NEWREPO BUILD02 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Build02 source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f "DUWM-CLEAN-NEWREPO-BUILD02-SOURCE.tar.gz"
          echo "64a6bcb007f2c1f993a3cdf111a222bbca36380b0ecd99e508e3c104954c83d8  DUWM-CLEAN-NEWREPO-BUILD02-SOURCE.tar.gz" | sha256sum -c -

      - name: Extract DUWM source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/duwm"
          mkdir -p "$RUNNER_TEMP/duwm"
          tar -xzf "DUWM-CLEAN-NEWREPO-BUILD02-SOURCE.tar.gz" -C "$RUNNER_TEMP/duwm"
          echo "PROJECT_DIR=$RUNNER_TEMP/duwm" >> "$GITHUB_ENV"
          echo "SOURCE EXTRACTED SUCCESSFULLY"

      - name: Verify Android project and Build02 repair
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -F 'final LruCache<String,Bitmap> mem;' "$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom/DuRemoteImageLoader.java"
          ! grep -F 'mem;protected int sizeOf' "$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom/DuRemoteImageLoader.java"
          echo "BUILD02 SOURCE REPAIR VERIFIED"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true

      - name: Compile DUWM Java
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac --stacktrace

      - name: Process Android resources
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache :app:processDebugResources --stacktrace

      - name: Assemble DUWM APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace

      - name: Locate and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload DUWM Build02 APK
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-CLEAN-NEWREPO-BUILD02-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
