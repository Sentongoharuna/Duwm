name: DUWM Build 77 APK (Uploaded Source ZIP)
on:
  workflow_dispatch:
  push:
    paths:
      - 'DUWM-BUILD-77-REAL-UI-SOURCE.zip'
      - '.github/workflows/duwm-build-77.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fL --retry 3 -o /tmp/commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/commandlinetools.zip -d /tmp/android-cli
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv /tmp/android-cli/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extract Build 77 Android source
        shell: bash
        run: |
          set -euo pipefail
          unzip -q DUWM-BUILD-77-REAL-UI-SOURCE.zip -d source
          ROOT="$(find source -name settings.gradle.kts -o -name settings.gradle | head -n 1)"
          test -n "$ROOT" || { echo "No Android Gradle project in source ZIP"; exit 1; }
          ROOT="$(dirname "$ROOT")"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Using source: $ROOT"
      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_ROOT" :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-BUILD-77-DEBUG-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
