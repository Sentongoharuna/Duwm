    - name: V1159 CORRECTION SOURCE GATE - original globe default with real observed native signals
      shell: bash
      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" <<'V1159_ORIGINAL_GATE'\nfrom pathlib import Path\nimport sys\nroot=Path(sys.argv[1]);folder=root/'app/src/main/java/com/sentongoharuna/worldsituationroom'\n\
        s=(folder/'OperationsMainActivity.java').read_text()\nfor required in (\n    'SatelliteMapView nativeGlobe=(SatelliteMapView)instance;',\n    'nativeGlobe.setGlobeMode(true);',\n\
        \    'switchOriginalRenderer();\\n    }',\n    'nativeGlobe.setSignals(toNativeSignals(earthObservations));',\n    'new Signal(id,layer,a.title,a.detail,a.lat,a.lon,',\n\
        \    'nativeGlobe.setCenter(item.lat,item.lon,nativeGlobe.getZoom());',\n    'earthObservations.clear();earthObservations.addAll(observations);',\n\
        \    '((SatelliteMapView)originalEarth).setSignals(toNativeSignals(earthObservations));',\n    'nativeGlobe.setGlobeMode(true)',\n):\n  assert required\
        \ in s, 'Original globe was not really restored: '+required\nassert 'if(originalMode)switchOriginalRenderer();' not in s, 'Observation selection\
        \ still throws user to imitation globe'\nfor file in ('SatelliteMapView.java','DuwmLiveWallpaperService.java','MainActivity.java','MediaDeskActivity.java','AircraftOperationsActivity.java'):\n\
        \  assert (folder/file).stat().st_size>1000, 'Original feature missing: '+file\nprint('PASS original globe DEFAULT, source pins native, touch/zoom\
        \ original and protected source intact')\nV1159_ORIGINAL_GATE"
    - name: V1159 BASE RULES - make original globe sources visible and preserve signal continuity
      shell: bash
      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" <<'V1159_BASE_RULES_PATCH'\nfrom pathlib import Path\nimport hashlib,sys\nproject=Path(sys.argv[1]);folder=project/'app/src/main/java/com/sentongoharuna/worldsituationroom'\n\
        target=folder/'OperationsMainActivity.java'\nprotected=[folder/name for name in ('SatelliteMapView.java','DuwmLiveWallpaperService.java','MainActivity.java','MediaDeskActivity.java','AircraftOperationsActivity.java')]\n\
        baseline={str(f):hashlib.sha256(f.read_bytes()).hexdigest() for f in protected}\ns=target.read_text(encoding='utf-8')\ndef exactly_once(old,new,label):\n\
        \    global s\n    count=s.count(old)\n    assert count==1, f'{label}: expected one original anchor, found {count}'\n    s=s.replace(old,new,1)\n\
        # Show genuine per-source status on the ORIGINAL renderer, not just on its hidden substitute.\nexactly_once('originalHud.setVisibility(View.GONE);',\n\
        \             'originalHud.setVisibility(View.VISIBLE);', 'original source HUD visibility')\nexactly_once('earthHud.addView(text(\"LIVE EARTH /\
        \ GLOBAL SIGNALS\",11,TEXT,true));',\n             'earthHud.addView(text(\"ORIGINAL GLOBE / OBSERVED SIGNALS\",11,TEXT,true));', 'native HUD heading')\n\
        # Give the protected globe more first-screen room without discarding the source-backed telemetry panel.\nexactly_once('root.addView(telemetryPanel,new\
        \ LinearLayout.LayoutParams(-1,dp(178)));',\n             'root.addView(telemetryPanel,new LinearLayout.LayoutParams(-1,dp(166)));','native globe\
        \ space')\n# Keep observed aircraft stable by their received callsign/source between source refreshes.\n# This changes rendering identity only;\
        \ the actual coordinates and times remain source-derived.\nexactly_once('String id=\"observed-\"+a.type+\"-\"+a.title+\"-\"+a.timeMillis;',\n  \
        \           'String id=\"observed-\"+a.type+\"-\"+a.title+\"-\"+(a.type==OperationsGlobeView.AIR?a.source:a.timeMillis);', 'source marker continuity')\n\
        target.write_text(s,encoding='utf-8')\nfor f in protected:\n    assert hashlib.sha256(f.read_bytes()).hexdigest()==baseline[str(f)], 'original source\
        \ changed '+f.name\nassert 'nativeGlobe.setGlobeMode(true);' in s and 'nativeGlobe.setSignals(toNativeSignals(earthObservations));' in s\nassert\
        \ 'originalHud.setVisibility(View.VISIBLE);' in s\nassert 'ORIGINAL GLOBE / OBSERVED SIGNALS' in s\nprint('PASS BASE RULE 1: exact original native\
        \ globe + truthful observed-source status in first viewport')\nprint('PASS BASE RULE 2: actual extra screen room and stable received aircraft markers;\
        \ NO version bump')\nV1159_BASE_RULES_PATCH\n"
    - name: V1159 VISIBLE UPGRADE - native full-screen FOCUS and RESTORE
      shell: bash
      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" <<'V1159_FOCUS_PATCH'\nfrom pathlib import Path\nimport hashlib,sys\nroot=Path(sys.argv[1]);p=root/'app/src/main/java/com/sentongoharuna/worldsituationroom'\n\
        main=p/'OperationsMainActivity.java'\nprotected=[p/x for x in ('SatelliteMapView.java','DuwmLiveWallpaperService.java','MainActivity.java','MediaDeskActivity.java','AircraftOperationsActivity.java')]\n\
        protect={str(x):hashlib.sha256(x.read_bytes()).hexdigest() for x in protected}\ns=main.read_text(encoding='utf-8')\ndef rep(a,b,label):\n    global\
        \ s\n    n=s.count(a)\n    assert n==1, f'{label} source changed; found {n} exact anchors (refuse silent no-op)'\n    s=s.replace(a,b,1)\n# Real\
        \ functionality: FOCUS native globe to occupy entire operational screen.\nrep('    private boolean originalMode=false;',\n    '    private boolean\
        \ originalMode=false;\\n    private boolean fullEarth=false;', 'native focus state')\nrep('        originalToggle.setOnClickListener(v->switchOriginalRenderer());',\n\
        \    '''        originalToggle.setOnClickListener(v->switchOriginalRenderer());\n        // This control actually reflows the native globe viewport.\n\
        \        TextView focusControl=action(\"FOCUS\",\"Expand original native globe full-screen\");\n        rowAdd(globeHeading,focusControl,68,35);''','focus\
        \ action control')\nrep('root.addView(telemetryPanel,new LinearLayout.LayoutParams(-1,dp(166)));',\n    '''root.addView(telemetryPanel,new LinearLayout.LayoutParams(-1,dp(166)));\n\
        \        focusControl.setOnClickListener(v->{\n            if(!originalMode || !(originalEarth instanceof SatelliteMapView)){\n                detail.setText(\"\
        Original protected native globe not ready; refusing substitute renderer.\");\n                return;\n            }\n            fullEarth=!fullEarth;\n\
        \            // The preserved native SatelliteMapView grows when the weighted frame remeasures.\n            metadata.setVisibility(fullEarth?View.GONE:View.VISIBLE);\n\
        \            scroller.setVisibility(fullEarth?View.GONE:View.VISIBLE);\n            telemetryPanel.setVisibility(fullEarth?View.GONE:View.VISIBLE);\n\
        \            layers.setVisibility(fullEarth?View.GONE:View.VISIBLE);\n            detail.setVisibility(fullEarth?View.GONE:View.VISIBLE);\n    \
        \        focusControl.setText(fullEarth?\"RESTORE\":\"FOCUS\");\n            focusControl.setContentDescription(fullEarth?\"Restore source panels\
        \ and tabs\":\"Expand original native globe full-screen\");\n            globeLabel.setText(fullEarth?\"ORIGINAL EARTH  /  FULL-SCREEN LIVE GLOBE\"\
        :\"ORIGINAL GLOBE  /  OBSERVED WORLD POSITIONS\");\n            originalEarth.requestLayout();originalEarth.postInvalidateOnAnimation();\n     \
        \   });''','full-screen actual panel reflow')\nrep('globeLabel=text(\"LIVE EARTH  /  OBSERVED WORLD POSITIONS\",12,TEXT,true);',\n    'globeLabel=text(\"\
        ORIGINAL GLOBE  /  OBSERVED WORLD POSITIONS\",12,TEXT,true);','visible original globe heading')\nmain.write_text(s,encoding='utf-8')\nfor x in protected:\n\
        \    assert hashlib.sha256(x.read_bytes()).hexdigest()==protect[str(x)],'Protected original modified: '+x.name\nfor item in ('focusControl.setOnClickListener','metadata.setVisibility(fullEarth?View.GONE:View.VISIBLE)',\n\
        \             'scroller.setVisibility(fullEarth?View.GONE:View.VISIBLE)',\n             'telemetryPanel.setVisibility(fullEarth?View.GONE:View.VISIBLE)',\n\
        \             'originalEarth.postInvalidateOnAnimation()','fullEarth=!fullEarth'):\n    assert item in s,'Focus integration absent: '+item\nassert\
        \ 'nativeGlobe.setGlobeMode(true)' in s\nassert 'nativeGlobe.setSignals(toNativeSignals(earthObservations))' in s\nprint('PASS V1159: original globe\
        \ native full-screen FOCUS and RESTORE, unchanged protected source, real received observations')\nV1159_FOCUS_PATCH\n"
