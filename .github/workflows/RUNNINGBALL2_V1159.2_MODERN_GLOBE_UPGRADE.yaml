        \ 'Return to modern detailed Earth globe' in orig_xml,'Modern globe return action missing'\nsubprocess.run(['adb','shell','input','tap',str((h1+h3)//2),str((h2+h4)//2)],check=True,timeout=20)\n\
        time.sleep(1.0)\nsubprocess.run(['adb','shell','uiautomator','dump','/sdcard/v11592-modern.xml'],check=True,stdout=subprocess.DEVNULL,timeout=30)\n\
        modern_xml=subprocess.run(['adb','shell','cat','/sdcard/v11592-modern.xml'],capture_output=True,text=True,check=True,timeout=20).stdout\nassert\
        \ 'MODERN HD EARTH' in modern_xml and 'Open original globe for comparison' in modern_xml,'Modern globe did not restore'\nprint('PASS: modern HD\
        \ Earth is default, original remains optionally reachable, modern return works',flush=True)\n\n# Navigate by an actual visible tappable control;\
        \ a source string by itself is not proof.\ndef find_accessible(node):\n    desc=node.get('content-desc','')\n    return 'Open AIRCRAFT monitoring\
        \ sources' in desc\nfound=[n for n in root.iter('node') if find_accessible(n)]\nassert found,'Air operations tab missing from actual device UI'\n\
        m=re.fullmatch(r'\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]',found[0].get('bounds',''))\nassert m,'Aircraft tab has no visible bounds'\na,b,c,d=map(int,m.groups());assert\
        \ c>a and d>b\nsubprocess.run(['adb','shell','input','tap',str((a+c)//2),str((b+d)//2)],check=True,timeout=20)\ntime.sleep(2.0)\nstate=subprocess.run(['adb','shell','dumpsys','activity','activities'],capture_output=True,text=True,check=True,timeout=25).stdout\n\
        assert 'AircraftOperationsActivity' in state,'Tapping Aircraft did not open the native flight register'\nsubprocess.run(['adb','exec-out','screencap','-p'],stdout=open('/tmp/V1159_AIRCRAFT_REGISTER.png','wb'),check=True,timeout=20)\n\
        print('PASS V1159 actual rotating globe + visible source receipts + native aircraft navigation')\nV1159_REAL_DEVICE\nV1159_TEST_SCRIPT\nbash -n\
        \ \"$RUNNER_TEMP/v1159-screen-test.sh\"\npython3 -m pip install --no-cache-dir 'Pillow==11.3.0'\n"
    - name: V1159 EMULATOR - observed globe animation and live-operations interface
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        profile: pixel_6
        cores: 4
        ram-size: 4096M
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        script: bash "$RUNNER_TEMP/v1159-screen-test.sh"
    - name: Upload real Android screen evidence for V1159 globe movement and navigation
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: RUNNINGBALL2-V1159.2-ANDROID-EVIDENCE
        path: '/tmp/V1159_GLOBE_FRAME_1.png

          /tmp/V1159_GLOBE_FRAME_2.png

          /tmp/V1159_MAIN.xml

          /tmp/V1159_AIRCRAFT_REGISTER.png

          /tmp/V1159_ORIGINAL_GESTURE.png

          /tmp/V1159_FOCUS_EXPANDED.png

          /tmp/V1159_FOCUS.xml

          /tmp/V11592_HD_EARTH.png

          /tmp/V11592_ORIGINAL_OPTION.png'
        if-no-files-found: warn
        retention-days: 30
    - name: Publish V1159 direct APK only after observed real-screen globe and aircraft tests pass
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nAPK=\"$RUNNER_TEMP/release/RUNNINGBALL2-V1159.2-DEVELOP-UGANDA.apk\"\ntest -s \"$APK\" || { echo \"::error::Compiled V1159\
        \ APK is missing\"; exit 1; }\ntest -s /tmp/V11592_HD_EARTH.png || { echo \"::error::V1159.2 HD Earth screenshot missing\"; exit 1; }\ntest -s /tmp/V1159_FOCUS_EXPANDED.png\
        \ || { echo \"::error::No visible FOCUS screenshot; refusing APK publication\"; exit 1; }\ngh --version\n# GitHub Artifacts are always ZIP downloads.\
        \ Release assets retain .apk extension.\nif gh release view \"v1159.2\" --repo \"$GITHUB_REPOSITORY\" >/dev/null 2>&1; then\n  gh release upload\
        \ \"v1159.2\" \"$APK\" --repo \"$GITHUB_REPOSITORY\" --clobber\nelse\n  gh release create \"v1159.2\" \"$APK\" \\\n    --repo \"$GITHUB_REPOSITORY\"\
        \ \\\n    --target \"$GITHUB_SHA\" \\\n    --title \"RUNNINGBALL2 V1159.2 | MODERN HD EARTH ENHANCED\" \\\n    --notes \"V1159 correction makes\
        \ modern OperationsGlobeView the DEFAULT first-screen rotating globe, uses detailed GSHHS geography and native modern touch/zoom engine and plots\
        \ only actual OpenSky/USGS/ISS records via native Signal API. Emulator screenshot and gesture tests must pass before release. Preserves original\
        \ globe, aircraft register, native radio/TV, image cards and wallpaper. Data reception on phone depends on public source availability; no simulated\
        \ observations.\" \\\n    --latest=false\nfi\necho '## V1159 Direct APK (not ZIP)' >> \"$GITHUB_STEP_SUMMARY\"\necho \"https://github.com/$GITHUB_REPOSITORY/releases/download/v1159.2/RUNNINGBALL2-V1159.2-DEVELOP-UGANDA.apk\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\ngh release view v1159.2 --repo \"$GITHUB_REPOSITORY\" --json assets --jq '.assets[] | select(.name==\"RUNNINGBALL2-V1159.2-DEVELOP-UGANDA.apk\"\
        ) | .name + \" \" + (.size|tostring)' | tee /tmp/V1159_RELEASE_ASSET.txt\ntest -s /tmp/V1159_RELEASE_ASSET.txt || { echo \"::error::Release asset\
        \ not visible\"; exit 1; }\n"
    - name: Verify identical signed V1159 release APK
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nAPK=\"$RUNNER_TEMP/release/RUNNINGBALL2-V1159.2-DEVELOP-UGANDA.apk\"\nRELEASE_DIR=\"$RUNNER_TEMP/verified-direct-release\"\
        \nmkdir -p \"$RELEASE_DIR\"\ngh release download v1159.2 --repo \"$GITHUB_REPOSITORY\" --pattern 'RUNNINGBALL2-V1159.2-DEVELOP-UGANDA.apk' --dir\
        \ \"$RELEASE_DIR\" --clobber\nPUBLIC_APK=\"$RELEASE_DIR/RUNNINGBALL2-V1159.2-DEVELOP-UGANDA.apk\"\ntest -s \"$PUBLIC_APK\"\ncmp \"$APK\" \"$PUBLIC_APK\"\
        \ || { echo '::error::Published APK differs from the verified built APK'; exit 1; }\npython3 - \"$PUBLIC_APK\" <<'PY_V1159_DIRECT_APK'\nimport pathlib,sys,zipfile\n\
        p=pathlib.Path(sys.argv[1]); assert p.suffix=='.apk' and p.stat().st_size>20000\nwith zipfile.ZipFile(p) as z:\n    assert z.testzip() is None\n\
        \    for f in ('AndroidManifest.xml','classes.dex','assets/develop_uganda_logo.png'):\n        assert f in z.namelist(), f\nprint('PASS: GitHub\
        \ Releases provides identical, signed Android .apk file; ZIP extraction unnecessary')\nPY_V1159_DIRECT_APK\nSDK=\"${ANDROID_HOME:-$ANDROID_SDK_ROOT}\"\
        \n\"$SDK/build-tools/36.0.0/apksigner\" verify \"$PUBLIC_APK\"\necho '## V1159 Direct APK VERIFIED' >> \"$GITHUB_STEP_SUMMARY\"\necho \"https://github.com/$GITHUB_REPOSITORY/releases/download/v1159.2/RUNNINGBALL2-V1159.2-DEVELOP-UGANDA.apk\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: V1154 provider connectivity audit (not proof of Android runtime feed reception)
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/evidence\"\npython3 - \"$RUNNER_TEMP/evidence/v1154_provider_probe.json\" <<'V1154_PROVIDER'\nimport\
        \ datetime,json,sys,urllib.request,urllib.error\nrows={\n  'opensky_aircraft':'https://opensky-network.org/api/states/all',\n  'iss_observation':'https://api.wheretheiss.at/v1/satellites/25544',\n\
        \  'celestrak_orbits':'https://celestrak.org/NORAD/elements/gp.php?GROUP=STATIONS&FORMAT=JSON',\n  'bbc_world_rss':'https://feeds.bbci.co.uk/news/world/rss.xml',\n\
        \  'radio_browser':'https://de1.api.radio-browser.info/json/stations/search?limit=2',\n  'iptv_directory':'https://iptv-org.github.io/api/channels.json',\n\
        \  'ripe_internet_asn':'https://stat.ripe.net/data/country-resource-list/data.json?resource=UG',\n}\nout={'at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),\
        \ 'note':'CI server HTTP probes only; device UI not inferred', 'sources':{}}\nfor name,url in rows.items():\n    try:\n        r=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'DEVELOP-UGANDA/1154\
        \ integration-audit'}),timeout=7)\n        with r: b=r.read(8192)\n        out['sources'][name]={'http_status':r.status,'nonempty':bool(b),'sample_bytes':len(b)}\n\
        \    except Exception as e:\n        out['sources'][name]={'status':'UNAVAILABLE','error':str(e)[:160]}\nout['sources']['ais_vessels']={'status':'KEY_AND_BACKEND_REQUIRED','docs':'https://www.aisstream.io/documentation'}\n\
        out['sources']['city_cameras']={'status':'PUBLIC_DIRECTORY_LINKS','api_key_required_for_embedding':True}\nout['sources']['cloudflare_traffic']={'status':'API_KEY_REQUIRED','routing_statistics':'RIPEstat\
        \ is not live packet traffic'}\nopen(sys.argv[1],'w').write(json.dumps(out,indent=2))\nprint(json.dumps(out,indent=2))\nV1154_PROVIDER\n"
    - name: Upload provider truth audit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: RUNNINGBALL2-V1159.2-SOURCE-TRUTH
        path: ${{ runner.temp }}/evidence/v1154_provider_probe.json
        if-no-files-found: ignore
    - name: Display preserved-feature evidence
      if: always()
      shell: bash
      run: "if [ -f /tmp/V1152_INHERITED_AUDIT.txt ]; then\n  echo '## V1154: inherited source-step audit' >> \"$GITHUB_STEP_SUMMARY\"\n  echo 'The audit\
        \ lists original V109 generation steps executed before compiling the V1153 APK.' >> \"$GITHUB_STEP_SUMMARY\"\n  printf 'Source steps: '; grep -c\
        \ '^EXECUTED:' /tmp/V1152_INHERITED_AUDIT.txt || true\n  tail -n 8 /tmp/V1152_INHERITED_AUDIT.txt\nfi\n"
    - name: Upload inherited-feature audit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: RUNNINGBALL2-V1159.2-INHERITED-AUDIT
        path: /tmp/V1152_INHERITED_AUDIT.txt
        if-no-files-found: ignore
'on':
  workflow_dispatch: {}
