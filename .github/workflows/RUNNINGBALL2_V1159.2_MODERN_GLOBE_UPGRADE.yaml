        assert visual_delta>1.0,'Optional original renderer did not produce a distinct on-screen view'\nsubprocess.run(['adb','shell','uiautomator','dump','/sdcard/v11592-original.xml'],check=True,stdout=subprocess.DEVNULL,timeout=30)\n\
