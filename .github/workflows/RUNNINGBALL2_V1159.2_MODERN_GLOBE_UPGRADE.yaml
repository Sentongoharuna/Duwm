        assert ncode == 1 and nname == 1, (''Version label source not as expected'',ncode,nname)

        assert ''versionCode = 11592'' in updated and ''versionName = "RUNNINGBALL2-V1159.2-LIVE-OBSERVATION-DESK"'' in updated

        file.write_text(updated,encoding=''utf-8'')

        strings=Path(sys.argv[1])/''app/src/main/res/values/strings.xml''

        original_strings=strings.read_text(encoding=''utf-8'')

