# Compact workflow: requires the exact full Repair 2 SOURCE.zip at the repository root.
# No predecessor recovery payload is embedded; all build and native verification gates are retained.
name: "DUWM 1728.2/21/3 | Repair 2 | Clear picture with changing source information | Start fix"
run-name: "DUWM 1728.2/21/3 | Repair 2 | Compile and verify review, layout and media | Start fix"
'on':
  workflow_dispatch: {}
  push:
    branches:
      - main
      - build/duwm-1728-2-21-3
      - build/duwm-1728-2-21-3-repair2
    paths:
      - .github/workflows/DUWM-1728.2-21-3-REPAIR2-APK.yml
      - DUWM-1728.2-21-3-REPAIR2-SOURCE.zip
permissions:
  contents: read
concurrency:
  group: duwm-1728-2-21-3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Checkout existing original repository
      uses: actions/checkout@v5
    - name: Restore exact full Repair 2 source ZIP (required)
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_RESTORE'
        import hashlib,json,os,pathlib,stat,tempfile,zipfile
        source=pathlib.Path('DUWM-1728.2-21-3-REPAIR2-SOURCE.zip')
        expected_zip='d2b1507dcccf2346aff415cd0951adbb15afc205c0e6bfca22abbcbd3b4b5c91'
        expected_manifest='edbffa497d78f20cc1c643efb1644f201cfacda82d87e7127b39e8915e9b7d32'
        project_name='DUWM-1728-2-21-3-ANDROID-SOURCE'
        manifest_name='1728_2_21_3_SOURCE_SHA256.json'
        # This compact workflow requires the full matching Repair 2 ZIP at the
        # repository root. No predecessor archive or embedded patch is used.
        if source.is_symlink() or not source.is_file():
            raise SystemExit('Missing required regular file: '+source.name+' at the repository root. This compact workflow requires the full Repair 2 source ZIP; older source archives are not a fallback.')
        actual_zip=hashlib.sha256(source.read_bytes()).hexdigest()
        if actual_zip!=expected_zip:
            raise SystemExit('Repair 2 source ZIP SHA-256 mismatch: expected '+expected_zip+', got '+actual_zip+'. Upload the matching full Repair 2 source ZIP; older archives cannot replace it.')
        runner_temp=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
        root=pathlib.Path(tempfile.mkdtemp(prefix='duwm1728221-3-start-fix-',dir=runner_temp))
        project=root/project_name
        project.mkdir()
        def safe_target(name):
            rel=pathlib.PurePosixPath(name)
            if not rel.parts or rel.is_absolute() or '..' in rel.parts or chr(92) in name or rel.as_posix()!=name:
                raise ValueError('Unsafe or noncanonical source path: '+name)
            target=project.joinpath(*rel.parts)
            if not target.resolve().is_relative_to(project):
                raise ValueError('Source path escapes isolated project: '+name)
            return target
        with zipfile.ZipFile(source) as archive:
            if archive.testzip() is not None:raise ValueError('Corrupt Repair 2 source ZIP')
            seen=set()
            for info in archive.infolist():
                rel=pathlib.PurePosixPath(info.filename)
                if not rel.parts or rel.is_absolute() or '..' in rel.parts or chr(92) in info.filename or rel.parts[0]!=project_name:
                    raise ValueError('Unsafe or unexpected source ZIP root')
                mode=info.external_attr>>16
                if stat.S_ISLNK(mode) or (stat.S_IFMT(mode) not in (0,stat.S_IFREG,stat.S_IFDIR)):
                    raise ValueError('Source ZIP links and special files are rejected')
                canonical=rel.as_posix()+('/' if info.is_dir() else '')
                if info.filename!=canonical:raise ValueError('Noncanonical source ZIP member')
                if info.filename in seen:raise ValueError('Duplicate source ZIP member')
                seen.add(info.filename)
                if info.is_dir():continue
                if len(rel.parts)<2:raise ValueError('Source file has no project-relative path')
                target=safe_target('/'.join(rel.parts[1:]))
                target.parent.mkdir(parents=True,exist_ok=True)
                target.write_bytes(archive.read(info))
        manifest=project/manifest_name
        if hashlib.sha256(manifest.read_bytes()).hexdigest()!=expected_manifest:
            raise ValueError('Repair 2 source manifest SHA-256 mismatch')
        expected=json.loads(manifest.read_text(encoding='utf-8'))
        if not isinstance(expected,dict) or not expected:raise ValueError('Invalid source manifest')
        for name,want in expected.items():
            target=safe_target(name)
            if not target.is_file() or target.is_symlink() or hashlib.sha256(target.read_bytes()).hexdigest()!=want:
                raise ValueError('Source integrity failed: '+name)
        actual={p.relative_to(project).as_posix() for p in project.rglob('*') if p.is_file()}
        if actual!=set(expected)|{manifest_name}:raise ValueError('Unexpected or missing source files')
        print('PASS exact /21/3 Repair 2 full source:',len(expected),'packaged file hashes; no predecessor fallback')
        with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as env:
            env.write('PROJECT='+str(project)+'\n')
            env.write('BUILD_LOG_DIR='+str(runner_temp/'duwm1728221-3-logs')+'\n')
        PY_RESTORE
    - name: Check every packaged source file
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_HASH'
        import pathlib,os,json,hashlib
        root=pathlib.Path(os.environ['PROJECT']).resolve()
        expected=json.loads((root/'1728_2_21_3_SOURCE_SHA256.json').read_text())
        for name,sha in expected.items():
            p=(root/name).resolve()
            assert p.is_relative_to(root) and p.is_file(),name
            assert hashlib.sha256(p.read_bytes()).hexdigest()==sha,name
        print('PASS',len(expected),'packaged source hashes')
        PY_HASH
    - name: Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Ensure Android SDK and signing tools
      shell: bash
      run: |
        set -euo pipefail
        SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
        MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
        test -x "$MANAGER"
        if [ ! -s "$SDK/platforms/android-36/android.jar" ] || [ ! -x "$SDK/build-tools/36.0.0/apksigner" ]; then
          timeout 600 "$MANAGER" --sdk_root="$SDK" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
        fi
        test -s "$SDK/platforms/android-36/android.jar"
        test -x "$SDK/build-tools/36.0.0/aapt"
        echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
    - name: Ensure explicit DejaVu host-render test dependency
      shell: bash
      run: |
        set -euo pipefail
        cd "$PROJECT"
        bash verification/ci_host_fonts.sh
    - name: Test /21/3 picture clarity, SDK-field repair and retained broadcast contracts
      shell: bash
      run: |
        set -euo pipefail
        cd "$PROJECT"
        python3 -u verification/ci_host_checks.py
      id: host_checks
    - name: Publish scoped host-render evidence
      uses: actions/upload-artifact@v6
      with:
        name: DUWM-1728.2-21-3-REPAIR2-HOST-RENDER-TESTS-NOT-PHONE
        path: ${{ env.PROJECT }}/verification/results/1728_2_21_3/
        if-no-files-found: warn
        retention-days: 30
      if: always()
    - name: Optional retained debug signing key
      shell: bash
      env:
        SAVED_KEY: ${{ secrets.DUWM_DEBUG_KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        if [ -n "$SAVED_KEY" ]; then
          mkdir -p "$HOME/.android"
          printf '%s' "$SAVED_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
        else
          echo 'No retained debug keystore supplied. Existing installations may have a different signer; preserve private drafts.'
        fi
    - name: Gradle 8.13
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: '8.13'
        cache-disabled: true
    - name: Resolve actual pinned ML Kit SDK and retain dependency diagnostics
      shell: bash
      run: |
        set -euo pipefail
        cd "$PROJECT"
        bash verification/ci_scene_dependency.sh
    - name: Android Java type-check (catches missing methods; not a syntax-only test)
      shell: bash
      run: |
        set -euo pipefail
        cd "$PROJECT"
        bash verification/ci_android_build.sh typecheck
    - name: Assemble real application and instrumentation APKs
      shell: bash
      run: |
        set -euo pipefail
        cd "$PROJECT"
        bash verification/ci_android_build.sh assemble
        mkdir -p "$RUNNER_TEMP/duwm-apk" "$RUNNER_TEMP/duwm-native-test"
        cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/duwm-apk/DUWM-1728.2-21-3-REPAIR2.apk"
        cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/duwm-native-test/DUWM-native-tests.apk"
        cp 1728_2_21_3_BUILD_NOTES.md 1728_2_21_3_ACCEPTANCE.json "$RUNNER_TEMP/duwm-apk/"
        cp verification/run_native_stages.sh verification/verify_native_stages.py verification/summarize_native_stages.py "$RUNNER_TEMP/duwm-native-test/"
    - name: Verify actual APK identity, signature and compiled components
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PY_APK'
        import os,pathlib,zipfile,subprocess,hashlib
        out=pathlib.Path(os.environ['RUNNER_TEMP'])/'duwm-apk'
        apk=out/'DUWM-1728.2-21-3-REPAIR2.apk'
        assert apk.stat().st_size>150000
        with zipfile.ZipFile(apk) as z:
            assert z.testzip() is None
            dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
            for token in (b'SatelliteMapView',b'Duwm1718MonitorsCamActivity',b'Duwm1728BroadcastLayout',b'Duwm1728BroadcastCanvas',b'Duwm1728EglVideoPipe',b'Duwm1728AiProductionClient',b'Duwm1728VideoEditorActivity',b'Duwm1728AiStartPolicy',b'maybeStartAiAfterCapture',b'beginAi',b'Duwm1728BroadcastTimeline',b'Duwm1728ExportPreflight',b'parseSrtCues',b'Duwm1728FramePlan',b'showFraming',b'Duwm1728BroadcastReviewActivity',b'shareIntent',b'Duwm1728EditorTrimPolicy',b'Duwm1728BroadcastReviewState',b'Duwm1728ExportRecovery',b'Duwm1728ExportRecoveryActivity',b'Duwm1728ExportRecoveryProvider',b'Duwm1728BroadcastComposition',b'Duwm1728CaptionEditPolicy',b'Duwm1728CaptionEditorDialog',b'Duwm1728CaptionSrt',b'Duwm1728CaptionFilesController',b'Duwm1728CaptionFileStore',b'Duwm1728CaptionFileProvider',b'Duwm1728AutomaticProduction',b'Duwm1728PcmTimeline',b'Duwm1728SpeechCues',b'Duwm1728CaptionPages',b'Duwm1728SpeechSessionPolicy',b'Duwm1728SpeechLanguagePolicy',b'Duwm1728SpeechReadiness',b'Duwm1728HeadlineFit',b'Duwm1728OutputSizePolicy'):
                assert token in dex,token
        test_apk=pathlib.Path(os.environ['RUNNER_TEMP'])/'duwm-native-test'/'DUWM-native-tests.apk'
        assert test_apk.stat().st_size>50000
        with zipfile.ZipFile(test_apk) as z:
            assert z.testzip() is None
            test_dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
            for token in (b'DuwmRenderedFrameCapture',b'review.missing_file.verified',b'ANDROID-EDITOR-TRIM-LANDSCAPE-BOUNDS.json',b'-CAPTURE.txt',b'caption_files',b'DuwmCaptionFilesChecks',b'automatic_production',b'DuwmAutomaticProductionChecks',b'automatic_report',b'DuwmAutomaticReportChecks',b'automatic_ready',b'DuwmAutomaticReadyChecks',b'automatic_fit',b'DuwmAutomaticFitChecks',b'scene_timeline',b'DuwmSceneTimelineChecks',b'measured_telemetry',b'DuwmMeasuredTelemetryChecks',b'clear_picture',b'DuwmClearPictureChecks',b'DuwmAacPacketContract',b'DuwmNativeAacChecks'):
                assert token in test_dex,token
        tools=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
        signer=subprocess.check_output([str(tools/'apksigner'),'verify','--verbose','--print-certs',str(apk)],text=True)
        print(signer)
        (out/'APK-SIGNER.txt').write_text(signer)
        text=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(apk)],text=True)
        for token in ("versionCode='172824'","versionName='1728.2.21.3'","name='com.sentongoharuna.worldsituationroom.rb2live25'","application-label:'DUWM 1728.2/21/3 • DEVELOP.UGANDA'"):
            assert token in text,token
        (out/'APK-IDENTITY.txt').write_text(text)
        (out/'SHA256SUMS.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  '+apk.name+'\n')
        print('Compiled development APK. AI inference, physical camera and native export are separate gates.')
        PY_APK
    - name: Verify clear-picture, measurement and actual ML Kit class definitions in the compiled APK
      shell: bash
      run: |
        set -euo pipefail
        cd "$PROJECT"
        python3 verification/verify_clear_picture_apk.py "$RUNNER_TEMP/duwm-apk/DUWM-1728.2-21-3-REPAIR2.apk" "$BUILD_LOG_DIR/SCENE-SDK-DEPENDENCY.json" "$RUNNER_TEMP/duwm-apk/CLEAR-PICTURE-SDK-APK-INTEGRATION.json"
        cp "$BUILD_LOG_DIR/SCENE-SDK-DEPENDENCY.json" "$RUNNER_TEMP/duwm-apk/"
    - name: Publish compiled development APK for testing
      uses: actions/upload-artifact@v6
      with:
        name: DUWM-1728.2-21-3-REPAIR2-COMPILED-DEVELOPMENT-APK
        path: ${{ runner.temp }}/duwm-apk/
        if-no-files-found: error
        retention-days: 30
    - name: Publish Android test APK
      uses: actions/upload-artifact@v6
      with:
        name: DUWM-1728.2-21-3-REPAIR2-NATIVE-TEST-APK
        path: ${{ runner.temp }}/duwm-native-test/
        if-no-files-found: error
        retention-days: 30
    - name: Retain compiler logs and diagnostics even when a job fails
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: DUWM-1728.2-21-3-REPAIR2-BUILD-DIAGNOSTICS
        path: |
          ${{ env.PROJECT }}/app/build/reports/
          ${{ env.PROJECT }}/build/reports/
          ${{ runner.temp }}/duwm1728221-3-logs/
          ${{ env.PROJECT }}/verification/results/1728_2_21_3/HOST-CI*
        if-no-files-found: warn
        retention-days: 30
  native-broadcast-tests:
    needs: compile-development
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Java 17 for Android emulator tooling
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Download compiled application
      uses: actions/download-artifact@v7
      with:
        name: DUWM-1728.2-21-3-REPAIR2-COMPILED-DEVELOPMENT-APK
        path: apk
    - name: Download native test APK
      uses: actions/download-artifact@v7
      with:
        name: DUWM-1728.2-21-3-REPAIR2-NATIVE-TEST-APK
        path: tests
    - name: Enable KVM
      shell: bash
      run: |
        set -euo pipefail
        test -e /dev/kvm
        sudo chmod 666 /dev/kvm
    - name: Prepare persistent native test and evidence script
      shell: bash
      run: |
        set -euo pipefail
        cp tests/run_native_stages.sh "$RUNNER_TEMP/duwm-native.sh"
        cp tests/verify_native_stages.py "$RUNNER_TEMP/verify_native_stages.py"
        chmod +x "$RUNNER_TEMP/duwm-native.sh"
        bash -n "$RUNNER_TEMP/duwm-native.sh"
    - name: Required nineteen native stages with exact APK and evidence verification
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        profile: pixel_6
        emulator-boot-timeout: 900
        disable-animations: true
        script: bash "$RUNNER_TEMP/duwm-native.sh" apk/DUWM-1728.2-21-3-REPAIR2.apk tests/DUWM-native-tests.apk native-evidence
    - name: Summarize every native stage
      if: always()
      shell: bash
      run: |
        python3 tests/summarize_native_stages.py native-evidence
    - name: Publish actual native evidence, including failures
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: DUWM-1728.2-21-3-REPAIR2-NATIVE-EXPORT-EVIDENCE
        path: native-evidence/
        if-no-files-found: warn
        retention-days: 30
    - name: Publish development APK with native test evidence only after success
      if: success()
      uses: actions/upload-artifact@v6
      with:
        name: DUWM-1728.2-21-3-REPAIR2-NATIVE-TESTED-DEVELOPMENT-APK
        path: |-
          apk/
          native-evidence/
        if-no-files-found: error
        retention-days: 30
