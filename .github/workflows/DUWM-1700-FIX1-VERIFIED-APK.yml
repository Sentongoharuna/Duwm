name: DUWM 1700 FIX1 | Repair Maritime Java compile and verify real APK
run-name: DUWM 1700 FIX1 | Repair View import; compile, sign and launch APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/DUWM-1700-FIX1-VERIFIED-APK.yml'
      - 'DUWM-1700-FIX1-ANDROID-SOURCE.zip'
permissions:
  contents: read
concurrency:
  group: duwm-1700-fix1-verified-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout precise source ZIP
        uses: actions/checkout@v4
      - name: Reject stale, missing or corrupt 1700 source
        shell: bash
        run: |
          set -euo pipefail
          echo '9d1054edc28304d9641c01d66f0aa7c664849f61d45f3b79c06db710b0477333  DUWM-1700-FIX1-ANDROID-SOURCE.zip' | sha256sum --check
          unzip -t DUWM-1700-FIX1-ANDROID-SOURCE.zip | tail -n 1
          unzip -q DUWM-1700-FIX1-ANDROID-SOURCE.zip -d "$RUNNER_TEMP/duwm1700"
          PROJECT="$RUNNER_TEMP/duwm1700/DUWM-1700-ANDROID-SOURCE"
          test -f "$PROJECT/verification/check_1700_upgrade.py"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK API 36 and signing tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          test -n "$SDK_MANAGER" && test -x "$SDK_MANAGER"
          if [ ! -f "$SDK_ROOT/platforms/android-36/android.jar" ] || [ ! -x "$SDK_ROOT/build-tools/36.0.0/apksigner" ]; then
            yes | timeout 180 "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            timeout 600 "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          fi
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Test exact 1699 source lineage, real features and preserved original globe
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python3 verification/check_source.py
          python3 verification/check_1700_upgrade.py
          python3 verification/check_1700_fix1.py
          mkdir -p "$RUNNER_TEMP/duwm1700-parser"
          javac -d "$RUNNER_TEMP/duwm1700-parser" verification/JavaSyntaxCheck.java
          java -cp "$RUNNER_TEMP/duwm1700-parser" JavaSyntaxCheck
      - name: Compile real Android debug APK (must succeed)
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          gradle --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p "$RUNNER_TEMP/duwm1700-apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/duwm1700-apk/DUWM-1700.apk"
      - name: Reject incorrect APK identity, missing pages, or invalid signature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os,subprocess,zipfile
          apk=Path(os.environ['RUNNER_TEMP'])/'duwm1700-apk/DUWM-1700.apk'
          assert apk.is_file() and apk.stat().st_size>150000, 'No actual compiled APK'
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None, 'Corrupt compiled APK'
              entries=z.namelist()
              assert 'AndroidManifest.xml' in entries
              dex=b''.join(z.read(n) for n in entries if n.startswith('classes') and n.endswith('.dex'))
              for cls in [b'MainActivity',b'SatelliteMapView',b'AircraftOperationsActivity',b'GevMarineActivity',
                          b'Duwm1166NewsDeskActivity',b'Duwm1166RadioAtlasActivity',b'MediaDeskActivity',
                          b'Duwm1687WorkspaceActivity',b'Duwm1687MissionBoard']:
                  assert cls in dex, ('Missing compiled app activity',cls)
              for token in [b'altitudeBand',b'speedBand',b'selectedMapFocus',b'suppressedRepeats',b'mediaSort',b'focusLatestObservedAircraft',b'focusLatestReceivedVessel',b'playAdjacentStation',b'playAdjacentMediaSource']:
                  assert token in dex,('Missing operational filtering logic',token)
          tools=Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
          subprocess.run([str(tools/'apksigner'),'verify','--verbose',str(apk)],check=True)
          badge=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(apk)],text=True)
          for expected in ["versionCode='170000'", "versionName='1700'", "application-label:'DUWM 1700 • DEVELOP.UGANDA'",
                           "name='com.sentongoharuna.worldsituationroom.rb2live25'"]:
              assert expected in badge,('Wrong installed APK',expected,badge[:900])
          (apk.parent/'SHA256SUMS.txt').write_text(f'{hashlib.sha256(apk.read_bytes()).hexdigest()}  {apk.name}\n')
          print('PASS compiled actual 1700 APK, signature, identity, original globe and native activity code')
          PY
      - name: Android emulator — install and launch the original globe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            PKG=com.sentongoharuna.worldsituationroom.rb2live25
            APK="$RUNNER_TEMP/duwm1700-apk/DUWM-1700.apk"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n "$PKG/com.sentongoharuna.worldsituationroom.MainActivity"
            sleep 20
            adb shell pidof "$PKG"
            adb exec-out screencap -p > "$RUNNER_TEMP/duwm1700-apk/01-ORIGINAL-GLOBE.png"
            adb shell uiautomator dump /sdcard/duwm1700.xml || true
            adb pull /sdcard/duwm1700.xml "$RUNNER_TEMP/duwm1700-apk/02-UI-TREE.xml" || true
            test -s "$RUNNER_TEMP/duwm1700-apk/01-ORIGINAL-GLOBE.png"
            adb logcat -d -s AndroidRuntime:E > "$RUNNER_TEMP/duwm1700-apk/03-RUNTIME-ERRORS.txt" || true
            if grep -q "FATAL EXCEPTION" "$RUNNER_TEMP/duwm1700-apk/03-RUNTIME-ERRORS.txt"; then
              echo 'FATAL EXCEPTION during original globe launch'; cat "$RUNNER_TEMP/duwm1700-apk/03-RUNTIME-ERRORS.txt"; exit 1
            fi
      - name: Publish verified installable APK only after all checks pass
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-1700-FIX1-VERIFIED-INSTALLABLE-APK
          path: ${{ runner.temp }}/duwm1700-apk/
          if-no-files-found: error
          retention-days: 30
