name: DUWM 1.2-20-4-20 WORKING GLOBE BASELINE FIX2 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/DUWM-1-2-20-4-20-WORKING-GLOBE-BASELINE-FIX2-APK.yml"
      - "DUWM-1-2-20-4-20-WORKING-GLOBE-BASELINE-FIX2-SOURCE.tar.gz"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact source
        run: echo "0debfa1d7a816bf54d9601210c9c79d017a269018b56aba0500db2862aea262e  DUWM-1-2-20-4-20-WORKING-GLOBE-BASELINE-FIX2-SOURCE.tar.gz" | sha256sum -c -

      - name: Extract
        run: |
          mkdir -p "$RUNNER_TEMP/duwm"
          tar -xzf DUWM-1-2-20-4-20-WORKING-GLOBE-BASELINE-FIX2-SOURCE.tar.gz -C "$RUNNER_TEMP/duwm"
          echo "PROJECT_DIR=$RUNNER_TEMP/duwm/world-situation-room-native-1-2-20-4-20-WORKING-GLOBE-BASELINE-FIX1" >> "$GITHUB_ENV"

      - name: Working Globe Baseline FIX2 Gate
        run: |
          chmod +x "$PROJECT_DIR/scripts/"*.sh
          "$PROJECT_DIR/scripts/verify-1-2-20-4-20-working-globe-baseline-fix1.sh" "$PROJECT_DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true

      - name: Compile
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac --stacktrace

      - name: Lint
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:lintDebug --stacktrace

      - name: Assemble
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace

      - name: Stage exactly one APK
        run: |
          mapfile -t A < <(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk")
          test "${#A[@]}" -eq 1 && test -s "${A[0]}"
          mkdir -p "$RUNNER_TEMP/release"
          cp "${A[0]}" "$RUNNER_TEMP/release/DUWM-1-2-20-4-20-WORKING-GLOBE-BASELINE-FIX2.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DUWM-1-2-20-4-20-WORKING-GLOBE-BASELINE-FIX2-APK
          path: ${{ runner.temp }}/release/DUWM-1-2-20-4-20-WORKING-GLOBE-BASELINE-FIX2.apk
          if-no-files-found: error
