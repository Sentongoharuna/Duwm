name: "DUWM 1728.2/21/4/13 | Professional headline and status transitions"
run-name: "DUWM 1728.2/21/4/13 | Build APK and verify professional transitions + 20 native stages"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "DUWM-1728.2-21-4-13-PROFESSIONAL-TRANSITIONS-SOURCE.zip"
      - ".github/workflows/DUWM-1728.2-21-4-13-PROFESSIONAL-TRANSITIONS-APK.yml"

permissions:
  contents: read

concurrency:
  group: duwm-1728-2-21-4-13-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_ZIP: DUWM-1728.2-21-4-13-PROFESSIONAL-TRANSITIONS-SOURCE.zip
  SOURCE_SHA256: e011e645f4cdceba8493cf67d6b59fde734fe86dc3e99262780cd1335959c28c
  PROJECT_DIR: DUWM-1728-2-21-4-13-ANDROID-SOURCE
  APP_ARTIFACT: DUWM-1728.2-21-4-13-COMPILED-APK
  TEST_ARTIFACT: DUWM-1728.2-21-4-13-NATIVE-TEST-APK
  TESTED_ARTIFACT: DUWM-1728.2-21-4-13-NATIVE-TESTED-INSTALLABLE-APK

jobs:
  compile-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Restore and verify exact /21/4/13 source
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP"
          echo "$SOURCE_SHA256  $SOURCE_ZIP" | sha256sum -c -
          rm -rf "$PROJECT_DIR"
          unzip -q "$SOURCE_ZIP"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          python3 - <<'PY2'
          from pathlib import Path
          import hashlib, json
          root=Path("DUWM-1728-2-21-4-13-ANDROID-SOURCE")
          data=json.loads((root/"1728_2_21_4_13_SOURCE_SHA256.json").read_text())
          assert data["build"]=="1728.2/21/4/13"
          assert len(data["files"])==data["file_count"]
          for rel,want in data["files"].items():
              p=root/rel
              assert p.is_file(), f"Missing packaged file: {rel}"
              assert hashlib.sha256(p.read_bytes()).hexdigest()==want, f"Changed packaged file: {rel}"
          print("PASS",data["file_count"],"packaged source hashes")
          PY2
      - name: Smooth ticker policy host test
        working-directory: ${{ env.PROJECT_DIR }}
        run: verification/run_smooth_ticker_policy_host_tests.sh
      - name: Source/time ticker attribution host test
        working-directory: ${{ env.PROJECT_DIR }}
        run: verification/run_ticker_attribution_host_tests.sh
      - name: Compact production status policy host test
        working-directory: ${{ env.PROJECT_DIR }}
        run: verification/run_production_status_policy_host_tests.sh
      - name: Professional headline and status transition host test
        working-directory: ${{ env.PROJECT_DIR }}
        run: verification/run_professional_transition_host_tests.sh
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
          cache-disabled: true
      - name: Ensure Android SDK and signing tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${{ANDROID_SDK_ROOT:-${{ANDROID_HOME:-/usr/local/lib/android/sdk}}}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$MANAGER"
          yes | "$MANAGER" --licenses >/dev/null || true
          "$MANAGER" --sdk_root="$SDK" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: Resolve actual pinned ML Kit SDK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --no-configuration-cache --console=plain :app:duwmVerifySceneDependency --stacktrace
      - name: Android Java type-check
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --no-configuration-cache --console=plain :app:compileDebugJavaWithJavac :app:compileDebugAndroidTestJavaWithJavac --stacktrace
      - name: Assemble application and native-test APKs
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --console=plain :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          mkdir -p "$GITHUB_WORKSPACE/apk-output" "$GITHUB_WORKSPACE/test-output"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk-output/DUWM-1728.2-21-4-13-PROFESSIONAL-TRANSITIONS.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$GITHUB_WORKSPACE/test-output/DUWM-native-tests.apk"
      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/apk-output/DUWM-1728.2-21-4-13-PROFESSIONAL-TRANSITIONS.apk"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-output/APK-IDENTITY.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/apk-output/APK-SIGNER.txt"
          grep -q "versionCode='172837'" "$GITHUB_WORKSPACE/apk-output/APK-IDENTITY.txt"
          grep -q "versionName='1728.2.21.4.13'" "$GITHUB_WORKSPACE/apk-output/APK-IDENTITY.txt"
          grep -q "name='com.sentongoharuna.worldsituationroom.rb2live25'" "$GITHUB_WORKSPACE/apk-output/APK-IDENTITY.txt"
          sha256sum "$APK" > "$GITHUB_WORKSPACE/apk-output/SHA256SUMS.txt"
      - name: Publish compiled APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_ARTIFACT }}
          path: apk-output/
          if-no-files-found: error
          retention-days: 30
      - name: Publish native test APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.TEST_ARTIFACT }}
          path: test-output/
          if-no-files-found: error
          retention-days: 30

  native-broadcast-tests:
    needs: compile-development
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Restore exact source for native scripts
        shell: bash
        run: |
          set -euo pipefail
          echo "$SOURCE_SHA256  $SOURCE_ZIP" | sha256sum -c -
          rm -rf "$PROJECT_DIR"
          unzip -q "$SOURCE_ZIP"
          test -x "$PROJECT_DIR/verification/run_native_stages.sh"
      - name: Java 17 for emulator tooling
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Download compiled application
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.APP_ARTIFACT }}
          path: apk
      - name: Download native test APK
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.TEST_ARTIFACT }}
          path: tests
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Run all twenty native stages
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-animations: true
          script: >-
            bash "$GITHUB_WORKSPACE/$PROJECT_DIR/verification/run_native_stages.sh"
            "$GITHUB_WORKSPACE/apk/DUWM-1728.2-21-4-13-PROFESSIONAL-TRANSITIONS.apk"
            "$GITHUB_WORKSPACE/tests/DUWM-native-tests.apk"
            "$GITHUB_WORKSPACE/native-evidence"
      - name: Publish actual native evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DUWM-1728.2-21-4-13-NATIVE-EVIDENCE
          path: native-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish native-tested installable APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.TESTED_ARTIFACT }}
          path: apk/DUWM-1728.2-21-4-13-PROFESSIONAL-TRANSITIONS.apk
          if-no-files-found: error
          retention-days: 30
