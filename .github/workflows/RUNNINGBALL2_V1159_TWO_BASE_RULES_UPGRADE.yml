    - name: V1159 BASE RULES - make original globe sources visible and preserve signal continuity
      shell: bash
      run: |
        set -euo pipefail
        python3 - "$PROJECT_DIR" <<'V1159_BASE_RULES_PATCH'
        from pathlib import Path
        import hashlib,sys
        project=Path(sys.argv[1]);folder=project/'app/src/main/java/com/sentongoharuna/worldsituationroom'
        target=folder/'OperationsMainActivity.java'
        protected=[folder/name for name in ('SatelliteMapView.java','DuwmLiveWallpaperService.java','MainActivity.java','MediaDeskActivity.java','AircraftOperationsActivity.java')]
        baseline={str(f):hashlib.sha256(f.read_bytes()).hexdigest() for f in protected}
        s=target.read_text(encoding='utf-8')
        def exactly_once(old,new,label):
            global s
            count=s.count(old)
            assert count==1, f'{label}: expected one original anchor, found {count}'
            s=s.replace(old,new,1)
        # Show genuine per-source status on the ORIGINAL renderer, not just on its hidden substitute.
        exactly_once('originalHud.setVisibility(View.GONE);',
                     'originalHud.setVisibility(View.VISIBLE);', 'original source HUD visibility')
        exactly_once('earthHud.addView(text("LIVE EARTH / GLOBAL SIGNALS",11,TEXT,true));',
                     'earthHud.addView(text("ORIGINAL GLOBE / OBSERVED SIGNALS",11,TEXT,true));', 'native HUD heading')
        # Give the protected globe more first-screen room without discarding the source-backed telemetry panel.
        exactly_once('root.addView(telemetryPanel,new LinearLayout.LayoutParams(-1,dp(178)));',
                     'root.addView(telemetryPanel,new LinearLayout.LayoutParams(-1,dp(166)));','native globe space')
        # Keep observed aircraft stable by their received callsign/source between source refreshes.
        # This changes rendering identity only; the actual coordinates and times remain source-derived.
        exactly_once('String id="observed-"+a.type+"-"+a.title+"-"+a.timeMillis;',
                     'String id="observed-"+a.type+"-"+a.title+"-"+(a.type==OperationsGlobeView.AIR?a.source:a.timeMillis);', 'source marker continuity')
        target.write_text(s,encoding='utf-8')
        for f in protected:
            assert hashlib.sha256(f.read_bytes()).hexdigest()==baseline[str(f)], 'original source changed '+f.name
        assert 'nativeGlobe.setGlobeMode(true);' in s and 'nativeGlobe.setSignals(toNativeSignals(earthObservations));' in s
        assert 'originalHud.setVisibility(View.VISIBLE);' in s
        assert 'ORIGINAL GLOBE / OBSERVED SIGNALS' in s
        print('PASS BASE RULE 1: exact original native globe + truthful observed-source status in first viewport')
        print('PASS BASE RULE 2: actual extra screen room and stable received aircraft markers; NO version bump')
        V1159_BASE_RULES_PATCH
