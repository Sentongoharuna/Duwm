    - name: DUWM 1160 install 8-color incoming signal lights across every screen
      shell: bash
      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" <<'PY_DUWM_1160_SIGNALS'\nfrom pathlib import Path\nimport sys,xml.etree.ElementTree\
        \ as ET,hashlib,gzip,base64\nroot=Path(sys.argv[1]);main=root/'app/src/main'\npkg=main/'java/com/sentongoharuna/worldsituationroom'\n\
        res=main/'res'\nassert pkg.is_dir(), 'Original Android package missing'\n# Preserve every home-screen widget, unchanged original\
        \ globe, wallpaper, and all existing share flows.\nwidget_names=['DuWidgetProviders.java','DuWidgetUpdater.java','WidgetSnapshot.java','WidgetRefreshScheduler.java']\n\
        protected_names=widget_names+['SatelliteMapView.java','DuwmLiveWallpaperService.java',\n                             'OperationsGlobeView.java','V115941ShareCards.java',\n\
        \                             'OperationsMainActivity.java','MediaDeskActivity.java',\n                             'AircraftOperationsActivity.java','WorldSourceHubActivity.java']\n\
        before={n:hashlib.sha256((pkg/n).read_bytes()).hexdigest() for n in protected_names if (pkg/n).is_file()}\nwidget_xml={str(p):hashlib.sha256(p.read_bytes()).hexdigest()\
        \ for p in res.rglob('*') if p.is_file() and 'widget' in p.name.lower()}\nassert (pkg/'V115941ShareCards.java').is_file(), 'Per-point\
        \ card renderer was not retained'\npayloads={'DuwmSignalRail.java': ('4e7a2af74fecd23bbcc6ad5febaea018206d7f5aeb6a607b714371b08243e930',\n\
        ''),\n\
        'DuwmSignalProvider.java': ('62fef27cafffc1995b404f054cd67a46a0ad20d49f0b92ed93ed2c21fddd12e5',\n''),\n\
        'DuwmSignalMonitor.java': ('f3dd4432ea1dd68c33619871f98b610920de85d894ef1f0047dde33ac136e7f6',\n'')}\n\
        for name,(sha,encoded) in payloads.items():\n    java=gzip.decompress(base64.b64decode(encoded,validate=True))\n    assert hashlib.sha256(java).hexdigest()==sha,('Signal\
        \ source checksum mismatch',name)\n    assert not (pkg/name).exists(),('Signal source already installed',name)\n    (pkg/name).write_bytes(java)\n\
        \n# Wire only the received source receipts into the lights. No artificial network results.\npulse=pkg/'PulseDataActivity.java'\n\
        s=pulse.read_text(encoding='utf-8')\ndef once(anchor,replace,label):\n    global s\n    assert s.count(anchor)==1,('Unexpected\
        \ Pulse source change',label,s.count(anchor))\n    s=s.replace(anchor,replace,1)\nonce('        long now=System.currentTimeMillis();freshCount=0;',\n\
        \     '        long now=System.currentTimeMillis();freshCount=0;\\n'\n     '        boolean movingPoint=false,recentNewQuake=false,newNews=false;',\
        \ 'state snapshot')\nonce('            p.oldX=(float)(prior.longitude/180d);p.oldY=(float)(prior.latitude/90d);p.moveStarted=now;',\n\
        \     '            p.oldX=(float)(prior.longitude/180d);p.oldY=(float)(prior.latitude/90d);p.moveStarted=now;\\n'\n     '  \
        \          movingPoint=true;', 'real observed movement')\nonce('          if(!seen.contains(p.id)){freshCount++;seen.add(p.id);}',\n\
        \     '''          if(!seen.contains(p.id)){\n            freshCount++;seen.add(p.id);\n            // ALERT may light only\
        \ for a newly received quake with a recent provider timestamp.\n            if(p.kind.equals(\"EARTHQUAKE\") && p.time>0 &&\
        \ p.time<=now && now-p.time<900000L)\n              recentNewQuake=true;\n            if(p.kind.equals(\"NEWS\"))newNews=true;\n\
        \          }''', 'genuine new event detection')\nonce('        loading=false;drawAll();',\n     '        DuwmSignalRail.publishPulse(this,state,movingPoint,recentNewQuake,newNews,freshCount>0,now);\\\
        n'\n     '        loading=false;drawAll();', 'verified receipt publisher')\nonce('    add(root,label(\"SOURCE-DRIVEN RADAR \
        \ •  EVERY RECORD SHAREABLE\",11,MUTED));',\n     '''    add(root,label(\"SOURCE-DRIVEN RADAR  •  EVERY RECORD SHAREABLE\",11,MUTED));\n\
        \    add(root,label(\"SIGNAL LIGHTS  /  COLOUR KEY\\\\nRED alert  •  ORANGE traffic  •  YELLOW satellite  •  GREEN verified\\\
        \\nBLUE vessel/weather  •  CYAN incoming feed  •  PURPLE intelligence  •  WHITE system\\\\nBright = recent real receipt; blinking\
        \ = a genuine new arrival/change; dim = no confirmed data. Tap an LED to share its actual status.\",10,MUTED));''', 'visible\
        \ eight-category legend')\nonce('DEVELOP.UGANDA-World-Monitor/1159.4-2',\n     'DEVELOP.UGANDA-World-Monitor/1160', 'versioned\
        \ source user-agent')\npulse.write_text(s,encoding='utf-8')\n\n# A private startup provider registers one lifecycle observer\
        \ for ALL Activities.\n# It does not replace the app's Application class or the original widget receivers.\nmanifest=main/'AndroidManifest.xml'\n\
        ET.register_namespace('android','http://schemas.android.com/apk/res/android')\ntree=ET.parse(manifest);app=tree.getroot().find('application')\n\
        assert app is not None\nA='{http://schemas.android.com/apk/res/android}'\noriginal_receivers=[ET.tostring(n,encoding='unicode')\
        \ for n in app.findall('receiver')]\noriginal_activities=[ET.tostring(n,encoding='unicode') for n in app.findall('activity')]\n\
        existing_provider=[n.get(A+'name','') for n in app.findall('provider')]\nassert not any('DuwmSignalProvider' in p for p in existing_provider),\
        \ 'Signal initializer already present'\nET.SubElement(app,'provider',{A+'name':'.DuwmSignalProvider',\n                    \
        \          A+'authorities':'com.sentongoharuna.worldsituationroom.rb2live25.signals1160',\n                              A+'exported':'false'})\n\
        assert [ET.tostring(n,encoding='unicode') for n in app.findall('receiver')]==original_receivers\nassert [ET.tostring(n,encoding='unicode')\
        \ for n in app.findall('activity')]==original_activities\ntree.write(manifest,encoding='utf-8',xml_declaration=True)\nfor name,sha\
        \ in before.items():\n    assert hashlib.sha256((pkg/name).read_bytes()).hexdigest()==sha,('Protected feature changed',name)\n\
        for path,sha in widget_xml.items():\n    assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==sha,('Original widget UI\
        \ changed',path)\nrail=(pkg/'DuwmSignalRail.java').read_text(encoding='utf-8')\nassert all(x in rail for x in ['RED: alert','ORANGE:\
        \ observed traffic movement','YELLOW: observed satellite',\n                              'GREEN: verified received source','BLUE:\
        \ vessel/weather','CYAN: communications/incoming feed',\n                              'PURPLE: news/intelligence','WHITE: app/system\
        \ active',\n                              'onActivityResumed(Activity a) { attach(a); DuwmSignalMonitor.resumed(a); }',\n  \
        \                            'publishPulse(', 'publishVerifiedReceipt(', 'V115941ShareCards.share'])\nmonitor=(pkg/'DuwmSignalMonitor.java').read_text(encoding='utf-8')\n\
        assert all(t in monitor for t in ['opensky-network.org/api/states/all', 'earthquake.usgs.gov',\n                           \
        \       'api.wheretheiss.at', 'feeds.bbci.co.uk', 'DuwmSignalRail.publishPulse',\n                                  'source-led-refresh',\
        \ 'Response too large'])\nassert 'DuwmSignalRail.publishPulse(this,state,movingPoint,recentNewQuake,newNews,freshCount>0,now);'\
        \ in s\nassert 'android:exported' in manifest.read_text() and 'signals1160' in manifest.read_text()\nprint('PASS DUWM 1160:\
        \ 8 original-style lights on every Activity, actual receipts / status changes only; no added widget or demo data; every LED\
        \ shareable')\nPY_DUWM_1160_SIGNALS"
    - name: Validate 1160 map installer without deleting original features
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''DUWM_MAP_PREFLIGHT''

        from pathlib import Path

        import yaml,ast,re,base64,gzip,hashlib

        wf=yaml.safe_load(Path(''.github/workflows/DUWM-1160-GEOMAPS-READY.yml'').read_text())

        assert str(wf[''name'']).startswith(''DUWM 1160'')

        s=next(x[''run''] for x in wf[''jobs''][''build''][''steps''] if x[''name''].startswith(''DUWM 1160 MAP FIX''))

        body=re.search(r"<<''DUWM1160_REAL_PLACE_MAP''\n(.*?)\nDUWM1160_REAL_PLACE_MAP",s,re.S)

        assert body, ''Native map installer not located''

        ast.parse(body.group(1))

        print(''PASS map-source installer syntax and no new version designation'')

        DUWM_MAP_PREFLIGHT

        '
