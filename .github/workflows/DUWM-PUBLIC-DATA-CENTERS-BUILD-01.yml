      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Compile Android code
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac --stacktrace
      - name: Assemble real APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace
      - name: Verify APK contains all catalog sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk')
          test "${#APKS[@]}" -eq 1
          test -s "${APKS[0]}"
          unzip -p "${APKS[0]}" assets/duwm_public_centers.tsv > "$RUNNER_TEMP/packed-catalog.tsv"
          test "$(wc -l < "$RUNNER_TEMP/packed-catalog.tsv")" -eq 93
          grep -q 'USGS Earthquake Feed' "$RUNNER_TEMP/packed-catalog.tsv"
          grep -q 'Uganda Bureau of Statistics' "$RUNNER_TEMP/packed-catalog.tsv"
          grep -q 'CelesTrak' "$RUNNER_TEMP/packed-catalog.tsv"
          mkdir -p "$RUNNER_TEMP/release"
          cp "${APKS[0]}" "$RUNNER_TEMP/release/DUWM-PUBLIC-DATA-CENTERS-01.apk"
          sha256sum "$RUNNER_TEMP/release/DUWM-PUBLIC-DATA-CENTERS-01.apk" > "$RUNNER_TEMP/release/SHA256.txt"
      - name: Upload APK for phone download
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-PUBLIC-DATA-CENTERS-01-APK
          path: |
            ${{ runner.temp }}/release/DUWM-PUBLIC-DATA-CENTERS-01.apk
            ${{ runner.temp }}/release/SHA256.txt
          if-no-files-found: error
          retention-days: 14
