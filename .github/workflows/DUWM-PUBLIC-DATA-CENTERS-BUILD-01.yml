name: DUWM PUBLIC DATA CENTERS 01 - REAL SOURCES APK
run-name: DUWM PUBLIC DATA CENTERS 01 #${{ github.run_number }}
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/DUWM-PUBLIC-DATA-CENTERS-BUILD-01.yml'
permissions:
  contents: read
concurrency:
  group: duwm-public-centers-v1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout existing DUWM repository
        uses: actions/checkout@v4
      - name: Verify and unpack last compiled DUWM archive
        shell: bash
        run: |
          set -euo pipefail
          echo '36c771fedacc2246a51c9cdf065e52d5749a54dc87ccb0495481752316b49187  DUWM-UPGRADE-1-1-20-20-FINAL-FIX2-SOURCE.tar.gz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/duwm";tar -xzf DUWM-UPGRADE-1-1-20-20-FINAL-FIX2-SOURCE.tar.gz -C "$RUNNER_TEMP/duwm"
          test -s "$RUNNER_TEMP/duwm/app/src/main/AndroidManifest.xml"
          echo "PROJECT_DIR=$RUNNER_TEMP/duwm" >> "$GITHUB_ENV"
      - name: Verify original baseline before integration
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$PROJECT_DIR/scripts/"*.sh
          "$PROJECT_DIR/scripts/verify-step12-fix2.sh" "$PROJECT_DIR"
          "$PROJECT_DIR/scripts/verify-upgrade-1-1-20-18-regressions.sh" "$PROJECT_DIR"
          "$PROJECT_DIR/scripts/verify-upgrade-1-1-20-19-ui-contract.sh" "$PROJECT_DIR"
          "$PROJECT_DIR/scripts/verify-upgrade-1-1-20-20-final.sh" "$PROJECT_DIR"
          "$PROJECT_DIR/scripts/verify-upgrade-1-1-20-20-warning-fix2.sh" "$PROJECT_DIR"
      - name: Inject all 93 centers and native Android screen
        shell: bash
        run: |
