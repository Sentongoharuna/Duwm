name: RUNNINGBALL2 V110 FIX1 FULL PREVIOUS DEVELOPMENTS + LOGO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/V110_FIX2_DIRECT_PHONE_UPLOAD.yml"

permissions:
  contents: read
jobs:
  build:
    name: Preserve V109 complete engine, install DEVELOP.UGANDA logo, verify APK
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - name: Checkout current DUWM repository (source workflow and assets)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact protected original RUNNINGBALL2 baseline
        uses: actions/checkout@v4
        with:
          repository: Sentongoharuna/Du-World-Situation-Room-
          ref: 7d952dd607cdeec94832896023c10203425a3b7f
          path: rb2-original-source
          persist-credentials: false

      - name: Set up original Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up original Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up original Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true

      - name: Verify V109 source identity and required tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir PyYAML==6.0.3
          test "$(git hash-object .github/workflows/RUNNINGBALL2_V109.yml)" = "e6b8f657870b9ccec31a0fcd9e7c864a491c5e4c"
          test -d rb2-original-source
          java -version
          gradle --version
          python3 - <<'PY_CONTRACT'
          import yaml,pathlib
          src=pathlib.Path('.github/workflows/RUNNINGBALL2_V109.yml')
          data=yaml.safe_load(src.read_text(encoding='utf8'))
          steps=data['jobs']['build']['steps']
          assert len(steps)==97,('V109 source step count changed',len(steps))
          assert steps[6]['name'].startswith('Verify and unpack complete V24')
          assert steps[7]['name'].startswith('Execute EVERY V24')
          assert steps[12]['name'].startswith('Install V25 unique package')
          assert steps[62]['name'].startswith('V108 INSTALL')
          assert steps[67]['name'].startswith('Compile Android Java')
          for i in range(6,67):
              step=steps[i]
              if 'uses' in step:
                  assert i in (36,38,61,66),f'Unexpected source action at step {i+1}: {step}'
                  assert step['uses']=='actions/upload-artifact@v4'
              else:
                  assert 'run' in step,('Empty required source step',i+1)
          print('PASS: EXACT V109 source workflow pinned, full native V24→V108 source chain preserved')
          PY_CONTRACT

      - name: Execute original V109 Android source generation and every source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_REBUILD'
          import pathlib,subprocess,yaml,os,sys
          source=pathlib.Path('.github/workflows/RUNNINGBALL2_V109.yml')
          steps=yaml.safe_load(source.read_text(encoding='utf-8'))['jobs']['build']['steps']
          assert len(steps)==97
          env=os.environ.copy()
          root=pathlib.Path(env['GITHUB_WORKSPACE'])
          marker=pathlib.Path(env['GITHUB_ENV'])
          # V109 steps 7..67: preserve all real source installs and regression contracts.
          # Four upload-artifact actions have no equivalent standalone shell command;
          # source-probe commands are still executed and evidence remains on disk.
          for index in range(6,67):
              part=steps[index]
              if 'uses' in part:
                  assert index in (36,38,61,66) and part['uses']=='actions/upload-artifact@v4'
                  print(f'PRESERVED EVIDENCE (upload deferred) step {index+1}: {part["name"]}',flush=True)
                  continue
              print(f'RUN PRESERVED V109 step {index+1}/67: {part["name"]}',flush=True)
              script=part['run']
              assert '${{' not in script, ('GitHub expression would not expand in wrapper',index+1)
              proc=subprocess.run(['bash','-e','-o','pipefail','-c',script],cwd=root,env=env,check=False)
              if proc.returncode:
                  raise SystemExit(f'V110 STOP: V109 inherited step {index+1} FAILED: {part["name"]}; exit {proc.returncode}')
              # The real GitHub runner sets GITHUB_ENV only after an Action step.
              # Re-read each emitted value so the inherited steps behave identically.
              if marker.exists():
                  for line in marker.read_text().splitlines():
                      if '=' not in line: continue
                      key,value=line.split('=',1)
                      if key and key.isidentifier():env[key]=value
          project=pathlib.Path(env.get('PROJECT_DIR',''))
          assert project.is_dir() and (project/'app/build.gradle.kts').is_file(),('Generated app missing',project)
          with marker.open('a') as f:f.write('PROJECT_DIR='+str(project.resolve())+'\n')
          print('PASS: full V109 source-generation through V108 preserved; no new placeholder app substituted',flush=True)
          pathlib.Path('/tmp/V110_INHERITED_FEATURES.txt').write_text('\n'.join(
              f'{index+1}: {steps[index]["name"]}' for index in range(6,67)
          )+'\n',encoding='utf8')
          PY_REBUILD

