          expected='e583513eda20b22ee9a9641c58a2b58869fd9997a94ae49c1321c378aa32d97b'
          assert hashlib.sha256(logo).hexdigest()==expected,'Official logo data integrity failure'
          assert logo[:8]==bytes.fromhex('89504e470d0a1a0a'),'Brand image must be PNG'
          res=root/'app/src/main/res'
          image_path=res/'drawable-nodpi'/'develop_uganda_logo.png'
          image_path.parent.mkdir(parents=True,exist_ok=True)
          image_path.write_bytes(logo)
          # Asset remains reusable from ImageView and future source-credited share cards.
          assets=root/'app/src/main/assets';assets.mkdir(parents=True,exist_ok=True)
          (assets/'develop_uganda_logo.png').write_bytes(logo)
          # Preserve all existing activities, providers and wallpaper services.
          manifest=root/'app/src/main/AndroidManifest.xml'
          source=manifest.read_text(encoding='utf-8')
          match=re.search(r'<application\b[^>]*>',source,flags=re.S)
          assert match,'Android manifest must have an application tag'
          tag=match.group(0)
          if re.search(r'android:icon\s*=\s*"[^"]*"',tag):
              tag=re.sub(r'android:icon\s*=\s*"[^"]*"','android:icon="@drawable/develop_uganda_logo"',tag,count=1)
          else:
              tag=tag.replace('<application','<application android:icon="@drawable/develop_uganda_logo"',1)
          if re.search(r'android:roundIcon\s*=\s*"[^"]*"',tag):
              tag=re.sub(r'android:roundIcon\s*=\s*"[^"]*"','android:roundIcon="@drawable/develop_uganda_logo"',tag,count=1)
          else:
              tag=tag.replace('<application','<application android:roundIcon="@drawable/develop_uganda_logo"',1)
          # App drawer title is bound to the upgraded app_name resource, not a stale literal.
          if re.search(r'android:label\s*=\s*"[^"]*"',tag):
              tag=re.sub(r'android:label\s*=\s*"[^"]*"','android:label="@string/app_name"',tag,count=1)
          else:
              tag=tag.replace('<application','<application android:label="@string/app_name"',1)
          manifest.write_text(source[:match.start()]+tag+source[match.end():],encoding='utf-8')
          # Keep the original installation package identity so V110 is an update.
          gradle=root/'app/build.gradle.kts';text=gradle.read_text(encoding='utf-8')
          assert text.count('applicationId = "com.sentongoharuna.worldsituationroom.rb2live25"')==1
          assert text.count('versionCode = 110')==1
          text=text.replace('versionCode = 110','versionCode = 111',1)
          assert text.count('versionName = "RUNNINGBALL2-V109-XML-NAVIGATION-REPAIR"')==1
          text=text.replace('versionName = "RUNNINGBALL2-V109-XML-NAVIGATION-REPAIR"','versionName = "RUNNINGBALL2-V110-DEVELOP-UGANDA-OFFICIAL-LOGO"',1)
          gradle.write_text(text,encoding='utf-8')
          strings=res/'values/strings.xml';a=strings.read_text(encoding='utf-8')
          a,count=re.subn(r'(<string\s+name="app_name">).*?(</string>)',r'\g<1>DEVELOP.UGANDA V110\g<2>',a,count=1)
          assert count==1,'app_name resource missing'
          strings.write_text(a,encoding='utf-8')
          assert image_path.read_bytes()==(assets/'develop_uganda_logo.png').read_bytes()
          assert 'android:icon="@drawable/develop_uganda_logo"' in manifest.read_text()
          assert 'android:roundIcon="@drawable/develop_uganda_logo"' in manifest.read_text()
          print('PASS V110 official logo: launcher, round icon, reusable app image resource and new visible label')
          print('PASS V110 original activity/wallpaper/source Java unchanged')
          PY_V110_LOGO

      - name: Compile original app and produce signed V110 debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac :app:assembleDebug --stacktrace

      - name: Verify actual APK assets, prior application identity, and embedded official logo
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t APKS < <(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print0)
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          test -s "$APK"
          mkdir -p "$RUNNER_TEMP/release"
          cp "$APK" "$RUNNER_TEMP/release/RUNNINGBALL2-V110-DEVELOP-UGANDA-LOGO-APK.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F 'com.sentongoharuna.worldsituationroom.rb2live25'
          echo "$BADGING" | grep -F "versionCode='111'"
          echo "$BADGING" | grep -F 'DEVELOP.UGANDA V110'
          python3 - "$APK" <<'PY_CHECK_APK'
          import zipfile,sys
          with zipfile.ZipFile(sys.argv[1]) as apk:
              assert apk.testzip() is None
              paths=apk.namelist()
              assert 'classes.dex' in paths and 'AndroidManifest.xml' in paths
              icons=[p for p in paths if p.endswith('/develop_uganda_logo.png')]
              assert icons,('Official PNG absent from compiled APK',paths[-30:])
              assert any(p.endswith('assets/develop_uganda_logo.png') for p in paths),'Reusable official logo missing'
              import hashlib
              embedded=apk.read('assets/develop_uganda_logo.png')
              assert hashlib.sha256(embedded).hexdigest()=='e583513eda20b22ee9a9641c58a2b58869fd9997a94ae49c1321c378aa32d97b','Official icon was changed in packaging'
              assert any(x.endswith('develop_uganda_logo.png') and x!='assets/develop_uganda_logo.png' for x in paths),'Drawable PNG missing'
              print('PASS V110 APK: true classes.dex, preserved native app, exact original branded image')
          PY_CHECK_APK
          sha256sum "$RUNNER_TEMP/release/RUNNINGBALL2-V110-DEVELOP-UGANDA-LOGO-APK.apk"
          echo 'V110 official logo embedded in original V109 native app. Prior V24-V109 source-generation retained; real provider availability not guaranteed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V110 APK regardless of later emulator result
        uses: actions/upload-artifact@v4
        with:
          name: RUNNINGBALL2-V110-DEVELOP-UGANDA-APK
          path: ${{ runner.temp }}/release/RUNNINGBALL2-V110-DEVELOP-UGANDA-LOGO-APK.apk
          if-no-files-found: error
          retention-days: 30

      - name: Permit Android emulator hardware acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator - install V110 and prove native app starts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            APK="$RUNNER_TEMP/release/RUNNINGBALL2-V110-DEVELOP-UGANDA-LOGO-APK.apk"
            PKG='com.sentongoharuna.worldsituationroom.rb2live25'
            adb install -r "$APK"
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 | tee /tmp/V110_LAUNCH_LOG.txt
            sleep 9
            adb shell pidof "$PKG" | grep -Eq '[0-9]+'
            adb shell dumpsys activity activities > /tmp/V110_ACTIVITY.txt
            adb exec-out screencap -p > /tmp/V110_LAUNCH.png
            test -s /tmp/V110_LAUNCH.png
            echo 'PASS V110: real emulator installed and launched the compiled APK'

      - name: Upload V110 emulator proof and source-probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RUNNINGBALL2-V110-BUILD-TEST-EVIDENCE
          path: |
            /tmp/V110_INHERITED_FEATURES.txt
            /tmp/V110_LAUNCH_LOG.txt
            /tmp/V110_ACTIVITY.txt
            /tmp/V110_LAUNCH.png
            ${{ runner.temp }}/evidence/
          if-no-files-found: ignore
          retention-days: 30
