name: DUWM 1728.2 21.4 35 RDD
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check source archive
        run: test -f DUWM-1728.2-21.4-35-RDD-SOURCE.zip && unzip -t DUWM-1728.2-21.4-35-RDD-SOURCE.zip
      - name: Extract source
        run: unzip -q DUWM-1728.2-21.4-35-RDD-SOURCE.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: DUWM-1728-2-21-4-14-ANDROID-SOURCE
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DUWM-BUILD35-APK
          path: DUWM-1728-2-21-4-14-ANDROID-SOURCE/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
