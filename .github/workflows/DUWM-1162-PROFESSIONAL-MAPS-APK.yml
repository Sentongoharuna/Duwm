                previousFrame=lastGestureEnd;
                postInvalidateOnAnimation();
                return true;
            }
        ''','real observation selection+center')
        g=once(g,'''if(moving&&!dragging){long now=SystemClock.uptimeMillis();long dt=Math.min(60,Math.max(0,now-previousFrame));yaw=(yaw+dt*.000105d)%(2*Math.PI);previousFrame=now;}''', '''long now=SystemClock.uptimeMillis();
                long dt=Math.min(60,Math.max(0,now-previousFrame));previousFrame=now;
                if(!dragging && focusPending){
