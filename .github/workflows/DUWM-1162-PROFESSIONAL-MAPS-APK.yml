                Observation previous=selectedObservation;
                objects.clear();
                if(items!=null)for(Observation v:items){
                    if(v!=null && Double.isFinite(v.lat) && Double.isFinite(v.lon) &&
                       Math.abs(v.lat)<=90d && Math.abs(v.lon)<=180d)objects.add(v);
                }
                selectedObservation=null;
                if(previous!=null)for(Observation v:objects){
