    - name: Prepare emulator permissions for secondary UI smoke test
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm || true
    - name: 1162 Android emulator smoke test — require map Activity and screenshot
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        profile: pixel_6
        cores: 2
        ram-size: 2048M
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        script: |
          set -euo pipefail
          adb install -r "$RUNNER_TEMP/duwm1162/DUWM-1162.apk"
          adb shell am start -n com.sentongoharuna.worldsituationroom.rb2live25/com.sentongoharuna.worldsituationroom.DuwmPlaceMapActivity
          sleep 10
          adb shell uiautomator dump /sdcard/duwm1162.xml >/dev/null
          adb shell cat /sdcard/duwm1162.xml > "$RUNNER_TEMP/duwm1162/screen.xml"
          adb exec-out screencap -p > "$RUNNER_TEMP/duwm1162/actual-screen.png"
          test -s "$RUNNER_TEMP/duwm1162/actual-screen.png"
          adb shell dumpsys activity activities | grep -q 'DuwmPlaceMapActivity'
          if adb logcat -d -t 4500 | grep -A8 'FATAL EXCEPTION' | grep -q 'com.sentongoharuna.worldsituationroom'; then echo 'FAIL: app crash detected' >&2; exit 1; fi
          echo "PASS 1162 emulator: actual map activity launches and screenshot saved"
    - name: Upload 1162 emulator evidence even if runtime smoke test fails
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: DUWM-1162-ANDROID-EVIDENCE
        path: |
          ${{ runner.temp }}/duwm1162/actual-screen.png
          ${{ runner.temp }}/duwm1162/screen.xml
        retention-days: 30
        if-no-files-found: warn
    - name: Upload 1162 build failure evidence (no false APK artifact)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: DUWM-1162-FAILURE-DIAGNOSTICS
        path: |-
          ${{ runner.temp }}/duwm1162/screen.xml
          ${{ runner.temp }}/duwm1162/actual-screen.png
        if-no-files-found: warn
        retention-days: 14
