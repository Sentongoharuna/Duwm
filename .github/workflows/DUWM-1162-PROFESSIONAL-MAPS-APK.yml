            final String url=it.image!=null?it.image:it.url;
            if(!duwmP4MediaUrl(url))return;
            final long seq=++cameraSequence;
            playing.setText("CAMERA IMAGE / REQUESTING SOURCE FRAME / "+it.title);
            io.execute(()->{
              HttpURLConnection c=null;
              try{
                c=(HttpURLConnection)new URL(url).openConnection();
                c.setUseCaches(false);c.setInstanceFollowRedirects(true);
                c.setConnectTimeout(9000);c.setReadTimeout(13000);
                c.setRequestProperty("Cache-Control","no-cache");
                int statusCode=c.getResponseCode();
                if(statusCode!=200)throw new java.io.IOException("HTTP "+statusCode);
                if(!"https".equalsIgnoreCase(c.getURL().getProtocol()))throw new java.io.IOException("Non-HTTPS camera redirect");
                final long lastModified=c.getLastModified();
                try(InputStream in=c.getInputStream();ByteArrayOutputStream out=new ByteArrayOutputStream()){
                  byte[] b=new byte[8192];int n;while((n=in.read(b))!=-1){
                    if(out.size()+n>3500000)throw new java.io.IOException("Camera image exceeds 3.5MB");
                    out.write(b,0,n);
                  }
                  byte[] bytes=out.toByteArray();
                  BitmapFactory.Options opt=new BitmapFactory.Options();opt.inJustDecodeBounds=true;
                  BitmapFactory.decodeByteArray(bytes,0,bytes.length,opt);
                  if(opt.outWidth<1||opt.outHeight<1)throw new java.io.IOException("No decodable camera image");
                  opt.inJustDecodeBounds=false;opt.inSampleSize=Math.max(1,Math.max(opt.outWidth/900,opt.outHeight/650));
                  Bitmap frame=BitmapFactory.decodeByteArray(bytes,0,bytes.length,opt);
