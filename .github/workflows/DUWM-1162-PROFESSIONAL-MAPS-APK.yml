        \ APK',part)\n    assert 'assets/naturalearth_coasts.txt' in z.namelist(), 'Original natural coastline missing'\n    assert\
        \ 'assets/duwm_place_map.html' in z.namelist(), 'Real geographic map missing'\nprint('PASS: actual installable APK includes\
        \ observed-record globe controls, map bridge, original renderer and sharing')\nPY_DUWM_1162_P3_PACKAGE\n"
    - name: 1162 PRIORITY 4 | Verify actual compiled DEX contains TV radio and public camera playback
      shell: bash
      run: "set -euo pipefail\npython3 - \"$RUNNER_TEMP/duwm1162/DUWM-1162.apk\" <<'PY_DUWM_P4_DEX'\nimport sys,zipfile\np=sys.argv[1]\n\
        with zipfile.ZipFile(p) as z:\n    assert z.testzip() is None, 'APK archive damaged'\n    dex=b''.join(z.read(name) for name\
        \ in z.namelist() if name.endswith('.dex'))\n    for token in (b'MediaDeskActivity',b'KEXP / Seattle Public Radio',\n      \
        \            b'DW English / International News',b'Yellowstone Old Faithful / NPS',\n                  b'PUBLIC CAMERAS',b'duwmP4CameraFrame',b'duwmP4PlayCamera',\n\
        \                  b'OperationsGlobeView',b'DuwmWorldIntelligenceActivity',\n                  b'DuwmPlaceMapActivity',b'V115941ShareCards',b'DuWidgetProviders'):\n\
        \        assert token in dex,('P4 function or protected baseline absent from actual compiled APK',token)\n    assert 'assets/duwm_place_map.html'\
        \ in z.namelist(), 'P2 map removed'\nprint('PASS: genuine compiled Android APK includes native TV radio source-camera playback\
        \ and original globe/maps')\nPY_DUWM_P4_DEX\n"
    - name: 1162 PACKAGED MAP CHECK | Require real JavaScript map engine inside compiled APK
      shell: bash
      run: "set -euo pipefail\npython3 - \"$RUNNER_TEMP/duwm1162/DUWM-1162.apk\" <<'PY_1162_APK_MAP_ENGINE'\nimport zipfile,sys\napk=sys.argv[1]\n\
        with zipfile.ZipFile(apk) as z:\n assert z.testzip() is None\n assert 'assets/duwm_place_map.html' in z.namelist(),'Map screen\
        \ absent from compiled APK'\n html=z.read('assets/duwm_place_map.html')\n for value in (b'duwm1162-v5-umd-bundle',b'duwm1162-leaflet-bundle',b'duwm1162-map-runtime-repair',\n\
        \               b'window.duwmReceive',b'duwm-source-points',b'window.duwmMode',b'window.duwmFocus'):\n  assert value in html,('Bundled\
        \ geographic rendering code missing in installable APK',value)\n assert len(html)>1000000,('Bundled map renderer suspiciously\
        \ short',len(html))\n assert b'maplibre-gl@6.16.0' not in html, 'Old non-existent MapLibre v6 UMD script remains'\nprint('PASS:\
        \ actual APK contains compatible MapLibre 5 UMD, real coordinate bridge and 2D fallback')\nPY_1162_APK_MAP_ENGINE\n"
    - name: Publish genuine 1162 APK artifact only after signed APK validation
      uses: actions/upload-artifact@v4
      with:
        name: DUWM-1162-INSTALLABLE-APK
        path: ${{ runner.temp }}/duwm1162/DUWM-1162.apk
        retention-days: 30
        if-no-files-found: error
    - name: Prepare emulator permissions for secondary UI smoke test
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm || true

        '
    - name: 1162 OPTIONAL hosted-emulator runtime test (APK build/signature already verified)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        profile: pixel_6
        cores: 2
        ram-size: 2048M
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
        script: "set -euo pipefail\nadb wait-for-device\nfor i in 1 2 3 4 5; do\n  if adb shell getprop sys.boot_completed | grep -q\
          \ '^1'; then break; fi\n  sleep 4\ndone\nadb install -r \"$RUNNER_TEMP/duwm1162/DUWM-1162.apk\"\nadb shell am start -n com.sentongoharuna.worldsituationroom.rb2live25/com.sentongoharuna.worldsituationroom.OperationsMainActivity\n\
          sleep 7\nadb exec-out screencap -p > \"$RUNNER_TEMP/duwm1162/actual-screen.png\"\ntest -s \"$RUNNER_TEMP/duwm1162/actual-screen.png\"\
          \nif adb logcat -d -t 4500 | grep -A8 'FATAL EXCEPTION' | grep -q 'com.sentongoharuna.worldsituationroom'; then\n  echo 'Android\
          \ app crashed in emulator' >&2; exit 1\nfi\necho 'PASS: Android app opened in hosted emulator and screen captured'\n"
      continue-on-error: true
    - name: Upload 1162 emulator evidence even if runtime smoke test fails
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: DUWM-1162-ANDROID-EVIDENCE
        path: '${{ runner.temp }}/duwm1162/actual-screen.png

          ${{ runner.temp }}/duwm1162/screen.xml

          '
        retention-days: 30
        if-no-files-found: warn
    - name: Upload 1162 build failure evidence (no false APK artifact)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: DUWM-1162-FAILURE-DIAGNOSTICS
        path: '${{ runner.temp }}/duwm1162/screen.xml

          ${{ runner.temp }}/duwm1162/actual-screen.png'
        if-no-files-found: warn
        retention-days: 14
    - name: '1162 | CI verification summary: signed APK pass, emulator is supplemental'
      if: always()
      shell: bash
      run: "set -euo pipefail\n{\n  echo '## DUWM 1162 Priority 3'\n  echo 'APK compilation, signing and compiled-feature verification\
        \ must pass before artifact publishing.'\n  echo 'Hosted Android emulator verification is supplemental and may be inconclusive\
        \ if ADB is offline.'\n  echo 'Do not infer successful on-phone operation from a successful build alone.'\n} >> \"$GITHUB_STEP_SUMMARY\"\
        \n"
