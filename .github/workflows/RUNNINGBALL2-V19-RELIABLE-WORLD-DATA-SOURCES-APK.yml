            private void lookup(){String name=query.getText().toString().trim();if(name.isEmpty())return;
              String[] pair=name.replace("geo:","").split(",");if(pair.length==2){try{double lat=Double.parseDouble(pair[0].trim()),lon=Double.parseDouble(pair[1].trim());if(RunningballWorldTarget.valid(lat,lon)){fly(lat,lon,"COORDINATE TARGET");return;}}catch(NumberFormatException ignored){}}
              for(int i=0;i<NAMES.length;i++)if(NAMES[i].equalsIgnoreCase(name)){fly(SITES[i][0],SITES[i][1],NAMES[i]);return;}
              if(System.currentTimeMillis()-lastLookup<1600){status.setText("SEARCH RATE LIMIT • PLEASE TRY AGAIN");return;}
              lastLookup=System.currentTimeMillis();status.setText("SEARCHING GLOBAL PLACES…");
              new Thread(()->{try{String url="https://geocoding-api.open-meteo.com/v1/search?name="+URLEncoder.encode(name,"UTF-8")+"&count=8&language=en&format=json";
                HttpURLConnection con=(HttpURLConnection)new URL(url).openConnection();try{
                  con.setConnectTimeout(7500);con.setReadTimeout(7500);con.setRequestProperty("Accept","application/json");
                  if(con.getResponseCode()!=200)throw new IllegalStateException("HTTP "+con.getResponseCode());
                  ByteArrayOutputStream bytes=new ByteArrayOutputStream();InputStream in=con.getInputStream();try{byte[] buf=new byte[8192];int n;while((n=in.read(buf))!=-1){if(bytes.size()+n>150000)throw new IllegalStateException("RESULT TOO LARGE");bytes.write(buf,0,n);}}finally{in.close();}
                  JSONArray results=new JSONObject(bytes.toString("UTF-8")).optJSONArray("results");
                  if(results==null||results.length()==0)throw new IllegalStateException("NO LOCATION MATCH");
                  final String[] options=new String[results.length()];final double[][] coords=new double[results.length()][2];
                  for(int k=0;k<results.length();k++){JSONObject item=results.optJSONObject(k);if(item==null)continue;
                    coords[k][0]=item.optDouble("latitude",Double.NaN);coords[k][1]=item.optDouble("longitude",Double.NaN);
                    options[k]=item.optString("name","PLACE")+" · "+item.optString("country","")+" · "+item.optString("admin1","");}
                  runOnUiThread(()->new AlertDialog.Builder(this).setTitle("SELECT GLOBAL LOCATION").setItems(options,(d,k)->fly(coords[k][0],coords[k][1],options[k])).show());
                }finally{con.disconnect();}}
                catch(Exception error){runOnUiThread(()->status.setText("PLACE SEARCH UNAVAILABLE: "+error.getMessage()+". Use latitude,longitude."));}
              }).start();
            }
