                  String region=String.format(Locale.US,"%.4f,%.4f",lat,lon);
                  String api=String.format(Locale.US,"https://api.open-meteo.com/v1/forecast?latitude=%.4f&longitude=%.4f&current=temperature_2m,wind_speed_10m,precipitation,weather_code&timezone=UTC",lat,lon);
                  JSONObject response=new JSONObject(read(api,150000));
                  JSONObject current=response.optJSONObject("current");
                  if(current==null||!current.has("temperature_2m")||!current.has("time"))throw new IllegalStateException("WEATHER FIELDS MISSING");
                  JSONObject result=new JSONObject();result.put("provider","Open-Meteo model-derived");result.put("region",region);
                  result.put("time",current.optString("time",""));result.put("temperature",current.optDouble("temperature_2m",Double.NaN));
                  result.put("wind",current.optDouble("wind_speed_10m",Double.NaN));result.put("precipitation",current.optDouble("precipitation",Double.NaN));
                  result.put("code",current.optInt("weather_code",-1));commit(c,key,result);
                } else if(FX.equals(key)) {
                  JSONObject response=new JSONObject(read("https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,GBP,JPY",100000));
                  JSONObject rates=response.optJSONObject("rates");
                  if(rates==null||!rates.has("EUR")||!rates.has("GBP")||!rates.has("JPY"))throw new IllegalStateException("FX QUOTES MISSING");
                  JSONObject result=new JSONObject();result.put("provider","Frankfurter / official reference rates");
                  result.put("date",response.optString("date",""));result.put("base","USD");result.put("rates",rates);commit(c,key,result);
                }
              }catch(Exception e){failure(c,key,e);}
            }
            public static void request(Context c,boolean manual,Runnable onFinished){
              Context app=c.getApplicationContext();if(!BUSY.compareAndSet(false,true))return;
              new Thread(()->{
                try {
                  if(manual||due(app,NEWS,30L*60000L))fetch(app,NEWS);
                  // Do not keep sending one location's weather after the user changes region.
                  if(RunningballWorldTarget.ready(app)){
                    String region=String.format(Locale.US,"%.4f,%.4f",RunningballWorldTarget.lat(app),RunningballWorldTarget.lon(app));
                    if(!region.equals(cached(app,WEATHER).optString("region",""))||manual||due(app,WEATHER,15L*60000L))fetch(app,WEATHER);
                  }
                  if(manual||due(app,FX,6L*3600000L))fetch(app,FX);
                }finally{BUSY.set(false);if(onFinished!=null)new Handler(Looper.getMainLooper()).post(onFinished);}
              },"RB17-sourced-feeds").start();
            }
          }
