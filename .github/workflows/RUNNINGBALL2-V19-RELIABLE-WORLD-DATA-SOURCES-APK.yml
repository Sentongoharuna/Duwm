            private void entry(String heading,String provider,String figure,long success,long limit,String error,String requirement,Class<?> destination){
              long elapsed=success<=0?Long.MAX_VALUE:Math.max(0,System.currentTimeMillis()-success);
              boolean failed=error!=null&&!error.isEmpty();boolean available=success>0;
              String state=!available?(requirement.isEmpty()?"NOT LOADED":"SETUP REQUIRED"):
                  (failed?"FETCH FAILED / CACHED":elapsed>limit?"STALE / CACHED":"RECENT SNAPSHOT");
              int tint=!available?AMBER:failed?RED:elapsed>limit?AMBER:GREEN;
              LinearLayout card=new LinearLayout(this);card.setOrientation(LinearLayout.VERTICAL);
              card.setPadding(dp(13),dp(12),dp(12),dp(13));card.setBackground(shape(tint));
              card.addView(label(heading+"  •  "+state,12,tint,true));
              TextView big=label(figure,22,INK,true);LinearLayout.LayoutParams b=new LinearLayout.LayoutParams(-1,-2);b.topMargin=dp(6);card.addView(big,b);
              TextView source=label(provider+"  /  "+age(success)+"  /  "+utc(success),10,DIM,false);
              LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,-2);p.topMargin=dp(5);card.addView(source,p);
              if(!requirement.isEmpty())card.addView(label(requirement,11,AMBER,false));
              if(failed)card.addView(label("ERROR: "+error,11,RED,false));
              if(destination!=null){TextView action=label("OPEN DETAILS  ›",11,CYAN,true);action.setPadding(0,dp(9),0,0);card.addView(action);
                card.setOnClickListener(v->{if(destination==RunningballV17DetailsActivity.class){if(heading.startsWith("WORLD NEWS"))jumpFeed(RunningballV17Feeds.NEWS);else if(heading.startsWith("WEATHER"))jumpFeed(RunningballV17Feeds.WEATHER);else jumpFeed(RunningballV17Feeds.FX);}else jump(destination);});}
              LinearLayout.LayoutParams m=new LinearLayout.LayoutParams(-1,-2);m.topMargin=dp(9);board.addView(card,m);
            }
