                  r.setTextViewText(R.id.rb11_marine_meta,total>0?recent+" RECENT POSITION REPORTS":"CONNECT SECURE AIS BRIDGE");
                  if(updated>0L){SimpleDateFormat fmt=new SimpleDateFormat("dd MMM HH:mm 'UTC'",Locale.US);fmt.setTimeZone(TimeZone.getTimeZone("UTC"));
                      r.setTextViewText(R.id.rb11_marine_footer,"FETCHED "+fmt.format(new Date(updated)));
                  }else r.setTextViewText(R.id.rb11_marine_footer,"OPEN TO CONNECT AIS");
                  Intent i=new Intent(c,GevMarineActivity.class);PendingIntent p=PendingIntent.getActivity(c,id,i,PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE);
                  r.setOnClickPendingIntent(R.id.rb11_marine_root,p);manager.updateAppWidget(id,r);
              }
          }
