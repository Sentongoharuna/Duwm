          #!/usr/bin/env bash
          # Executed as one entire script, never one shell per YAML line.
          set -euo pipefail
          APK="$RUNNER_TEMP/release/RUNNINGBALL2-V19-WORLD-DATA-COMMAND-APK.apk"
          if [[ ! -s "$APK" ]]; then
            echo 'ERROR: signed V15 APK not found at expected release path:' "$APK" >&2
            ls -lah "$RUNNER_TEMP/release" "$PROJECT_DIR/app/build/outputs/apk/debug" 2>&1 || true
            exit 42
          fi
          printf 'V15 emulator installing signed APK: %s\n' "$APK"
          adb install -r "$APK"
          PKG=com.sentongoharuna.worldsituationroom.rb2worlddata19
          adb shell am force-stop "$PKG" || true
          adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/dev/null
          sleep 3
          python3 - <<'PY_ADB_SMOKE'
          import subprocess,time,re,xml.etree.ElementTree as ET
          pkg='com.sentongoharuna.worldsituationroom.rb2worlddata19'
          def adb(*args):
              result=subprocess.run(['adb',*args],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=40)
              if result.returncode: raise RuntimeError('adb '+str(args)+'\n'+result.stdout[-1200:])
              return result.stdout
          def dump():
              adb('shell','uiautomator','dump','/sdcard/rb15-ui.xml')
              xml=adb('shell','cat','/sdcard/rb15-ui.xml')
              return ET.fromstring(xml[xml.index('<?xml'):])
          def find(term):
              root=dump()
              for n in root.iter('node'):
                  if term in (n.get('text','')+' '+n.get('content-desc','')):
                      m=re.search(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.get('bounds',''))
                      if m:
                          x1,y1,x2,y2=map(int,m.groups());return ((x1+x2)//2,(y1+y2)//2)
              return None
          def capture_failure(tag):
              name='/tmp/NavigationMissing'+tag+'Activity.png'
              try:
                  with open(name,'wb') as img:
                      subprocess.run(['adb','exec-out','screencap','-p'],stdout=img,check=True,timeout=20)
              except Exception as e: print('Could not capture UI screenshot:',e,flush=True)
              try:
                  hierarchy=dump()
                  labels=[n.get('text','') for n in hierarchy.iter('node') if n.get('text','').strip()]
                  print('VISIBLE UI LABELS:',repr(labels[-40:]),flush=True)
              except Exception as e: print('UI hierarchy unavailable:',e,flush=True)
              try:
                  focus=adb('shell','dumpsys','activity','activities')
                  for row in focus.splitlines():
                      if 'topResumedActivity' in row or 'mResumedActivity' in row:
                          print('FOREGROUND:',row.strip(),flush=True)
              except Exception as e: print('Cannot read foreground activity:',e,flush=True)
              return name
          def hub():
              # After ACTION_SEND, Android's chooser belongs to the SYSTEM, not our
              # package. A force-stop of our package alone cannot reliably dismiss it.
              component=pkg+'/com.sentongoharuna.worldsituationroom.RunningballV12HubActivity'
              for attempt in range(3):
                  if attempt:
                      adb('shell','input','keyevent','4')  # close any remaining overlay
                      time.sleep(.35)
                  adb('shell','am','force-stop',pkg)
                  adb('shell','am','start','-W','-n',component)
                  for poll in range(5):
                      time.sleep(.45)
                      details=adb('shell','dumpsys','activity','activities')
                      resumed=[line for line in details.splitlines()
                               if 'topResumedActivity' in line or 'mResumedActivity' in line]
                      # Do not accept a stale dashboard hidden under system chooser.
                      if resumed and 'RunningballV12HubActivity' not in resumed[-1]:
                          continue
                      # The ScrollView might retain its earlier scroll offset. Verify
                      # an actually visible tile, not only the top-of-page heading.
                      try:
                          adb('shell','input','swipe','520','320','520','1550','250')
                          time.sleep(.3)
                          if find('OPEN ORIGINAL APP') or find('AIRCRAFT RADAR') or find('COMMAND CENTER'):
                              print('PASS dashboard foreground restored after navigation',flush=True)
                              return
                      except Exception as e:
                          print('Dashboard UI not yet ready:',str(e)[:180],flush=True)
              screenshot=capture_failure('DashboardReturn')
              raise AssertionError('V15 dashboard could not regain foreground/visible tiles; see '+screenshot)
          def nav(label,activity):
              hub()
              hit=None
              for _ in range(10):
                  hit=find(label)
                  if hit:break
                  adb('shell','input','swipe','500','1600','500','430','350');time.sleep(.4)
              if not hit:
                  # Capture evidence of the missing button before failing the build.
                  screenshot='/tmp/NavigationMissing'+activity+'Activity.png'
                  with open(screenshot,'wb') as img:
                      subprocess.run(['adb','exec-out','screencap','-p'],stdout=img,check=True,timeout=20)
                  try:
                      nodes=[n.get('text','') for n in dump().iter('node') if n.get('text','').strip()]
                      print('VISIBLE UI LABELS:',repr(nodes[-35:]),flush=True)
                  except Exception as e:print('Cannot dump missing-button UI:',e,flush=True)
                  raise AssertionError(f'Cannot find navigation button {label}; screenshot {screenshot}')
              adb('shell','input','tap',str(hit[0]),str(hit[1]));time.sleep(1.6)
              resumed=adb('shell','dumpsys','activity','activities')
              lines=[row for row in resumed.splitlines() if 'topResumedActivity' in row or 'mResumedActivity' in row]
              if lines:assert activity in lines[-1],f'{label} did not become resumed: '+lines[-1]
              else:assert activity in resumed,f'{label} failed to navigate to {activity}'
              assert pkg in resumed,f'{label} navigated outside expected app'
              # Capture screen for independent human review.
              name=re.sub('[^a-zA-Z0-9]+','-',activity)
              subprocess.run(['adb','exec-out','screencap','-p'],stdout=open('/tmp/'+name+'.png','wb'),check=True,timeout=20)
              print('PASS visible navigation:',label,'→',activity)
          # Real on-emulator smoke tests for each installed activity. A successful launch
          # does NOT assert that remote providers are live or that the phone behaves identically.
          hub()
          # V16 new dashboard must be present on the actual Android screen, not just in source files.
          for _ in range(4):
              if find('WORLD COMMAND GRID'):break
              adb('shell','input','swipe','530','450','530','1650','250');time.sleep(.3)
          assert find('WORLD COMMAND GRID'),'V16 WORLD COMMAND GRID is not visible on launcher'
          assert find('EARTHQUAKES') or find('AIRCRAFT'),'V16 source boards missing from screen'
          print('PASS V16 live boards are visible on Android emulator')
          for label,activity in [
            ('OPEN ORIGINAL APP',''),
            ('WORLDWIDE EARTH','RunningballWorldExplorerActivity'),
            ('AIRCRAFT RADAR','AirRadarActivity'),
            ('AIRCRAFT CONTACTS','GevContactsActivity'),
            ('COCKPIT & CHASE','GevCockpitActivity'),
            ('EARTH EXPLORER','GevEarthExploreActivity'),
            ('SATELLITE INTELLIGENCE','GevSatelliteActivity'),
            ('MARITIME INTELLIGENCE','GevMarineActivity'),
            ('OPEN GLOBAL SIGNALS','RunningballV13SignalsActivity'),
            ('OPEN SOURCE HEALTH','RunningballV15SourceHealthActivity')]:
              if not activity:continue
              nav(label,activity)
          # Verify the standard Android share chooser can be invoked from Global Signals.
          nav('OPEN GLOBAL SIGNALS','RunningballV13SignalsActivity')
          hit=find('SHARE GLOBAL SIGNALS REPORT')
          if not hit:
              for _ in range(4):
                  adb('shell','input','swipe','520','1550','520','450','250');time.sleep(.3)
                  hit=find('SHARE GLOBAL SIGNALS REPORT')
                  if hit:break
          assert hit,'Global Signals report sharing not visible'
          adb('shell','input','tap',str(hit[0]),str(hit[1]));time.sleep(1)
          output=adb('shell','dumpsys','activity','activities')
          assert 'ResolverActivity' in output or 'ChooserActivity' in output or 'com.android.intentresolver' in output, 'Share chooser did not open'
          print('PASS Android share chooser')
          adb('shell','input','keyevent','4')  # dismiss system sharesheet
          time.sleep(.7)
          # nav() reopens the dashboard itself. No redundant force-stop/start here.
          nav('OPEN SOURCE HEALTH','RunningballV15SourceHealthActivity')
          assert find('REQUEST NEW AIRCRAFT REPORT'),'V15 real AIR refresh control not visible'
          assert find('NO VERIFIED SNAPSHOT') or find('AIR  /  ADSB.LOL'),'Source status panel missing'
          print('PASS V15 source diagnostics view')
          PY_ADB_SMOKE
          # UIAutomator uses AndroidRuntime for normal shell startup; do not flag it as a crash.
          adb logcat -d -v brief > "$RUNNER_TEMP/v15-smoke-all-logcat.txt"
          python3 "$RUNNER_TEMP/v15-target-crash-filter.py" "$RUNNER_TEMP/v15-smoke-all-logcat.txt" "$PKG"
          RB15_EMULATOR_SINGLE_SHELL_END
          test -s "$RUNNER_TEMP/v15-emulator-smoke.sh"
          bash -n "$RUNNER_TEMP/v15-emulator-smoke.sh"
          python3 - "$RUNNER_TEMP/v15-emulator-smoke.sh" <<'PY_V15_SCRIPT_VALIDATE'
          import ast,sys
          from pathlib import Path
          script=Path(sys.argv[1]).read_text()
          assert script.startswith('#!/usr/bin/env bash\n')
          assert 'APK="$RUNNER_TEMP/release/RUNNINGBALL2-V19-WORLD-DATA-COMMAND-APK.apk"' in script
          assert 'adb install -r "$APK"' in script
          assert script.count("python3 - <<'PY_ADB_SMOKE'")==1
          py=script.split("python3 - <<'PY_ADB_SMOKE'\n",1)[1].split('\nPY_ADB_SMOKE',1)[0]
          ast.parse(py)
          for label in ('AIRCRAFT RADAR','SATELLITE INTELLIGENCE','MARITIME INTELLIGENCE','OPEN SOURCE HEALTH','COCKPIT & CHASE'):
              assert label in py,label
          from os import environ
          hub=(Path(environ['PROJECT_DIR'])/'app/src/main/java/com/sentongoharuna/worldsituationroom/RunningballV12HubActivity.java').read_text(encoding='utf-8')
          module_labels={
              'AIRCRAFT RADAR':'AirRadarActivity',
              'AIRCRAFT CONTACTS':'GevContactsActivity',
              'COCKPIT & CHASE':'GevCockpitActivity',
              'EARTH EXPLORER':'GevEarthExploreActivity',
              'SATELLITE INTELLIGENCE':'GevSatelliteActivity',
              'MARITIME INTELLIGENCE':'GevMarineActivity',
              'OPEN GLOBAL SIGNALS':'RunningballV13SignalsActivity',
              'OPEN SOURCE HEALTH':'RunningballV15SourceHealthActivity',
          }
          for label,activity in module_labels.items():
              assert ('"'+label+'"') in hub, f'Missing visible home button: {label}'
              assert ("('"+label+"','"+activity+"')") in py, f'Emulator must search exact visible button: {label}'
          assert 'NavigationMissing' in py,'Missing navigation buttons must leave screenshot evidence'
          assert "keyevent','4'" in py,'Share chooser dismissal absent'
          assert 'def capture_failure(tag):' in py,'Failure evidence capture absent'
          assert "V15 dashboard could not regain foreground" in py,'Dashboard missing retry gate'
          assert 'topResumedActivity' in py,'System chooser foreground check missing'
          assert 'v15-target-crash-filter.py' in script,'Targeted crash detection not called'
          assert 'adb logcat -d -v brief > ' in script,'Raw logcat capture missing'
          assert 'grep -E \'FATAL EXCEPTION|AndroidRuntime\'' not in script,'Legacy false-positive logcat check still present'
          print('PASS: single Bash shell, signed APK path, navigation recovery and targeted fatal scanning')
          PY_V15_SCRIPT_VALIDATE

      - name: V17 EMULATOR GATE - navigate news weather FX and capture real screens
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/v15-emulator-smoke.sh" <<'RB17_ADB_GATE'
          from pathlib import Path
          import sys,ast
          p=Path(sys.argv[1]);script=p.read_text(encoding='utf-8')
          needle="print('PASS V15 source diagnostics view')"
          assert script.count(needle)==1,'Emulator diagnostics navigation anchor changed'
          inject="""print('V17 checking sourced boards and detailed views')
          hub()
          for label,key in [('OPEN V17 NEWS DETAIL','news'),('OPEN V17 WEATHER DETAIL','weather'),('OPEN V17 FX DETAIL','fx')]:
              nav(label,'RunningballV17DetailsActivity')
              screen=adb('shell','dumpsys','activity','activities')
              assert 'RunningballV17DetailsActivity' in screen, 'Detail failed for '+key
              subprocess.run(['adb','exec-out','screencap','-p'],stdout=open('/tmp/V17_'+key+'.png','wb'),check=True,timeout=20)
          print('PASS V17: all three detail screens opened from the actual command center')
          hub()
          subprocess.run(['adb','exec-out','screencap','-p'],stdout=open('/tmp/V17_command_center.png','wb'),check=True,timeout=20)
          """
          script=script.replace(needle,needle+'\n'+inject,1)
          start=script.split("python3 - <<'PY_ADB_SMOKE'\n",1)[1].split('\nPY_ADB_SMOKE',1)[0]
          ast.parse(start)
          assert 'OPEN V17 NEWS DETAIL' in script
          p.write_text(script,encoding='utf-8')
          print('V17 emulator detail-nav and screenshot checks appended')
          RB17_ADB_GATE
          bash -n "$RUNNER_TEMP/v15-emulator-smoke.sh"

      - name: V15 app crash filter - test false positives and genuine exceptions
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v15-target-crash-filter.py" <<'PY_V15_CRASH_FILTER'
          #!/usr/bin/env python3
          """Return nonzero only for app-owned fatal exceptions in captured Android logcat."""
          from pathlib import Path
          import re
          import sys
          
          def find_app_fatals(lines, package):
              failures=[]
              for index,line in enumerate(lines):
                  if 'FATAL EXCEPTION:' not in line:
                      continue
                  block=lines[index:index+24]
                  if any(re.search(r'\bProcess:\s*'+re.escape(package)+r'(?=\s|,|$)', row) for row in block):
                      failures.append(''.join(block))
              return failures
          
          def main():
              if len(sys.argv)!=3:
                  raise SystemExit('usage: v15-target-crash-filter.py LOGCAT_FILE APP_PACKAGE')
              p=Path(sys.argv[1]); package=sys.argv[2]
              if not p.is_file():
                  raise SystemExit('LOGCAT UNAVAILABLE: missing '+str(p))
              text=p.read_text(encoding='utf-8',errors='replace')
              if not text.strip():
                  raise SystemExit('LOGCAT UNAVAILABLE: empty capture')
              fatal=find_app_fatals(text.splitlines(True),package)
              if fatal:
                  for block in fatal:
                      print('APPLICATION FATAL EXCEPTION:',block,flush=True)
                  return 1
              print('PASS V15 target-app crash check; routine AndroidRuntime startup logs ignored',flush=True)
              return 0
          
          if __name__=='__main__':
              sys.exit(main())
          PY_V15_CRASH_FILTER
          python3 - "$RUNNER_TEMP/v15-target-crash-filter.py" <<'PY_V15_FILTER_TEST'
          import ast,sys,runpy
          from pathlib import Path
          p=Path(sys.argv[1]);code=p.read_text(encoding='utf-8')
          ast.parse(code)
          f=runpy.run_path(str(p))['find_app_fatals']
          package='com.sentongoharuna.worldsituationroom.rb2worlddata19'
          normal=['D/AndroidRuntime( 7695): >>>>>> START com.android.internal.os.RuntimeInit uid 2000 <<<<<<\n',
                  'I/AndroidRuntime( 7695): Using default boot image\n',
                  'D/AndroidRuntime( 7695): Calling main entry com.android.commands.uiautomator.Launcher\n',
                  'D/AndroidRuntime( 7695): Shutting down VM\n']
          unrelated=['E/AndroidRuntime( 1122): FATAL EXCEPTION: main\n',
                     'E/AndroidRuntime( 1122): Process: com.android.otherapp, PID: 1122\n']
          own=['E/AndroidRuntime( 2211): FATAL EXCEPTION: main\n',
               'E/AndroidRuntime( 2211): Process: '+package+', PID: 2211\n',
               'E/AndroidRuntime( 2211): java.lang.IllegalStateException: test\n']
          assert not f(normal,package), 'Routine AndroidRuntime startup incorrectly treated as crash'
          assert not f(unrelated,package), 'Crash belonging to different app incorrectly counted'
          assert len(f(own,package)) == 1, 'Real app fatal exception not detected'
          assert len(f(normal+own,package)) == 1, 'App fatal hidden by routine logger'
          print('PASS V15 crash filter: benign startup, unrelated crash and own fatal checked')
          PY_V15_FILTER_TEST

      - name: V15 Android emulator - boot app and exercise visible navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # This action splits script into separate sh -c commands. Exactly ONE invocation
          # is required or shell variables (including APK) disappear between lines.
          script: |
            bash "$RUNNER_TEMP/v15-emulator-smoke.sh"

      - name: Upload V15 emulator navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RUNNINGBALL2-V19-EMULATOR-SCREENSHOTS
          path: |
            /tmp/*Activity.png
            /tmp/V17_*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload RUNNINGBALL2 V19 emulator-verified APK
        uses: actions/upload-artifact@v4
        with:
          name: RUNNINGBALL2-V19-WORLD-DATA-EMULATOR-VERIFIED-APK
          path: ${{ runner.temp }}/release/RUNNINGBALL2-V19-WORLD-DATA-COMMAND-APK.apk
          if-no-files-found: error
          retention-days: 30

      - name: Baseline Android lint report (does not mask source build failures)
        continue-on-error: true
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache :app:lintDebug

      - name: Upload lint report when available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RUNNINGBALL2-V19-LINT
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/lint-results-debug.*
            ${{ env.PROJECT_DIR }}/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/*.txt
          if-no-files-found: ignore
          retention-days: 30
