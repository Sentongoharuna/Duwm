          package com.sentongoharuna.worldsituationroom;

          import android.content.Context;
          import android.content.SharedPreferences;
          import java.util.Locale;

          /** Shared worldwide observer: never pretend regional observations cover the planet. */
          public final class RunningballWorldTarget {
            private static final String PREF="rb_global_observer_v1";
            private RunningballWorldTarget() {}
            public static boolean valid(double lat,double lon) {
              return !Double.isNaN(lat)&&!Double.isNaN(lon)&&!Double.isInfinite(lat)&&!Double.isInfinite(lon)
                &&lat>=-90.0d&&lat<=90.0d&&lon>=-180.0d&&lon<=180.0d;
            }
            private static SharedPreferences prefs(Context context) {
              return context.getApplicationContext().getSharedPreferences(PREF,Context.MODE_PRIVATE);
            }
            public static boolean ready(Context context) {return prefs(context).getBoolean("chosen",false);}
            public static double lat(Context context) {return Double.longBitsToDouble(prefs(context).getLong("lat",Double.doubleToLongBits(0.0d)));}
            public static double lon(Context context) {return Double.longBitsToDouble(prefs(context).getLong("lon",Double.doubleToLongBits(0.0d)));}
            public static String label(Context context) {
              return ready(context)?prefs(context).getString("label","SELECTED WORLD REGION"):"NO REGION SELECTED";
            }
            public static String url(Context context) {
              if(!ready(context)||!valid(lat(context),lon(context)))throw new IllegalStateException("SELECT WORLD REGION FIRST");
              return String.format(Locale.US,"https://api.adsb.lol/v2/point/%.5f/%.5f/250",lat(context),lon(context));
            }
            public static void choose(Context context,double lat,double lon,String label) {
              if(!valid(lat,lon))throw new IllegalArgumentException("World coordinates out of range");
              String clean=label==null?"WORLD REGION":label.trim();
              if(clean.isEmpty())clean="COORDINATE TARGET";
              if(clean.length()>48)clean=clean.substring(0,48);
              if(ready(context)&&Math.abs(lat(context)-lat)<0.00001d&&Math.abs(lon(context)-lon)<0.00001d)return;
              prefs(context).edit().putBoolean("chosen",true).putLong("lat",Double.doubleToLongBits(lat))
                 .putLong("lon",Double.doubleToLongBits(lon)).putString("label",clean).apply();
              // Region switch must discard old regional observations; never show them under a new location.
              context.getApplicationContext().getSharedPreferences("air_widget_v2",Context.MODE_PRIVATE).edit()
                 .remove("last_snapshot").putString("last_error","NEW REGION SELECTED - REQUESTING OBSERVATIONS").apply();
            }
          }
