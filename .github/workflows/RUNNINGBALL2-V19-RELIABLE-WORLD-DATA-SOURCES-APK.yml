            private int dp(int n){return Math.round(getResources().getDisplayMetrics().density*n);}
            private TextView text(String s,int size,int color){TextView v=new TextView(this);v.setText(s);v.setTextSize(size);v.setTextColor(color);return v;}
            private GradientDrawable bg(){GradientDrawable g=new GradientDrawable();g.setColor(0xFF13293A);g.setCornerRadius(dp(13));g.setStroke(dp(1),0xFF3F7792);return g;}
            private TextView button(String label,Runnable r){TextView v=text(label,12,CYAN);v.setGravity(Gravity.CENTER);v.setBackground(bg());v.setPadding(dp(8),dp(12),dp(8),dp(12));v.setOnClickListener(w->r.run());return v;}
            @Override public void onCreate(Bundle saved){super.onCreate(saved);getWindow().setStatusBarColor(BG);getWindow().setNavigationBarColor(BG);
