              LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(-1,dp(49));cp.topMargin=dp(10);root.addView(controls,cp);
              state=text("CHOOSE WORLDWIDE DATASET",12,CYAN);LinearLayout.LayoutParams sp=new LinearLayout.LayoutParams(-1,-2);sp.topMargin=dp(13);root.addView(state,sp);
              list=new LinearLayout(this);list.setOrientation(LinearLayout.VERTICAL);LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,-2);lp.topMargin=dp(8);root.addView(list,lp);
              setContentView(sc);load("quakes",USGS);
            }
            private String stamp(long when){if(when<=0L)return "TIME UNAVAILABLE";
              SimpleDateFormat fmt=new SimpleDateFormat("dd MMM HH:mm 'UTC'",Locale.US);fmt.setTimeZone(TimeZone.getTimeZone("UTC"));return fmt.format(new Date(when));}
            private void item(String title,String facts,String source,double lat,double lon){
              TextView v=button(title+"\n"+facts+"\n"+source+"  •  TAP FOR EARTH POSITION",()->{
                if(!RunningballWorldTarget.valid(lat,lon)){state.setText("EVENT LOCATION NOT REPORTED");return;}
                Intent i=new Intent(this,GevEarthExploreActivity.class);i.putExtra("geo_lat",lat);i.putExtra("geo_lon",lon);startActivity(i);
              });v.setGravity(Gravity.LEFT);v.setTextColor(INK);
              LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,-2);p.bottomMargin=dp(7);list.addView(v,p);
            }
            private void show(String kind,String raw,long fetched,boolean cached,String error){list.removeAllViews();
              state.setText((cached?"CACHED / NOT A LIVE UPDATE":"DOWNLOADED REPORT")+" • "+stamp(fetched)+(error.isEmpty()?"":" • "+error));
              int shown=0;try{
                JSONObject data=new JSONObject(raw);
                if("quakes".equals(kind)){
                  JSONArray a=data.optJSONArray("features");if(a!=null)for(int i=0;i<a.length()&&shown<75;i++){
                    JSONObject e=a.optJSONObject(i);if(e==null)continue;JSONObject prop=e.optJSONObject("properties");JSONObject geom=e.optJSONObject("geometry");if(prop==null||geom==null)continue;
                    JSONArray geo=geom.optJSONArray("coordinates");if(geo==null||geo.length()<2)continue;double lon=geo.optDouble(0,Double.NaN),lat=geo.optDouble(1,Double.NaN);
                    if(!RunningballWorldTarget.valid(lat,lon))continue;
                    String mag=prop.isNull("mag")?"Magnitude not reported":String.format(Locale.US,"M %.1f",prop.optDouble("mag",Double.NaN));
                    item(mag+" · "+prop.optString("place","Unnamed event"),stamp(prop.optLong("time",0L))+String.format(Locale.US,"  •  %.3f, %.3f",lat,lon),"USGS • 24H M2.5+",lat,lon);shown++;
                  }
                }else{
                  JSONArray a=data.optJSONArray("events");if(a!=null)for(int i=0;i<a.length()&&shown<65;i++){
                    JSONObject e=a.optJSONObject(i);if(e==null)continue;JSONArray geo=e.optJSONArray("geometry");if(geo==null||geo.length()==0)continue;
                    JSONObject last=geo.optJSONObject(geo.length()-1);if(last==null)continue;if(!"Point".equals(last.optString("type")))continue;
                    JSONArray coords=last.optJSONArray("coordinates");if(coords==null||coords.length()<2)continue;
                    double lon=coords.optDouble(0,Double.NaN),lat=coords.optDouble(1,Double.NaN);if(!RunningballWorldTarget.valid(lat,lon))continue;
                    item(e.optString("title","NASA NATURAL EVENT"),"Reported location "+String.format(Locale.US,"%.3f, %.3f",lat,lon)+" • OBSERVED / CURATED","NASA EONET • EVENT",lat,lon);shown++;
                  }
                }
              }catch(Exception ex){state.setText("INVALID SOURCE RESPONSE: "+ex.getMessage());}
              if(shown==0)item("NO GEOLOCATED EVENTS AVAILABLE","Provider unavailable, empty or only polygon observations","NO SAMPLE DATA",Double.NaN,Double.NaN);
            }
            private void load(String kind,String endpoint){SharedPreferences cache=getSharedPreferences(PREF,Context.MODE_PRIVATE);
              state.setText("REQUESTING GLOBAL "+kind.toUpperCase(Locale.US)+" DATA...");
              new Thread(()->{HttpURLConnection conn=null;String raw=null,error="";long stamp=0;
                try{conn=(HttpURLConnection)new URL(endpoint).openConnection();conn.setConnectTimeout(9000);conn.setReadTimeout(9000);
                  conn.setRequestProperty("User-Agent","RUNNINGBALL2-Worldwide-Events/1.0");
                  if(conn.getResponseCode()!=200)throw new IllegalStateException("HTTP "+conn.getResponseCode());
                  ByteArrayOutputStream out=new ByteArrayOutputStream();InputStream in=conn.getInputStream();try{byte[] chunk=new byte[8192];int n;while((n=in.read(chunk))!=-1){if(out.size()+n>1_600_000)throw new IllegalStateException("SOURCE RESPONSE TOO LARGE");out.write(chunk,0,n);}}finally{in.close();}
                  raw=out.toString("UTF-8");new JSONObject(raw);stamp=System.currentTimeMillis();cache.edit().putString(kind+"_raw",raw).putLong(kind+"_time",stamp).apply();
                }catch(Exception e){error=e.getMessage()==null?"SOURCE ERROR":e.getMessage();raw=cache.getString(kind+"_raw","");stamp=cache.getLong(kind+"_time",0L);}
                finally{if(conn!=null)conn.disconnect();}
                final String body=raw==null?"":raw,reason=error;final long time=stamp;final boolean cached=!reason.isEmpty();
                runOnUiThread(()->show(kind,body,time,cached,reason));
              }).start();
            }
          }
