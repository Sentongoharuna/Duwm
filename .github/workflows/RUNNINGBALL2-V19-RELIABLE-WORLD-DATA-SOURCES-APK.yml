              private void switchGroup(String next){if(next.equals(group))return;group=next;selected=-1;items.clear();query.setText("");restore();fetch(false);}
              private SharedPreferences prefs(){return getSharedPreferences(PREF,MODE_PRIVATE);}
              private String key(){return "data_"+group;}
              private void restore(){String raw=prefs().getString(key(),"[]");downloadMs=prefs().getLong(key()+"_time",0L);parse(raw);render();GevSatelliteWidget.updateAll(this);}
              private static long parseEpoch(String epoch){try{
                  String s=epoch.replace("Z","");int dot=s.indexOf('.');if(dot>=0){String fraction=s.substring(dot+1);
                      if(fraction.length()>3)fraction=fraction.substring(0,3);
                      while(fraction.length()<3)fraction+="0";s=s.substring(0,dot)+"."+fraction;
                  }else{s+=".000";}
                  SimpleDateFormat fmt=new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS",Locale.US);fmt.setLenient(false);
                  fmt.setTimeZone(TimeZone.getTimeZone("UTC"));Date d=fmt.parse(s);return d==null?0L:d.getTime();
              }catch(Exception e){return 0L;}}
              private void parse(String raw){items.clear();try{JSONArray arr=new JSONArray(raw);
                 for(int i=0;i<arr.length()&&items.size()<100;i++){
                   JSONObject j=arr.optJSONObject(i);if(j==null)continue;Sat s=new Sat();
                   s.name=j.optString("OBJECT_NAME","");s.norad=j.optInt("NORAD_CAT_ID",0);
                   s.epoch=j.optString("EPOCH","");s.epochMs=parseEpoch(s.epoch);
                   s.mm=j.optDouble("MEAN_MOTION",Double.NaN);s.ecc=j.optDouble("ECCENTRICITY",Double.NaN);
                   s.inc=j.optDouble("INCLINATION",Double.NaN);s.raan=j.optDouble("RA_OF_ASC_NODE",Double.NaN);
                   s.arg=j.optDouble("ARG_OF_PERICENTER",Double.NaN);s.mean=j.optDouble("MEAN_ANOMALY",Double.NaN);
                   if(!s.name.isEmpty()&&s.norad>0&&s.epochMs>0&&GevOrbitMath.validElements(s.mm,s.ecc,s.inc,s.raan,s.arg,s.mean))items.add(s);
                 }
              }catch(Exception ignored){}if(selected>=items.size())selected=-1;}
              private void fetch(boolean user){if(loading)return;
                  long age=System.currentTimeMillis()-downloadMs;
                  if(!user&&!items.isEmpty()&&age>=0&&age<6*3600000L){render();return;}
                  loading=true;banner.setText("REQUESTING "+group+" FROM CELESTRAK …");
                  final String forGroup=group;
                  pool.execute(()->{
                      String raw=null, error=null;
                      HttpURLConnection con=null;
                      try{URL url=new URL(BASE+forGroup+"&FORMAT=JSON");con=(HttpURLConnection)url.openConnection();
                          con.setRequestProperty("User-Agent","RUNNINGBALL2-SatelliteMonitor/10");
                          con.setConnectTimeout(9000);con.setReadTimeout(11000);
                          int code=con.getResponseCode();if(code!=200)throw new IllegalStateException("HTTP "+code);
                          try(InputStream stream=con.getInputStream();ByteArrayOutputStream b=new ByteArrayOutputStream()){
                              byte[] buf=new byte[4096];int n;while((n=stream.read(buf))!=-1){b.write(buf,0,n);if(b.size()>600000)throw new IllegalStateException("Catalogue too large");}
                              raw=b.toString("UTF-8");
                          }
                          if(!raw.trim().startsWith("["))throw new IllegalStateException("Invalid JSON catalogue");
                      }catch(Exception e){error=e.getMessage();}finally{if(con!=null)con.disconnect();}
                      final String body=raw,err=error;
                      ui.post(()->{if(isFinishing()||isDestroyed())return;loading=false;
                          if(!forGroup.equals(group))return;
                          if(body!=null){parse(body);if(!items.isEmpty()){
                              downloadMs=System.currentTimeMillis();prefs().edit().putString(key(),body)
                                  .putLong(key()+"_time",downloadMs).apply();banner.setText("CATALOGUE RECEIVED • PREDICTED ORBITS");
                          }else banner.setText("SOURCE RETURNED NO USABLE ORBITS");}
                          else banner.setText("OFFLINE / CACHED ORBITS • "+(err==null?"UNKNOWN ERROR":err));
                          render();GevSatelliteWidget.updateAll(this);
                      });
                  });
              }
              private static String utc(long ms){if(ms<=0)return "UNKNOWN";SimpleDateFormat f=new SimpleDateFormat("dd MMM HH:mm 'UTC'",Locale.US);f.setTimeZone(TimeZone.getTimeZone("UTC"));return f.format(new Date(ms));}
              private void render(){record.setText(group+"  •  "+items.size()+" ORBITAL RECORDS  •  "+utc(downloadMs));renderList();showSelected();}
              private void renderList(){if(list==null)return;list.removeAllViews();long now=System.currentTimeMillis();String f=query==null?"":query.getText().toString().trim().toLowerCase(Locale.US);int count=0;
                  for(int i=0;i<items.size();i++){Sat sat=items.get(i);if(!f.isEmpty()&&!sat.name.toLowerCase(Locale.US).contains(f)&&!String.valueOf(sat.norad).contains(f))continue;
                      if(count++>=45)break;final int ix=i;
                      GevOrbitMath.Position p=sat.at(now);TextView row=label(sat.name+"  •  #"+sat.norad+"\n"+
                          (p.valid?String.format(Locale.US,"EST %.1f°, %.1f°  •  %.0f KM",p.lat,p.lon,p.altKm):"ELEMENTS INVALID"),12,
                          i==selected?CYAN:INK,i==selected);
                      row.setPadding(dp(13),dp(7),dp(10),dp(7));row.setBackground(card(i==selected));
                      LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,dp(67));lp.bottomMargin=dp(6);list.addView(row,lp);
                      row.setOnClickListener(v->{selected=ix;render();});
                  }
                  if(count==0){TextView empty=label("NO MATCHING SATELLITES • UPDATE OR CHANGE GROUP",12,MUTED,false);list.addView(empty);}
              }
              private String nextEstimatedPass(Sat sat,long now){
                  // Coarse orbital forecast; two-body model, 3-minute grid, NOT SGP4.
                  GevOrbitMath.Position current=sat.at(now);
                  if(GevOrbitMath.elevationDeg(current,0.3476d,32.5825d)>=10d)return "EST ABOVE 10° NOW";
                  for(long t=now+180000L;t<=now+86400000L;t+=180000L){
                      double elev=GevOrbitMath.elevationDeg(sat.at(t),0.3476d,32.5825d);
                      if(!Double.isNaN(elev)&&elev>=10d)return "EST NEXT >10° "+utc(t);
                  }
                  return "NO EST >10° PASS IN 24H";
              }
              private void showSelected(){if(selection==null||meta==null)return;
                  if(selected<0||selected>=items.size()){
                      selection.setText("SELECT A SATELLITE • POSITIONS ARE ESTIMATED");meta.setText("SOURCE: CELESTRAK • TWO-BODY KEPLER ESTIMATE; NOT SGP4 • NO LIVE TRACKING");return;
                  }
                  Sat s=items.get(selected);long now=System.currentTimeMillis();GevOrbitMath.Position p=s.at(now);
                  long elementAge=Math.abs(now-s.epochMs);String quality=elementAge>72L*3600000L?"OLD ELEMENTS — LOW CONFIDENCE":"APPROXIMATE TWO-BODY ORBIT";
                  selection.setText(s.name+" • NORAD "+s.norad);
                  if(!p.valid){meta.setText("POSITION UNAVAILABLE • CHECK SOURCE ELEMENTS");return;}
                  double elev=GevOrbitMath.elevationDeg(p,0.3476,32.5825);
                  meta.setText(String.format(Locale.US,"EST %.3f°, %.3f°  •  %.0f KM ALT  •  %.0f MIN PERIOD\nKAMPALA ELEV %.1f° • %s\n%s",p.lat,p.lon,p.altKm,GevOrbitMath.periodSeconds(s.mm)/60d,elev,quality,nextEstimatedPass(s,now)));
              }
              private void openEarth(){Sat s=chosen();if(s==null){banner.setText("SELECT A SATELLITE FIRST");return;}
                  GevOrbitMath.Position p=s.at(System.currentTimeMillis());if(!p.valid){banner.setText("ORBITAL POSITION UNAVAILABLE");return;}
