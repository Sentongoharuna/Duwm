          /** Global public events, never simulated markers. USGS / NASA source attribution and age shown. */
          public final class RunningballGlobalEventsActivity extends Activity {
            private static final int BG=0xFF09121D,CYAN=0xFF80E2F8,INK=0xFFF0F8FC,DIM=0xFF9BAFC2;
