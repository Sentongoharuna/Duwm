            public static final String NEWS="news", WEATHER="weather", FX="fx";
            private RunningballV17Feeds() {}
            public static SharedPreferences data(Context c){return c.getApplicationContext().getSharedPreferences(PREF,Context.MODE_PRIVATE);}
            public static long received(Context c,String key){return data(c).getLong(key+"_received",0L);}
            public static long attempted(Context c,String key){return data(c).getLong(key+"_attempted",0L);}
