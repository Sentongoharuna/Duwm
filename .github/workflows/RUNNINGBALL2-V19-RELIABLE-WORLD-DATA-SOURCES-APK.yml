                  String raw=read("https://api.gdeltproject.org/api/v2/doc/doc?query=technology%20OR%20aviation%20OR%20economy&mode=artlist&format=json&maxrecords=15&timespan=24h",480000);
                  JSONObject source=new JSONObject(raw);JSONArray items=source.optJSONArray("articles");
                  if(items==null)throw new IllegalStateException("NO ARTICLE LIST");
                  JSONArray clean=new JSONArray();
                  for(int i=0;i<items.length()&&clean.length()<15;i++) {
                    JSONObject a=items.optJSONObject(i);if(a==null)continue;
                    String title=a.optString("title","").trim(),link=a.optString("url","").trim();
                    if(title.length()<8||!link.startsWith("https://"))continue;
                    JSONObject entry=new JSONObject();entry.put("title",title.length()>240?title.substring(0,240):title);
                    entry.put("url",link);entry.put("domain",a.optString("domain",""));
