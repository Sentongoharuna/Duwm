            if activity.tag not in ('activity','activity-alias'): continue
            for fil in activity.findall('intent-filter'):
              actions={el.get(key+'name') for el in fil.findall('action')}
              categories={el.get(key+'name') for el in fil.findall('category')}
              if 'android.intent.action.MAIN' in actions and 'android.intent.category.LAUNCHER' in categories:
                matches.append((activity,fil))
          assert len(matches)==1,'V12 requires exactly one original Android launcher; found '+str(len(matches))
          activity,fil=matches[0]
          previous=activity.get(key+'targetActivity') if activity.tag=='activity-alias' else activity.get(key+'name')
          assert previous,'V12 original app activity name missing'
          previous=previous.lstrip('.').split('.')[-1]
          assert (home/'java/com/sentongoharuna/worldsituationroom'/ (previous+'.java')).is_file(),'Original launcher class not found: '+previous
          activity.remove(fil)
          hub=ET.SubElement(app,'activity',{key+'name':'.RunningballV12HubActivity',key+'label':'@string/app_name',key+'exported':'true'})
          f=ET.SubElement(hub,'intent-filter')
          ET.SubElement(f,'action',{key+'name':'android.intent.action.MAIN'})
          ET.SubElement(f,'category',{key+'name':'android.intent.category.LAUNCHER'})
          tree.write(manifest,encoding='utf-8',xml_declaration=True)
          source=java.read_text(encoding='utf-8');assert source.count('V12_ORIGINAL_ACTIVITY')==1
          java.write_text(source.replace('V12_ORIGINAL_ACTIVITY',previous),encoding='utf-8')
          assert before==(home/'java/com/sentongoharuna/worldsituationroom/DuwmLiveWallpaperService.java').read_bytes()
          for item in ('AirRadarActivity','GevContactsActivity','GevCockpitActivity','GevEarthExploreActivity','GevSatelliteActivity','GevMarineActivity','LiveWallpaperLauncherActivity'):
            assert any(a.attrib.get(key+'name')=='.'+item for a in app.iter('activity')),'Unregistered direct navigation: '+item
          assert sum(1 for el in app.iter('activity') if el.attrib.get(key+'name')=='.RunningballV12HubActivity')==1
          assert sum(1 for ac in app.iter('action') if ac.attrib.get(key+'name')=='android.intent.action.MAIN')==1
          print('V12 launcher is direct command center; all 8 routes connected; original monitor and wallpaper untouched')
          PY_V12_ENTRY
