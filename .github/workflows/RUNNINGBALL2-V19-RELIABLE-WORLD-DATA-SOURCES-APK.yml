          package com.sentongoharuna.worldsituationroom;
          
          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          
          import org.json.JSONArray;
          import org.json.JSONObject;
          
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import java.util.TimeZone;
          
          /** Accessible, scrollable report, opened from any aircraft widget row. */
          public final class AirFlightDetailsActivity extends Activity {
              private final int background = Color.rgb(7, 15, 26);
              private final int ink = Color.rgb(228, 240, 248);
              private final int muted = Color.rgb(139, 168, 185);
              private final int cyan = Color.rgb(76, 213, 234);
              private int dp(float x) { return (int)(x*getResources().getDisplayMetrics().density+.5f); }
              private TextView label(String text, int sp, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(text); t.setTextSize(sp); t.setTextColor(color);
                  if (bold) t.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  t.setPadding(0, dp(5), 0, dp(5));
                  return t;
              }
              private GradientDrawable panel() {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(Color.rgb(14, 28, 42)); d.setCornerRadius(dp(14));
                  d.setStroke(dp(1), Color.rgb(34, 72, 88)); return d;
              }
              private void field(LinearLayout parent, String key, String value) {
                  LinearLayout row=new LinearLayout(this);
                  row.setOrientation(LinearLayout.VERTICAL);
                  row.setPadding(dp(10),dp(5),dp(8),dp(6));
                  row.addView(label(key, 11, muted, false));
                  row.addView(label(value, 18, ink, true));
                  parent.addView(row);
              }
              private static String fmt(double value, String pattern, String unit) {
                  return AirOperationsWidgets.finite(value)?String.format(Locale.US,pattern,value)+unit:"NOT REPORTED";
              }
              @Override protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  getWindow().setStatusBarColor(background); getWindow().setNavigationBarColor(background);
                  ScrollView sc = new ScrollView(this);
                  sc.setFillViewport(true); sc.setBackgroundColor(background);
                  LinearLayout root=new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(20), dp(24), dp(20), dp(30));
                  sc.addView(root);
                  root.addView(label("RUNNINGBALL2  /  AIRCRAFT INTELLIGENCE", 11, cyan, true));
                  String hex=getIntent().getStringExtra("air_hex");
                  if(hex==null)hex="";
                  JSONObject cached=AirOperationsWidgets.lastData(this);
                  long stamp=cached.optLong("time",0L);
                  JSONArray entries=cached.optJSONArray("items");
                  JSONObject aircraft=null;
                  if(entries!=null){for(int i=0;i<entries.length();i++){
                      JSONObject row=entries.optJSONObject(i);
                      if(row!=null&&(hex.isEmpty()||hex.equals(row.optString("hex", "")))){aircraft=row;break;}
                  }}
                  String title=aircraft!=null?aircraft.optString("flight", "AIRCRAFT"):"AIRCRAFT OPERATIONS";
                  root.addView(label(title, 29, ink, true));
                  root.addView(label("KAMPALA COVERAGE  •  250 NM RADIUS", 12, muted, false));
                  if(aircraft==null){
                      root.addView(label("No cached aircraft report is available. Refresh either aircraft widget while connected.",16,muted,false));
                      setContentView(sc);return;
                  }
                  LinearLayout card=new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setBackground(panel());
                  card.setPadding(dp(8),dp(7),dp(8),dp(10));
                  LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(-1,-2);
                  cp.topMargin=dp(14); root.addView(card,cp);
                  field(card,"ICAO / HEX IDENTIFIER",aircraft.optString("hex", "—"));
                  field(card,"DISTANCE FROM KAMPALA",fmt(aircraft.optDouble("nm",Double.NaN),"%.1f"," nautical miles"));
                  field(card,"BAROMETRIC ALTITUDE",aircraft.optBoolean("ground",false)?"ON GROUND":fmt(aircraft.optDouble("alt",Double.NaN),"%.0f"," feet"));
                  field(card,"GROUND SPEED",fmt(aircraft.optDouble("speed",Double.NaN),"%.0f"," knots"));
                  field(card,"HEADING (TRUE)",fmt(aircraft.optDouble("heading",Double.NaN),"%.0f"," degrees"));
                  field(card,"LATITUDE",fmt(aircraft.optDouble("lat",Double.NaN),"%.5f","°"));
                  field(card,"LONGITUDE",fmt(aircraft.optDouble("lon",Double.NaN),"%.5f","°"));
                  field(card,"POSITION AGE WHEN RECEIVED",fmt(aircraft.optDouble("seen",Double.NaN),"%.0f"," seconds"));
                  SimpleDateFormat df=new SimpleDateFormat("dd MMM yyyy  •  HH:mm:ss 'UTC'",Locale.US);
                  df.setTimeZone(TimeZone.getTimeZone("UTC"));
                  root.addView(label("SNAPSHOT: "+(stamp>0?df.format(new Date(stamp)):"NOT AVAILABLE"),12,cyan,true));
