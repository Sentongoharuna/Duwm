                conn.setRequestMethod("GET");conn.setConnectTimeout(6500);conn.setReadTimeout(7500);
                conn.setRequestProperty("Accept","application/json");conn.setRequestProperty("User-Agent","RUNNINGBALL2/17 (source-credited Android reader)");
                int code=conn.getResponseCode();if(code!=200)throw new IllegalStateException("PROVIDER HTTP "+code);
