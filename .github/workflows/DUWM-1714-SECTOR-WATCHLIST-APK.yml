name: "DUWM 1714 | 19-sector persisted watchlist and unobstructed navy globe"
run-name: "DUWM 1714 | Build, verify saved 19-sector watchlist and launch original globe"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/DUWM-1714-SECTOR-WATCHLIST-APK.yml'
      - 'DUWM-1714-SECTOR-WATCHLIST-SOURCE.zip'
permissions:
  contents: read
concurrency:
  group: duwm-1714-full-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout source or trusted baseline
        uses: actions/checkout@v4
      - name: Recover exact 1714 source and verify every file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/duwm1714"
          if [ -s 'DUWM-1714-SECTOR-WATCHLIST-SOURCE.zip' ]; then
            echo '029a3bff1a1f02584407aca81ac7c0c41767a64827504b84454509f8b87833b5  DUWM-1714-SECTOR-WATCHLIST-SOURCE.zip' | sha256sum --check
            unzip -t 'DUWM-1714-SECTOR-WATCHLIST-SOURCE.zip' | tail -n 1
            unzip -q 'DUWM-1714-SECTOR-WATCHLIST-SOURCE.zip' -d "$RUNNER_TEMP/duwm1714"
          else
            echo 'acf9503bb8d8c5764c16910a14c68045a289a0df52dab49cd91ed3f8bb790cbb  DUWM-1709-SECTOR-OUTLINES-SOURCE.zip' | sha256sum --check
