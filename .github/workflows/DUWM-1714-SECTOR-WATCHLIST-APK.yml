      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK API 36 and signing tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          test -x "$SDK_MANAGER"
          if [ ! -f "$SDK_ROOT/platforms/android-36/android.jar" ] || [ ! -x "$SDK_ROOT/build-tools/36.0.0/apksigner" ]; then
            timeout 600 "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          fi
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Verify original protected globe, persisted source watchlist and all 19 desks
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python3 verification/check_source.py
          python3 verification/check_1714.py
          mkdir -p "$RUNNER_TEMP/duwm1714-parser"
          javac -d "$RUNNER_TEMP/duwm1714-parser" verification/JavaSyntaxCheck.java
          java -cp "$RUNNER_TEMP/duwm1714-parser" JavaSyntaxCheck
      - name: Compile actual Android 1714 APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          gradle --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p "$RUNNER_TEMP/duwm1714-output"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/duwm1714-output/DUWM-1714.apk"
      - name: Verify signed APK identity and compiled 1714 functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_APK'
          import os, pathlib, subprocess, zipfile, hashlib
          apk=pathlib.Path(os.environ['RUNNER_TEMP'])/'duwm1714-output/DUWM-1714.apk'
          assert apk.is_file() and apk.stat().st_size > 150000
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
              for part in [b'SatelliteMapView',b'Duwm1712OperationsMatrixActivity',b'Duwm1713ReceiptCoverageView',
                           b'render1713Comparison',b'pick1713Sector',b'add1713ComparisonCard',
                           b'isWatched',b'setWatched',b'confirmClearWatchlist',b'WATCHED',
                           b'SignalTickerRailView',b'Duwm1709SectorOutline',b'Duwm1710SourceWaveView',
                           b'Duwm1711NativeDeskDock']:
                  assert part in dex,('Missing compiled feature',part)
          sdk=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
          subprocess.run([str(sdk/'apksigner'),'verify','--verbose',str(apk)],check=True)
          badge=subprocess.check_output([str(sdk/'aapt'),'dump','badging',str(apk)],text=True)
          for value in ["versionCode='171400'", "versionName='1714'",
                        "name='com.sentongoharuna.worldsituationroom.rb2live25'",
                        "application-label:'DUWM 1714 • DEVELOP.UGANDA'"]:
              assert value in badge,(value,badge[:1000])
          (apk.parent/'SHA256SUMS.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  '+apk.name+'\n')
          print('PASS compiled 1714 identity, signed APK, original globe and watchlist and source comparison')
          PY_APK
      - name: Publish compiled APK even if emulator launch fails
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-1714-COMPILED-APK-LAUNCH-UNVERIFIED
          path: ${{ runner.temp }}/duwm1714-output/DUWM-1714.apk
          retention-days: 30
          if-no-files-found: error
      - name: Enable KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm || { echo 'GitHub runner KVM unavailable' >&2; exit 1; }
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Prepare persistent emulator launch script
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/duwm1714-launch.sh" <<'DUWM_LAUNCH'
          #!/usr/bin/env bash
          set -euo pipefail
          APK="${RUNNER_TEMP:?}/duwm1714-output/DUWM-1714.apk"
          PKG=com.sentongoharuna.worldsituationroom.rb2live25
          test -s "$APK"
          adb wait-for-device
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb install -r "$APK"
          adb logcat -c
          adb shell am start -W -n "$PKG/com.sentongoharuna.worldsituationroom.MainActivity"
          sleep 20
          adb shell pidof "$PKG" >/dev/null
          adb exec-out screencap -p > "${RUNNER_TEMP}/duwm1714-output/01-ORIGINAL-GLOBE.png"
          test -s "${RUNNER_TEMP}/duwm1714-output/01-ORIGINAL-GLOBE.png"
          adb logcat -d -s AndroidRuntime:E > "${RUNNER_TEMP}/duwm1714-output/02-ANDROID-RUNTIME.txt" || true
          if grep -q 'FATAL EXCEPTION' "${RUNNER_TEMP}/duwm1714-output/02-ANDROID-RUNTIME.txt"; then
            cat "${RUNNER_TEMP}/duwm1714-output/02-ANDROID-RUNTIME.txt" >&2
            exit 1
          fi
          echo 'PASS actual 1714 APK installed, original globe launched, screenshot saved, no fatal exception'
          DUWM_LAUNCH
          chmod +x "$RUNNER_TEMP/duwm1714-launch.sh"
          bash -n "$RUNNER_TEMP/duwm1714-launch.sh"
      - name: Android emulator - install APK and launch protected original globe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          script: bash "$RUNNER_TEMP/duwm1714-launch.sh"
      - name: Publish verified Build 1714 APK and screenshot
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-1714-VERIFIED-APK-AND-GLOBE-SCREENSHOT
          path: ${{ runner.temp }}/duwm1714-output/
          retention-days: 30
          if-no-files-found: error
