name: "DUWM 1719 | My World + MONITORS CAM Signed APK"
run-name: "DUWM 1719 | Build original globe, My World and safe MONITORS CAM"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/DUWM-1719-MY-WORLD-MONITORS-CAM-APK.yml'
      - 'DUWM-1719-MY-WORLD-MONITORS-CAM-SOURCE.zip'
permissions:
  contents: read
concurrency:
  group: duwm-1719-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile-and-verify:
    name: Compile real signed Android 1719 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout the original DUWM repository
        uses: actions/checkout@v4
      - name: Verify exact full 1719 source and unzip
        shell: bash
        run: |
          set -euo pipefail
          echo '99d997e970760ba336e36699cff7427e858b3180d06094d711a17cac2b6c8c71  DUWM-1719-MY-WORLD-MONITORS-CAM-SOURCE.zip' | sha256sum -c -
          unzip -t DUWM-1719-MY-WORLD-MONITORS-CAM-SOURCE.zip | tail -n 1
          mkdir -p "$RUNNER_TEMP/duwm1719"
          unzip -q DUWM-1719-MY-WORLD-MONITORS-CAM-SOURCE.zip -d "$RUNNER_TEMP/duwm1719"
          test -s "$RUNNER_TEMP/duwm1719/DUWM-1719-ANDROID-SOURCE/verification/check_1719.py"
          echo "DUWM_PROJECT=$RUNNER_TEMP/duwm1719/DUWM-1719-ANDROID-SOURCE" >> "$GITHUB_ENV"
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK API 36 and signature tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -s "$SDK_ROOT/platforms/android-36/android.jar" ] || [ ! -x "$SDK_ROOT/build-tools/36.0.0/apksigner" ]; then
            timeout 600 "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          fi
          test -s "$SDK_ROOT/platforms/android-36/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Run original-globe, 1717 repair, palette, 1719 worldwide + camera checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$DUWM_PROJECT"
          python3 verification/check_source.py
          python3 verification/check_1717_fix1.py
          python3 verification/check_1715_reference_palette.py
          python3 verification/check_1719.py
          mkdir -p "$RUNNER_TEMP/duwm1719-parser"
          javac -d "$RUNNER_TEMP/duwm1719-parser" verification/JavaSyntaxCheck.java
          java -cp "$RUNNER_TEMP/duwm1719-parser" JavaSyntaxCheck
      - name: Compile complete Android source into real APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$DUWM_PROJECT"
          gradle --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p "$RUNNER_TEMP/duwm1719-release"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/duwm1719-release/DUWM-1719.apk"
      - name: Verify actual APK signature, build ID and compiled features
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          import os,hashlib,pathlib,subprocess,zipfile
          apk=pathlib.Path(os.environ['RUNNER_TEMP'])/'duwm1719-release/DUWM-1719.apk'
          assert apk.is_file() and apk.stat().st_size > 180_000
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
              assert dex, 'No classes.dex in APK'
              for symbol in (b'Duwm1719MyWorldActivity',b'Duwm1718MonitorsCamActivity',
                             b'Duwm1718GlobalDiscoverActivity',b'Duwm1717ReceiptAuditActivity',
                             b'Duwm1716SignalCenterActivity',b'Duwm1715SignalLights',
                             b'SatelliteMapView',b'showReadiness',b'sourceWeather',
                             b'DuwmOptionsActivity'):
                  assert symbol in dex,('Required 1719 class or method missing in compiled APK',symbol)
          sdk=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
          subprocess.run([str(sdk/'apksigner'),'verify','--verbose',str(apk)],check=True)
          info=subprocess.check_output([str(sdk/'aapt'),'dump','badging',str(apk)],text=True)
          for value in ("versionCode='171900'","versionName='1719'",
                        "name='com.sentongoharuna.worldsituationroom.rb2live25'",
                        "application-label:'DUWM 1719 • DEVELOP.UGANDA'"):
              assert value in info,(value,info[:1300])
          (apk.parent/'SHA256SUMS.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  '+apk.name+'\n')
          print('PASS 1719 APK identity, signature, original globe, 19 desks, My World, MONITORS CAM. Physical camera tests still required.')
          PY_VERIFY
      - name: Publish installable signed APK and checksum regardless of emulator availability
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-1719-SIGNED-INSTALLABLE-APK
          path: ${{ runner.temp }}/duwm1719-release/
          if-no-files-found: error
          retention-days: 30
