      - name: V25 STAGE2 V7 CONTRACT - actual news quake NASA locations and safe empty sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'RB25_STAGE2_V7_CHECK'
          import sys,hashlib,xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path(sys.argv[1])/'app/src/main/java/com/sentongoharuna/worldsituationroom'
          screen=(p/'RunningballV25WorldBrief.java').read_text()
          hub=(p/'RunningballV12HubActivity.java').read_text()
          panel=(p/'RunningballV25Stage2Panel.java').read_text()
          news=(p/'RunningballV17Feeds.java').read_text()
          sources=(p/'RunningballV25Sources.java').read_text()
          for field in ('news_json','quakes_raw','nasa_raw','"features"','"events"','"articles"',
                        '"mag"','"place"','"time"','"title"','"categories"','"provider"','RUNNINGBALL2'):
            # RUNNINGBALL2 is in package names; other fields must be actual cache parsers.
            if field=='RUNNINGBALL2':continue
            assert field in screen,f'V7 world brief lacks provider field {field}'
          for field in ('KAMPALA','LONDON','NEW YORK','TOKYO','SINGAPORE','DUBAI','PARIS','NAIROBI',
                        'USER_PRESET','REGIONAL 250 NM, NOT WORLDWIDE','REFRESH WORLD FEEDS','SOURCE ERRORS',
                        'RunningballWorldTarget.choose','RunningballV16SourceRefresh.request',
                        'RunningballV17Feeds.request','RunningballV19SatelliteBootstrap.request',
                        'RunningballV19Noaa.request','AirOperationsWidgets.Pulse.class'):
            assert field in screen,f'V7 region/request control missing {field}'
          for banned in ('Math.random(', 'new Random(', 'HttpURLConnection', 'Thread.sleep(', 'https://news.google.com'):
            assert banned not in screen,f'V7 world brief contains prohibited {banned}'
          assert screen.count('sourceRow(')>=5
          assert panel.count('new RunningballV25WorldBrief(c)')==1
          assert panel.index('STAGE 5 · OPTIONAL EXPANDED SOURCES')<panel.index('new RunningballV25WorldBrief(c)')
          assert hub.count('new RunningballV25Stage2Panel(this)')==1
          assert 'maxrecords=30' in news and 'clean.length()<30' in news
          assert 'https://api.frankfurter.dev/v1/latest?base=USD' in sources
          assert 'FRAME_MS=33L' in (p/'DuwmLiveWallpaperService.java').read_text()
          assert 'rotation=(rotation+(dt/1000.0d)*4.0d)%360.0d;' in (p/'DuwmLiveWallpaperService.java').read_text()
          assert (p/'SatelliteMapView.java').is_file()
          assert (p/'RunningballV25Stage2GeoView.java').is_file()
          assert 'RUNNINGBALL2' in hub and 'new RunningballV25Stage1Panel(this)' in hub
          ET.parse(Path(sys.argv[1])/'app/src/main/AndroidManifest.xml')
          print('V7 PASS: actual publisher-linked global headlines, real USGS magnitudes/locations and NASA names; region-select only regional air; preserved globe')
          RB25_STAGE2_V7_CHECK

