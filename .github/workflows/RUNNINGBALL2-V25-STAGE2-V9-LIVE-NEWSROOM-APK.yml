      - name: V25 FIX4 NAVIGATION - scan after each gesture and assert real activity launch
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/v15-emulator-smoke.sh" <<'RB25_FIX4_NAVIGATION'
          from pathlib import Path
          import sys,ast,re
          file=Path(sys.argv[1]); source=file.read_text(encoding='utf-8')
          start='def nav(label,activity):\n'
          end='# Real on-emulator smoke tests for each installed activity.'
          if source.count(start)!=1 or source.count(end)!=1:
              raise SystemExit('FIX4: cannot uniquely locate original emulator navigation function')
          old=source.split(start,1)[1].split(end,1)[0]
          for needle in ("for _ in range(10):",'hit=find(label)','if not hit:',"assert activity in lines[-1]", "assert pkg in resumed"):
              if needle not in old:
                  raise SystemExit('FIX4: original strict Android navigation contract missing: '+needle)
          nav='''def nav(label,activity):
              hub()
              hit=find(label)
              # V25 panels are taller than V24. Find the REAL on-screen button,
              # including after the FINAL gesture; never pass by source string alone.
              for scan in range(36):
                  if hit:break
                  adb('shell','input','swipe','510','1560','510','670','280')
                  time.sleep(.25)
                  hit=find(label)  # mandatory probe AFTER every swipe, including last
              if not hit:
                  # Search backwards too in case a short button appeared during UI updates.
                  for scan in range(36):
                      adb('shell','input','swipe','510','670','510','1560','280')
                      time.sleep(.25)
                      hit=find(label)
                      if hit:break
              if not hit:
                  screenshot=capture_failure(activity)
                  raise AssertionError('Cannot find visible navigation button '+label+'; screenshot '+screenshot)
              adb('shell','input','tap',str(hit[0]),str(hit[1]))
              time.sleep(1.6)
              resumed=adb('shell','dumpsys','activity','activities')
              lines=[row for row in resumed.splitlines() if 'topResumedActivity' in row or 'mResumedActivity' in row]
              if lines:assert activity in lines[-1],f'{label} did not become resumed: '+lines[-1]
              else:assert activity in resumed,f'{label} failed to navigate to {activity}'
              assert pkg in resumed,f'{label} navigated outside expected app'
              name=re.sub('[^a-zA-Z0-9]+','-',activity)
              subprocess.run(['adb','exec-out','screencap','-p'],stdout=open('/tmp/'+name+'.png','wb'),check=True,timeout=20)
              print('PASS FIX4 visible navigation:',label,'→',activity,flush=True)
          '''
          # Local deterministic regression: item first becomes visible after the
          # tenth swipe. Previous V24 helper failed at exactly this boundary.
          import types
          unit={"swipes":0,"taps":0}
          class QuietTime:
              def sleep(self,seconds):pass
          class CaptureOnly:
              def run(self,*args,**kwargs):return None
          def fake_adb(*args):
              if 'swipe' in args:unit['swipes']+=1
              if 'tap' in args:unit['taps']+=1
              if 'dumpsys' in args:return 'topResumedActivity: com.sentongoharuna.worldsituationroom.rb2live25/AirRadarActivity'
              return ''
          test_scope={'hub':lambda:None,'find':lambda label:(510,850) if unit['swipes']>=10 else None,
                      'adb':fake_adb,'time':QuietTime(),'pkg':'com.sentongoharuna.worldsituationroom.rb2live25',
                      'subprocess':CaptureOnly(),'re':re}
          compiled=compile(nav+'\n','v25fix4_nav_test','exec')
          exec(compiled,test_scope)
          test_scope['nav']('AIRCRAFT RADAR','AirRadarActivity')
          if unit['swipes']!=10 or unit['taps']!=1:
              raise SystemExit('FIX4: ten-gesture boundary regression failed; navigation not truly tested')
          # The production script retains every preexisting test, including ALL
          # nine source boards, legacy activities, V22, V23 and V24 assertions.
          source=source.replace(start+old,nav+'\n',1)
          body=source.split("python3 - <<'PY_ADB_SMOKE'\n",1)[1].split('\nPY_ADB_SMOKE',1)[0]
          ast.parse(body)
          for guard in ("('AIRCRAFT RADAR','AirRadarActivity')",
                        "('AIRCRAFT CONTACTS','GevContactsActivity')",
                        "('COCKPIT & CHASE','GevCockpitActivity')",
                        "assert find('V22 / WORLD STATUS')",
                        "assert find('V23 / WORLD OPERATIONS CONTROL')",
                        "assert find('WORLD NEWS')",
                        "assert find('NASA EVENTS')",
                        "assert find('V25 / STAGE ACCESS')"):
              if guard not in body:raise SystemExit('FIX4: inherited screen gate missing: '+guard)
          file.write_text(source,encoding='utf-8')
          print('PASS FIX4: after-swipe navigation, bidirectional discovery, real activity assertions and all prior gates retained')
          RB25_FIX4_NAVIGATION
          bash -n "$RUNNER_TEMP/v15-emulator-smoke.sh"

