              public Result(String k,String pr,String ep,String c,String v,long when,long source,Status s,String err){
                key=k;provider=pr;endpoint=ep;coverage=c;value=v;fetchedAt=when;sourceTime=source;status=s;errorReason=err;
              }
              public String age(){if(fetchedAt<=0)return "NEVER RECEIVED";
                long m=Math.max(0,(System.currentTimeMillis()-fetchedAt)/60000L);
                return m==0?"<1m":m<60?m+"m":m<1440?(m/60)+"h "+(m%60)+"m":(m/1440)+"d";}
              public String display(){return status.toString().replace('_',' ')+" · "+age();}
            }
            private static SharedPreferences p(Context c,String s){return c.getApplicationContext().getSharedPreferences(s,Context.MODE_PRIVATE);}
            private static JSONObject obj(String s){try{return new JSONObject(s);}catch(Exception e){return new JSONObject();}}
            private static int count(JSONObject o,String name){JSONArray a=o.optJSONArray(name);return a==null?-1:a.length();}
            private static int array(String raw){try{return new JSONArray(raw).length();}catch(Exception e){return -1;}}
            private static String figure(long stamp,int value){return stamp>0&&value>=0?Integer.toString(value):"--";}
            private static Status classify(long when,long ttl,String err,boolean configured,boolean regionReady){
              if(!configured)return Status.NOT_CONFIGURED;
              if(!regionReady)return Status.NO_DATA_FOR_REGION;
              if(when<=0)return err==null||err.isEmpty()?Status.NO_DATA_FOR_REGION:Status.FAILED;
              long age=Math.max(0,System.currentTimeMillis()-when);
              if(err!=null&&!err.isEmpty())return Status.OFFLINE_CACHE;
              if(age<=ttl)return Status.LIVE;
              if(age<=ttl*3)return Status.DELAYED;
              return Status.STALE;
            }
            public static Result read(Context ctx,int index){
              if(index<0||index>=IDS.length)throw new IllegalArgumentException("source index");
              boolean region=RunningballWorldTarget.ready(ctx);String key=IDS[index],err="",value="--";long stamp=0,sourceTime=0;
              String coverage="WORLDWIDE / PROVIDER-LIMITED";boolean configured=true,regionReady=true;
              switch(index){
