      - name: Execute EVERY V24 source-generation and regression step unchanged (through V24 acceptance)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'RB25_V24_RUN'
          import os,subprocess,yaml,sys,pathlib
          source=pathlib.Path('/tmp/RUNNINGBALL2-V24-EMBEDDED-LOCKED.yml')
          steps=yaml.safe_load(source.read_text())['jobs']['build']['steps']
          assert len(steps)==77,'V24 baseline step count differs'
          env=dict(os.environ)
          cwd=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          # V24 uses GITHUB_ENV between steps. Re-load it after every subprocess.
          marker=pathlib.Path(os.environ['GITHUB_ENV'])
          for index in range(2,57):
            item=steps[index]
            if 'uses' in item:
              # V24 actions at 5 and 6 are already installed in this job. Verify
              # exact name/action pairs; all other unexpected action steps fail closed.
              approved={5:('Java 17','actions/setup-java@v4'),
                        6:('Gradle 8.13','gradle/actions/setup-gradle@v4')}
              expected=approved.get(index)
              if expected is None or (item.get('name'),item.get('uses'))!=expected:
                raise SystemExit(f'V25 S2 BASELINE DEPENDENCY REJECTED index={index} name={item.get("name")} action={item.get("uses")}')
              if index==5:
                probe=subprocess.run(['java','-version'],env=env,check=False,capture_output=True,text=True)
                if probe.returncode or '17.' not in probe.stderr+probe.stdout:raise SystemExit('V25 S2 java17 precondition failed')
              if index==6:
                probe=subprocess.run(['gradle','--version'],env=env,check=False,capture_output=True,text=True)
                if probe.returncode or '8.13' not in probe.stdout:raise SystemExit('V25 S2 Gradle8.13 precondition failed')
              print('REUSE VERIFIED PREINSTALLED V24 ACTION',index,expected,flush=True)
              continue
            label=item['name']
            print('RUN V24 PRESERVED',index,label,flush=True)
            cmd=['bash','-eo','pipefail','-c',item['run']]
            child=subprocess.run(cmd,cwd=str(cwd),env=env,check=False)
            if child.returncode!=0:raise SystemExit('V24 BASELINE STOP AT '+str(index)+' '+label+' EXIT '+str(child.returncode))
            if marker.exists():
              for line in marker.read_text().splitlines():
                if '=' in line:
                  key,value=line.split('=',1)
                  if key and key.isidentifier():env[key]=value
          target=env.get('PROJECT_DIR','')
          if not target or not pathlib.Path(target).is_dir():raise SystemExit('V25 PROJECT_DIR missing after protected recovery')
          with marker.open('a') as f:f.write('PROJECT_DIR='+target+'\n')
          print('PASS: all 55 V24 generation/regression stages retain their original tests')
          RB25_V24_RUN
      - name: V25 Stage1 install shared region, truth-state screens and attribution
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'RB25_STAGE1_INSTALL'
          #!/usr/bin/env python3
          """Stage-1-only additive source patch: independent implementation, no upstream GEV code copied."""
          from pathlib import Path
          import sys, re, hashlib, xml.etree.ElementTree as ET
          root=Path(sys.argv[1])/'app/src/main'
          p=root/'java/com/sentongoharuna/worldsituationroom'
          assert p.is_dir(),f'STAGE1: project java path absent: {p}'
          wall=p/'DuwmLiveWallpaperService.java';globe=p/'SatelliteMapView.java'
          w_sha=hashlib.sha256(wall.read_bytes()).hexdigest();g_sha=hashlib.sha256(globe.read_bytes()).hexdigest()
          def patch(path,old,new,anchor):
           s=path.read_text(encoding='utf8'); n=s.count(old)
           if n!=1:raise SystemExit(f'STAGE1 ANCHOR FAILURE: {path.name} / {anchor} / expected 1 occurrence, got {n}')
           path.write_text(s.replace(old,new,1),encoding='utf8')
          def new(path,contents):
           if path.exists():raise SystemExit(f'STAGE1 NEW FILE EXISTS: {path}')
           path.write_text(contents.strip()+'\n',encoding='utf8')
          
          new(p/'RunningballV25RegionQuery.java',r'''package com.sentongoharuna.worldsituationroom;
          import java.util.Locale;
          /** Independent Stage 1 pure Java region functions, no third-party material. */
          public final class RunningballV25RegionQuery {
            private RunningballV25RegionQuery(){}
            public static final int RADIUS_NM=250;
            public static String url(double lat,double lon){
              if(!Double.isFinite(lat)||!Double.isFinite(lon)||Math.abs(lat)>90d||Math.abs(lon)>180d)
                throw new IllegalArgumentException("invalid global coordinates");
              return String.format(Locale.US,"https://api.adsb.lol/v2/point/%.5f/%.5f/%d",lat,lon,RADIUS_NM);
            }
            public static String coverage(String name){return (name==null||name.trim().isEmpty()?"UNNAMED REGION":name.trim())+" / 250 NM REGIONAL AIRCRAFT";}
            public static String key(double lat,double lon){return String.format(Locale.US,"%.4f,%.4f",lat,lon);}
          }''')
          
          target=p/'RunningballWorldTarget.java'
          patch(target,'return String.format(Locale.US,"https://api.adsb.lol/v2/point/%.5f/%.5f/250",lat(context),lon(context));',
                'return RunningballV25RegionQuery.url(lat(context),lon(context));','shared radius/url formatter')
          patch(target,'  public static void choose(Context context,double lat,double lon,String label) {','''  public static String source(Context context){return prefs(context).getString("source","MAP");}
            public static long revision(Context context){return prefs(context).getLong("revision",0L);}
            public static String coverage(Context context){return ready(context)?RunningballV25RegionQuery.coverage(label(context)):"GLOBAL VIEW / NO REGIONAL AIRCRAFT QUERY";}
            /** Global reset leaves the historic provider snapshots intact, but invalidates the current regional aircraft display. */
            public static void resetGlobal(Context context){
              SharedPreferences state=prefs(context);
              if(!state.getBoolean("chosen",false))return;
              long rev=state.getLong("revision",0L)+1L;
              state.edit().putBoolean("chosen",false).putString("label","GLOBAL VIEW")
                .putString("source","GLOBAL_RESET").putLong("revision",rev).apply();
              context.getApplicationContext().getSharedPreferences("air_widget_v2",Context.MODE_PRIVATE)
                .edit().remove("last_snapshot").putString("last_error","NO REGION SELECTED").apply();
            }
            public static void choose(Context context,double lat,double lon,String label) {
              choose(context,lat,lon,label,"MAP");
            }
            public static void choose(Context context,double lat,double lon,String label,String source) {''','add global reset and source')
          patch(target,'.putLong("lon",Double.doubleToLongBits(lon)).putString("label",clean).apply();',
                '.putLong("lon",Double.doubleToLongBits(lon)).putString("label",clean)\n       .putString("source",source==null?"MAP":source).putLong("revision",revision(context)+1L).apply();','region revision')
