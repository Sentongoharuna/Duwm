            private final ArrayList<Float> samples=new ArrayList<>();
            public RunningballV25Stage2Sparkline(Context context){super(context);setMinimumHeight((int)(58*getResources().getDisplayMetrics().density));}
            public void setPoints(JSONArray data){samples.clear();for(int i=0;i<data.length();i++){
