      - name: V25 STAGE 2 V8 CONTRACT - publisher integrity, regional conflict honesty, and access
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'RB25_V8_CONTRACT'
          import sys,xml.etree.ElementTree as ET,re,hashlib
          from pathlib import Path
          p=Path(sys.argv[1])/'app/src/main';pkg=p/'java/com/sentongoharuna/worldsituationroom'
          repo=(pkg/'RunningballV25NewsRepository.java').read_text()
          screen=(pkg/'RunningballV25NewsMonitorActivity.java').read_text()
          panel=(pkg/'RunningballV25Stage2Panel.java').read_text()
          for source in ('independent.co.ug/feed/','observer.ug/feed/','softpower.ug/feed/','watchdoguganda.com/feed',
                         'api.gdeltproject.org/api/v2/doc/doc','parseRss','parseGdelt','getConnectTimeout',
                         'setReadTimeout(12000)','MAX_BYTES=450000','newFixedThreadPool(2)','MIN_RETRY'):
              if source=='getConnectTimeout':continue
              assert source in repo,'V8 source invariant failed: '+source
          for forbidden in ('Math.random','new Random(','google.com/search','news.google.com','HARD_CODED_CASUALTIES'):
              assert forbidden not in repo and forbidden not in screen,forbidden
          for value in ('UGANDA NEWS','MIDDLE EAST','WORLD CONFLICTS','ALL SOURCES','NOT CONFIGURED',
                        'The Independent','Daily Monitor','New Vision',
                        'Uganda Radio Network','NBS Television','YEMEN / RED SEA'):
              assert value in screen,'V8 displayed provider or region missing: '+value
          assert 'UNVERIFIED INCIDENT' in repo
          assert screen.index('UGANDA NEWS')<screen.index('WORLD CONFLICTS')
          assert 'RunningballV25NewsMonitorActivity.class' in panel
          assert panel.index('UGANDA NEWS')<panel.index('new RunningballV25WorldBrief(c)')
          m=ET.parse(p/'AndroidManifest.xml').getroot();android='{http://schemas.android.com/apk/res/android}'
          nodes=[x for x in m.iter('activity') if x.get(android+'name')=='.RunningballV25NewsMonitorActivity']
          assert len(nodes)==1 and nodes[0].get(android+'exported')=='false'
          assert (pkg/'DuwmLiveWallpaperService.java').is_file()
          assert hashlib.sha256((pkg/'DuwmLiveWallpaperService.java').read_bytes()).hexdigest()=='07f5bf384b0ff324335e3997cb46440309ccbe5188d8ebd326cc551e550f7fc3'
          assert hashlib.sha256((pkg/'SatelliteMapView.java').read_bytes()).hexdigest()=='adf0d3e4b4f1df1a844b01554e6e9ea610dac48decd24f62d3e1daee18b23b7d'
          print('PASS V8: four RSS collectors, 14 publisher links, GDELT conflict coverage, Stage2 real routes, protected globe')
          RB25_V8_CONTRACT

      - name: V25 STAGE2 V9 INSTALL - received global newsroom, local search, provider health and main access
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'RB25_V9_NEWSROOM_INSTALL'
          from pathlib import Path
          import sys, hashlib
          root=Path(sys.argv[1]); p=root/'app/src/main/java/com/sentongoharuna/worldsituationroom'
          manifest=root/'app/src/main/AndroidManifest.xml'
          wall=p/'DuwmLiveWallpaperService.java'; globe=p/'SatelliteMapView.java'
          wall_before=hashlib.sha256(wall.read_bytes()).hexdigest();globe_before=hashlib.sha256(globe.read_bytes()).hexdigest()

          def unique_replace(path,old,new,label):
              content=path.read_text(encoding='utf-8'); count=content.count(old)
              if count!=1: raise SystemExit(f'V9 [{label}] FILE={path.name} ANCHOR={old[:70]!r} MATCHES={count}')
              path.write_text(content.replace(old,new,1),encoding='utf-8')

          new_class=p/'RunningballV25NewsroomActivity.java'
          if new_class.exists():raise SystemExit('V9 newsroom Activity already installed; expected clean V8 source')
          new_class.write_text(r'''package com.sentongoharuna.worldsituationroom;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Set;
          import java.util.TimeZone;

          /** V9 independent implementation using V8 received RSS/GDELT caches; never a verified incident feed. */
          public final class RunningballV25NewsroomActivity extends Activity {
            private static final int BG=0xFF07111B,CYAN=0xFF55D6EF,GREEN=0xFF5CFFC6,
                AMBER=0xFFFFBE66,INK=0xFFEAF5FE,MUTED=0xFFB6C4CD,RED=0xFFFF5C6E;
            private static final String[] NAMES={"THE INDEPENDENT","THE OBSERVER","SOFTPOWER NEWS","WATCHDOG UGANDA","MIDDLE EAST / GDELT","WORLD CONFLICT / GDELT"};
            private static final String[] LABELS={"ALL NEWS","UGANDA","MIDDLE EAST","WORLD CONFLICT","SOURCE HEALTH"};
            private final Handler ui=new Handler(Looper.getMainLooper());
            private final Runnable tick=new Runnable(){public void run(){if(!visible)return;render();RunningballV25NewsRepository.refresh(RunningballV25NewsroomActivity.this,false,RunningballV25NewsroomActivity.this::render);ui.postDelayed(this,60000L);}};
            private boolean visible=false;private int filter=0;private String query="";
            private TextView summary, updated;private LinearLayout headlines;private ScrollView scroller;
            private int dp(int v){return Math.round(v*getResources().getDisplayMetrics().density);}
            private GradientDrawable panel(int line){GradientDrawable d=new GradientDrawable(GradientDrawable.Orientation.TL_BR,new int[]{0xFF142B3C,BG});d.setStroke(dp(1),line);d.setCornerRadius(dp(12));return d;}
            private TextView label(String s,int size,int colour,boolean bold){TextView v=new TextView(this);v.setText(s);v.setTextSize(size);v.setTextColor(colour);if(bold)v.setTypeface(null,1);return v;}
            private TextView button(String s,Runnable action){TextView t=label(s,11,CYAN,true);t.setGravity(Gravity.CENTER);t.setPadding(dp(8),dp(12),dp(8),dp(12));t.setMinimumHeight(dp(48));t.setBackground(panel(0xFF3C687A));t.setContentDescription(s);t.setOnClickListener(v->action.run());return t;}
            private static long timestamp(String text){if(text==null||text.trim().isEmpty())return 0L;
              String[] formats={"yyyyMMdd'T'HHmmss'Z'","yyyyMMddHHmmss","EEE, dd MMM yyyy HH:mm:ss Z","EEE, dd MMM yyyy HH:mm:ss z","yyyy-MM-dd'T'HH:mm:ssX","yyyy-MM-dd'T'HH:mm:ss'Z'"};
              for(String pattern:formats){try{SimpleDateFormat f=new SimpleDateFormat(pattern,Locale.US);f.setLenient(false);f.setTimeZone(TimeZone.getTimeZone("UTC"));return f.parse(text.trim()).getTime();}catch(Exception ignored){}}
              return 0L;
            }
            private static final class Story {String title,url,publisher,published,desk,type;long stamp;
              Story(JSONObject x,String key){title=x.optString("title","").trim();url=x.optString("url","").trim();publisher=x.optString("publisher","Unknown publisher");published=x.optString("published","");type=x.optString("type","PUBLISHER HEADLINE");desk=key;stamp=timestamp(published);}
            }
            private boolean isVisibleDesk(int source){return filter==0||filter==1&&source<4||filter==2&&source==4||filter==3&&source==5;}
            private int newsCount(){int total=0;for(String key:RunningballV25NewsRepository.KEYS)total+=RunningballV25NewsRepository.articles(this,key).length();return total;}
            private void article(Story s){LinearLayout card=new LinearLayout(this);card.setOrientation(LinearLayout.VERTICAL);card.setPadding(dp(12),dp(11),dp(12),dp(12));card.setBackground(panel(0xFF345668));
              TextView meta=label(s.publisher+"  ·  "+(s.desk.startsWith("ug_")?"UGANDA":s.desk.equals("conflict_middle_east")?"MIDDLE EAST":"WORLD CONFLICT"),10,CYAN,true);card.addView(meta);
              TextView heading=label(s.title,14,INK,true);heading.setMaxLines(4);card.addView(heading);
              String when=s.published.isEmpty()?"PUBLISHED TIME NOT PROVIDED":"PUBLISHER DATE: "+s.published;
              String age=RunningballV25NewsRepository.age(RunningballV25NewsRepository.last(this,s.desk));
              card.addView(label(when+"  ·  LAST FETCH "+age+" AGO\n"+s.type+"  ·  TAP ORIGINAL REPORT",10,MUTED,false));
              card.setMinimumHeight(dp(70));card.setContentDescription("Open publisher article "+s.title);
              card.setOnClickListener(v->{try{if(RunningballV25NewsRepository.validArticle(s.url))startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse(s.url)));}
                catch(Exception e){summary.setText("BROWSER UNAVAILABLE: "+e.getClass().getSimpleName());}});
              LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,-2);lp.topMargin=dp(8);headlines.addView(card,lp);
            }
            private void notice(String title,String value,int tone){TextView t=label(title+"\n"+value,11,tone,false);t.setPadding(dp(10),dp(13),dp(9),dp(13));t.setBackground(panel(tone));
              LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,-2);lp.topMargin=dp(7);headlines.addView(t,lp);}
            private void renderHealth(){notice("SIX SOURCE FEEDS / REAL RECEIPT TIMES","Errors and cached stories are separate; a successfully fetched article is still only a publisher report.",CYAN);
              for(int i=0;i<RunningballV25NewsRepository.KEYS.length;i++){
                String key=RunningballV25NewsRepository.KEYS[i];long at=RunningballV25NewsRepository.last(this,key),attempt=RunningballV25NewsRepository.requested(this,key);
                String err=RunningballV25NewsRepository.error(this,key);boolean cached=at>0;boolean stale=cached&&System.currentTimeMillis()-at>30*60*1000L;
                String status=(!err.isEmpty()?(cached?"FETCH FAILED · OFFLINE CACHE":"FETCH FAILED"):(cached?(stale?"STALE CACHE":"RECENTLY FETCHED"):"NOT RECEIVED"));
                int colour=!err.isEmpty()?RED:stale?AMBER:cached?GREEN:AMBER;
                notice(NAMES[i]+" / "+status,
                  "LAST GOOD: "+RunningballV25NewsRepository.age(at)+"  ·  LAST REQUEST: "+RunningballV25NewsRepository.age(attempt)+
                  "\nARTICLES CACHED: "+RunningballV25NewsRepository.articles(this,key).length()+
                  (err.isEmpty()?"":"\nLAST ERROR: "+err)+"\nSOURCE: "+(i<4?RunningballV25NewsRepository.RSS_URLS[i]:"GDELT DOC 2.0"),colour);
              }
              notice("DATA INTEGRITY","No invented news counts, casualty figures, troop locations or validated combat incidents. RSS syndication and redistribution rights must be respected.",AMBER);
            }
            private void render(){if(headlines==null)return;
              int position=scroller==null?0:scroller.getScrollY();headlines.removeAllViews();int healthy=0,broken=0;
              for(String key:RunningballV25NewsRepository.KEYS){if(RunningballV25NewsRepository.last(this,key)>0)healthy++;if(!RunningballV25NewsRepository.error(this,key).isEmpty())broken++;}
              summary.setText("NEWSROOM · "+healthy+"/6 FEEDS HAVE A RECEIVED SNAPSHOT · "+broken+" LATEST FETCH ERRORS");
              updated.setText("SOURCE CACHES REFRESH WHILE VIEWING · 20 MIN TTL · 3 MIN MANUAL COOLDOWN");
              if(filter==4){renderHealth();return;}
