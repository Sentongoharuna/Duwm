            }
            @Override protected void onDraw(Canvas c){super.onDraw(c);float w=getWidth(),h=getHeight();
              paint.setColor(0xFF264858);paint.setStrokeWidth(1f);c.drawLine(0,h-4,w,h-4,paint);
