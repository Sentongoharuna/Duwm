          from pathlib import Path
          import sys,hashlib,xml.etree.ElementTree as ET
          root=Path(sys.argv[1])/'app/src/main';p=root/'java/com/sentongoharuna/worldsituationroom'
          expected={
            'DuwmLiveWallpaperService.java':'07f5bf384b0ff324335e3997cb46440309ccbe5188d8ebd326cc551e550f7fc3',
            'SatelliteMapView.java':'adf0d3e4b4f1df1a844b01554e6e9ea610dac48decd24f62d3e1daee18b23b7d'
          }
          for name,digest in expected.items():
            now=hashlib.sha256((p/name).read_bytes()).hexdigest()
            if now!=digest:raise SystemExit('V25 PROTECTED FILE MODIFIED '+name+' got '+now)
          for name in ('RunningballV25RegionQuery','RunningballV25RegionCache','RunningballV25Sources',
                       'RunningballV25ChangeLedger','RunningballV25Stage1Panel','RunningballV25Poller',
                       'RunningballV25CreditsActivity','RunningballV25SourceHealthActivity'):
            if not (p/(name+'.java')).is_file():raise SystemExit('V25 MISSING FILE '+name)
          for f in root.rglob('*.xml'):
            try:ET.parse(f)
            except Exception as exc:raise SystemExit('V25 XML ERROR '+str(f)+': '+str(exc))
          manifest=(root/'AndroidManifest.xml').read_text()
          for item in ('RunningballV25CreditsActivity','RunningballV25SourceHealthActivity'):
