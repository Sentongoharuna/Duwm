              RunningballV25Stage2History.update(this,index);RunningballV25ChangeLedger.update(this);
              boolean newReport=r.fetchedAt>0&&r.fetchedAt!=previousStamp&&previousStamp>0;
              if(newReport&&!"--".equals(previousValue)&&!"--".equals(r.value)&&!previousValue.equals(r.value)){
                delta.setText("REPORTED CHANGE: "+previousValue+" → "+r.value);delta.setAlpha(1f);delta.animate().alpha(.25f).setDuration(10000L).start();
                figure.setAlpha(.4f);figure.animate().alpha(1f).setDuration(450L).start();
              }
              if(r.fetchedAt>0){previousStamp=r.fetchedAt;previousValue=r.value;}
              figure.setText(r.value);int tint=r.status==RunningballV25Sources.Status.LIVE?GREEN:AMBER;
              age.setText(r.display());age.setTextColor(tint);
              scope.setText("PROVIDER: "+r.provider+"\nCOVERAGE: "+r.coverage+"\nLAST SUCCESS: "+(r.fetchedAt<=0?"NONE":new java.util.Date(r.fetchedAt).toString()));
              note.setText(r.errorReason.isEmpty()?"PROVIDER STATUS: "+r.status:"PROVIDER ERROR: "+r.errorReason);
              chart.setPoints(RunningballV25Stage2History.points(this,index));
              history.setText("VERIFIED SOURCE ACTIVITY\n"+RunningballV25ChangeLedger.summary(this));
            }
            private void request(){long now=System.currentTimeMillis();if(now-lastRequest<60000L){note.setText("REQUEST COOLDOWN / TRY AGAIN IN ONE MINUTE");return;}
              lastRequest=now;note.setText("REQUEST ISSUED / RESULTS NOT CONFIRMED");Context app=getApplicationContext();
              Runnable done=()->main.post(this::refreshView);
              try{RunningballV16SourceRefresh.request(app,false,done);}catch(RuntimeException e){note.setText("UPDATE REQUEST FAILED: "+e.getClass().getSimpleName());}
              try{RunningballV17Feeds.request(app,false,done);}catch(RuntimeException ignored){}
              try{RunningballV19SatelliteBootstrap.request(app,done);}catch(RuntimeException ignored){}
              try{RunningballV19Noaa.request(app,done);}catch(RuntimeException ignored){}
              if(RunningballWorldTarget.ready(app)){Intent i=new Intent(app,AirOperationsWidgets.Pulse.class);i.setAction("com.sentongoharuna.worldsituationroom.AIR_WIDGET_REFRESH");i.setPackage(app.getPackageName());app.sendBroadcast(i);}
            }
            private void openNativeDetail(){Class<?> target=RunningballV19SourceCenterActivity.class;Intent intent=null;
              switch(index){case 0:target=AirRadarActivity.class;break;case 1:target=GevSatelliteActivity.class;break;
                case 2:target=GevMarineActivity.class;break;case 3:case 4:target=RunningballGlobalEventsActivity.class;break;
                case 5:case 6:case 7:target=RunningballV17DetailsActivity.class;break;case 8:target=RunningballV19SourceCenterActivity.class;break;default:break;}
              intent=new Intent(this,target);
              if(index==5)intent.putExtra("feed",RunningballV17Feeds.NEWS);
              if(index==6)intent.putExtra("feed",RunningballV17Feeds.WEATHER);
              if(index==7)intent.putExtra("feed",RunningballV17Feeds.FX);
              startActivity(intent);
            }
            private void share(){RunningballV25Sources.Result r=RunningballV25Sources.read(this,index);
              String s="RUNNINGBALL2 V25 · STAGE 2\n"+RunningballV25Sources.NAMES[index]+": "+r.value+"\nSTATUS: "+r.display()+
                "\nPROVIDER: "+r.provider+"\nCOVERAGE: "+r.coverage+"\n"+(r.fetchedAt>0?"RECEIVED: "+new java.util.Date(r.fetchedAt):"NO VERIFIED REPORT")+"\nNO WORLDWIDE TOTAL IMPLIED";
              Intent send=new Intent(Intent.ACTION_SEND);send.setType("text/plain");send.putExtra(Intent.EXTRA_TEXT,s);startActivity(Intent.createChooser(send,"Share sourced observation"));
            }
            @Override protected void onResume(){super.onResume();visible=true;main.post(tick);}
            @Override protected void onPause(){visible=false;main.removeCallbacks(tick);delta.animate().cancel();figure.animate().cancel();super.onPause();}
