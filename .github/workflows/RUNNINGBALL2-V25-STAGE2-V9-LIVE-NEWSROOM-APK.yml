                  coverage="CELESTRAK STATIONS / ORBIT ESTIMATE · TWO-BODY KEPLER";break;}
                case 2:{SharedPreferences s=p(ctx,"rb11_marine");configured=!s.getString("endpoint","").trim().isEmpty();
                  coverage=configured?"USER-CONFIGURED AIS GATEWAY":"AIS SOURCE NOT CONNECTED";stamp=s.getLong("last_fetch",0);
                  value=figure(stamp,count(obj(s.getString("rows","{}")),"rows"));break;}
                case 3:case 4:{SharedPreferences s=p(ctx,"rb_global_public_events");String stem=index==3?"quakes":"nasa";
                  coverage=index==3?"WORLD / 24 HOURS / M2.5+":"WORLD / OPEN EVENTS / RESULT LIMIT 65";
                  stamp=s.getLong(stem+"_time",0);err=s.getString(stem+"_v16_error","");
                  value=figure(stamp,count(obj(s.getString(stem+"_raw","{}")),index==3?"features":"events"));break;}
                case 5:case 6:case 7:{SharedPreferences s=p(ctx,"rb17_verified_feeds");String stem=index==5?"news":index==6?"weather":"fx";
                  JSONObject o=obj(s.getString(stem+"_json","{}"));stamp=s.getLong(stem+"_received",0);err=s.getString(stem+"_error","");
                  if(index==5){value=figure(stamp,count(o,"articles"));coverage=o.optString("provider","PUBLISHER-LINKED RESULTS / NOT GLOBAL TOTAL");}
                  if(index==6){coverage=region?RunningballWorldTarget.label(ctx):"SELECT REGION";
                    configured=true;regionReady=region && RunningballV25RegionQuery.key(RunningballWorldTarget.lat(ctx),RunningballWorldTarget.lon(ctx)).equals(o.optString("region",""));
                    if(!regionReady){stamp=0;err="PREVIOUS REGION / WEATHER REQUERY REQUIRED";}
                    double v=o.optDouble("temperature",Double.NaN);if(stamp>0&&Double.isFinite(v))value=String.format(Locale.US,"%.1f °C",v);}
                  if(index==7){JSONObject rates=o.optJSONObject("rates");double v=rates==null?Double.NaN:rates.optDouble("EUR",Double.NaN);
                    if(stamp>0&&Double.isFinite(v))value=String.format(Locale.US,"%.4f USD/EUR",v);coverage="REFERENCE DATE "+o.optString("date","UNKNOWN");}
                  break;}
                case 8:{stamp=RunningballV19Noaa.received(ctx);err=RunningballV19Noaa.error(ctx);
                  double kp=RunningballV19Noaa.kp(ctx);if(stamp>0&&Double.isFinite(kp))value=String.format(Locale.US,"%.2f KP",kp);
                  coverage="NOAA PLANETARY K-INDEX / OBSERVATION";break;}
              }
              Status status=classify(stamp,FRESH[index],err,configured,regionReady);
              if(stamp==0)value="--";
              return new Result(key,PROVIDERS[index],ENDPOINTS[index],coverage,value,stamp,sourceTime,status,err);
            }
          }''')
          
          new(p/'RunningballV25ChangeLedger.java',r'''package com.sentongoharuna.worldsituationroom;
          import android.content.Context;
          import android.content.SharedPreferences;
          import org.json.JSONArray;
          import org.json.JSONObject;
          /** Verified receipt/figure changes only; never generates synthetic traffic or headlines. */
          public final class RunningballV25ChangeLedger {
            private static final String PREF="rb25_change_ledger";private RunningballV25ChangeLedger(){}
            public static synchronized String update(Context c){
              SharedPreferences store=c.getApplicationContext().getSharedPreferences(PREF,Context.MODE_PRIVATE);
              JSONArray history;try{history=new JSONArray(store.getString("events","[]"));}catch(Exception e){history=new JSONArray();}
              SharedPreferences.Editor e=store.edit();String last="";
              for(int i=0;i<RunningballV25Sources.IDS.length;i++){
                RunningballV25Sources.Result r=RunningballV25Sources.read(c,i);
                if(r.fetchedAt<=0||"--".equals(r.value))continue;
                String id="last_"+r.key;long previousStamp=store.getLong(id+"_when",0L);
                String previousValue=store.getString(id+"_value","");
                if(previousStamp==r.fetchedAt)continue;
                e.putLong(id+"_when",r.fetchedAt).putString(id+"_value",r.value);
                if(previousStamp<=0)continue; // first observation is a baseline, not 'new events'
                String type=previousValue.equals(r.value)?"SOURCE UPDATED":"REPORTED VALUE CHANGED";
                JSONObject event=new JSONObject();try{
                  event.put("received",r.fetchedAt);event.put("source",r.provider);event.put("type",type);
                  event.put("detail",RunningballV25Sources.NAMES[i]+": "+previousValue+" → "+r.value);
                  event.put("coverage",r.coverage);history.put(event);
                  last=type+" / "+RunningballV25Sources.NAMES[i];
                }catch(Exception ignored){}
              }
              JSONArray next=new JSONArray();for(int i=Math.max(0,history.length()-30);i<history.length();i++)next.put(history.opt(i));
              e.putString("events",next.toString());e.apply();return last;
            }
            public static String summary(Context c){
              JSONArray a;try{a=new JSONArray(c.getApplicationContext().getSharedPreferences(PREF,Context.MODE_PRIVATE).getString("events","[]"));}
              catch(Exception ignored){return "NO VERIFIED CHANGES RECORDED";}
              if(a.length()==0)return "NO VERIFIED CHANGES RECORDED";
              StringBuilder out=new StringBuilder();for(int i=a.length()-1;i>=Math.max(0,a.length()-5);i--){
                JSONObject item=a.optJSONObject(i);if(item==null)continue;
                out.append(item.optString("type")).append(" · ").append(item.optString("detail"));
                if(i>Math.max(0,a.length()-5))out.append("\n");
              }return out.toString();
            }
          }''')
          
