      - name: Decode exact Globe-only source
        run: |
          set -euo pipefail
          base64 --decode "$RUNNER_TEMP/du-globe-source.b64" > "$RUNNER_TEMP/du-globe-source.tar.gz"
          echo "0833899275ba04b30dcf06f429b59e4c3ece21bf29726d94326ee90ec7bd0a6f  $RUNNER_TEMP/du-globe-source.tar.gz" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/du-globe"
          tar -xzf "$RUNNER_TEMP/du-globe-source.tar.gz" -C "$RUNNER_TEMP/du-globe"
          echo "PROJECT_DIR=$RUNNER_TEMP/du-globe/world-situation-room-native-globe-only-1" >> "$GITHUB_ENV"
      - name: Verify Globe-only ownership
        run: |
          set -euo pipefail
          chmod +x "$PROJECT_DIR/scripts/verify-globe-only-rule.sh"
          "$PROJECT_DIR/scripts/verify-globe-only-rule.sh" "$PROJECT_DIR"
          if [ -s "$PROJECT_DIR/GLOBE_BASE_HASHES.sha256" ]; then
            cd "$PROJECT_DIR"; sha256sum -c GLOBE_BASE_HASHES.sha256
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          set -euo pipefail
          SDK="${{ANDROID_SDK_ROOT:-${{ANDROID_HOME:-/usr/local/lib/android/sdk}}}}";test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV";echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true
      - name: Compile Globe-only app
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac --stacktrace
      - name: Lint Globe-only app
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:lintDebug --stacktrace
      - name: Assemble Globe-only APK
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace
      - name: Stage exactly one APK
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk')
          test "${#APKS[@]}" -eq 1;test -s "${APKS[0]}"
          mkdir -p "$RUNNER_TEMP/release"
          cp "${APKS[0]}" "$RUNNER_TEMP/release/sentongoharuna.apk"
          sha256sum "$RUNNER_TEMP/release/sentongoharuna.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: sentongoharuna-APK
          path: ${{ runner.temp }}/release/sentongoharuna.apk
          if-no-files-found: error
          retention-days: 14
