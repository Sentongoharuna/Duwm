name: FIX14.30 30.30 UI FREEZE RESTORE
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  ui-freeze-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: echo "f5fff5230c0ea951fcb3d4b0dfd4919bfc38703987fb06d09c50e9118545c1c2  FIX14-30-30-30-UI-FREEZE-RESTORE-SOURCE.tar.gz" | sha256sum -c -
      - run: |
          mkdir -p "$RUNNER_TEMP/duwm"; tar -xzf FIX14-30-30-30-UI-FREEZE-RESTORE-SOURCE.tar.gz -C "$RUNNER_TEMP/duwm"
          P="$(find "$RUNNER_TEMP/duwm" -mindepth 1 -maxdepth 1 -type d | head -n1)"; echo "PROJECT_DIR=$P" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: Verify original UI freeze
        run: python3 "$PROJECT_DIR/fix14-tests/FIX14_30_30_UI_FREEZE_AUDIT.py" "$PROJECT_DIR"
      - name: Verify V2 compile repair
        run: python3 "$PROJECT_DIR/fix14-tests/FIX14_30_30_BUILD_REPAIR_V2_AUDIT.py" "$PROJECT_DIR"
      - name: FIX14 acceptance regression
        run: |
          mkdir -p "$RUNNER_TEMP/final"
          javac -d "$RUNNER_TEMP/final" "$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom/"{Fix14GlobalPortRelease,Fix14FinalAcceptance,PortTruthProvenanceAudit,PortLoadPerformanceHarness}.java "$PROJECT_DIR/fix14-tests/Fix14FinalAcceptanceSmoke.java"
          java -cp "$RUNNER_TEMP/final" Fix14FinalAcceptanceSmoke
      - name: SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"; echo "SDKMANAGER=$SM" >> "$GITHUB_ENV"
      - run: yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true; "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.13", cache-disabled: true}
      - name: Build UI-frozen FIX14 APK
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache clean :app:assembleDebug --stacktrace
      - name: Stage APK
        run: |
          mapfile -t APKS < <(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | sort)
          test "${#APKS[@]}" -eq 1; test -s "${APKS[0]}"
          mkdir -p "$RUNNER_TEMP/release"; cp "${APKS[0]}" "$RUNNER_TEMP/release/FIX14-30-30-30-UI-FREEZE-RESTORE.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: FIX14-30-30-30-UI-FREEZE-RESTORE-APK
          path: ${{ runner.temp }}/release/FIX14-30-30-30-UI-FREEZE-RESTORE.apk
          if-no-files-found: error
