    - name: V1159 PREPARE - real on-screen globe motion, observation board, native flight register
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/v1159-screen-test.sh\" <<'V1159_TEST_SCRIPT'\n#!/usr/bin/env\
        \ bash\nset -euo pipefail\nAPK=\"$RUNNER_TEMP/release/RUNNINGBALL2-159.4-2-DEVELOP-UGANDA.apk\"\n\
        test -s \"$APK\"\nadb install -r \"$APK\"\nPKG=\"com.sentongoharuna.worldsituationroom.rb2live25\"\n\
        adb shell am force-stop \"$PKG\" || true\nadb shell am start -n \"$PKG/com.sentongoharuna.worldsituationroom.OperationsMainActivity\"\
        \nsleep 6\nadb exec-out screencap -p > /tmp/V1159_GLOBE_FRAME_1.png\nsleep 3\nadb exec-out screencap\
        \ -p > /tmp/V1159_GLOBE_FRAME_2.png\nadb shell uiautomator dump /sdcard/v1159-ui.xml >/dev/null\nadb\
        \ shell cat /sdcard/v1159-ui.xml > /tmp/V1159_MAIN.xml\npython3 - <<'V1159_REAL_DEVICE'\nfrom pathlib\
        \ import Path\nfrom xml.etree import ElementTree as ET\nfrom PIL import Image,ImageChops,ImageStat\n\
        import subprocess, re,time\n\n# Android UIAutomator occasionally returns a null hierarchy during a\
        \ layout\n# transition. Retry genuine device dumps; never synthesize UI evidence.\ndef get_real_ui(name,\
        \ max_attempts=5):\n    remote='/sdcard/'+name\n    last=''\n    for attempt in range(max_attempts):\n\
        \        subprocess.run(['adb','shell','rm','-f',remote],capture_output=True,timeout=15)\n        got=subprocess.run(['adb','shell','uiautomator','dump',remote],capture_output=True,text=True,timeout=40)\n\
        \        read=subprocess.run(['adb','shell','cat',remote],capture_output=True,text=True,timeout=20)\n\
        \        if got.returncode==0 and read.returncode==0 and '<hierarchy' in read.stdout:\n           \
        \ try:\n                ET.fromstring(read.stdout)\n                return read.stdout\n          \
        \  except ET.ParseError as exc:\n                last=str(exc)\n        else:\n            last=(got.stdout+'\
        \ '+got.stderr+' '+read.stderr)[-260:]\n        time.sleep(1.5)\n    raise AssertionError('Android\
        \ emulator could not provide a real UI hierarchy for '+name+': '+last)\nxml=Path('/tmp/V1159_MAIN.xml').read_text()\n\
        root=ET.fromstring(xml)\ntexts=' '.join((n.get('text','')+' '+n.get('content-desc','')) for n in root.iter('node'))\n\
        for required in ('OBSERVED SIGNALS','AIRCRAFT','ROTATION','MODERN HD EARTH','FOCUS','ORIGINAL GLOBE','NEWS\
        \ PHOTO CARDS','NASA EARTH PHOTOS','SOURCE RECEIPTS'):\n    assert required in texts,'Missing actual\
        \ main-screen function: '+required\nx=Image.open('/tmp/V1159_GLOBE_FRAME_1.png').convert('RGB')\ny=Image.open('/tmp/V1159_GLOBE_FRAME_2.png').convert('RGB')\n\
        assert x.size==y.size\n# Restrict to the upper globe. Ignore clocks, scrolling logs, and status bars.\n\
        box=(int(x.width*.18),int(x.height*.25),int(x.width*.82),int(x.height*.66))\nscore=sum(ImageStat.Stat(ImageChops.difference(x.crop(box),y.crop(box))).mean)/3\n\
        print('EARTH FRAME DIFFERENCE',score,flush=True)\nassert score>0.20,'Original main Earth globe is static,\
        \ refusing release'\nfrom PIL import ImageStat\npixels=ImageChops.difference(x.crop(box),y.crop(box)).convert('L')\n\
        activity=sum(1 for level in pixels.getdata() if level>10)/float(pixels.width*pixels.height)\nprint('ORIGINAL\
        \ GLOBE MOVING PIXELS',round(activity,5),flush=True)\nassert activity>0.006,'Only status text moved;\
        \ protected original globe did not visibly rotate'\n# Exercise original renderer's own gesture, not\
        \ a new imitation pan handler.\nw,h=x.size\nsubprocess.run(['adb','shell','input','swipe',str(w//2-90),str(h//2),str(w//2+90),str(h//2+28),'420'],check=True,timeout=20)\n\
        time.sleep(1)\nsubprocess.run(['adb','exec-out','screencap','-p'],stdout=open('/tmp/V1159_ORIGINAL_GESTURE.png','wb'),check=True,timeout=20)\n\
        z=Image.open('/tmp/V1159_ORIGINAL_GESTURE.png').convert('RGB')\ngesture_score=sum(ImageStat.Stat(ImageChops.difference(y.crop(box),z.crop(box))).mean)/3\n\
        print('ORIGINAL GLOBE TOUCH REDRAW',gesture_score,flush=True)\nassert gesture_score>0.2,'Native globe\
        \ did not visibly respond to touch gesture'\n# Exercise visible FOCUS and RESTORE with Android screenshots,\
        \ rather than only checking Java strings.\nfocus=[n for n in root.iter('node') if 'Expand modern HD\
        \ Earth globe full-screen' in n.get('content-desc','')]\nassert len(focus)==1,'V1159 FOCUS action not\
        \ visible on real Android emulator'\nfm=re.fullmatch(r'\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]',focus[0].get('bounds',''))\n\
        assert fm,'FOCUS is not tappable'\nfa,fb,fc,fd=map(int,fm.groups())\nsubprocess.run(['adb','shell','input','tap',str((fa+fc)//2),str((fb+fd)//2)],check=True,timeout=20)\n\
        time.sleep(1.2)\nsubprocess.run(['adb','exec-out','screencap','-p'],stdout=open('/tmp/V1159_FOCUS_EXPANDED.png','wb'),check=True,timeout=20)\n\
        fx=get_real_ui('v1159-focus.xml')\nPath('/tmp/V1159_FOCUS.xml').write_text(fx,encoding='utf-8')\nassert\
        \ 'Restore source panels and tabs' in fx,'FOCUS did not switch layout'\nexpanded=Image.open('/tmp/V1159_FOCUS_EXPANDED.png').convert('RGB')\n\
        change=sum(ImageStat.Stat(ImageChops.difference(z,expanded)).mean)/3\nprint('VISIBLE FOCUS SCREEN CHANGE',round(change,2),flush=True)\n\
        assert change>1.0,'FOCUS produced no visible screen change'\nroot2=ET.fromstring(fx)\nrestore=[n for\
        \ n in root2.iter('node') if 'Restore source panels and tabs' in n.get('content-desc','')]\nassert\
        \ len(restore)==1,'RESTORE action missing'\nrm=re.fullmatch(r'\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\\
        ]',restore[0].get('bounds',''))\nassert rm,'RESTORE not tappable'\nra,rb,rc,rd=map(int,rm.groups())\n\
        subprocess.run(['adb','shell','input','tap',str((ra+rc)//2),str((rb+rd)//2)],check=True,timeout=20)\n\
        time.sleep(0.8)\n\n# The modern high-detail globe is the default. Original remains accessible only\
        \ for comparison.\nrestored_xml=get_real_ui('v11592-restored.xml')\nrestored_root=ET.fromstring(restored_xml)\n\
        original=[n for n in restored_root.iter('node') if n.get('text','').strip()=='ORIGINAL GLOBE']\nassert\
        \ len(original)>=1,'V1159.4 modern-default original-compare control not visible'\nmh=re.fullmatch(r'\\\
        [(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]',original[0].get('bounds',''))\nassert mh,'original renderer compare\
        \ has no tappable bounds'\nh1,h2,h3,h4=map(int,mh.groups())\nsubprocess.run(['adb','exec-out','screencap','-p'],stdout=open('/tmp/V11593_HD_EARTH.png','wb'),check=True,timeout=20)\n\
        subprocess.run(['adb','shell','input','tap',str((h1+h3)//2),str((h2+h4)//2)],check=True,timeout=20)\n\
        time.sleep(1.3)\nsubprocess.run(['adb','exec-out','screencap','-p'],stdout=open('/tmp/V11593_ORIGINAL_OPTION.png','wb'),check=True,timeout=20)\n\
        orig_img=Image.open('/tmp/V11593_ORIGINAL_OPTION.png').convert('RGB')\nhdimg=Image.open('/tmp/V11593_HD_EARTH.png').convert('RGB')\n\
        visual_delta=sum(ImageStat.Stat(ImageChops.difference(hdimg,orig_img)).mean)/3\nassert visual_delta>1.0,'Optional\
        \ original renderer did not produce a distinct on-screen view'\norig_xml=get_real_ui('v11592-original.xml')\n\
        assert 'Return to modern detailed Earth globe' in orig_xml,'Modern globe return action missing'\nsubprocess.run(['adb','shell','input','tap',str((h1+h3)//2),str((h2+h4)//2)],check=True,timeout=20)\n\
        time.sleep(1.0)\nmodern_xml=get_real_ui('v11592-modern.xml')\nassert 'MODERN HD EARTH' in modern_xml\
        \ and 'Open original globe for comparison' in modern_xml,'Modern globe did not restore'\nprint('PASS:\
        \ modern HD Earth is default, original remains optionally reachable, modern return works',flush=True)\n\
        \n# Navigate by an actual visible tappable control; a source string by itself is not proof.\ndef find_accessible(node):\n\
        \    desc=node.get('content-desc','')\n    return 'Open AIRCRAFT monitoring sources' in desc\nfound=[n\
        \ for n in root.iter('node') if find_accessible(n)]\nassert found,'Air operations tab missing from\
        \ actual device UI'\nm=re.fullmatch(r'\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]',found[0].get('bounds',''))\n\
        assert m,'Aircraft tab has no visible bounds'\na,b,c,d=map(int,m.groups());assert c>a and d>b\nsubprocess.run(['adb','shell','input','tap',str((a+c)//2),str((b+d)//2)],check=True,timeout=20)\n\
        time.sleep(2.0)\nstate=subprocess.run(['adb','shell','dumpsys','activity','activities'],capture_output=True,text=True,check=True,timeout=25).stdout\n\
        assert 'AircraftOperationsActivity' in state,'Tapping Aircraft did not open the native flight register'\n\
        subprocess.run(['adb','exec-out','screencap','-p'],stdout=open('/tmp/V1159_AIRCRAFT_REGISTER.png','wb'),check=True,timeout=20)\n\
        print('PASS V1159 actual rotating globe + visible source receipts + native aircraft navigation')\n\
        V1159_REAL_DEVICE\nV1159_TEST_SCRIPT\nbash -n \"$RUNNER_TEMP/v1159-screen-test.sh\"\npython3 -m pip\
        \ install --no-cache-dir 'Pillow==11.3.0'\n"
