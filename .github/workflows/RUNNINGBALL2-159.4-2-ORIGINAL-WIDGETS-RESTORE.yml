    - name: V1159 BASE RULES - make original globe sources visible and preserve signal continuity
      shell: bash
      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" <<'V1159_BASE_RULES_PATCH'\nfrom pathlib import Path\n\
        import hashlib,sys\nproject=Path(sys.argv[1]);folder=project/'app/src/main/java/com/sentongoharuna/worldsituationroom'\n\
        target=folder/'OperationsMainActivity.java'\nprotected=[folder/name for name in ('SatelliteMapView.java','DuwmLiveWallpaperService.java','MainActivity.java','MediaDeskActivity.java','AircraftOperationsActivity.java')]\n\
        baseline={str(f):hashlib.sha256(f.read_bytes()).hexdigest() for f in protected}\ns=target.read_text(encoding='utf-8')\n\
        def exactly_once(old,new,label):\n    global s\n    count=s.count(old)\n    assert count==1, f'{label}:\
        \ expected one original anchor, found {count}'\n    s=s.replace(old,new,1)\n# Show genuine per-source\
        \ status on the ORIGINAL renderer, not just on its hidden substitute.\nexactly_once('originalHud.setVisibility(View.GONE);',\n\
        \             'originalHud.setVisibility(View.VISIBLE);', 'original source HUD visibility')\nexactly_once('earthHud.addView(text(\"\
        LIVE EARTH / GLOBAL SIGNALS\",11,TEXT,true));',\n             'earthHud.addView(text(\"ORIGINAL GLOBE\
        \ / OBSERVED SIGNALS\",11,TEXT,true));', 'native HUD heading')\n# Give the protected globe more first-screen\
        \ room without discarding the source-backed telemetry panel.\nexactly_once('root.addView(telemetryPanel,new\
        \ LinearLayout.LayoutParams(-1,dp(178)));',\n             'root.addView(telemetryPanel,new LinearLayout.LayoutParams(-1,dp(166)));','native\
        \ globe space')\n# Keep observed aircraft stable by their received callsign/source between source refreshes.\n\
        # This changes rendering identity only; the actual coordinates and times remain source-derived.\nexactly_once('String\
        \ id=\"observed-\"+a.type+\"-\"+a.title+\"-\"+a.timeMillis;',\n             'String id=\"observed-\"\
        +a.type+\"-\"+a.title+\"-\"+(a.type==OperationsGlobeView.AIR?a.source:a.timeMillis);', 'source marker\
        \ continuity')\ntarget.write_text(s,encoding='utf-8')\nfor f in protected:\n    assert hashlib.sha256(f.read_bytes()).hexdigest()==baseline[str(f)],\
        \ 'original source changed '+f.name\nassert 'nativeGlobe.setGlobeMode(true);' in s and 'nativeGlobe.setSignals(toNativeSignals(earthObservations));'\
        \ in s\nassert 'originalHud.setVisibility(View.VISIBLE);' in s\nassert 'ORIGINAL GLOBE / OBSERVED SIGNALS'\
        \ in s\nprint('PASS BASE RULE 1: exact original native globe + truthful observed-source status in first\
        \ viewport')\nprint('PASS BASE RULE 2: actual extra screen room and stable received aircraft markers;\
        \ NO version bump')\nV1159_BASE_RULES_PATCH\n"
