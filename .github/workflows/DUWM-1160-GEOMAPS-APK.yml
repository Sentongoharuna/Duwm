    - name: Compile complete Android APK
      shell: bash
      run: 'set -euo pipefail

        cd "$PROJECT_DIR"

        gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac :app:assembleDebug --stacktrace

        mkdir -p "$RUNNER_TEMP/release"

        cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/release/DEVELOP-UGANDA-1160.apk"

        '
    - name: Verify signed APK actual compiled DEX and correct version
      shell: bash
      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" \"$RUNNER_TEMP/release/DEVELOP-UGANDA-1160.apk\" <<'PY_DUWM_VERIFY'\n\
        from pathlib import Path\nimport subprocess,sys,zipfile\nproject,apk=map(Path,sys.argv[1:]);assert apk.is_file() and\
        \ apk.stat().st_size>150000\nwith zipfile.ZipFile(apk) as z:\n assert z.testzip() is None\n files=z.namelist();assert\
        \ 'classes.dex' in files and 'AndroidManifest.xml' in files\n dex=b''.join(z.read(n) for n in files if n.endswith('.dex'))\n\
        \ for item in (b'PulseDataActivity',b'V115941ShareCards',b'OperationsGlobeView',b'DuWidgetProviders',b'BBC News RSS',b'SOURCE\
        \ COUNT',b'WORLD GEOGRAPHIC DISPLAY',b'EARTHQUAKE'):\n  assert item in dex,('New visualization/data sharing or original\
        \ feature missing from compiled APK',item)\nsdk=Path(__import__('os').environ['ANDROID_HOME']);tools=sdk/'build-tools/36.0.0'\n\
        subprocess.run([str(tools/'apksigner'),'verify',str(apk)],check=True)\nbadge=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(apk)],text=True)\n\
        assert \"versionCode='116000'\" in badge and \"1160\" in badge,badge[:300]\nassert \"name='com.sentongoharuna.worldsituationroom.rb2live25'\"\
        \ in badge\nprint('PASS real signed Android APK with radar, data cards, source truth and unchanged application identity')\n\
        PY_DUWM_VERIFY\npython3 - \"$RUNNER_TEMP/release/DEVELOP-UGANDA-1160.apk\" <<'PY_DUWM_SIGNAL_APK'\nimport sys,zipfile\n\
        with zipfile.ZipFile(sys.argv[1]) as z:\n    assert z.testzip() is None\n    dex=b''.join(z.read(n) for n in z.namelist()\
        \ if n.endswith('.dex'))\n    for symbol in (b'DuwmSignalRail',b'DuwmSignalProvider',b'DuwmSignalMonitor',b'DUWM 1160',\n\
        \                   b'V115941ShareCards',b'PulseDataActivity',b'publishVerifiedReceipt',\n                   b'SIGNAL\
        \ LIGHTS',b'NO RECENT VERIFIED SOURCE RECEIPT'):\n        assert symbol in dex,('Signal system not compiled in APK',symbol)\n\
        print('PASS: compiled APK includes all-screen source-driven signal rail, shareable LEDs, and original renderer')\n\
        PY_DUWM_SIGNAL_APK\n\npython3 - \"$RUNNER_TEMP/release/DEVELOP-UGANDA-1160.apk\" <<'DUWM_1160_MAP_APK_GATE'\nimport\
        \ sys,zipfile\nwith zipfile.ZipFile(sys.argv[1]) as apk:\n    assert apk.testzip() is None, 'APK checksum mismatch'\n\
        \    dex=b''.join(apk.read(p) for p in apk.namelist() if p.endswith('.dex'))\n    for symbol in (b'DuwmGeoLensActivity',b'EXPLORE\
        \ TRUE LOCAL GEOGRAPHY',\n                   b'overpass-api.de',b'NO MEASURED ROUTE HISTORY',\n                  \
        \ b'naturalearth_coasts.txt',b'DuwmSignalRail',b'V115941ShareCards'):\n        assert symbol in dex, ('Missing compiled\
        \ map/rail feature',symbol)\nprint('PASS 1160 compiled geographic detail, source-position traces, compact signal system')\n\
        DUWM_1160_MAP_APK_GATE\n"
    - name: Upload installable DUWM 1160 APK before emulator tests
      uses: actions/upload-artifact@v4
      with:
        name: DEVELOP-UGANDA-1160-APK
        path: ${{ runner.temp }}/release/DEVELOP-UGANDA-1160.apk
        retention-days: 30
        if-no-files-found: error
    - name: Enable emulator KVM acceleration
      shell: bash
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm || true'
    - name: Prepare Bash emulator test to avoid sh pipefail regression
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/duwm-1160-emulator-test.sh\" <<'DUWM_1160_EMU_SH'\nset -euo pipefail\n\
        adb install -r \"$RUNNER_TEMP/release/DEVELOP-UGANDA-1160.apk\"\nadb shell am start -n com.sentongoharuna.worldsituationroom.rb2live25/com.sentongoharuna.worldsituationroom.PulseDataActivity\n\
        sleep 5\nadb shell dumpsys activity activities | grep -q 'PulseDataActivity'\nadb shell uiautomator dump /sdcard/duwm1160.xml\
        \ >/dev/null\nadb shell cat /sdcard/duwm1160.xml > \"$RUNNER_TEMP/duwm-116000-ui.xml\"\ngrep -q 'LIVE SIGNAL INTELLIGENCE'\
        \ \"$RUNNER_TEMP/duwm-116000-ui.xml\"\ngrep -q 'SHARE SELECTED INDIVIDUAL DATA POINT' \"$RUNNER_TEMP/duwm-116000-ui.xml\"\
        \nadb exec-out screencap -p > \"$RUNNER_TEMP/duwm-116000-visuals.png\"\ntest -s \"$RUNNER_TEMP/duwm-116000-visuals.png\"\
        \nif adb logcat -d -t 3000 | grep -E 'FATAL EXCEPTION.*|Process: com.sentongoharuna.worldsituationroom.rb2live25'\
        \ | tail -n 10; then true;fi\necho 'PASS Android emulator: new source-driven radar opens and individual share controls\
        \ visible'\n# The Activity lifecycle provider must add the source-truth LED rail on every Activity.\nadb shell uiautomator\
        \ dump /sdcard/duwm1160-led.xml >/dev/null\nadb shell cat /sdcard/duwm1160-led.xml > \"$RUNNER_TEMP/duwm-1160-led.xml\"\
        \ngrep -q 'SIGNAL LIGHTS' \"$RUNNER_TEMP/duwm-1160-led.xml\"\ngrep -q 'RED ALERT' \"$RUNNER_TEMP/duwm-1160-led.xml\"\
        \necho 'PASS emulator: eight-colour all-screen signal rail visible and accessible'\n\nadb shell dumpsys package com.sentongoharuna.worldsituationroom.rb2live25\
        \ | grep -q DuwmGeoLensActivity || {\n  echo 'Observed geographic detail activity not declared'; exit 1;\n}\necho\
        \ 'PASS emulator: observed-place activity installed, original widgets and signal UI retained'\nDUWM_1160_EMU_SH\n\
        bash -n \"$RUNNER_TEMP/duwm-1160-emulator-test.sh\"\n"
    - name: Android emulator verifies genuine visual screen and per-point share action
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        profile: pixel_6
        cores: 2
        ram-size: 2048M
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        script: bash "$RUNNER_TEMP/duwm-1160-emulator-test.sh"
    - name: Upload real Android screenshot and UI evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: DEVELOP-UGANDA-1160-ANDROID-EVIDENCE
        path: '${{ runner.temp }}/duwm-116000-visuals.png

          ${{ runner.temp }}/duwm-116000-ui.xml

          ${{ runner.temp }}/duwm-1160-led.xml'
        if-no-files-found: warn
        retention-days: 30
    name: Build and verify original-scope 1160 APK
run-name: DUWM 1160 | real city road maps, measured paths, compact LEDs
