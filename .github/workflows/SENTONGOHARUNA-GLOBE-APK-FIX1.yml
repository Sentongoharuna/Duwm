name: SENTONGOHARUNA GLOBE APK FIX1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/SENTONGOHARUNA-GLOBE-APK-FIX1.yml"
      - "SENTONGOHARUNA-GLOBE-SOURCE.tar.gz"

permissions:
  contents: read

jobs:
  build:
    name: Build Globe APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          test -s SENTONGOHARUNA-GLOBE-SOURCE.tar.gz
          echo "0833899275ba04b30dcf06f429b59e4c3ece21bf29726d94326ee90ec7bd0a6f  SENTONGOHARUNA-GLOBE-SOURCE.tar.gz" | sha256sum -c -

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/duwm"
          tar -xzf SENTONGOHARUNA-GLOBE-SOURCE.tar.gz -C "$RUNNER_TEMP/duwm"
          test -d "$RUNNER_TEMP/duwm/world-situation-room-native-globe-only-1"
          echo "PROJECT_DIR=$RUNNER_TEMP/duwm/world-situation-room-native-globe-only-1" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true

      - name: Verify Globe-only contract
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$PROJECT_DIR/scripts/verify-globe-only-rule.sh"
          "$PROJECT_DIR/scripts/verify-globe-only-rule.sh" "$PROJECT_DIR"

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac --stacktrace

      - name: Assemble APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk")
          test "${#APKS[@]}" -eq 1
          test -s "${APKS[0]}"
          mkdir -p "$RUNNER_TEMP/release"
          cp "${APKS[0]}" "$RUNNER_TEMP/release/SENTONGOHARUNA-GLOBE.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SENTONGOHARUNA-GLOBE-APK-FIX1
          path: ${{ runner.temp }}/release/SENTONGOHARUNA-GLOBE.apk
          if-no-files-found: error
          retention-days: 14
