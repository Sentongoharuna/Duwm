name: DUWM 1.2-20-1 LIVE OBJECT REFRESH APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/DUWM-1-2-20-1-LIVE-OBJECT-REFRESH-APK.yml"
      - "DUWM-1-2-20-1-LIVE-OBJECT-REFRESH-SOURCE.tar.gz"
permissions:
  contents: read
jobs:
  build:
    name: Build 1.2-20-1 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify source
        run: |
          set -euo pipefail
          test -s DUWM-1-2-20-1-LIVE-OBJECT-REFRESH-SOURCE.tar.gz
          echo "dfa94b249d49d3dc1e278d0fe1201b3cda9297500ffe823d6a369a6f0a8ac1d4  DUWM-1-2-20-1-LIVE-OBJECT-REFRESH-SOURCE.tar.gz" | sha256sum -c -
      - name: Extract
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/duwm"
          tar -xzf DUWM-1-2-20-1-LIVE-OBJECT-REFRESH-SOURCE.tar.gz -C "$RUNNER_TEMP/duwm"
          echo "PROJECT_DIR=$RUNNER_TEMP/duwm/world-situation-room-native-1-2-20-1" >> "$GITHUB_ENV"
      - name: Verify 1.2-20-1 contract
        run: |
          chmod +x "$PROJECT_DIR/scripts/verify-1-2-20-1-live-object-refresh.sh"
          "$PROJECT_DIR/scripts/verify-1-2-20-1-live-object-refresh.sh" "$PROJECT_DIR"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true
      - name: Compile
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac --stacktrace
      - name: Assemble
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace
      - name: Stage APK
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk")
          test "${#APKS[@]}" -eq 1
          test -s "${APKS[0]}"
          mkdir -p "$RUNNER_TEMP/release"
          cp "${APKS[0]}" "$RUNNER_TEMP/release/DUWM-1-2-20-1.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: DUWM-1-2-20-1-LIVE-OBJECT-REFRESH-APK
          path: ${{ runner.temp }}/release/DUWM-1-2-20-1.apk
          if-no-files-found: error
          retention-days: 14
