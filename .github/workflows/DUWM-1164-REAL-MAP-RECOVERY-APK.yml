                    String captured=lastModified>0?fmt.format(new Date(lastModified)):
                        "source capture time unknown";
                    playing.setText("CAMERA IMAGE RECEIVED / "+received+" / "+captured);
                  }});
                }
              }catch(Exception ex){String msg=shortText(ex.getMessage(),90);
                ui.post(()->{if(active&&seq==cameraSequence)playing.setText("CAMERA UNAVAILABLE / "+msg);});
              }finally{if(c!=null)c.disconnect();}
            });
          }
