      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        profile: pixel_6
        cores: 2
        ram-size: 2048M
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
        script: "set -euo pipefail\nadb wait-for-device\nfor i in 1 2 3 4 5; do\n  if adb shell getprop sys.boot_completed\
          \ | grep -q '^1'; then break; fi\n  sleep 4\ndone\nadb install -r \"$RUNNER_TEMP/duwm1164/DUWM-1164.apk\"\n\
          adb shell am start -n com.sentongoharuna.worldsituationroom.rb2live25/com.sentongoharuna.worldsituationroom.OperationsMainActivity\n\
          sleep 7\nadb exec-out screencap -p > \"$RUNNER_TEMP/duwm1164/actual-screen.png\"\ntest -s \"$RUNNER_TEMP/duwm1164/actual-screen.png\"\
          \nif adb logcat -d -t 4500 | grep -A8 'FATAL EXCEPTION' | grep -q 'com.sentongoharuna.worldsituationroom';\
          \ then\n  echo 'Android app crashed in emulator' >&2; exit 1\nfi\necho 'PASS: Android app opened in hosted\
