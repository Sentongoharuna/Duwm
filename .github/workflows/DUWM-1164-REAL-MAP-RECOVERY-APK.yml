    - name: Prepare emulator permissions for secondary UI smoke test
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm || true
    - name: 1164 OPTIONAL emulator smoke test (physical phone needed for map visuals)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        profile: pixel_6
        cores: 2
        ram-size: 2048M
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
        script: |
          set -euo pipefail
          adb wait-for-device
          for i in 1 2 3 4 5; do
            if adb shell getprop sys.boot_completed | grep -q '^1'; then break; fi
            sleep 4
          done
          adb install -r "$RUNNER_TEMP/duwm1164/DUWM-1164.apk"
          adb shell am start -n com.sentongoharuna.worldsituationroom.rb2live25/com.sentongoharuna.worldsituationroom.OperationsMainActivity
          sleep 7
          adb exec-out screencap -p > "$RUNNER_TEMP/duwm1164/actual-screen.png"
          test -s "$RUNNER_TEMP/duwm1164/actual-screen.png"
          if adb logcat -d -t 4500 | grep -A8 'FATAL EXCEPTION' | grep -q 'com.sentongoharuna.worldsituationroom'; then
            echo 'Android app crashed in emulator' >&2; exit 1
          fi
          echo 'PASS: Android app opened in hosted emulator and screen captured'
      continue-on-error: true
    - name: Upload 1163 runtime evidence if emulator available
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: DUWM-1164-ANDROID-EVIDENCE
        path: |
          ${{ runner.temp }}/duwm1164/actual-screen.png
          ${{ runner.temp }}/duwm1164/screen.xml
