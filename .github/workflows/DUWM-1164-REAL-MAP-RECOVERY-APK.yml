           if(ms===lastStyle&&applied)return;
           lastStyle=ms;applied=true;
           function paint(id,k,v){if(map.getLayer(id))map.setPaintProperty(id,k,v);}
           // All layers below are created only from actual OSM vector geometry.
           paint('duwm-road-halo','line-blur',3.5);
           paint('duwm-road-halo','line-width',['interpolate',['linear'],['zoom'],8,1.4,12,5,15,8]);
