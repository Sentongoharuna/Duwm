name: DUWM 1164 | Real Map Recovery + Verified Professional Visual Upgrade
run-name: DUWM 1164 | Real vector/2D maps + compact professional UI | same original globe
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/DUWM-1164-REAL-MAP-RECOVERY-APK.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - name: Checkout existing DUWM repository
      uses: actions/checkout@v4
    - name: Checkout protected original RUNNINGBALL2 engine
      uses: actions/checkout@v4
      with:
        repository: Sentongoharuna/Du-World-Situation-Room-
        ref: 7d952dd607cdeec94832896023c10203425a3b7f
        path: rb2-original-source
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Gradle 8.13
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'
        cache-disabled: true
    - name: Install PyYAML for deterministic baseline reconstruction
      run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
    - name: 1162 SOURCE INTEGRITY — verify original widgets, real map payloads and nested installer syntax
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY_1162_PREFLIGHT'\nfrom pathlib import Path\nimport ast,base64,gzip,hashlib,re,yaml\n\
        ref=Path('.github/workflows/DUWM1160-MAPS.yml')\nbase=Path('.github/workflows/RUNNINGBALL2-V1159.4-1-SHARE-CARDS.yml')\n\
        for f in (ref,base,Path('.github/workflows/RUNNINGBALL2_V109.yml'),Path('.github/workflows/V110_FIX2_DIRECT_PHONE_UPLOAD.yml')):\n\
        \    assert f.is_file(), ('Protected baseline file is missing',str(f))\nsteps=yaml.safe_load(ref.read_text(encoding='utf-8'))['jobs']['build']['steps']\n\
        basesteps=yaml.safe_load(base.read_text(encoding='utf-8'))['jobs']['build']['steps']\nassert len(steps)>=18 and\
        \ len(basesteps)>=64, 'Baseline scripts are unexpectedly incomplete'\nassert basesteps[6]['name'].startswith('Rebuild\
        \ full V109 native app')\nfor title in (\n    'Rebuild intact 1159.4/1 baseline without adding or replacing widgets',\n\
        \    'Install DUWM 1160 individual sharing and genuine moving data visualizations',\n    'DUWM 1160 install 8-color\
        \ incoming signal lights across every screen',\n    'DUWM 1160 MAPS: install illuminated OSM regional networks,\
        \ actual moving tracks, compact signal chip',\n):\n    matches=[s for s in steps if s.get('name')==title]\n \
        \   assert len(matches)==1,('Baseline step missing/duplicated',title)\n    script=matches[0].get('run','')\n\
        \    assert isinstance(script,str) and script.startswith('set -euo pipefail'),title\n    match=re.search(r\"\
        <<'([^']+)'\\n(.*?)\\n\\1(?:\\n|$)\",script,re.S)\n    assert match,('Malformed embedded Python heredoc',title)\n\
        \    tree=ast.parse(match.group(2),filename=title)\n    for node in tree.body:\n        if not isinstance(node,ast.Assign):continue\n\
        \        if not any(isinstance(x,ast.Name) and x.id in ('payloads','encoded') for x in node.targets):continue\n\
        \        obj=ast.literal_eval(node.value)\n        pairs=(list(obj.values()) if isinstance(obj,dict) else [])\n\
        \        for sha,payload in pairs:\n            real=gzip.decompress(base64.b64decode(payload,validate=True))\n\
        \            assert hashlib.sha256(real).hexdigest()==sha,('Corrupt original compressed source payload',title)\n\
        \        if isinstance(obj,str):\n            real=gzip.decompress(base64.b64decode(obj,validate=True))\n   \
        \         assert len(real)>10000,('Missing main source payload',title)\nprint('PASS: all inherited 1160 sources\
        \ and protected 1159 build stages are structurally valid and uncorrupted')\nPY_1162_PREFLIGHT"
    - name: Reconstruct protected RUNNINGBALL2 globe, source cards and exact 1160 working map engine
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY_REBUILD_1162'\nfrom pathlib import Path\nimport os, subprocess, tempfile,\
        \ yaml\nold = Path('.github/workflows/DUWM1160-MAPS.yml')\nassert old.is_file(), 'DUWM1160-MAPS.yml is missing:\
        \ do not rebuild from inferior baseline'\nactions = yaml.safe_load(old.read_text(encoding='utf-8'))['jobs']['build']['steps']\n\
        expected = [\n    'Rebuild intact 1159.4/1 baseline without adding or replacing widgets',\n    'Install DUWM\
        \ 1160 individual sharing and genuine moving data visualizations',\n    'DUWM 1160 install 8-color incoming signal\
        \ lights across every screen',\n    'DUWM 1160 MAPS: install illuminated OSM regional networks, actual moving\
        \ tracks, compact signal chip'\n]\nassert len(actions) >= 14\nfor title in expected:\n    assert sum(s.get('name')\
        \ == title for s in actions) == 1, ('Baseline drift', title)\nworkspace = Path(os.environ['GITHUB_WORKSPACE'])\n\
        env = os.environ.copy()\nenvfile = Path(env['GITHUB_ENV'])\nfor title in expected:\n    entry = next(s for s\
        \ in actions if s.get('name') == title)\n    script = entry.get('run')\n    assert isinstance(script, str) and\
        \ 100 < len(script) < 200000\n    assert (chr(36)+chr(123)+chr(123)) not in script, 'Untrusted nested workflow\
        \ expression'\n    with tempfile.NamedTemporaryFile(prefix='duwm1162-', suffix='.sh',\n                     \
        \                dir=env['RUNNER_TEMP'], mode='w', delete=False) as f:\n        f.write(script)\n        tmp\
        \ = Path(f.name)\n    print('REBUILD:', title, flush=True)\n    try:\n        result = subprocess.run(['bash',\
        \ '-eo', 'pipefail', str(tmp)],\n                                cwd=workspace, env=env, check=False)\n     \
        \   assert result.returncode == 0, ('Source generation failed', title, result.returncode)\n    finally:\n   \
        \     tmp.unlink(missing_ok=True)\n    if envfile.exists():\n        for line in envfile.read_text().splitlines():\n\
        \            if '=' in line:\n                key, val = line.split('=', 1)\n                if key.isidentifier():\
        \ env[key] = val\nproject = Path(env.get('PROJECT_DIR', ''))\nassert project.is_dir(), 'Full Android project\
        \ source was not generated'\npath = project / 'app/src/main/java/com/sentongoharuna/worldsituationroom'\nfor\
        \ name in ('OperationsGlobeView.java','DuwmLiveWallpaperService.java',\n             'DuWidgetProviders.java','V115941ShareCards.java',\n\
        \             'DuwmPlaceMapActivity.java','DuwmGeoObservationStore.java',\n             'DuwmSignalRail.java','PulseDataActivity.java'):\n\
        \    assert (path / name).is_file(), ('Missing feature', name)\nassert (project/'app/src/main/assets/duwm_place_map.html').is_file()\n\
        with envfile.open('a') as f:\n    f.write('PROJECT_DIR='+str(project.resolve())+'\\n')\nprint('PASS: full original\
        \ widgets and globe, share cards, signals and actual OSM map source')\nPY_REBUILD_1162\n"
    - name: 1162 | Install distinct real-data map lighting, route movement and reduced eight-LED panel
      shell: bash
      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" <<'PY_DUWM_1162_UPGRADE'\nfrom pathlib import Path\nimport\
        \ hashlib,re,sys\nroot=Path(sys.argv[1]);main=root/'app/src/main';pkg=main/'java/com/sentongoharuna/worldsituationroom'\n\
        htmlfile=main/'assets/duwm_place_map.html';railfile=pkg/'DuwmSignalRail.java';gradle=root/'app/build.gradle.kts';strings=main/'res/values/strings.xml'\n\
        for f in (htmlfile,railfile,gradle,strings):\n    assert f.is_file(), ('Required existing app source missing',f)\n\
        protected=['OperationsGlobeView.java','DuwmLiveWallpaperService.java','SatelliteMapView.java','DuWidgetProviders.java','DuWidgetUpdater.java','WidgetSnapshot.java','V115941ShareCards.java']\n\
        protected_hash={n:hashlib.sha256((pkg/n).read_bytes()).hexdigest() for n in protected if (pkg/n).is_file()}\n\
        assert len(protected_hash)>=5,'Protected globe, widgets, or share renderer is missing'\nhtml=htmlfile.read_text(encoding='utf-8')\n\
        for token in (\"https://tiles.openfreemap.org/styles/dark\",'duwm-road-halo','duwm-route-core','duwm-source-points','window.duwmReceive','function\
        \ animate(t)','const modes=','function updateLayerPalette()','function roadLayers()'):\n    assert token in html,('Existing\
        \ 1160 geographic engine missing',token)\nassert 'duwm1162' not in html,'1162 already installed, refuse double\
        \ patch'\nassert html.count('</head>')==1 and html.count('</body>')==1\n# Real OSM-derived district, road, water\
        \ & building details, with per-mode thematic styles.\nstyle='''\n<style id=\"duwm1162-professional-map\">\n:root\
        \ { color-scheme: dark; }\n#glow {background:radial-gradient(ellipse at 50% 56%,transparent 59%,rgba(0,5,13,.12)\
        \ 88%,rgba(0,6,13,.25) 100%)!important;\n box-shadow:inset 0 0 10px rgba(16,142,184,.10)!important}\n#top {font-weight:600;\
        \ letter-spacing:.08em; background:linear-gradient(#061320ed,#06132090,transparent)!important}\n#footer {font-size:8px!important;opacity:.92;max-height:59px;overflow:hidden}\n\
        #compass {right:11px!important;top:55px!important;width:36px!important;height:36px!important; background:#071b2de0;\n\
        \ border:1px solid #42758a88!important;box-shadow:0 0 10px #0fcbe422!important}\n.maplibregl-canvas {filter:contrast(1.13)\
        \ saturate(1.12)}\n.maplibregl-ctrl-group {background:#081d2ce8!important;border:1px solid #2e6c8277!important;border-radius:6px!important}\n\
        .maplibregl-popup-content {background:#091c2cf5!important;color:#e7f7ff!important;border:1px solid #3d9ab18c!important;border-radius:6px!important}\n\
        </style>'''\nhtml=html.replace('</head>',style+'\\n</head>',1)\n# No fabricated tracks or motion. Animate style\
        \ only on existing source-derived route geometry,\n# and brighten a node only if the original source point layer\
        \ reports it.\nupgrader='''\n// DUWM 1162: animation applies only to features from real provider receipts / vector\
        \ OSM tiles.\n// Road lighting is cartographic styling, not evidence of observed road traffic.\nfunction duwm1162Paint(t){\n\
        \ if(!map||!map.isStyleLoaded())return;\n const palette=modes[mode]||modes.CITY;\n const glow=.40+.10*Math.sin(t/870);\n\
        \ if(map.getLayer('duwm-road-core')){\n   map.setPaintProperty('duwm-road-core','line-color',palette.accent);\n\
        \   map.setPaintProperty('duwm-road-core','line-opacity',.82);\n }\n if(map.getLayer('duwm-road-minor')){\n \
        \  map.setPaintProperty('duwm-road-minor','line-color',palette.accent);\n   map.setPaintProperty('duwm-road-minor','line-opacity',mode==='CITY'?.32:.17);\n\
        \ }\n if(map.getLayer('duwm-water-sheen'))map.setPaintProperty('duwm-water-sheen','line-opacity',mode==='SEA'?.77:.35);\n\
        \ if(map.getLayer('duwm-road-halo'))map.setPaintProperty('duwm-road-halo','line-opacity',glow);\n if(map.getLayer('duwm-route-core')\
        \ && traces.some(p=>p&&p.to>p.from && ['AIRCRAFT','ISS'].includes(p.kind))){\n   // The feature geometry itself\
        \ originates from two observed source fixes, not invented paths.\n   const phase=(Math.sin(t/390)+1)/2;\n   map.setPaintProperty('duwm-route-core','line-opacity',.75+.23*phase);\n\
        \ }\n if(map.getLayer('duwm-signal-dot') && points.length){\n   map.setPaintProperty('duwm-signal-dot','circle-stroke-width',1.1+.65*((Math.sin(t/620)+1)/2));\n\
        \ }\n if(map.getLayer('duwm-real-buildings')){\n   map.setPaintProperty('duwm-real-buildings','fill-extrusion-opacity',mode==='CITY'?.67:.39);\n\
        \ }\n}\n'''\nneedle='function animate(t){if(!screenEnabled)return;'\nassert html.count(needle)==1,'Cannot safely\
        \ insert validated original animation upgrade'\nhtml=html.replace(needle,upgrader+'\\nfunction animate(t){if(!screenEnabled)return;\\\
        n try{duwm1162Paint(t);}catch(error){console.warn(\"1162 map styling unavailable\",error);}',1)\nassert 'duwm1162Paint(t)'\
        \ in html and html.count('function animate(t)')==1\nhtmlfile.write_text(html,encoding='utf-8')\n\n# Rework real\
        \ source-receipt rail: 124x30dp with LED spacing corrected (not squeezed/clipped).\nrail=railfile.read_text(encoding='utf-8')\n\
        for token in ('156f*rail.density','36f*rail.density','Gravity.END | Gravity.BOTTOM','float left=dp(48)','\"SIGNALS\"\
        ','dp(6.2f)','dp(3.35f)'):\n    assert token in rail,('Original LED layout changed',token)\nrail=rail.replace('156f*rail.density','124f*rail.density',1).replace('36f*rail.density','30f*rail.density',1)\n\
        rail=rail.replace('lp.rightMargin = (int)(12f*rail.density+.5f);','lp.rightMargin = (int)(10f*rail.density+.5f);',1)\n\
        rail=rail.replace('lp.bottomMargin = (int)(18f*rail.density+.5f);','lp.bottomMargin = (int)(76f*rail.density+.5f);',1)\n\
        rail=rail.replace('float left=dp(48)','float left=dp(30)',1)\nrail=rail.replace('c.drawText(\"SIGNALS\"','c.drawText(\"\
        SIG\"',1)\nrail=rail.replace('dp(6.2f)','dp(4.65f)',1).replace('dp(3.35f)','dp(2.55f)',1)\nassert '124f*rail.density'\
        \ in rail and '76f*rail.density' in rail and 'float left=dp(30)' in rail\n# 8 lights each > 10dp apart, glow\
        \ diameter < 9.3dp, so all fit even at low-density screen.\nassert (124-30-6)/8 > 2*4.65\nrailfile.write_text(rail,encoding='utf-8')\n\
        g=gradle.read_text(encoding='utf-8')\nassert g.count('versionCode = 116000')==1 and g.count('versionName = \"\
        1160\"')==1,'1160 APK version source has drifted'\ng=g.replace('versionCode = 116000','versionCode = 116200',1).replace('versionName\
        \ = \"1160\"','versionName = \"1162\"',1)\nassert 'applicationId = \"com.sentongoharuna.worldsituationroom.rb2live25\"\
        ' in g,'Protected Android package changed'\ngradle.write_text(g,encoding='utf-8')\ns=strings.read_text(encoding='utf-8')\n\
        assert 'DEVELOP.UGANDA 1160' in s,'App version label source changed'\nstrings.write_text(s.replace('DEVELOP.UGANDA\
        \ 1160','DEVELOP.UGANDA 1162',1),encoding='utf-8')\n# Keep the browser's diagnostic source version in sync with\
        \ this compiled APK.\nactivity=pkg/'DuwmPlaceMapActivity.java'\njava=activity.read_text(encoding='utf-8')\nassert\
        \ java.count('DEVELOP.UGANDA/1160')==2, '1160 source user agents not found'\nactivity.write_text(java.replace('DEVELOP.UGANDA/1160','DEVELOP.UGANDA/1162'),encoding='utf-8')\n\
        # Keep persisted signal preferences untouched, only update its accessible presentation label.\nassert 'duwm1162'\
        \ in html and 'traces.some' in html\nfor n,digest in protected_hash.items():\n    assert hashlib.sha256((pkg/n).read_bytes()).hexdigest()==digest,('1162\
        \ modified a protected original feature',n)\nprint('PASS: 1162 professional source geometry, original globe/widgets/share\
        \ cards untouched, compact honest signals')\nPY_DUWM_1162_UPGRADE\n"
    - name: 1162 SOURCE GATE — execute actual map JavaScript syntax check and Android manifest validation
      shell: bash
      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" <<'PY_1162_SOURCE_GATE'\nfrom pathlib import Path\nimport ast,re,sys,hashlib,subprocess,tempfile,xml.etree.ElementTree\
        \ as ET\nroot=Path(sys.argv[1]);src=root/'app/src/main';pkg=src/'java/com/sentongoharuna/worldsituationroom'\n\
        html=src/'assets/duwm_place_map.html'\nassert html.is_file()\ns=html.read_text(encoding='utf-8')\nfor key in\
        \ ('https://tiles.openfreemap.org/styles/dark','window.duwmReceive','duwm1162Paint(t)',\n            'duwm-source-tracks','duwm-route-core','duwm-road-halo'):\n\
        \    assert key in s,('Verified data map feature missing',key)\nscripts=re.findall(r'<script(?:\\s[^>]*)?>([\\\
        s\\S]*?)</script>',s,re.I)\nscripts=[item for item in scripts if item.strip()]\nassert len(scripts)==1,'Unexpected\
        \ HTML map script structure'\nwith tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:\n    f.write(scripts[0]);path=Path(f.name)\n\
        try:subprocess.run(['node','--check',str(path)],check=True)\nfinally:path.unlink(missing_ok=True)\nmanifest=src/'AndroidManifest.xml'\n\
        ET.parse(manifest)\nassert 'DuwmPlaceMapActivity' in manifest.read_text(), 'Place-map Activity missing from AndroidManifest'\n\
        java=(pkg/'DuwmPlaceMapActivity.java').read_text()\nassert 'DEVELOP.UGANDA/1162' in java,'Outdated map browser\
        \ version'\nassert (pkg/'DuwmSignalRail.java').is_file()\nassert (pkg/'V115941ShareCards.java').is_file()\nassert\
        \ (pkg/'DuwmGeoObservationStore.java').is_file()\nassert 'versionCode = 116200' in (root/'app/build.gradle.kts').read_text()\n\
        print('PASS: 1162 map JavaScript, manifest, cards, versions and source-based route layers')\nPY_1162_SOURCE_GATE"
    - name: 1162 JAVA COMPILATION FIX — remove two invalid DuwmSignalMonitor lifecycle calls
      shell: bash
      run: 'set -euo pipefail

        python3 - "$PROJECT_DIR" <<''PY_1162_MISSING_MONITOR''

        from pathlib import Path

        import sys

        root=Path(sys.argv[1]);pkg=root/''app/src/main/java/com/sentongoharuna/worldsituationroom''

        rail_file=pkg/''DuwmSignalRail.java''

        assert rail_file.is_file(), ''Expected 1162 signal rail missing''

        src=rail_file.read_text(encoding=''utf-8'')

        resume=''@Override public void onActivityResumed(Activity a) { attach(a); DuwmSignalMonitor.resumed(a); }''

        pause=''@Override public void onActivityPaused(Activity a) { DuwmSignalMonitor.paused(a); }''

        assert src.count(resume)==1 and src.count(pause)==1, ''Missing-monitor API shape changed: refuse unsafe patch''

        assert not (pkg/''DuwmSignalMonitor.java'').exists(), ''Monitor now exists: avoid applying a stale fix''

        # Only the two unresolved extra lifecycle calls are removed. Existing attach,

        # incoming real-source receipt tracking, signal publisher, globe and widgets stay intact.

        src=src.replace(resume,''@Override public void onActivityResumed(Activity a) { attach(a); }'',1)

        src=src.replace(pause,''@Override public void onActivityPaused(Activity a) { }'',1)

        assert ''DuwmSignalMonitor'' not in src, ''Unresolved monitor reference remains''

        assert ''DuwmSignalRail'' in src and ''attach(a)'' in src

        rail_file.write_text(src,encoding=''utf-8'')

        print(''PASS: repaired two javac missing-symbol errors without altering existing signal rail or received data'')

        PY_1162_MISSING_MONITOR

        '
    - name: 1162 PRIORITY 1 + 2 | Install worldwide source-intelligence dashboard and real-coordinate map bridge
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY_DUWM_INTEL_SOURCE'\nfrom pathlib import Path\nimport base64,gzip,hashlib\n\
        encoded=''\n\
        expected='b345165c5bf08e27c4da9b8c502f081784942f6f5914fb8e23055c02760d92fd'\nraw=gzip.decompress(base64.b64decode(encoded,validate=True))\n\
        assert hashlib.sha256(raw).hexdigest()==expected,'Bundled intelligence source corrupted'\nassert b'V115941ShareCards.share'\
        \ in raw and b'NO SYNTHETIC' not in raw or len(raw)>15000\nfile=Path('.github/workflows/duwm1162_intelligence_source.java')\n\
        file.write_bytes(raw)\nprint('PASS: '+str(len(raw))+' genuine 1162 source bytes delivered to build workspace')\n\
        PY_DUWM_INTEL_SOURCE\npython3 - \"$PROJECT_DIR\" <<'PY_DUWM_INTEL_INSTALL'\nfrom pathlib import Path\nimport\
        \ sys,hashlib,xml.etree.ElementTree as ET\n\nproject=Path(sys.argv[1]);main=project/'app/src/main';pkg=main/'java/com/sentongoharuna/worldsituationroom'\n\
        assert (pkg/'DuwmPlaceMapActivity.java').is_file(), 'Existing actual map Activity missing'\nassert (pkg/'DuwmGeoObservationStore.java').is_file(),\
        \ 'Source observation store absent'\nassert (pkg/'V115941ShareCards.java').is_file(), 'Original sharing implementation\
        \ absent'\nassert (pkg/'OperationsGlobeView.java').is_file(), 'Original globe absent'\nassert (main/'assets/duwm_place_map.html').is_file(),\
        \ 'Existing OSM/MapLibre vector map absent'\n# Original globe, wallpaper, widgets and branded share cards must\
        \ not be modified.\nprotected=['OperationsGlobeView.java','DuwmLiveWallpaperService.java','SatelliteMapView.java','DuWidgetProviders.java','DuWidgetUpdater.java','WidgetSnapshot.java','V115941ShareCards.java']\n\
        prior={n:hashlib.sha256((pkg/n).read_bytes()).hexdigest() for n in protected if (pkg/n).is_file()}\nassert len(prior)>=5,\
        \ 'Protected original feature set incomplete'\n\nactivity=pkg/'DuwmWorldIntelligenceActivity.java'\nassert not\
        \ activity.exists(), 'Intelligence dashboard class already present; do not overwrite'\n# Independent source for\
        \ review and unit tests, embedded in the workflow for phone-only upload.\nintelligence_source=Path('.github/workflows/duwm1162_intelligence_source.java')\n\
        # On GitHub Actions we embed a compressed verified copy instead; local file is test fallback.\nif not intelligence_source.exists():\n\
        \    raise SystemExit('Bundled dashboard Java source was not installed before executing patch')\nsource=intelligence_source.read_text(encoding='utf-8')\n\
        assert 'extends Activity' in source and 'loadAircraft()' in source and 'loadMarkets()' in source\nassert 'AIS\
        \ FEED NOT CONFIGURED' in source and 'CONFLICT REPORTS' in source\nassert source.count('class DuwmWorldIntelligenceActivity')==1\n\
        activity.write_text(source,encoding='utf-8')\n\ngeo=pkg/'DuwmPlaceMapActivity.java';s=geo.read_text(encoding='utf-8')\n\
        anchor='    cityStatus=label(\"KAMPALA   •   SOURCE MAP  /  NOT LIVE TRAFFIC\",10,MUTED);root.addView(cityStatus);'\n\
        assert s.count(anchor)==1,'Map screen insertion anchor moved'\nnew_button='''    TextView intel=label(\"WORLD\
        \ INTELLIGENCE  /  9 SOURCE CHANNELS\",11,CYAN);intel.setGravity(Gravity.CENTER);panel(intel);\n    LinearLayout.LayoutParams\
        \ intelParams=new LinearLayout.LayoutParams(-1,dp(39));intelParams.bottomMargin=dp(5);root.addView(intel,intelParams);\n\
        \    intel.setOnClickListener(v->startActivity(new Intent(this,DuwmWorldIntelligenceActivity.class)));\n'''\n\
        s=s.replace(anchor,new_button+anchor,1)\n\npoint_anchor='  private void sendPoints(){JSONArray array=new JSONArray(),lines=new\
        \ JSONArray();for(JSONObject p:reports.values())array.put(p);for(JSONObject t:traces)lines.put(t);'\nassert s.count(point_anchor)==1,'Map\
        \ source receipt serialization changed'\nbridge='''  /** Merge only fresh actual provider coordinates from the\
        \ worldwide dashboard. */\n  private java.util.List<DuwmGeoObservationStore.Fix> mergeWorldwidePositions(){\n\
        \    java.util.List<DuwmGeoObservationStore.Fix> actual=DuwmGeoObservationStore.read(this);\n    long now=System.currentTimeMillis();\n\
        \    for(DuwmGeoObservationStore.Fix f:actual){\n      if(f.sourceTime<=0||now-f.sourceTime>3600000L||now-f.receivedAt>3600000L)continue;\n\
        \      if(!f.type.equals(\"AIRCRAFT\")&&!f.type.equals(\"EARTHQUAKE\")&&!f.type.equals(\"ISS\"))continue;\n \
        \     if(!reports.containsKey(f.id))put(reports,f.id,f.type,f.title,f.detail,f.provider,f.url,f.sourceTime,f.lat,f.lon);\n\
        \    }\n    return actual;\n  }\n'''\nreplace='''  private void sendPoints(){java.util.List<DuwmGeoObservationStore.Fix>\
        \ worldwide=mergeWorldwidePositions();\n    JSONArray array=new JSONArray(),lines=new JSONArray();for(JSONObject\
        \ p:reports.values())array.put(p);for(JSONObject t:traces)lines.put(t);\n    long now=System.currentTimeMillis();for(DuwmGeoObservationStore.Fix\
