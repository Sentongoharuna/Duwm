name: DUWM 1693 | Real Native Pages Upgrade | Verified APK
run-name: DUWM 1693 | Native source controls and responsive evidence views derived from actual 1692 source
'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/DUWM-1693-REAL-NATIVE-PAGES-APK.yml
      - DUWM-1693-REAL-NATIVE-PAGES-SOURCE.zip
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: duwm-1693-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-1693-native:
    name: Compile modified Android activities, verify original globe and produce installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout exact source archive
        uses: actions/checkout@v4
      - name: Verify immutable 1693 source against release checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s DUWM-1693-REAL-NATIVE-PAGES-SOURCE.zip
          echo '4adade73a43e0df4e704626595a23a8cba5361fc3da4e25f1c4990ca7e25e317  DUWM-1693-REAL-NATIVE-PAGES-SOURCE.zip' | sha256sum -c -
          unzip -t DUWM-1693-REAL-NATIVE-PAGES-SOURCE.zip | tail -2
          mkdir -p "$RUNNER_TEMP/duwm1693src"
          unzip -q DUWM-1693-REAL-NATIVE-PAGES-SOURCE.zip -d "$RUNNER_TEMP/duwm1693src"
          PROJECT="$RUNNER_TEMP/duwm1693src/DUWM-1693-ANDROID-SOURCE"
          test -f "$PROJECT/verification/check_1693_lineage.py"
          test -f "$PROJECT/app/src/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK API 36 and Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          test -n "$SDK_MANAGER" && test -x "$SDK_MANAGER"
          if [ ! -f "$SDK_ROOT/platforms/android-36/android.jar" ] || [ ! -x "$SDK_ROOT/build-tools/36.0.0/apksigner" ]; then
            yes | timeout 120 "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            timeout 600 "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          fi
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt"
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Verify 1692 to 1693 lineage, six native desks, original globe and Java syntax
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python3 verification/check_source.py
          python3 verification/check_1674_fix1_compiler.py
          python3 verification/check_1679_geometry.py
          python3 verification/check_1693_lineage.py
          mkdir -p "$RUNNER_TEMP/duwm1693syntax"
          javac -d "$RUNNER_TEMP/duwm1693syntax" verification/JavaSyntaxCheck.java
          java -cp "$RUNNER_TEMP/duwm1693syntax" JavaSyntaxCheck
          mkdir -p "$RUNNER_TEMP/duwm1693geo"
          javac -d "$RUNNER_TEMP/duwm1693geo" \
            app/src/main/java/com/sentongoharuna/worldsituationroom/Duwm1676GeoMath.java \
            verification/Duwm1676GeoMathTest.java
          java -cp "$RUNNER_TEMP/duwm1693geo" com.sentongoharuna.worldsituationroom.Duwm1676GeoMathTest
      - name: Compile all actual Android activities into a debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac :app:assembleDebug --stacktrace
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$RUNNER_TEMP/duwm1693apk"
          cp "$APK" "$RUNNER_TEMP/duwm1693apk/DUWM-1693-REAL-NATIVE-PAGES.apk"
      - name: Validate APK contents, launcher label, version code, and cryptographic signature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_APK'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, os, subprocess
          apk=Path(os.environ['RUNNER_TEMP'])/'duwm1693apk/DUWM-1693-REAL-NATIVE-PAGES.apk'
          assert apk.is_file() and apk.stat().st_size>150000,'APK was not created'
          with ZipFile(apk) as z:
              assert z.testzip() is None
              names=z.namelist()
              for file in ('AndroidManifest.xml','classes.dex','assets/duwm_1683_real_fix_modes.json','assets/duwm_country_borders_wdbii.txt','assets/duwm_release_ui.json'):
                  assert file in names,('missing Android asset',file)
              dex=b''.join(z.read(n) for n in names if n.endswith('.dex'))
              for cls in (b'MainActivity',b'SatelliteMapView',b'GevMarineActivity',b'Duwm1670FlightMapActivity',b'Duwm1166NewsDeskActivity',b'Duwm1166RadioAtlasActivity',b'MediaDeskActivity',b'Duwm1671SourceStatusActivity',b'Duwm1687Console',b'Duwm1687MissionBoard',b'Duwm1687WorkspaceActivity',b'Duwm1687ShareCard',b'NewsStore',b'Duwm1166RadioAtlasActivity',b'Duwm1687MissionBoard',b'Duwm1690EvidenceBars',b'Duwm1691Chrome',b'Duwm1693Chrome',b'Duwm1687OpsVisual',b'Duwm1671SectorActivity'):
                  assert cls in dex,('native 1693 component missing from APK',cls)
          build=Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
          subprocess.run([str(build/'apksigner'),'verify',str(apk)],check=True)
          badge=subprocess.check_output([str(build/'aapt'),'dump','badging',str(apk)],text=True)
          for expected in ("versionCode='169300'","versionName='1693'","application-label:'DUWM 1693 • DEVELOP.UGANDA'","name='com.sentongoharuna.worldsituationroom.rb2live25'","launchable-activity: name='com.sentongoharuna.worldsituationroom.MainActivity'"):
              assert expected in badge,('stale/relabelled APK',expected,badge[:1200])
          (apk.parent/'SHA256SUMS.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  DUWM-1693-REAL-NATIVE-PAGES.apk\n')
          print('PASS: Android compilation, 1693 launcher identity, native classes and debug APK signature')
          PY_APK
      - name: Publish only verified APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-1693-REAL-NATIVE-PAGES-APK
          path: |
            ${{ runner.temp }}/duwm1693apk/DUWM-1693-REAL-NATIVE-PAGES.apk
            ${{ runner.temp }}/duwm1693apk/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
      - name: Explain compilation boundary
        if: always()
        shell: bash
        run: |
          {
            echo '### DUWM 1693 | Existing-native-page upgrade from exact 1691'
            echo 'The base is the exact 1692 source ZIP, not an older shell or copied APK.'
            echo 'Ten core native components changed against the pinned 1692 source. Existing native filters, map focus, source-state views, in-app playback controls, source charts and workspace receipt comparisons improved in place. Single original globe and media engines preserved.'
            echo 'Only an actual Android compile, APK signature, correct version/name and native dex class check can produce the APK artifact.'
            echo 'An Actions green check is NOT a physical phone UI/performance or live stream/provider verification.'
          } >> "$GITHUB_STEP_SUMMARY"
