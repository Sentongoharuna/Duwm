name: DUWM 1728.2/10 | Broadcast timing and output checks
run-name: DUWM 1728.2/10 | Compile and test source-aligned broadcast output
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/DUWM-1728.2-10-BROADCAST-TIMING-OUTPUT-CHECKS-APK.yml
    - DUWM-1728.2-10-BROADCAST-TIMING-OUTPUT-CHECKS-SOURCE.zip
permissions:
  contents: read
concurrency:
  group: duwm-1728-2-10-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Checkout existing original repository
      uses: actions/checkout@v4
    - name: Restore complete /10 source or checked repair from /8 or /9
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_RESTORE'
        import pathlib,os,hashlib,json,zipfile,tarfile,base64,io,shutil
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'duwm1728210'
        root.mkdir(parents=True,exist_ok=True)
        project=root/'DUWM-1728-2-10-ANDROID-SOURCE'
        if project.exists():shutil.rmtree(project)
        project.mkdir()
        full=pathlib.Path('DUWM-1728.2-10-BROADCAST-TIMING-OUTPUT-CHECKS-SOURCE.zip')
        expected_full='a9f98fc58040b8d8159b798aecdf9de7e60d5e5f39207ba3a2b30466059f3b0e'
        parents={'DUWM-1728.2-8-PRO-BROADCAST-SOURCE.zip': ['144baab2e1a066af19d548c8a7b8e610719a15e77441f57c5efe9cee9b8754fd'], 'DUWM-1728.2-9-BROADCAST-COMPILE-REPAIR-SOURCE.zip': ['23acb3d2f272013e27a1b198b612691a7bebb652f75e4b234f457c3bb3b4b2be', '4673e999a76b615d554e76721282d7b5b5a28a98fa896a2a7dff9444e63bf5e9']}
        def unzip_project(archive):
            with zipfile.ZipFile(archive) as z:
                assert z.testzip() is None,'Corrupt source ZIP'
                for n in z.namelist():
                    if n.endswith('/'):continue
                    parts=pathlib.PurePosixPath(n).parts
                    if len(parts)<2 or '..' in parts or pathlib.PurePosixPath(n).is_absolute():raise ValueError('Unsafe source member')
                    target=project.joinpath(*parts[1:]);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(z.read(n))
        if full.is_file():
            assert hashlib.sha256(full.read_bytes()).hexdigest()==expected_full,'Use the matching /10 source ZIP and YAML'
            unzip_project(full)
        else:
            baseline=None
            for name,allowed in parents.items():
                p=pathlib.Path(name)
                if p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest() in allowed:baseline=p;break
            if baseline is None:raise SystemExit('Upload the /10 source ZIP, or retain the exact /8 PRO-BROADCAST or /9 source ZIP')
            unzip_project(baseline)
            patch=base64.b64decode("".join(os.environ[k] for k in sorted(os.environ) if k.startswith("DUWM_PATCH_")))
            assert hashlib.sha256(patch).hexdigest()=='5e9e48af54b6cf5a87de9eee2e641615acb763e607244371c525204f9e16d8dd'
            with tarfile.open(fileobj=io.BytesIO(patch),mode='r:xz') as tf:
                for member in tf.getmembers():
                    n=pathlib.PurePosixPath(member.name)
                    if not member.isfile() or n.is_absolute() or '..' in n.parts:raise ValueError('Unsafe repair member')
                    target=project.joinpath(*n.parts);target.parent.mkdir(parents=True,exist_ok=True)
                    target.write_bytes(tf.extractfile(member).read())
        manifest=json.loads((project/'1728_2_10_SOURCE_SHA256.json').read_text())
        allowed=set(manifest)|{'1728_2_10_SOURCE_SHA256.json'}
        for p in list(project.rglob('*')):
            if p.is_file() and p.relative_to(project).as_posix() not in allowed:p.unlink()
        for n,digest in manifest.items():
            p=project/n
            assert p.resolve().is_relative_to(project.resolve()) and p.is_file(),n
            assert hashlib.sha256(p.read_bytes()).hexdigest()==digest,n
        with open(os.environ['GITHUB_ENV'],'a') as out:out.write('PROJECT='+str(project)+'\n')
        print('PASS exact /10 project restored:',len(manifest),'source-file hashes')
        PY_RESTORE
      env:
        DUWM_PATCH_000: 
        DUWM_PATCH_001: 
        DUWM_PATCH_002: 
        DUWM_PATCH_003: 
        DUWM_PATCH_004: 
        DUWM_PATCH_005: 
        DUWM_PATCH_006: 
        DUWM_PATCH_007: 
        DUWM_PATCH_008: 
        DUWM_PATCH_009: 
        DUWM_PATCH_010: 
        DUWM_PATCH_011: 
        DUWM_PATCH_012: 
        DUWM_PATCH_013: 
        DUWM_PATCH_014: 
        DUWM_PATCH_015: 
        DUWM_PATCH_016: 
        DUWM_PATCH_017: 
        DUWM_PATCH_018: 
        DUWM_PATCH_019: 
        DUWM_PATCH_020: 
        DUWM_PATCH_021: 
        DUWM_PATCH_022: 
    - name: Check every packaged source file
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_HASH'
        import pathlib,os,json,hashlib
        root=pathlib.Path(os.environ['PROJECT']).resolve()
        expected=json.loads((root/'1728_2_10_SOURCE_SHA256.json').read_text())
        for name,sha in expected.items():
            p=(root/name).resolve()
            assert p.is_relative_to(root) and p.is_file(),name
            assert hashlib.sha256(p.read_bytes()).hexdigest()==sha,name
        print('PASS',len(expected),'packaged source hashes')
        PY_HASH
    - name: Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Execute shared renderer, exact subtitle timing, privacy and service contract regressions
      shell: bash
      run: |
        set -euo pipefail
        cd "$PROJECT"
        python -m pip install -r ai-production-server/requirements-test.txt
        python verification/check_source.py
        python verification/check_1728_2_10.py
        python -m pytest -q ai-production-server/test_server.py
        mkdir -p "$RUNNER_TEMP/duwm-parser"
        javac -d "$RUNNER_TEMP/duwm-parser" verification/JavaSyntaxCheck.java
        java -cp "$RUNNER_TEMP/duwm-parser" JavaSyntaxCheck
        java -cp "$RUNNER_TEMP/duwm-parser" JavaSyntaxCheck app/src/androidTest/java
    - name: Publish scoped host-render evidence
      uses: actions/upload-artifact@v4
      with:
        name: DUWM-1728.2-10-HOST-RENDER-TESTS-NOT-PHONE
        path: ${{ env.PROJECT }}/verification/results/1728_2_10/
        if-no-files-found: error
        retention-days: 30
    - name: Ensure Android SDK and signing tools
      shell: bash
      run: |
        set -euo pipefail
        SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
        MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
        test -x "$MANAGER"
        if [ ! -s "$SDK/platforms/android-36/android.jar" ] || [ ! -x "$SDK/build-tools/36.0.0/apksigner" ]; then
          timeout 600 "$MANAGER" --sdk_root="$SDK" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
        fi
        test -s "$SDK/platforms/android-36/android.jar"
        test -x "$SDK/build-tools/36.0.0/aapt"
        echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
    - name: Optional retained debug signing key
      shell: bash
      env:
        SAVED_KEY: ${{ secrets.DUWM_DEBUG_KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        if [ -n "$SAVED_KEY" ]; then
          mkdir -p "$HOME/.android"
          printf '%s' "$SAVED_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
        else
          echo 'No retained debug keystore supplied. Existing installations may have a different signer; preserve private drafts.'
        fi
    - name: Gradle 8.13
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'
        cache-disabled: true
    - name: Android Java type-check (catches missing methods; not a syntax-only test)
      shell: bash
      run: |
        set -euo pipefail
        cd "$PROJECT"
        bash verification/ci_android_build.sh typecheck
    - name: Assemble real application and instrumentation APKs
      shell: bash
      run: |
        set -euo pipefail
        cd "$PROJECT"
        bash verification/ci_android_build.sh assemble
        mkdir -p "$RUNNER_TEMP/duwm-apk" "$RUNNER_TEMP/duwm-native-test"
        cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/duwm-apk/DUWM-1728.2-10-BROADCAST-TIMING-OUTPUT-CHECKS.apk"
        cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/duwm-native-test/DUWM-native-tests.apk"
        cp 1728_2_10_BUILD_NOTES.md 1728_2_10_ACCEPTANCE.json "$RUNNER_TEMP/duwm-apk/"
    - name: Verify actual APK identity, signature and compiled components
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PY_APK'
        import os,pathlib,zipfile,subprocess,hashlib
        out=pathlib.Path(os.environ['RUNNER_TEMP'])/'duwm-apk'
        apk=out/'DUWM-1728.2-10-BROADCAST-TIMING-OUTPUT-CHECKS.apk'
        assert apk.stat().st_size>150000
        with zipfile.ZipFile(apk) as z:
            assert z.testzip() is None
            dex=b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
            for token in (b'SatelliteMapView',b'Duwm1718MonitorsCamActivity',b'Duwm1728BroadcastLayout',b'Duwm1728BroadcastCanvas',b'Duwm1728EglVideoPipe',b'Duwm1728AiProductionClient',b'Duwm1728VideoEditorActivity',b'Duwm1728AiStartPolicy',b'maybeStartAiAfterCapture',b'beginAi',b'Duwm1728BroadcastTimeline',b'Duwm1728ExportPreflight',b'parseSrtCues'):
                assert token in dex,token
        tools=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
        subprocess.run([str(tools/'apksigner'),'verify','--verbose',str(apk)],check=True)
        text=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(apk)],text=True)
        for token in ("versionCode='172810'","versionName='1728.2.10'","name='com.sentongoharuna.worldsituationroom.rb2live25'","application-label:'DUWM 1728.2/10 • DEVELOP.UGANDA'"):
            assert token in text,token
        (out/'APK-IDENTITY.txt').write_text(text)
        (out/'SHA256SUMS.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  '+apk.name+'\n')
        print('Compiled development APK. AI inference, physical camera and native export are separate gates.')
        PY_APK
    - name: Publish compiled development APK for testing
      uses: actions/upload-artifact@v4
      with:
        name: DUWM-1728.2-10-COMPILED-DEVELOPMENT-APK
        path: ${{ runner.temp }}/duwm-apk/
        if-no-files-found: error
        retention-days: 30
    - name: Publish Android test APK
      uses: actions/upload-artifact@v4
      with:
        name: DUWM-1728.2-10-NATIVE-TEST-APK
        path: ${{ runner.temp }}/duwm-native-test/
        if-no-files-found: error
        retention-days: 30
    - name: Retain compiler logs and diagnostics even when a job fails
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: DUWM-1728.2-10-BUILD-DIAGNOSTICS
        path: |
          ${{ env.PROJECT }}/app/build/reports/
          ${{ env.PROJECT }}/build/reports/
          ${{ runner.temp }}/duwm1728210-logs/
        if-no-files-found: warn
        retention-days: 30
  native-broadcast-tests:
    needs: compile-development
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - name: Java 17 for Android emulator tooling
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Download compiled application
      uses: actions/download-artifact@v4
      with:
        name: DUWM-1728.2-10-COMPILED-DEVELOPMENT-APK
        path: apk
    - name: Download native test APK
      uses: actions/download-artifact@v4
      with:
        name: DUWM-1728.2-10-NATIVE-TEST-APK
        path: tests
    - name: Enable KVM
      shell: bash
      run: |
        set -euo pipefail
        test -e /dev/kvm
        sudo chmod 666 /dev/kvm
    - name: Prepare persistent native test and evidence script
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/duwm-native.sh" <<'NATIVE'
        #!/usr/bin/env bash
        set -euo pipefail
        PKG=com.sentongoharuna.worldsituationroom.rb2live25
        mkdir -p native-evidence
        collect() {
          adb logcat -d -s AndroidRuntime:E > native-evidence/ANDROID-RUNTIME.txt || true
          adb exec-out run-as "$PKG" tar -C files -cf - broadcast-native-proof > native-evidence/proof.tar || true
          if tar -tf native-evidence/proof.tar >/dev/null 2>&1; then
            tar -xf native-evidence/proof.tar -C native-evidence
          fi
        }
        trap collect EXIT
        adb install -r apk/DUWM-1728.2-10-BROADCAST-TIMING-OUTPUT-CHECKS.apk
        adb install -r tests/DUWM-native-tests.apk
        adb logcat -c
        adb shell am instrument -w -r "$PKG.test/com.sentongoharuna.worldsituationroom.DuwmSignalInstrumentation" | tee native-evidence/INSTRUMENTATION.txt
        grep -q 'DUWM_NATIVE_BROADCAST_PASS' native-evidence/INSTRUMENTATION.txt
        ! grep -q 'DUWM_NATIVE_BROADCAST_FAIL' native-evidence/INSTRUMENTATION.txt
        NATIVE
        chmod +x "$RUNNER_TEMP/duwm-native.sh"
        bash -n "$RUNNER_TEMP/duwm-native.sh"
    - name: Required Android Canvas and real EGL/MP4 export tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        profile: pixel_6
        emulator-boot-timeout: 900
        disable-animations: true
        script: bash "$RUNNER_TEMP/duwm-native.sh"
    - name: Publish actual native evidence, including failures
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: DUWM-1728.2-10-NATIVE-EXPORT-EVIDENCE
        path: native-evidence/
        if-no-files-found: warn
        retention-days: 30
    - name: Publish development APK with native test evidence only after success
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: DUWM-1728.2-10-NATIVE-TESTED-DEVELOPMENT-APK
        path: |-
          apk/
          native-evidence/
        if-no-files-found: error
        retention-days: 30
