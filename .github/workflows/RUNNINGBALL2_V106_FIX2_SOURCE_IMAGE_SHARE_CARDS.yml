    - name: ITEM 04 FIX1 INSTALL - JSON double boxing avoids unhandled checked JSONException
      shell: bash
      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" <<'RB25_ITEM04_INSTALL'\nfrom pathlib import Path\nimport sys,hashlib\nbase=Path(sys.argv[1])/'app/src/main/java/com/sentongoharuna/worldsituationroom'\nsource=base/'RunningballV25GlobalAircraftData.java'\nui=base/'RunningballV25WorldwideAirActivity.java'\noriginal=base/'DuwmLiveWallpaperService.java';globe=base/'SatelliteMapView.java'\nhashes={f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in (original,globe)}\ndef edit(file,old,new,label):\n    raw=file.read_text(encoding='utf-8')\n    n=raw.count(old)\n    if n!=1:raise SystemExit('ITEM04 INSTALL ERROR: '+label+' anchor='+repr(old[:110])+' file='+str(file)+' count='+str(n))\n    file.write_text(raw.replace(old,new,1),encoding='utf-8')\n\n# Store a second snapshot only after genuinely advancing source time. Bounded by the existing\n# 450,000-character compact map cache; no new network request and no privacy-sensitive storage.\nedit(source,'public final JSONArray points;','public final JSONArray points;\\n    public final JSONArray priorPoints;\\n    public final long priorSourceAt;','snapshot declaration')\nedit(source,'points=parsed;displayRows=parsed.length();', '''points=parsed;displayRows=parsed.length();\n      priorSourceAt=p.getLong(\"priorSourceAt\",0L);\n      JSONArray history;\n      try {String old=p.getString(\"priorPoints\",\"[]\");history=old.length()<=MAX_COMPACT_CHARS?new JSONArray(old):new JSONArray();}\n      catch(Exception invalid){history=new JSONArray();}\n      priorPoints=history;''','snapshot read')\nedit(source, '''      // A legitimate empty response is valid; show 0 only if the provider said 0.\n      pref(app).edit().putLong(\"receivedAt\",System.currentTimeMillis())''','''      // A legitimate empty response is valid; show 0 only if the provider said 0.\n      // Keep at most ONE preceding provider sample for same-aircraft two-fix comparison.\n      // Never synthesize a track from heading/speed or update a prior record when time is unchanged.\n      SharedPreferences oldCache=pref(app);\n      long olderSourceAt=oldCache.getLong(\"sourceAt\",0L);\n      long newSourceAt=sourceSeconds*1000L;\n      SharedPreferences.Editor twoFix=oldCache.edit();\n      if(newSourceAt>olderSourceAt && olderSourceAt>0L && newSourceAt-olderSourceAt<=5400000L){\n        String previous=oldCache.getString(\"points\",\"[]\");\n        if(previous.length()<=MAX_COMPACT_CHARS){twoFix.putLong(\"priorSourceAt\",olderSourceAt).putString(\"priorPoints\",previous);}\n        else{twoFix.remove(\"priorSourceAt\").remove(\"priorPoints\");}\n      } else if(newSourceAt>olderSourceAt){twoFix.remove(\"priorSourceAt\").remove(\"priorPoints\");}\n      twoFix.putLong(\"receivedAt\",System.currentTimeMillis())''','write previous source sample only on new report')\n\n# Display data-driven displacement segments, not invented intermediate flight positions.\nedit(ui,'private TextView status,detail;','private TextView status,detail,displacementInfo;','visible count field')\nedit(ui,'import java.util.Date;','import java.util.Date;\\nimport java.util.HashMap;','rendering import')\nedit(ui,'    detail=text(\"Tap a reported position for aircraft identification and last reported time.\",12,INK);col.addView(detail);',\n    '    displacementInfo=text(\"TWO-FIX DISPLACEMENTS: NONE UNTIL TWO DISTINCT PROVIDER REPORTS\",11,AMBER);col.addView(displacementInfo);\\n    detail=text(\"Tap a reported position for aircraft identification and last reported time.\",12,INK);col.addView(detail);','visible two-fix status')\nedit(ui,'private JSONArray points=new JSONArray();','private JSONArray points=new JSONArray();\\n    private JSONArray verifiedPairs=new JSONArray();','rendering cache')\nedit(ui,'    plot.update(s);','    plot.update(s);\\n    displacementInfo.setText(\"TWO-FIX DISPLACEMENTS: \"+plot.pairCount()+\" / STRAIGHT CONNECTORS, NOT RECORDED ROUTES\");','real count status')\nedit(ui,'''      points=snapshot.hasGood()&&snapshot.a