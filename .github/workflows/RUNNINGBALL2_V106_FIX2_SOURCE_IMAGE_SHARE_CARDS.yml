      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" <<'RB25_FIX5_VISIBLE_SOURCE_ROUTE'\nfrom pathlib import Path\nimport sys, xml.etree.ElementTree as ET, hashlib\nroot=Path(sys.argv[1])/'app/src/main'\nfolder=root/'java/com/sentongoharuna/worldsituationroom'\nscreen=folder/'RunningballV25SourceHealthActivity.java'\nlegacy=folder/'RunningballV15SourceHealthActivity.java'\nwallpaper=folder/'DuwmLiveWallpaperService.java'\nglobe=folder/'SatelliteMapView.java'\nassert screen.is_file() and legacy.is_file(), 'FIX5: original V15 or V25 source-health activity absent'\nold_wall=hashlib.sha256(wallpaper.read_bytes()).hexdigest()\nold_globe=hashlib.sha256(globe.read_bytes()).hexdigest()\ntext=screen.read_text(encoding='utf-8')\nanchors=[('import android.app.Activity;', 'import android.app.Activity;\\nimport android.content.Intent;', 'Activity import'),\n   ('content.addView(label(\"V25 / SOURCE HEALTH\",22,0xFFEAF5FE));',\n    '''content.addView(label(\"V25 / SOURCE HEALTH\",22,0xFFEAF5FE));\n      TextView legacyRoute=label(\"OPEN LEGACY AIR DIAGNOSTICS  ›\",13,0xFF55D6EF);\n      legacyRoute.setMinimumHeight(dp(48));\n      legacyRoute.setContentDescription(\"Open original V15 source diagnostics and aircraft refresh\");\n      legacyRoute.setOnClickListener(v->startActivity(new Intent(this,RunningballV15SourceHealthActivity.class)));\n      content.addView(legacyRoute);''', 'V25 header and V15 visible button')]\nfor old,new,label in anchors:\n  count=text.count(old)\n  if count!=1:raise SystemExit(f'FIX5 FAIL CLOSED: {screen.name} {label} anchor count {count} not 1')\n  text=text.replace(old,new,1)\nscreen.write_text(text,encoding='utf-8')\nmanifest=ET.parse(root/'AndroidManifest.xml')\nat='{http://schemas.android.com/apk/res/android}name'\nfor name in ('RunningballV15SourceHealthActivity','RunningballV25SourceHealthActivity'):\n  count=sum(e.get(at)=='.'+name for e in manifest.iter('activity'))\n  if count!=1:raise SystemExit(f'FIX5 FAIL CLOSED: AndroidManifest.xml {name} activity count {count}')\nassert 'REQUEST NEW AIRCRAFT REPORT' in legacy.read_text(), 'FIX5 original aircraft refresh removed'\nassert 'V25 / SOURCE HEALTH' in text and 'OPEN LEGACY AIR DIAGNOSTICS' in text\nassert hashlib.sha256(wallpaper.read_bytes()).hexdigest()==old_wall\nassert hashlib.sha256(globe.read_bytes()).hexdigest()==old_globe\nprint('FIX5: visible V25 health -> V15 diagnostics route added; both registered; original wallpaper and globe untouched')\nRB25_FIX5_VISIBLE_SOURCE_ROUTE\n"
