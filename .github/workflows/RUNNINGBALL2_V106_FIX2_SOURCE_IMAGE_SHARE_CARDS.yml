      shell: bash
      continue-on-error: true
      run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/evidence\"\npython3 - \"$RUNNER_TEMP/evidence/stage3v4-opensky.json\" <<'RB25_V4_OPENSKY'\nimport datetime,json,sys,urllib.request,urllib.error\nout={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),\n     'endpoint':'https://opensky-network.org/api/states/all','scope':'OpenSky receiver coverage, NOT all aircraft worldwide',\n     'http_status':None,'received_state_vectors':None,'provider_time_utc':None,'error':None,\n     'validation':'PROVIDER CHECK ONLY - NOT PHONE/EMULATOR VERIFICATION'}\ntry:\n  request=urllib.request.Request(out['endpoint'],headers={'User-Agent':'RUNNINGBALL2-SourceHealth/25','Accept':'application/json'})\n  with urllib.request.urlopen(request,timeout=15) as res:\n    out['http_status']=res.status\n    body=res.read(18*1024*1024+1)\n    if len(body)>18*1024*1024:raise ValueError('Response exceeds 18MiB')\n    obj=json.loads(body)\n    if not isinstance(obj.get('states'),list):raise ValueError('Missing states array')\n    out['received_state_vectors']=len(obj['states'])\n    out['provider_time_utc']=obj.get('time')\nexcept urllib.error.HTTPError as ex:\n  out['http_status']=ex.code;out['error']='HTTP '+str(ex.code)+'; source permission or quota may be required'\nexcept Exception as ex:out['error']=type(ex).__name__+': '+str(ex)[:180]\nwith open(sys.argv[1],'w') as fp:json.dump(out,fp,indent=2)\nprint(json.dumps(out,indent=2))\nRB25_V4_OPENSKY\n"
