4ObservedSeparation(){}\n  public static String describe(String beforeId,String afterId,double la1,double lo1,double la2,double lo2,\n                                long t1,long t2,long firstSourceMs,long lastSourceMs){\n    if(!RunningballV25AircraftTrailPolicy.qualifies(beforeId,afterId,la1,lo1,la2,lo2,t1,t2,firstSourceMs,lastSourceMs))\n      return \"NOT AVAILABLE / TWO VALID MOVED OBSERVATIONS REQUIRED\";\n    double latitude=Math.toRadians(la2-la1),longitude=Math.toRadians(lo2-lo1);\n    double h=Math.pow(Math.sin(latitude/2),2)+Math.cos(Math.toRadians(la1))*Math.cos(Math.toRadians(la2))*Math.pow(Math.sin(longitude/2),2);\n    double distance=6371.0088d*2d*Math.asin(Math.sqrt(Math.max(0d,Math.min(1d,h))));\n    if(!Double.isFinite(distance))return \"NOT AVAILABLE / INVALID PROVIDER POSITIONS\";\n    return String.format(Locale.US,\"%.2f km straight-line separation / %d seconds between reported fixes. NOT a traveled route or predicted path.\",distance,t2-t1);\n  }\n}\n''')\nfor name in ('SatelliteMapView.java','DuwmLiveWallpaperService.java'):\n  if not (p/name).is_file():raise SystemExit('V104 protected file missing: '+name)\nassert old.count('if(\"OPENSKY\".equalsIgnoreCase')==1 and 'AIRCRAFT OPERATIONS' in old\nassert air.read_text().count('V104 / TWO OBSERVED FIXES')==1\nprint('V104 ITEM05 installed source-truth two-observation detail for OpenSky only; no other files changed')\nV104_INSTALL\n"
