    - name: V25 STAGE 2 V8 CONTRACT - publisher integrity, regional conflict honesty, and access
      shell: bash
      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" <<'RB25_V8_CONTRACT'\nimport sys,xml.etree.ElementTree as ET,re,hashlib\nfrom pathlib import Path\np=Path(sys.argv[1])/'app/src/main';pkg=p/'java/com/sentongoharuna/worldsituationroom'\nrepo=(pkg/'RunningballV25NewsRepository.java').read_text()\nscreen=(pkg/'RunningballV25NewsMonitorActivity.java').read_text()\npanel=(pkg/'RunningballV25Stage2Panel.java').read_text()\nfor source in ('independent.co.ug/feed/','observer.ug/feed/','softpower.ug/feed/','watchdoguganda.com/feed',\n               'api.gdeltproject.org/api/v2/doc/doc','parseRss','parseGdelt','getConnectTimeout',\n               'setReadTimeout(12000)','MAX_BYTES=450000','newFixedThreadPool(2)','MIN_RETRY'):\n    if source=='getConnectTimeout':continue\n    assert source in repo,'V8 source invariant failed: '+source\nfor forbidden in ('Math.random','new Random(','google.com/search','news.google.com','HARD_CODED_CASUALTIES'):\n    assert forbidden not in repo and forbidden not in screen,forbidden\nfor value in ('UGANDA NEWS','MIDDLE EAST','WORLD CONFLICTS','ALL SOURCES','NOT CONFIGURED',\n              'The Independent','Daily Monitor','New Vision',\n              'Uganda Radio Network','NBS Television','YEMEN / RED SEA'):\n    assert value in screen,'V8 displayed provider or region missing: '+value\nassert 'UNVERIFIED INCIDENT' in repo\nassert screen.index('UGANDA NEWS')<screen.index('WORLD CONFLICTS')\nassert 'RunningballV25NewsMonitorActivity.class' in panel\nassert panel.index('UGANDA NEWS')<panel.index('new RunningballV25WorldBrief(c)')\nm=ET.parse(p/'AndroidManifest.xml').getroot();android='{http://schemas.android.com/apk/res/android}'\nnodes=[x for x in m.iter('activity') if x.get(android+'name')=='.RunningballV25NewsMonitorActivity']\nassert len(nodes)==1 and nodes[0].get(android+'exported')=='false'\nassert (pkg/'DuwmLiveWallpaperService.java').is_file()\nassert hashlib.sha256((pkg/'DuwmLiveWallpaperService.java').read_bytes()).hexdigest()=='07f5bf384b0ff324335e3997cb46440309ccbe5188d8ebd326cc551e550f7fc3'\nassert hashlib.sha256((pkg/'SatelliteMapView.java').read_bytes()).hexdigest()=='adf0d3e4b4f1df1a844b01554e6e9ea610dac48decd24f62d3e1daee18b23b7d'\nprint('PASS V8: four RSS collectors, 14 publisher links, GDELT conflict coverage, Stage2 real routes, protected globe')\nRB25_V8_CONTRACT\n"
