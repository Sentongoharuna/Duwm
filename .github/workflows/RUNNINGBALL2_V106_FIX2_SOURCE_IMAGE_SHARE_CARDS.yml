    - name: V106 FIX2 INSTALL - visible factual source share card on command center
      shell: bash
      run: |
        set -euo pipefail
        python3 - "$PROJECT_DIR" <<'V106_FIX2_ENTRY'
        from pathlib import Path
        import sys,hashlib
        p=Path(sys.argv[1])/'app/src/main/java/com/sentongoharuna/worldsituationroom'
        before={n:hashlib.sha256((p/n).read_bytes()).hexdigest() for n in ('SatelliteMapView.java','DuwmLiveWallpaperService.java')}
        f=p/'RunningballV25Stage2Panel.java';s=f.read_text()
        anchor='  private void board(int index){'
        if s.count(anchor)!=1:raise SystemExit('FIX2 launcher anchor missing: '+str(f))
        method="""  // V106 FIX2: an actual share action, based on the nine existing provider caches.
          private void shareV106SourceCard(){
            if(!(getContext() instanceof android.app.Activity))return;
            android.app.Activity activity=(android.app.Activity)getContext();
            int received=0;StringBuilder details=new StringBuilder();
            for(int k=0;k<9;k++){
              RunningballV25Sources.Result r=RunningballV25Sources.read(getContext(),k);
              if(r.fetchedAt>0L && !"--".equals(r.value))received++;
              if(k>0)details.append("; ");
              details.append(RunningballV25Sources.NAMES[k]).append(": ").append(r.display());
            }
            java.util.Map<String,String> facts=new java.util.LinkedHashMap<>();
            facts.put("CACHED_PROVIDER_COUNT",Integer.toString(received));
            facts.put("TOTAL_CHECKED", "9");
            ShareCardData data=new ShareCardData(
              "WORLD SOURCE AVAILABILITY", received+" of 9 source caches hold received data.",
              "LOCAL CACHE INSPECTION", "NOT A LIVE OBSERVATION", "SOURCE HEALTH", "WORLD",1,
              "RUNNINGBALL2 LOCAL SOURCE HEALTH", "",System.currentTimeMillis(),
              Double.NaN,Double.NaN,facts,0xFF55D6EF,
              "Card generated locally. Source report times are checked inside each provider; missing data is not zero.");
            ShareCardRenderer.share(activity,data);
          }
        """
        s=s.replace(anchor,method+anchor,1)
        anchor2='    TextView stage2=text("STAGE 2  ·  LIVE INTELLIGENCE BOARD INDEX  ↓",12,CYAN,true);'
        if s.count(anchor2)!=1:raise SystemExit('FIX2 visible stage-entry anchor missing: '+str(f))
        entry="""    TextView shareV106=text("SHARE V106 SOURCE CARD",12,GREEN,true);
            shareV106.setMinHeight(dp(48));shareV106.setPadding(dp(10),dp(14),dp(10),dp(14));
            shareV106.setBackground(panel(GREEN));shareV106.setContentDescription("Share verified source availability as V106 image PNG");
            shareV106.setOnClickListener(v->shareV106SourceCard());addView(shareV106);
        """
        s=s.replace(anchor2,entry+anchor2,1)
        f.write_text(s)
        visual=p/'RunningballV106ShareVisual.java';v=visual.read_text()
        old='text(c,p,"OBSERVED / REPORTED UTC",62,1116,19,CYAN,true);'
        new='text(c,p,"SOURCE HEALTH".equals(d.category)?"CARD GENERATED UTC":"OBSERVED / REPORTED UTC",62,1116,19,CYAN,true);'
        if v.count(old)!=1:raise SystemExit('FIX2 V106 attribution anchor changed: '+str(visual))
        visual.write_text(v.replace(old,new,1))
        for n,digest in before.items():
          assert hashlib.sha256((p/n).read_bytes()).hexdigest()==digest,'FIX2 protected renderer changed: '+n
        print('FIX2: actual share control added, no fabricated provider observations, source-media renderer retained')
        V106_FIX2_ENTRY

