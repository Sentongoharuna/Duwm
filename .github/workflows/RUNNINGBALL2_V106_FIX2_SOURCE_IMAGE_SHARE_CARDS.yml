    - name: Install V25 unique package and label without touching V24 source identity
      shell: bash
      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" <<'RB25_IDENTITY'\nfrom pathlib import Path\nimport sys,re\nroot=Path(sys.argv[1]); gradle=root/'app/build.gradle.kts';s=gradle.read_text()\nfor old,new in [\n  ('applicationId = \"com.sentongoharuna.worldsituationroom\"','applicationId = \"com.sentongoharuna.worldsituationroom.rb2live25\"'),\n  ('versionCode = 36','versionCode = 107'),\n  ('versionName = \"2026-local-news\"','versionName = \"RUNNINGBALL2-V106-FIX2-SOURCE-MEDIA-SHARE-CARDS\"')]:\n  if s.count(old)!=1:raise SystemExit('V25 IDENTITY ANCHOR FAILURE: '+gradle.name+' / '+old)\n  s=s.replace(old,new,1)\ngradle.write_text(s)\nf=root/'app/src/main/res/values/strings.xml';s=f.read_text()\ns,n=re.subn(r'(<string\\s+name=\"app_name\">).*?(</string>)',r'\\g<1>RUNNINGBALL2 V106 FIX2 SHARECARDS\\g<2>',s,count=1)\nif n!=1:raise SystemExit('V25 IDENTITY ANCHOR FAILURE: strings.xml app_name')\nf.write_text(s)\nRB25_IDENTITY\n"
    - name: V25 strict baseline retention, XML, Java and region test (two cities)
      shell: bash
      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" <<'RB25_SOURCE_GATE'\nfrom pathlib import Path\nimport sys,hashlib,xml.etree.ElementTree as ET\nroot=Path(sys.argv[1])/'app/src/main';p=root/'java/com/sentongoharuna/worldsituationroom'\nexpected={\n  'DuwmLiveWallpaperService.java':'07f5bf384b0ff324335e3997cb46440309ccbe5188d8ebd326cc551e550f7fc3',\n  'SatelliteMapView.java':'adf0d3e4b4f1df1a844b01554e6e9ea610dac48decd24f62d3e1daee18b23b7d'\n}\nfor name,digest in expected.items():\n  now=hashlib.sha256((p/name).read_bytes()).hexdigest()\n  if now!=digest:raise SystemExit('V25 PROTECTED FILE MODIFIED '+name+' got '+now)\nfor name in ('RunningballV25RegionQuery','RunningballV25RegionCache','RunningballV25Sources',\n             'RunningballV25ChangeLedger','RunningballV25Stage1Panel','RunningballV25Poller',\n             'RunningballV25CreditsActivity','RunningballV25SourceHealthActivity'):\n  if not (p/(name+'.java')).is_file():raise SystemExit('V25 MISSING FILE '+name)\nfor f in root.rglob('*.xml'):\n  try:ET.parse(f)\n  except Exception as exc:raise SystemExit('V25 XML ERROR '+str(f)+': '+str(exc))\nmanifest=(root/'AndroidManifest.xml').read_text()\nfor item in ('RunningballV25CreditsActivity','RunningballV25SourceHealthActivity'):\n  if item not in manifest:raise SystemExit('V25 MANIFEST MISSING '+item)\nwidgets=(p/'AirOperationsWidgets.java').read_text()\nfor item in ('rb_air_pulse_region','rb_air_command_region','RunningballWorldTarget.coverage'):\n  if item not in widgets:raise SystemExit('V25 WIDGET CONTRACT '+item)\nradar=(p/'AirRadarActivity.java').read_text()\nfor illegal in ('nautical miles around Kampala','KAMPALA AIRCRAFT SNAPSHOT','\"AVIATION\", \"KAMPALA\"'):\n  if illegal in radar:raise SystemExit('V25 FALSE GLOBAL SHARE '+illegal)\ntarget=(p/'RunningballWorldTarget.java').read_text()\nfor item in ('resetGlobal','RunningballV25RegionQuery.url','RunningballV25RegionCache.restore'):\n  if item not in target:raise SystemExit('V25 REGION MISSING '+item)\nnews=(p/'NewsPreferences.java').read_text()\nif '!s.id.startsWith(\"googlenews\")' not in news:raise SystemExit('V25 GOOGLE NEWS RSS NOT BLOCKED')\nprint('PASS V25: protected engine identical; manifest XML; dynamic widgets; worldwide share; cache/source contract')\nRB25_SOURCE_GATE\nTMPDIR=\"$(mktemp -d)\"\nPKG=\"$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom\"\njavac -d \"$TMPDIR\" \"$PKG/RunningballV25RegionQuery.java\"\ncat > \"$TMPDIR/RegionTest.java\" <<'JAVA'\nimport com.sentongoharuna.worldsituationroom.RunningballV25RegionQuery;\npublic final class RegionTest {\n  public static void main(String[] args) {\n    String ug=RunningballV25RegionQuery.url(.34760,32.58250);\n    String uk=RunningballV25RegionQuery.url(51.50740,-.12780);\n    if(ug.equals(uk)||!ug.contains(\"0.34760/32.58250/250\")||!uk.contains(\"51.50740/-0.12780/250\"))\n      throw new IllegalStateException(\"V25 two regions unexpectedly shared same URL\");\n    if(RunningballV25RegionQuery.coverage(\"LONDON\").contains(\"KAMPALA\"))\n      throw new IllegalStateException(\"V25 stale region label\");\n    System.out.println(\"PASS REAL TEST: Kampala and London request URLs & labels are different and explicitly 250 NM regional\");\n  }\n}\nJAVA\njavac -cp \"$TMPDIR\" -d \"$TMPDIR\" \"$TMPDIR/RegionTest.java\"\njava -cp \"$TMPDIR\" RegionTest\n"
    - name: V25 STAGE2 STRICT GATE - navigable boards, protected globe, no synthetic samples
      shell: bash
      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" <<'RB25_STAGE2_GUARD'\nfrom pathlib import Path\nimport sys,hashlib,xml.etree.ElementTree as ET\nroot=Path(sys.argv[1])/'app/src/main'\np=root/'java/com/sentongoharuna/worldsituationroom'\nexpected={'DuwmLiveWallpaperService.java':'07f5bf384b0ff324335e3997cb46440309ccbe5188d8ebd326cc551e550f7fc3',\n          'SatelliteMapView.java':'adf0d3e4b4f1df1a844b01554e6e9ea610dac48decd24f62d3e1daee18b23b7d'}\nfor name,hash in expected.items():\n  actual=hashlib.sha256((p/name).read_bytes()).hexdigest()\n  if actual!=hash:raise SystemExit('V25 S2 PROTECTED HASH CHANGED file='+name+' expected='+hash+' actual='+actual)\nwanted=('RunningballV25Stage2Panel','RunningballV25Stage2BoardActivity','RunningballV25Stage2Sparkline','RunningballV25Stage2History')\nfor name in wanted:\n  if not (p/(name+'.java')).is_file():raise SystemExit('V25 S2 missing native source '+name)\nhub=(p/'RunningballV12HubActivity.java').read_text()\nfor term in ('margin(body,v25Stage2,8)','margin(body,v25Stage1,9)','new RunningballV20LiveFeedPulse(this)','new RunningballV16CommandDeck(this)'):\n  if term not in hub:raise SystemExit('V25 S2 hub stage not reachable '+term)\nif hub.index('margin(body,v25Stage2,8)')>=hub.index('margin(body,v25Stage1,9)'):\n  raise SystemExit('V25 S2 navigation must be above legacy cards')\npanel=(p/'RunningballV25Stage2Panel.java').read_text()\nfor term in ('STAGE 1','STAGE 2','STAGE 3','STAGE 4','STAGE 5','RunningballV25Sources.read','setOnClickListener','SOURCE CHANGE LEDGER'):\n  if term not in panel:raise SystemExit('V25 S2 stage not visible/access not wired '+term)\nboards=(p/'RunningballV25Stage2BoardActivity.java').read_text()\nfor term in ('OPEN NATIVE INTELLIGENCE DETAIL','SHARE SOURCE REPORT','REQUEST VERIFIED SOURCE UPDATE','SOURCE HEALTH AND PROVIDER','RunningballV25Sources.read'):\n  if term not in boards:raise SystemExit('V25 S2 board action missing '+term)\nhistory=(p/'RunningballV25Stage2History.java').read_text()\nfor term in ('r.fetchedAt','r.value','Math.max(0,entries.length()-15)','new JSONArray','r.coverage'):\n  if term not in history:raise SystemExit('V25 S2 cannot prove real sample bounds '+term)\nfor name in ('RunningballV25Stage2Panel','RunningballV25Stage2BoardActivity'):\n  text=(p/(name+'.java')).read_text()\n  for banned in ('Math.random()', 'new Random(', 'FAKE LIVE', 'DEMO FIGURES'):\n    if banned in text:raise SystemExit('V25 S2 synthetic source display '+name+': '+banned)\nmanifest=ET.parse(root/'AndroidManifest.xml').getroot()\nkey='{http://schemas.android.com/apk/res/android}name'\nif sum(a.attrib.get(key)=='.RunningballV25Stage2BoardActivity' for a in manifest.iter('activity'))!=1:\n  raise SystemExit('V25 S2 board activity absent from AndroidManifest.xml')\nfor f in root.rglob('*.xml'):ET.parse(f)\nprint('PASS STAGE2: 5 stage labels, nine clickable verified boards, change-ledger, source-only sparkline, protected renderer')\nRB25_STAGE2_GUARD\n"
