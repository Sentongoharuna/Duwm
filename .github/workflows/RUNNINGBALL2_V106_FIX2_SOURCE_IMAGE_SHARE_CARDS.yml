    - name: V25 FIX1 preflight - preserve newsroom and identify exact worldwide aircraft source anchor
      shell: bash
      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" <<'RBV3_FIX1_PREFLIGHT'\nfrom pathlib import Path\nimport sys\npanel=Path(sys.argv[1])/'app/src/main/java/com/sentongoharuna/worldsituationroom/RunningballV25Stage2Panel.java'\ntext=panel.read_text()\nanchor='private final TextView activity,ticker,overview,newsTicker,v9Pulse;'\nassert text.count(anchor)==1,f'FIX1 PREFLIGHT {panel.name} V9 field count {text.count(anchor)}'\nfor requirement in ('V9 / LIVE NEWSROOM','newsTicker','v9Pulse'):\n assert requirement in text,f'FIX1 PREFLIGHT missing {requirement} in {panel.name}'\nprint('PASS FIX1: V9 newsroom and ticker kept; V2 aircraft field anchor confirmed')\nRBV3_FIX1_PREFLIGHT\n"
