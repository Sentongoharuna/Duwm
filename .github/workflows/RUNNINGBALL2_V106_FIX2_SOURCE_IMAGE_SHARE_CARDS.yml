      run: "set -euo pipefail\nAPK=\"$RUNNER_TEMP/release/RUNNINGBALL2-V106-FIX2-REACHABLE-SOURCE-IMAGE-CARDS.apk\"\nSCRIPT=\"$RUNNER_TEMP/v15-emulator-smoke.sh\"\ntest -s \"$APK\" || { echo \"FIX4 FAILED: signed Stage 2 APK missing: $APK\" >&2; exit 2; }\ntest -s \"$SCRIPT\" || { echo \"FIX4 FAILED: emulator smoke script missing: $SCRIPT\" >&2; exit 2; }\npython3 - \"$SCRIPT\" \"$APK\" <<'RB25_FIX4_EMULATOR_CONTRACT'\nimport pathlib,sys,ast\nscript=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')\napk=pathlib.Path(sys.argv[2]).resolve()\nexpected='APK=\"$RUNNER_TEMP/release/RUNNINGBALL2-V106-FIX2-REACHABLE-SOURCE-IMAGE-CARDS.apk\"'\nif script.count(expected)!=1:\n  raise SystemExit('FIX4 FAIL CLOSED: emulator shell must install exact FIX3 verified APK')\nif 'RUNNINGBALL2-V24-WORLD-SOURCE-RECOVERY-APK.apk' in script:\n  raise SystemExit('FIX4 FAIL CLOSED: stale V24 APK path remains')\nif 'com.sentongoharuna.worldsituationroom.rb2sources24' in script:\n  raise SystemExit('FIX4 FAIL CLOSED: stale V24 package remains')\nif 'PKG=com.sentongoharuna.worldsituationroom.rb2live25' not in script:\n  raise SystemExit('FIX4 FAIL CLOSED: emulator shell V25 package missing')\nif \"pkg='com.sentongoharuna.worldsituationroom.rb2live25'\" not in script:\n  raise SystemExit('FIX4 FAIL CLOSED: emulator Python V25 package missing')\nif 'adb install -r \"$APK\"' not in script:\n  raise SystemExit('FIX4 FAIL CLOSED: signed-APK install command missing')\npy=script.split(\"python3 - <<'PY_ADB_SMOKE'\\n\",1)[1].split('\\nPY_ADB_SMOKE',1)[0]\nast.parse(py)\nif \"hit=find(label)  # mandatory probe AFTER every swipe, including last\" not in py:\n  raise SystemExit('FIX4 PRE-FLIGHT: after-swipe navigation scan missing')\nif \"assert activity in lines[-1]\" not in py:\n  raise SystemExit('FIX4 PRE-FLIGHT: native activity launch check removed')\nif not apk.is_file() or apk.stat().st_size<20000:\n  raise SystemExit('FIX4 FAIL CLOSED: verified release APK not present')\nprint('PASS FIX4: signed release APK path and emulator install path match; V25 identity intact')\nRB25_FIX4_EMULATOR_CONTRACT\n\"$SDK_ROOT/build-tools/36.0.0/apksigner\" verify \"$APK\"\nPACKAGE=\"$(\"$SDK_ROOT/build-tools/36.0.0/aapt\" dump badging \"$APK\" | sed -n \"s/^package: name='\\([^']*\\)'.*/\\1/p\" | head -1)\"\ntest \"$PACKAGE\" = 'com.sentongoharuna.worldsituationroom.rb2live25'\nsha256sum \"$APK\"\necho 'V25 FIX5: emulator points to the exact signed APK and the correct package.' >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Permit Android emulator hardware acceleration
      shell: bash
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
