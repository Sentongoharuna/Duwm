    - name: V25 Stage 2 keyless live endpoint checks - independent status, no fabricated totals
      shell: bash
      continue-on-error: true
      run: "set -euo pipefail\npython3 - <<'RB25_PUBLIC_SOURCE_TEST'\nimport urllib.request,urllib.error,json,time,os,datetime\nurls=[\n  (\"adsb.lol REGIONAL LONDON\", \"https://api.adsb.lol/v2/point/51.50740/-0.12780/250\", \"ac\"),\n  (\"USGS M2.5 24H\", \"https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson\", \"features\"),\n  (\"NASA EONET OPEN 20\", \"https://eonet.gsfc.nasa.gov/api/v3/events?status=open&limit=20\", \"events\"),\n  (\"CELESTRAK STATIONS\", \"https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=json\", \"array\"),\n  (\"DW HEADLINE RSS\", \"https://rss.dw.com/xml/rss-en-all\", \"rss\"),\n  (\"FRANKFURTER USD/EUR\", \"https://api.frankfurter.app/latest?from=USD&to=EUR\", \"rates\"),\n  (\"NOAA KP\", \"https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json\", \"array\"),\n  (\"OPEN-METEO TEST ONLY - NONCOMMERCIAL\", \"https://api.open-meteo.com/v1/forecast?latitude=51.5074&longitude=-0.1278&current=temperature_2m\", \"current\")\n]\nevidence=[]\nfor name,url,shape in urls:\n  row={\"provider\":name,\"url\":url,\"checked_at_utc\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"status\":\"UNVERIFIED\",\"http_status\":None,\"record_count\":None,\"newest_source_time\":None}\n  try:\n    req=urllib.request.Request(url,headers={\"User-Agent\":\"RUNNINGBALL2-V25-Staging-Source-Check/1.0\",\"Accept\":\"application/json,application/xml,text/xml\"})\n    with urllib.request.urlopen(req,timeout=15) as res:\n      body=res.read(1200000);row[\"http_status\"]=res.status\n      if res.read(1):raise ValueError(\"response exceeds 1.2 MB safety limit\")\n    if shape==\"rss\":\n      from xml.etree import ElementTree as ET\n      root=ET.fromstring(body);rows=root.findall('.//item')\n      row[\"record_count\"]=len(rows)\n      row[\"newest_source_time\"]=rows[0].findtext('pubDate') if rows else None\n    else:\n      doc=json.loads(body);dataset=doc.get(shape) if isinstance(doc,dict) else doc\n      row[\"record_count\"]=len(dataset) if isinstance(dataset,(list,dict)) else None\n      if isinstance(doc,dict):row[\"newest_source_time\"]=doc.get(\"date\") or doc.get(\"time\") or doc.get(\"updated\")\n    row[\"status\"]=\"VERIFIED-SOURCE-CHECK\" if row[\"http_status\"]==200 else \"FAILED\"\n  except Exception as exc:row[\"status\"]=\"FAILED\";row[\"error\"]=str(exc)[:160]\n  evidence.append(row);print(name,row[\"status\"],row.get(\"http_status\"),row.get(\"record_count\"),row.get(\"error\",\"\"),flush=True)\nevidence.append({\"provider\":\"PRIVATE AIS\", \"status\":\"NOT_CONFIGURED\", \"reason\":\"no API key or endpoint supplied\"})\nos.makedirs(os.environ[\"RUNNER_TEMP\"]+\"/evidence\",exist_ok=True)\ndest=os.environ[\"RUNNER_TEMP\"]+\"/evidence/V25_SOURCE_CHECK.json\"\nwith open(dest,\"w\") as f:json.dump(evidence,f,indent=2)\nRB25_PUBLIC_SOURCE_TEST\n"
    - name: Upload actual V25 keyless provider check results
