    - name: ITEM 01 BUILD EVIDENCE - hash and code inclusion in assembled source
      shell: bash
      run: 'set -euo pipefail

        FILE="$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"

        test -s "$FILE"

        grep -Fq ''private List<Signal> rb25OpenSkyGlobeSignals()'' "$FILE"

        grep -Fq ''mapSignals.add(candidate);'' "$FILE"

        grep -Fq ''RunningballV25GlobalAircraftData.read(this)'' "$FILE"

        echo ''ITEM01 source included in Android compile input:''

        sha256sum "$FILE"

        echo ''Globe hash:''

        sha256sum "$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom/SatelliteMapView.java"

        echo ''Wallpaper hash:''

        sha256sum "$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom/DuwmLiveWallpaperService.java"

        '
