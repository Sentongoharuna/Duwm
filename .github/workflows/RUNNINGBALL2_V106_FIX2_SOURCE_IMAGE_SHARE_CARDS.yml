    - name: V25 FIX1 contract - worldwide aircraft and existing newsroom both visible
      shell: bash
      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" <<'RBV3_FIX1_POST'\nfrom pathlib import Path\nimport sys\npanel=Path(sys.argv[1])/'app/src/main/java/com/sentongoharuna/worldsituationroom/RunningballV25Stage2Panel.java'\ntext=panel.read_text()\nfor requirement in ('V9 / LIVE NEWSROOM','v9Pulse','newsTicker','globalAirHealth','WORLDWIDE AIRCRAFT  /  OPEN SKY GLOBAL'):\n assert requirement in text,f'FIX1 POST missing {requirement} in {panel.name}'\nassert text.count('private TextView globalAirHealth;')==1\nprint('PASS FIX1: existing newsroom, V2 aircraft, and V3 controls coexist')\nRBV3_FIX1_POST\n"
