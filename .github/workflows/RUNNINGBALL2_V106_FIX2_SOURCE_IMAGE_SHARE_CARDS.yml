name: RUNNINGBALL2 V106 FIX2 - SOURCE MEDIA SHARE CARDS ACCESS
run-name: 'RUNNINGBALL2 V106 FIX2 SHARECARDS #${{ github.run_number }}'
permissions:
  contents: read
concurrency:
  group: runningball2-v106-fix2-sharecards-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
    - name: Checkout destination repo
      uses: actions/checkout@v4
    - name: Checkout protected RUNNINGBALL2 original at pinned exact commit
      uses: actions/checkout@v4
      with:
        repository: Sentongoharuna/Du-World-Situation-Room-
        ref: 7d952dd607cdeec94832896023c10203425a3b7f
        path: rb2-original-source
        persist-credentials: false
    - name: Python 3.12 for the preserved V24 step chain
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Gradle 8.13
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'
        cache-disabled: true
    - name: PyYAML version for interpreting embedded V24 source-generation steps
      run: python3 -m pip install --no-cache-dir PyYAML==6.0.3
    - name: Verify and unpack complete V24 baseline workflow bundled inside THIS file
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''RB25_RESTORE''

        import base64,gzip,hashlib,pathlib

        content=''''''

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        ''''''

        blob=gzip.decompress(base64.b64decode(''''.join(content.split()),validate=True))

        expected=''094bf92f81e6fa5661ff076500dc210375c199bd7b3c2e5c7ed67ae1f2f84af0''

        actual=hashlib.sha256(blob).hexdigest()

        if actual!=expected:raise SystemExit(''V25: protected V24 workflow sha256 mismatch ''+actual)

        output=pathlib.Path(''/tmp/RUNNINGBALL2-V24-EMBEDDED-LOCKED.yml'')

        output.write_bytes(blob)

        print(''V25 VERIFIED V24 baseline: sha256=''+actual+'', length=''+str(len(blob)))

        RB25_RESTORE

        '
    - name: Execute EVERY V24 source-generation and regression step unchanged (through V24 acceptance)
      shell: bash
      run: "set -euo pipefail\npython3 - <<'RB25_V24_RUN'\nimport os,subprocess,yaml,sys,pathlib\nsource=pathlib.Path('/tmp/RUNNINGBALL2-V24-EMBEDDED-LOCKED.yml')\nsteps=yaml.safe_load(source.read_text())['jobs']['build']['steps']\nassert len(steps)==77,'V24 baseline step count differs'\nenv=dict(os.environ)\ncwd=pathlib.Path(os.environ['GITHUB_WORKSPACE'])\n# V24 uses GITHUB_ENV between steps. Re-load it after every subprocess.\nmarker=pathlib.Path(os.environ['GITHUB_ENV'])\nfor index in range(2,57):\n  item=steps[index]\n  if 'uses' in item:\n    # V24 actions at 5 and 6 are already installed in this job. Verify\n    # exact name/action pairs; all other unexpected action steps fail closed.\n    approved={5:('Java 17','actions/setup-java@v4'),\n              6:('Gradle 8.13','gradle/actions/setup-gradle@v4')}\n    expected=approved.get(index)\n    if expected is None or (item.get('name'),item.get('uses'))!=expected:\n      raise SystemExit(f'V25 S2 BASELINE DEPENDENCY REJECTED index={index} name={item.get(\"name\")} action={item.get(\"uses\")}')\n    if index==5:\n      probe=subprocess.run(['java','-version'],env=env,check=False,capture_output=True,text=True)\n      if probe.returncode or '17.' not in probe.stderr+probe.stdout:raise SystemExit('V25 S2 java17 precondition failed')\n    if index==6:\n      probe=subprocess.run(['gradle','--version'],env=env,check=False,capture_output=True,text=True)\n      if probe.returncode or '8.13' not in probe.stdout:raise SystemExit('V25 S2 Gradle8.13 precondition failed')\n    print('REUSE VERIFIED PREINSTALLED V24 ACTION',index,expected,flush=True)\n    continue\n  label=item['name']\n  print('RUN V24 PRESERVED',index,label,flush=True)\n  cmd=['bash','-eo','pipefail','-c',item['run']]\n  child=subprocess.run(cmd,cwd=str(cwd),env=env,check=False)\n  if child.returncode!=0:raise SystemExit('V24 BASELINE STOP AT '+str(index)+' '+label+' EXIT '+str(child.returncode))\n  if marker.exists():\n    for line in marker.read_text().splitlines():\n      if '=' in line:\n        key,value=line.split('=',1)\n        if key and key.isidentifier():env[key]=value\ntarget=env.get('PROJECT_DIR','')\nif not target or not pathlib.Path(target).is_dir():raise SystemExit('V25 PROJECT_DIR missing after protected recovery')\nwith marker.open('a') as f:f.write('PROJECT_DIR='+target+'\\n')\nprint('PASS: all 55 V24 generation/regression stages retain their original tests')\nRB25_V24_RUN\n"
    - name: V25 Stage1 install shared region, truth-state screens and attribution
      shell: bash
      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" <<'RB25_STAGE1_PRESERVED_EXACT'\nimport hashlib,gzip,base64\npayload=\"\"\"\"\
        \"\"\noriginal=gzip.decompress(base64.b64decode(payload))\nif hashlib.sha256(original).hexdigest()!=\"7025739e0bae852d30d880c27db7c33453a140c513220043c81893cd43fd7a0c\":\n    raise SystemExit(\"ITEM04 BASELINE SHA ERROR: preserved Stage1 code changed\")\nexec(compile(original.decode('utf-8'),'<preserved Stage1 Python>','exec'))\nRB25_STAGE1_PRESERVED_EXACT\n"
    - name: V25 Stage1 install bounded regional cache and visible-source orchestrator
      shell: bash
      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" <<'RB25_STAGE1_CACHE'\nfrom pathlib import Path\nimport hashlib,sys\np=Path(sys.argv[1])/'app/src/main/java/com/sentongoharuna/worldsituationroom'\ndef patch(file,old,new,tag):\n f=p/file;s=f.read_text();cnt=s.count(old)\n if cnt!=1:raise SystemExit('V25 EXTRA ANCHOR FAILURE '+file+' '+tag+' = '+str(cnt))\n f.write_text(s.replace(old,new,1))\ndef add(file,data):\n f=p/file\n if f.exists():raise SystemExit('V25 EXTRA duplicate '+file)\n f.write_text(data.strip()+'\\n')\nadd('RunningballV25RegionCache.java',r'''package com.sentongoharuna.worldsituationroom;\nimport android.content.Context;\nimport android.content.SharedPreferences;\nimport org.json.JSONObject;\n/** Two real previous regional ADS-B snapshots, 256 KiB maximum combined payload; 6h TTL.\n  Snapshots are cached only after their original observer coordinates and receipt time are validated. */\npublic final class RunningballV25RegionCache {\n  public static final int MAX_CACHE_BYTES=262144;public static final long TTL=21600000L;\n  private RunningballV25RegionCache(){}\n  private static SharedPreferences db(Context c){return c.getApplicationContext().getSharedPreferences(\"rb25_region_cache\",Context.MODE_PRIVATE);}\n  public static synchronized void save(Context c,double lat,double lon){\n    String data=c.getApplicationContext().getSharedPreferences(\"air_widget_v2\",Context.MODE_PRIVATE).getString(\"last_snapshot\",\"\");\n    if(data.isEmpty()||data.length()*2>MAX_CACHE_BYTES/2)return;\n    try{JSONObject record=new JSONObject(data);long stamp=record.optLong(\"time\",0L);\n      if(stamp<=0||System.currentTimeMillis()-stamp>TTL||\n         Math.abs(record.optDouble(\"observerLat\",999)-lat)>.001 ||\n         Math.abs(record.optDouble(\"observerLon\",999)-lon)>.001)return;\n      SharedPreferences p=db(c);String key=RunningballV25RegionQuery.key(lat,lon);\n      String a=p.getString(\"slot0_key\",\"\");String b=p.getString(\"slot1_key\",\"\");\n      int slot=key.equals(a)?0:key.equals(b)?1:a.isEmpty()?0:b.isEmpty()?1:\n        p.getLong(\"slot0_saved\",0L)<=p.getLong(\"slot1_saved\",0L)?0:1;\n      String k=\"slot\"+slot+\"_\";\n      p.edit().putString(k+\"key\",key).putString(k+\"data\",data).putLong(k+\"saved\",System.currentTimeMillis()).apply();\n    }catch(Exception ignored){} // bad data are never rescued into cache\n  }\n  public static synchronized boolean restore(Context c,double lat,double lon){\n    SharedPreferences p=db(c);String wanted=RunningballV25RegionQuery.key(lat,lon);\n    for(int slot=0;slot<2;slot++){\n      String key=\"slot\"+slot+\"_\";if(!wanted.equals(p.getString(key+\"key\",\"\")))continue;\n      String raw=p.getString(key+\"data\",\"\");\n      try{JSONObject o=new JSONObject(raw);long age=System.currentTimeMillis()-o.optLong(\"time\",0);\n        if(age<0||age>TTL||raw.length()*2>MAX_CACHE_BYTES/2)return false;\n        c.getApplicationContext().getSharedPreferences(\"air_widget_v2\",Context.MODE_PRIVATE).edit()\n         .putString(\"last_snapshot\",raw).putString(\"last_error\",\"OFFLINE CACHE / WAITING FOR NEW REGION REPORT\").apply();\n        return true;\n      }catch(Exception ignored){return false;}\n    }\n    return false;\n  }\n}''')\npatch('RunningballWorldTarget.java','''    long rev=state.getLong(\"revision\",0L)+1L;\n    state.edit()''','''    RunningballV25RegionCache.save(context,lat(context),lon(context));\n    long rev=state.getLong(\"revision\",0L)+1L;\n    state.edit()''','save previous on reset')\npatch('RunningballWorldTarget.java','''    prefs(context).edit().putBoolean(\"chosen\",true)''','''    if(ready(context))RunningballV25RegionCache.save(context,lat(context),lon(context));\n    prefs(context).edit().putBoolean(\"chosen\",true)''','save previous on select')\npatch('RunningballWorldTarget.java','''    context.getApplicationContext().getSharedPreferences(\"air_widget_v2\",Context.MODE_PRIVATE).edit()\n       .remove(\"last_snapshot\").putString(\"last_error\",\"PREVIOUS REGION - AWAITING NEW DATA\").apply();''','''    context.getApplicationContext().getSharedPreferences(\"\
        air_widget_v2\",Context.MODE_PRIVATE).edit()\n       .remove(\"last_snapshot\").putString(\"last_error\",\"PREVIOUS REGION - AWAITING NEW DATA\").apply();\n    RunningballV25RegionCache.restore(context,lat,lon);''','restore bounded previous region')\n\nadd('RunningballV25Poller.java',r'''package com.sentongoharuna.worldsituationroom;\nimport android.content.Context;\nimport android.content.Intent;\nimport android.os.Handler;\nimport android.os.Looper;\n/** Visible-screen orchestrator for the EXISTING independent V24 async fetchers.\n    Never polls in a Canvas frame; the legacy clients retain their own cooldowns. */\npublic final class RunningballV25Poller {\n  private final Context app;private final Handler main=new Handler(Looper.getMainLooper());\n  private boolean active=false;private long lastAny=0;\n  private final Runnable poll=new Runnable(){@Override public void run(){\n    if(!active)return;\n    long now=System.currentTimeMillis();\n    if(now-lastAny>=60000L){lastAny=now;dispatch();}\n    main.postDelayed(this,30000L);\n  }};\n  public RunningballV25Poller(Context c){app=c.getApplicationContext();}\n  public void start(){if(active)return;active=true;main.post(poll);}\n  public void stop(){active=false;main.removeCallbacks(poll);}\n  private void dispatch(){\n    // Each provider is isolated; the V24 clients do their network I/O on worker threads.\n    try{RunningballV16SourceRefresh.request(app,false,null);}catch(RuntimeException ignored){}\n    try{RunningballV17Feeds.request(app,false,null);}catch(RuntimeException ignored){}\n    try{RunningballV19SatelliteBootstrap.request(app,null);}catch(RuntimeException ignored){}\n    try{RunningballV19Noaa.request(app,null);}catch(RuntimeException ignored){}\n    if(RunningballWorldTarget.ready(app))try{\n      Intent intent=new Intent(app,AirOperationsWidgets.Pulse.class);\n      intent.setAction(\"com.sentongoharuna.worldsituationroom.AIR_WIDGET_REFRESH\");\n      intent.setPackage(app.getPackageName());app.sendBroadcast(intent);\n    }catch(RuntimeException ignored){}\n  }\n}''')\npatch('RunningballV25Stage1Panel.java','''  private boolean visible=false;private final Runnable tick=''', '''  private final RunningballV25Poller poller;\n  private boolean visible=false;private final Runnable tick=''', 'poller field')\npatch('RunningballV25Stage1Panel.java','''  public RunningballV25Stage1Panel(Context c){super(c);setOrientation(VERTICAL);''','''  public RunningballV25Stage1Panel(Context c){super(c);poller=new RunningballV25Poller(c);setOrientation(VERTICAL);''','poller initialize')\npatch('RunningballV25Stage1Panel.java','''    TextView reset=action(\"RESET GLOBAL\",()->{RunningballWorldTarget.resetGlobal(getContext());render();});''','''    TextView reset=action(\"RESET GLOBAL\",()->{RunningballWorldTarget.resetGlobal(getContext());\n      Intent refresh=new Intent(getContext(),AirOperationsWidgets.Pulse.class);\n      refresh.setAction(\"com.sentongoharuna.worldsituationroom.AIR_WIDGET_REFRESH\");getContext().sendBroadcast(refresh);render();});''','broadcast widget refresh')\npatch('RunningballV25Stage1Panel.java','''visible=true;ui.post(tick);''','''visible=true;poller.start();ui.post(tick);''','poller start')\npatch('RunningballV25Stage1Panel.java','''visible=false;ui.removeCallbacks(tick);super.onDetachedFromWindow();''','''visible=false;poller.stop();ui.removeCallbacks(tick);super.onDetachedFromWindow();''','poller stop')\npatch('RunningballWorldExplorerActivity.java','''RunningballWorldTarget.resetGlobal(this);world.setGlobeMode(true);world.setCenter(0d,0d,2.1);''','''RunningballWorldTarget.resetGlobal(this);world.setGlobeMode(true);world.setCenter(0d,0d,2.1);\n      Intent refresh=new Intent(this,AirOperationsWidgets.Command.class);\n      refresh.setAction(\"com.sentongoharuna.worldsituationroom.AIR_WIDGET_REFRESH\");sendBroadcast(refresh);''','Explorer reset refresh widget')\n\npatch('NewsPreferences.java',\n 'public boolean source(NewsSource s){return SafePreferences.bool(p,\"source_\"+s.id,s.enabledByDefault);}',\n 'public boolean source(NewsSource s){return\
        \ !s.id.startsWith(\"googlenews\") && SafePreferences.bool(p,\"source_\"+s.id,s.enabledByDefault);}',\n 'block Google News RSS including persisted user settings')\nprint('V25 EXTRA PASS: two bounded region caches; shared visible orchestrator; global widget reset')\nRB25_STAGE1_CACHE\n"
