      run: "set -euo pipefail\npython3 - \"$PROJECT_DIR\" <<'RB25_V6_GATE'\nfrom pathlib import Path\nimport hashlib,sys,xml.etree.ElementTree as ET,re\np=Path(sys.argv[1])/'app/src/main/java/com/sentongoharuna/worldsituationroom'\ngeo=(p/'RunningballV25Stage2GeoView.java').read_text()\npanel=(p/'RunningballV25Stage2Panel.java').read_text()\nboard=(p/'RunningballV25Stage2BoardActivity.java').read_text()\nspark=(p/'RunningballV25Stage2Sparkline.java').read_text()\nmarine=(p/'GevMarineActivity.java').read_text()\nfor token in ('rb_global_public_events','quakes_raw','nasa_raw','\"geometry\"',\n              '\"coordinates\"','\"seen_pos\"','\"last_snapshot\"','rb11_marine',\n              'report.fetchedAt','source==0','source==3','source==4','source==2',\n              'reduce_motion','getBoolean','postInvalidateDelayed(70L)'):\n  assert token in geo,'V6 GEO missing observed-data contract: '+token\nfor forbidden in ('Math.random','new Random(','Thread.sleep','HttpURLConnection','https://'):\n  assert forbidden not in geo,'V6 GEO disallowed synthetic/network call '+forbidden\nassert 'geo.update(r)' in board and 'new RunningballV25Stage2GeoView(this,index)' in board\nassert 'REDUCE MOTION' in board and 'getSharedPreferences(\"rb25_visual_preferences\"' in board\nassert 'newsTicker.setOnClickListener(v->board(5))' in panel\nassert 'setSelected(false)' in panel and 'articles.optJSONObject(0)' in panel\nassert 'screenWidthDp>=400' in panel and 'fontScale<=1.25f' in panel\nassert 'item.setMinimumHeight(dp(70))' in panel and 'item.setMinHeight(' not in panel\nassert 'AIS SOURCE NOT CONNECTED  •  REPORTED VESSELS --' in marine\nassert 'java.util.regex.Pattern.compile' in spark and 'Float.parseFloat(m.group())' in spark\nfor filename in ('DuwmLiveWallpaperService.java','SatelliteMapView.java'):\n  assert (p/filename).is_file(),filename\nwall=(p/'DuwmLiveWallpaperService.java').read_text()\nassert 'FRAME_MS=33L' in wall and 'rotation=(rotation+(dt/1000.0d)*4.0d)%360.0d;' in wall\nassert 'h.lockCanvas()' in wall and 'h.unlockCanvasAndPost(c)' in wall\nmanifest=Path(sys.argv[1])/'app/src/main/AndroidManifest.xml'\nET.parse(manifest)\nprint('PASS V6: AIR / SEA / USGS / EONET source-derived positions, bounded points, numeric trends, compact panels, motion toggle, AIS truth; protected wallpaper checks')\nRB25_V6_GATE\n"
