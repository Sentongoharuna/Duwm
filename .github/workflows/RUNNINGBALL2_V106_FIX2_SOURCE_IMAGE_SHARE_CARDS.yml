    - name: Verify APK identity, actual DEX, signed package, and unique V25 filename
      shell: bash
      run: "set -euo pipefail\nmapfile -d '' -t APKS < <(find \"$PROJECT_DIR/app/build/outputs/apk/debug\" -maxdepth 1 -type f -name '*.apk' -print0)\ntest \"${#APKS[@]}\" -eq 1\nAPK=\"${APKS[0]}\"; test -s \"$APK\"\npython3 - \"$APK\" <<'RB25_APK'\nimport sys,zipfile\nwith zipfile.ZipFile(sys.argv[1]) as z:\n  assert z.testzip() is None\n  for x in ('classes.dex','AndroidManifest.xml'):assert x in z.namelist(),x\nRB25_APK\n\"$SDK_ROOT/build-tools/36.0.0/apksigner\" verify \"$APK\"\nPACKAGE=\"$(\"$SDK_ROOT/build-tools/36.0.0/aapt\" dump badging \"$APK\" | sed -n \"s/^package: name='\\([^']*\\)'.*/\\1/p\" | head -1)\"\ntest \"$PACKAGE\" = 'com.sentongoharuna.worldsituationroom.rb2live25'\nmkdir -p \"$RUNNER_TEMP/release\"\ncp \"$APK\" \"$RUNNER_TEMP/release/RUNNINGBALL2-V106-FIX2-REACHABLE-SOURCE-IMAGE-CARDS.apk\"\nsha256sum \"$RUNNER_TEMP/release/RUNNINGBALL2-V106-FIX2-REACHABLE-SOURCE-IMAGE-CARDS.apk\"\necho 'V25 Stage2 V6 Android APK assembled, verified and signed; live-feed provider availability still requires network checks.' >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: V25 STAGE3 APK VERIFY - both wallpaper services and preview are in signed package
      shell: bash
      run: "set -euo pipefail\nAPK=\"$RUNNER_TEMP/release/RUNNINGBALL2-V106-FIX2-REACHABLE-SOURCE-IMAGE-CARDS.apk\"\ntest -s \"$APK\"\n\"$SDK_ROOT/build-tools/36.0.0/apksigner\" verify \"$APK\"\n\"$SDK_ROOT/build-tools/36.0.0/aapt\" dump xmltree \"$APK\" AndroidManifest.xml > \"$RUNNER_TEMP/rb25-stage3-manifest.txt\"\nfor item in 'DuwmLiveWallpaperService' 'RunningballV25IntelligenceWallpaperService' 'RunningballV25IntelligenceSettingsActivity' 'RunningballV25WorldwideAirActivity' 'RunningballV25FlightRegisterActivity'; do\n   grep -Fq \"$item\" \"$RUNNER_TEMP/rb25-stage3-manifest.txt\" || { echo \"STAGE3 APK FAIL: $item missing\" >&2; exit 1; }\ndone\n\"$SDK_ROOT/build-tools/36.0.0/aapt\" dump resources \"$APK\" > \"$RUNNER_TEMP/rb25-stage3-resources.txt\"\ngrep -Fq 'rb25_intelligence_wallpaper' \"$RUNNER_TEMP/rb25-stage3-resources.txt\" || {\n  echo 'STAGE3 APK FAIL: new wallpaper picker XML not packaged' >&2;exit 1; }\necho 'STAGE3 APK: both services, settings Activity and wallpaper XML packaged in the signed APK' >> \"$GITHUB_STEP_SUMMARY\"\n"
