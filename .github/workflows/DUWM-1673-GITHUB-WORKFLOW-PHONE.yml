name: DUWM 1673 | Visual Globe + Native TV Radio + AIS Share Cards
run-name: DUWM 1673 | Native Playback, Globe and All-Item Cards
'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/DUWM-1673-GITHUB-WORKFLOW-PHONE.yml
      - DUWM-1673-REAL-ANDROID-SOURCE.zip
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: duwm1673-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Compile and verify the complete DUWM 1673 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - name: Checkout actual 1673 source ZIP and workflow
        uses: actions/checkout@v4
      - name: Verify archive checksum and extract native Android project
        shell: bash
        run: |
          set -euo pipefail
          test -s DUWM-1673-REAL-ANDROID-SOURCE.zip
          printf '%s  %s\n' '3f820740f8f503a764d2f161d6670b73bf722bcf5699d584490346cdb62d8e99' 'DUWM-1673-REAL-ANDROID-SOURCE.zip' | sha256sum -c -
          unzip -t DUWM-1673-REAL-ANDROID-SOURCE.zip | tail -2
          mkdir -p "$RUNNER_TEMP/duwm1673-source"
          unzip -q DUWM-1673-REAL-ANDROID-SOURCE.zip -d "$RUNNER_TEMP/duwm1673-source"
          test -f "$RUNNER_TEMP/duwm1673-source/DUWM-1673-ANDROID-SOURCE/app/build.gradle.kts"
          echo "PROJECT=$RUNNER_TEMP/duwm1673-source/DUWM-1673-ANDROID-SOURCE" >> "$GITHUB_ENV"
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK; install only needed Android API 36 packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null)"
          fi
          test -n "$SDK_MANAGER" && test -x "$SDK_MANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDK_MANAGER" --version
          yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt"
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Verify 1673 source, dynamic globe redesign and in-app media cards
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python3 verification/check_1673_source.py
          # Old color/asset hashes from earlier versions intentionally do not veto a new UI.
          python3 - <<'PY_CHECK'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p=Path('app/src/main')
          manifest=ET.parse(p/'AndroidManifest.xml').getroot()
          assert manifest is not None
          for name in ('duwm_release_ui.json','naturalearth_coasts.txt',
                       'duwm_news_200_region_sources.json','duwm_country_borders_wdbii.txt'):
              assert (p/'assets'/name).is_file(),name
          for name in ('MediaDeskActivity','NativeMediaActivity','Duwm1166RadioAtlasActivity',
                       'GevMarineActivity','GevMarineRadarView','Duwm1673CommandDeckActivity'):
              path=p/'java/com/sentongoharuna/worldsituationroom'/(name+'.java')
              assert path.is_file() and path.stat().st_size>600,name
          print('PASS real 1673 app source and media + vessel map classes')
          PY_CHECK
      - name: Compile complete native Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac :app:assembleDebug --stacktrace
          mkdir -p "$RUNNER_TEMP/duwm1673"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/duwm1673/DUWM-1673.apk"
      - name: Verify compiled APK, package 1673, new launcher, and signature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_APK'
          import hashlib,os,subprocess
          from pathlib import Path
          from zipfile import ZipFile
          apk=Path(os.environ['RUNNER_TEMP'])/'duwm1673/DUWM-1673.apk'
          assert apk.is_file() and apk.stat().st_size>150000,'APK was not compiled'
          with ZipFile(apk) as z:
              assert z.testzip() is None
              names=z.namelist()
              for asset in ('AndroidManifest.xml','classes.dex','assets/naturalearth_coasts.txt',
                            'assets/duwm_news_200_region_sources.json','assets/duwm_country_borders_wdbii.txt'):
                  assert asset in names,('Missing APK artifact component',asset)
              dex=b''.join(z.read(n) for n in names if n.endswith('.dex'))
              for cls in (b'OperationsGlobeView',b'SatelliteMapView',b'DuwmLiveWallpaperService',
                          b'RunningballV25GlobalAircraftData',b'Duwm1670WorldMapView',
                          b'Duwm1670FlightMapActivity',b'Duwm1670NewsAtlasActivity',
                          b'Duwm1671MissionActivity',b'Duwm1671SectorActivity',b'GevMarineActivity',
                          b'GevMarineRadarView',b'Duwm1671SourceStatusActivity',b'Duwm1671Share',
                          b'Duwm1669SourceDirectoryActivity',b'MediaDeskActivity',
                          b'Duwm1673CommandDeckActivity',b'Duwm1166RadioAtlasActivity',b'NativeMediaActivity'):
                  assert cls in dex,('Missing real compiled class',cls)
          tools=Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
          subprocess.run([str(tools/'apksigner'),'verify',str(apk)],check=True)
          badging=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(apk)],text=True)
          assert "versionCode='167300'" in badging and "versionName='1673'" in badging
          assert "name='com.sentongoharuna.worldsituationroom.rb2live25'" in badging
          assert "Duwm1673CommandDeckActivity" in badging
          (apk.parent/'SHA256SUMS.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  DUWM-1673.apk\n')
          print('PASS signed 1673 APK with redesigned globe, native media, individual cards and AIS maps')
          PY_APK
      - name: Publish APK only after successful compilation and signature verification
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-1673-VERIFIED-INSTALLABLE-APK
          path: |
            ${{ runner.temp }}/duwm1673/DUWM-1673.apk
            ${{ runner.temp }}/duwm1673/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
      - name: State media runtime limitations and verified build boundaries
        if: always()
        shell: bash
        run: |
          {
            echo '### DUWM 1673 source and compilation'
            echo '1673 launcher and globe are redesigned; prior visual-hash gates are no longer mandatory.'
            echo 'TV and radio play inside Android only if the publisher supplies a direct supported stream; player errors remain visible.'
            echo 'AIS ships animate only between real received fixes; each observed ship has an individual share card.'
            echo 'Build success verifies compilation and APK structure, not third-party uptime, stream codecs or phone operation.'
          } >> "$GITHUB_STEP_SUMMARY"
