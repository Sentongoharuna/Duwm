name: DUWM 1.2-20-4-19A-4-19 FIX5 APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [".github/workflows/DUWM-1-2-20-4-19A-4-19-FIX5-APK.yml", "DUWM-1-2-20-4-19A-4-19-FIX5-SOURCE.tar.gz"]
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source
        run: echo "9280885d4d0eca70d5e629f826054486341952553b59dbfa59a3c6c6c690d475  DUWM-1-2-20-4-19A-4-19-FIX5-SOURCE.tar.gz" | sha256sum -c -
      - name: Extract
        run: |
          mkdir -p "$RUNNER_TEMP/duwm"
          tar -xzf DUWM-1-2-20-4-19A-4-19-FIX5-SOURCE.tar.gz -C "$RUNNER_TEMP/duwm"
          echo "PROJECT_DIR=$RUNNER_TEMP/duwm/world-situation-room-native-1-2-20-4-19A-4-19-FIX5" >> "$GITHUB_ENV"
      - name: FIX5 incident bucket compile repair gate
        run: chmod +x "$PROJECT_DIR/scripts/"*.sh && "$PROJECT_DIR/scripts/verify-1-2-20-4-19A-4-19-fix5-incident-bucket-compile-repair.sh" "$PROJECT_DIR"
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.13", cache-disabled: true}
      - name: Compile
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac --stacktrace
      - name: Lint
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:lintDebug --stacktrace
      - name: Assemble
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace
      - name: Stage exactly one APK
        run: |
          mapfile -t APKS < <(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk")
          test "${#APKS[@]}" -eq 1 && test -s "${APKS[0]}"
          test "$(head -c 2 "${APKS[0]}")" = "PK"
          mkdir -p "$RUNNER_TEMP/release"
          cp "${APKS[0]}" "$RUNNER_TEMP/release/DUWM-1-2-20-4-19A-4-19-FIX5.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: DUWM-1-2-20-4-19A-4-19-FIX5-APK
          path: ${{ runner.temp }}/release/DUWM-1-2-20-4-19A-4-19-FIX5.apk
          if-no-files-found: error
