name: DUWM FINAL GREEN APK
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          echo "2f9934966203996e686baefb1551fb1ed10ad9c00816c8b4dd2a53da384a9e92  DUWM-1-2-20-4-20-FINAL-GREEN-SOURCE.tar.gz" | sha256sum -c -

      - name: Extract and preflight
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/duwm"
          mkdir -p "$RUNNER_TEMP/duwm"
          tar -xzf DUWM-1-2-20-4-20-FINAL-GREEN-SOURCE.tar.gz -C "$RUNNER_TEMP/duwm"
          PROJECT_DIR="$(find "$RUNNER_TEMP/duwm" -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/java/com/sentongoharuna/worldsituationroom/SatelliteMapView.java"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Required Android packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          java -version
          gradle --version
          gradle --no-daemon --no-configuration-cache clean :app:assembleDebug --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" -print -quit)"
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::Debug APK was not produced."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release"
          cp "$APK" "$RUNNER_TEMP/release/DUWM-FINAL-GREEN.apk"
          test -s "$RUNNER_TEMP/release/DUWM-FINAL-GREEN.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-FINAL-GREEN-APK
          path: ${{ runner.temp }}/release/DUWM-FINAL-GREEN.apk
          if-no-files-found: error
          retention-days: 30
