name: "DUWM 1728.2/21/4/14 | Fixed telemetry | Direct APK"
run-name: "DUWM 1728.2/21/4/14 | Build installable APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/APK-FIXED-TELEMETRY-14-4-21-1728.2-DUWM.yml"

permissions:
  contents: read

concurrency:
  group: duwm-1728-2-21-4-14-direct-apk
  cancel-in-progress: false

env:
  BASE_ZIP: DUWM-1728.2-21-4-13-PROFESSIONAL-TRANSITIONS-SOURCE.zip
  BASE_SHA256: e011e645f4cdceba8493cf67d6b59fde734fe86dc3e99262780cd1335959c28c
  PROJECT_DIR: DUWM-1728-2-21-4-13-ANDROID-SOURCE
  APK_NAME: DUWM-1728.2-21-4-14-FIXED-TELEMETRY.apk
  ARTIFACT_NAME: DUWM-1728.2-21-4-14-INSTALLABLE-APK

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify inherited /21.4/13 source
        shell: bash
        run: |
          set -euo pipefail
          test -s "$BASE_ZIP"
          echo "$BASE_SHA256  $BASE_ZIP" | sha256sum -c -
          rm -rf "$PROJECT_DIR"
          unzip -q "$BASE_ZIP"
          test -f "$PROJECT_DIR/settings.gradle.kts"

      - name: Apply /21.4/14 fixed-telemetry upgrade
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("DUWM-1728-2-21-4-13-ANDROID-SOURCE")
          gradle = root / "app/build.gradle.kts"
          s = gradle.read_text()
          s = s.replace("versionCode = 172837", "versionCode = 172838")
          s = s.replace('versionName = "1728.2.21.4.13"', 'versionName = "1728.2.21.4.14"')
          gradle.write_text(s)

          layout = root / "app/src/main/java/com/sentongoharuna/worldsituationroom/Duwm1728ClearPictureLayout.java"
          t = layout.read_text()

          old = '''    private static void measurementLine(Painter painter,String value,float x,float y,float width,float unit,int color){
        if(value.isEmpty())return;
        // A reading changing digit count must not make the whole field pulse.
        float size=18*unit;painter.text(sceneFit(painter,value,size,false,width,false),x,y,size,color,false);
    }'''

          new = '''    private static void measurementLine(Painter painter,String value,float x,float y,float width,float unit,int color){
        String stable=value==null?"":value.trim();
        if(stable.isEmpty())stable="—";
        // /21.4/14: geometry is fixed; only the value changes inside the reserved cell.
        float size=18*unit;
        painter.text(sceneFit(painter,stable,size,false,width,false),x,y,size,color,false);
    }'''

          if old not in t:
              raise SystemExit("fixed telemetry anchor not found")
          layout.write_text(t.replace(old,new))
          print("PASS /21.4/14 fixed telemetry patch")
          PY

          grep -q 'versionCode = 172838' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionName = "1728.2.21.4.14"' "$PROJECT_DIR/app/build.gradle.kts"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$MANAGER"
          yes | "$MANAGER" --licenses >/dev/null || true
          "$MANAGER" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Resolve pinned ML Kit SDK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --no-configuration-cache --console=plain :app:duwmVerifySceneDependency --stacktrace

      - name: Compile Android Java
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --no-configuration-cache --console=plain :app:compileDebugJavaWithJavac --stacktrace

      - name: Assemble installable APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --console=plain :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee APK-IDENTITY.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee APK-SIGNER.txt
          grep -q "versionCode='172838'" APK-IDENTITY.txt
          grep -q "versionName='1728.2.21.4.14'" APK-IDENTITY.txt
          grep -q "name='com.sentongoharuna.worldsituationroom.rb2live25'" APK-IDENTITY.txt

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "apk-output/$APK_NAME"
          cp APK-IDENTITY.txt APK-SIGNER.txt apk-output/
          sha256sum "apk-output/$APK_NAME" > apk-output/SHA256SUMS.txt

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: apk-output/
          if-no-files-found: error
          retention-days: 30
