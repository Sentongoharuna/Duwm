name: DUWM 1.2-20-4-20 WORKING GLOBE BASELINE FIX5 APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/DUWM-1-2-20-4-20-WORKING-GLOBE-BASELINE-FIX5-APK.yml"
      - "DUWM-1-2-20-4-20-WORKING-GLOBE-BASELINE-FIX5-SOURCE.tar.gz"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify exact source
        run: echo "141647920bd260d4c3b701fa1938cb5b1d65fc188e3d9e37de688ae9b2d65234  DUWM-1-2-20-4-20-WORKING-GLOBE-BASELINE-FIX5-SOURCE.tar.gz" | sha256sum -c -
      - name: Extract
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/duwm"; mkdir -p "$RUNNER_TEMP/duwm"
          tar -xzf DUWM-1-2-20-4-20-WORKING-GLOBE-BASELINE-FIX5-SOURCE.tar.gz -C "$RUNNER_TEMP/duwm"
          PROJECT_DIR="$(find "$RUNNER_TEMP/duwm" -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Working Globe Baseline FIX5 Gate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$PROJECT_DIR/scripts/"*.sh
          bash "$PROJECT_DIR/scripts/verify-1-2-20-4-20-working-globe-baseline-fix1.sh" "$PROJECT_DIR"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true
      - name: Compile
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac --stacktrace
      - name: Lint
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:lintDebug --stacktrace
      - name: Assemble
        run: cd "$PROJECT_DIR" && gradle --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace
      - name: Stage exactly one APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t A < <(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" | sort)
          if [ "${#A[@]}" -ne 1 ]; then echo "::error::Expected exactly one APK, found ${#A[@]}"; printf '%s\n' "${A[@]:-}"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/release"
          cp "${A[0]}" "$RUNNER_TEMP/release/DUWM-1-2-20-4-20-WORKING-GLOBE-BASELINE-FIX5.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-1-2-20-4-20-WORKING-GLOBE-BASELINE-FIX5-APK
          path: ${{ runner.temp }}/release/DUWM-1-2-20-4-20-WORKING-GLOBE-BASELINE-FIX5.apk
          if-no-files-found: error
