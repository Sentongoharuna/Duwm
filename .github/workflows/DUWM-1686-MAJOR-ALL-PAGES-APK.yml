name: DUWM 1686 | MAJOR ALL-PAGES WORKSPACES | Original Command
run-name: DUWM 1686 | 19 major redesigned desks, deep-workspaces, source cards and original globe
'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/DUWM-1686-MAJOR-ALL-PAGES-APK.yml
      - DUWM-1686-MAJOR-ALL-PAGES-SOURCE.zip
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: duwm-1686-${{ github.ref }}
  cancel-in-progress: false
jobs:
  major-1686-apk:
    name: Build and verify the substantial DUWM 1686 Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout original repository and 1686 release package
        uses: actions/checkout@v4
      - name: Verify exact 1686 complete source ZIP and extract
        shell: bash
        run: |
          set -euo pipefail
          test -s DUWM-1686-MAJOR-ALL-PAGES-SOURCE.zip
          echo '3cd8077cb387bf1b6de3f4161fa944d91558c5137809655972c55c6a802ced95  DUWM-1686-MAJOR-ALL-PAGES-SOURCE.zip' | sha256sum -c -
          unzip -t DUWM-1686-MAJOR-ALL-PAGES-SOURCE.zip | tail -2
          mkdir -p "$RUNNER_TEMP/duwm1686src"
          unzip -q DUWM-1686-MAJOR-ALL-PAGES-SOURCE.zip -d "$RUNNER_TEMP/duwm1686src"
          test -f "$RUNNER_TEMP/duwm1686src/DUWM-1686-ANDROID-SOURCE/app/build.gradle.kts"
          echo "PROJECT=$RUNNER_TEMP/duwm1686src/DUWM-1686-ANDROID-SOURCE" >> "$GITHUB_ENV"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo 'Android SDK directory missing'; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          test -n "$SDK_MANAGER" && test -x "$SDK_MANAGER"
          if [ ! -f "$SDK_ROOT/platforms/android-36/android.jar" ] || [ ! -x "$SDK_ROOT/build-tools/36.0.0/apksigner" ]; then
            yes | timeout 120 "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            timeout 600 "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          fi
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Verify major functional source changes and preservation of original command
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python3 verification/check_source.py
          python3 verification/check_1674_fix1_compiler.py
          python3 verification/check_1679_geometry.py
          python3 verification/check_1686_major_upgrade.py
          mkdir -p "$RUNNER_TEMP/duwm1686syntax"
          javac -d "$RUNNER_TEMP/duwm1686syntax" verification/JavaSyntaxCheck.java
          java -cp "$RUNNER_TEMP/duwm1686syntax" JavaSyntaxCheck
          mkdir -p "$RUNNER_TEMP/duwm1686geo"
          javac -d "$RUNNER_TEMP/duwm1686geo" \
            app/src/main/java/com/sentongoharuna/worldsituationroom/Duwm1676GeoMath.java \
            verification/Duwm1676GeoMathTest.java
          java -cp "$RUNNER_TEMP/duwm1686geo" com.sentongoharuna.worldsituationroom.Duwm1676GeoMathTest
          mkdir -p "$RUNNER_TEMP/duwm1686fix"
          javac -d "$RUNNER_TEMP/duwm1686fix" \
            app/src/main/java/com/sentongoharuna/worldsituationroom/Duwm1683FixTracker.java \
            verification/Duwm1683FixTrackerTest.java
          java -cp "$RUNNER_TEMP/duwm1686fix" com.sentongoharuna.worldsituationroom.Duwm1683FixTrackerTest
      - name: Compile all real Android pages and assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          gradle --no-daemon --no-configuration-cache :app:compileDebugJavaWithJavac :app:assembleDebug --stacktrace
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$RUNNER_TEMP/duwm1686apk"
          cp "$APK" "$RUNNER_TEMP/duwm1686apk/DUWM-1686-MAJOR-ALL-PAGES.apk"
      - name: Verify compiled classes, release code and APK signature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_APK'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, os, subprocess
          apk=Path(os.environ['RUNNER_TEMP'])/'duwm1686apk/DUWM-1686-MAJOR-ALL-PAGES.apk'
          assert apk.is_file() and apk.stat().st_size>150000,'No installable DUWM 1686 APK'
          with ZipFile(apk) as archive:
              assert archive.testzip() is None
              names=archive.namelist()
              for asset in ('AndroidManifest.xml','classes.dex','assets/duwm_1683_real_fix_modes.json','assets/duwm_country_borders_wdbii.txt'):
                  assert asset in names,('Missing APK asset',asset)
              dex=b''.join(archive.read(f) for f in names if f.endswith('.dex'))
              for cls in (b'MainActivity',b'SatelliteMapView',b'Duwm1683DeskCatalog',b'Duwm1685PageUpgrade',b'Duwm1686Console',b'Duwm1686WorkspaceActivity',b'Duwm1686CommandBoard',b'Duwm1686ShareCard',b'Duwm1685ReceiptHistory',b'Duwm1685ReceiptChart',b'GevMarineActivity',b'Duwm1670FlightMapActivity',b'MediaDeskActivity',b'Duwm1166NewsDeskActivity',b'Duwm1166RadioAtlasActivity',b'Duwm1671SectorActivity',b'Duwm1671SourceStatusActivity',b'ShareCardProvider'):
                  assert cls in dex,('1686 class absent from APK',cls)
          build=Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
          subprocess.run([str(build/'apksigner'),'verify',str(apk)],check=True)
          badge=subprocess.check_output([str(build/'aapt'),'dump','badging',str(apk)],text=True)
          assert "versionCode='168600'" in badge, badge[:900]
          assert "versionName='1686'" in badge, badge[:900]
          assert "name='com.sentongoharuna.worldsituationroom.rb2live25'" in badge,badge[:900]
          assert "launchable-activity: name='com.sentongoharuna.worldsituationroom.MainActivity'" in badge,'Original globe home is not launch activity'
          sums=apk.parent/'SHA256SUMS.txt'
          sums.write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  DUWM-1686-MAJOR-ALL-PAGES.apk\n')
          print('PASS SIGNED APK: original DUWM launcher, 19 native desks, five-section workspaces, 1686 share cards')
          PY_APK
      - name: Upload installable APK and checksum after success
        uses: actions/upload-artifact@v4
        with:
          name: DUWM-1686-MAJOR-ALL-PAGES-APK
          path: |
            ${{ runner.temp }}/duwm1686apk/DUWM-1686-MAJOR-ALL-PAGES.apk
            ${{ runner.temp }}/duwm1686apk/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
      - name: Record functional evidence and limitations
        if: always()
        shell: bash
        run: |
          {
            echo '### DUWM 1686 | Original Command and 19 major redesigned native desks'
            echo '1686 includes 19 on-screen command panels, 19 new full-screen five-tab workspaces, a 19-desk navigable registry and redesigned 1080 x 1920 source image cards.'
            echo 'Original launcher globe preserved. Original native source maps, feeds and players retained. Every numeric source value is read from an actual stored provider receipt.'
            echo 'Green APK compilation verifies Android packaging and signature, not the appearance on a physical phone or the availability/licensing of external content and streaming services.'
          } >> "$GITHUB_STEP_SUMMARY"
